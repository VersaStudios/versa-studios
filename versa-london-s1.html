<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Versa Studios — London S1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&family=Barlow+Condensed:wght@500;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #efede3;
  --paper: #fafaf6;
  --paper-2: #fff;
  --text: #302f2c;
  --text-2: #5e564f;
  --muted: #8a8278;
  --rule: rgba(48,47,44,.12);
  --rule-dark: rgba(48,47,44,.25);
  --accent: #F4A258;
  --accent-deep: #c77d2e;
  --green: #3dbf7a;
  --green-dark: #239658;
  --red: #c80000;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:1700px;margin:0 auto;padding:18px 22px 60px}

.logo-bar{display:flex;align-items:center;justify-content:center;padding:18px 0 22px;margin-bottom:8px}
.logo-bar svg{height:42px;width:auto;display:block;fill:var(--text)}
@media (max-width:600px){ .logo-bar{padding:12px 0 16px} .logo-bar svg{height:32px} }

header.head{background:var(--text);color:var(--paper);padding:14px 22px;border-radius:10px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.06)}
.head-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.kicker{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:.1em;font-size:11px;color:rgba(239,237,227,.5);text-transform:uppercase}
.job-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--paper);letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.job-meta{font-family:'Barlow',sans-serif;font-size:13px;color:rgba(239,237,227,.7);margin-top:2px}

.status{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.status::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.status.saving{background:rgba(244,162,88,.18);color:var(--accent)}
.status.saved {background:rgba(61,191,122,.15);color:var(--green-dark)}
.status.error {background:rgba(200,0,0,.15);color:var(--red)}
.status.idle  {background:rgba(48,47,44,.08);color:var(--muted)}
.status.preview {background:rgba(244,162,88,.25);color:var(--accent-deep)}

.preview-banner{background:rgba(244,162,88,.12);border:1px solid rgba(244,162,88,.5);color:var(--accent-deep);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-family:'Barlow',sans-serif;font-size:13px;line-height:1.5}
.preview-banner strong{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-deep);display:inline-block;margin-right:6px}
.preview-banner code{background:rgba(244,162,88,.18);border:1px solid rgba(244,162,88,.35);border-radius:3px;padding:1px 6px;font-family:'Barlow Condensed',monospace;font-size:12px;color:var(--accent-deep)}

.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1200px){ .split{grid-template-columns:1fr} }

.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card.no-pad{padding:6px}

.fp-shell{background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:0;overflow:hidden;position:relative}
.fp-svg{display:block;width:100%;height:auto;max-height:82vh;cursor:crosshair;user-select:none}

/* Calibration toolbar */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(48,47,44,.04);border-bottom:1px solid var(--rule);font-family:'Barlow',sans-serif;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.cal-bar .cal-hint{display:flex;align-items:center;gap:6px}
.cal-bar kbd{font-family:inherit;background:rgba(48,47,44,.08);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700}
.cal-btn{background:var(--text);color:var(--paper);border:none;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:background .12s}
.cal-btn:hover{background:#000}
.cal-btn.ghost{background:transparent;color:var(--text-2);border:1px solid var(--rule-dark)}
.cal-btn.ghost:hover{background:rgba(48,47,44,.05);color:var(--text)}

/* Marker styling — number written into the chair, no background plate */
.mk{cursor:pointer;transition:opacity .15s}
.mk-bg{fill:transparent;stroke:transparent;stroke-width:2;transition:all .12s;cursor:pointer}
.mk:hover .mk-bg{fill:rgba(244,162,88,.10);stroke:rgba(244,162,88,.45)}
.mk.dragging{cursor:grabbing}
.mk.dragging .mk-bg{fill:rgba(244,162,88,.30);stroke:var(--accent-deep);stroke-width:3}
.mk.highlight .mk-bg{fill:rgba(244,162,88,.20);stroke:var(--accent)}
.mk.inactive{opacity:.35}
.mk-num{font-family:Arial,sans-serif;font-weight:900;fill:#302f2c;text-anchor:middle;pointer-events:none;paint-order:stroke fill;stroke:#fff;stroke-width:8;stroke-linejoin:round;transition:fill .12s}
.mk.assigned .mk-num{fill:#c77d2e}
.mk.inactive .mk-num{fill:#888}
.mk-role{font-family:Arial,sans-serif;font-weight:600;font-size:18px;fill:#302f2c;pointer-events:none;paint-order:stroke fill;stroke:#fff;stroke-width:4;stroke-linejoin:round}
.mk-name{font-family:Arial,sans-serif;font-weight:800;font-size:22px;fill:#302f2c;pointer-events:none;paint-order:stroke fill;stroke:#fff;stroke-width:5;stroke-linejoin:round}

.sidebar{display:flex;flex-direction:column;gap:14px;max-height:82vh;overflow-y:auto;padding-right:4px}
@media (max-width:1200px){ .sidebar{max-height:none} }

.zone-block{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.zone-head{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
.zone-head .zct{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}

.pos-row{display:grid;grid-template-columns:32px minmax(0,1.1fr) minmax(0,1.4fr) 100px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(48,47,44,.05);transition:opacity .15s}
.pos-row:last-child{border-bottom:none}
.pos-row.highlight{background:rgba(244,162,88,.12)}
.pos-row.inactive{opacity:.4}
.pos-row.inactive .fi{background:rgba(48,47,44,.03);color:var(--muted)}

.pos-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;color:#fff;background:var(--text);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:background .12s,opacity .12s;position:relative}
.pos-num.assigned{background:var(--accent-deep)}
.pos-num.inactive{background:rgba(48,47,44,.25)}
.pos-num:hover{background:var(--accent)}
.pos-num.inactive:hover{background:var(--text)}

.fi{font-family:'Barlow',sans-serif;font-size:15px;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);color:var(--text);outline:none;width:100%;transition:border-color .12s,box-shadow .12s;min-width:0;font-weight:500}
.fi:hover{border-color:var(--rule-dark)}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(244,162,88,.15)}
.fi::placeholder{color:rgba(48,47,44,.3);font-weight:400}

/* Comms Panel checkbox */
.cp-wrap{display:flex;align-items:center;justify-content:center;height:100%}
.cp{width:22px;height:22px;cursor:pointer;accent-color:var(--accent-deep);margin:0}
.cp:disabled{cursor:not-allowed;opacity:.4}

.col-labels{display:grid;grid-template-columns:32px minmax(0,1.1fr) minmax(0,1.4fr) 100px;gap:6px;padding:6px 0 10px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.col-labels span:nth-child(1){text-align:center}
.col-labels span:nth-child(4){text-align:center}

.loading,.error-state{text-align:center;padding:60px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.04em}
.error-state{color:var(--red);font-size:14px;font-family:'Barlow',sans-serif;letter-spacing:0;line-height:1.6}
.error-state strong{color:var(--text);font-weight:900;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:10px;font-size:15px}
.error-state code{background:rgba(48,47,44,.08);border:1px solid var(--rule);border-radius:3px;padding:1px 8px;font-family:'Barlow Condensed',monospace;font-size:13px}

.foot-note{font-size:12px;color:var(--muted);text-align:center;padding:14px 8px 4px;line-height:1.5}
.foot-note kbd{font-family:inherit;background:rgba(48,47,44,.08);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;font-size:11px}

.coord-log{position:absolute;top:8px;right:8px;background:rgba(48,47,44,.85);color:#fff;font-family:'Barlow Condensed',monospace;font-size:11px;padding:4px 9px;border-radius:4px;display:none;letter-spacing:.06em}
.coord-log.show{display:block}

@media (max-width:700px){
  .wrap{padding:10px 12px 40px}
  header.head{padding:12px 14px;flex-direction:column;align-items:flex-start;gap:8px}
  .job-name{font-size:18px}
  .status{align-self:flex-end}
  .pos-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1.2fr) 90px}
}

:root{
  --purple: #a855f7;
  --blue: #2a6cb8;
  --amber: #e08c3a;
  --text-2: #5e564f;
}

/* ── Tab navigation (compact rectangle buttons) ─────────────────────────── */
.tab-nav{
  display:flex;align-items:center;gap:8px;
  background:transparent;border:0;padding:0;box-shadow:none;
  margin:0 0 16px
}
.tab-nav button{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  flex:0 0 auto;
  padding:12px 28px;border-radius:8px;
  background:var(--paper);border:1px solid var(--rule);
  color:var(--text-2);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;
  letter-spacing:.12em;text-transform:uppercase;
  transition:background .14s,color .14s,border-color .14s,transform .14s,box-shadow .14s;
  box-shadow:0 1px 2px rgba(0,0,0,.02);
  min-width:140px;text-align:center
}
.tab-nav button:hover{
  border-color:var(--rule-dark);color:var(--text);
  transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(0,0,0,.04)
}
.tab-nav button.active{
  background:var(--text);border-color:var(--text);color:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08)
}
.tab-nav button .dot{display:none}

.view{display:block}
.view[hidden]{display:none}

/* ── Comms-specific UI (most are unique to comms; .fi is scoped) ──────── */
.card-title{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text);
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px
}
.card-title .accent-text{color:var(--green-dark)}
.card-title .count{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}

.meta-strip{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.meta-field{
  display:flex;align-items:center;gap:0;
  background:var(--paper);border:1px solid var(--rule);border-radius:8px;
  padding:4px 4px 4px 14px;box-shadow:0 1px 2px rgba(0,0,0,.02);
  overflow:hidden
}
.meta-field .label{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text);
  margin:0 12px 0 0;white-space:nowrap
}
.meta-field .fi{
  border:0;background:transparent;padding:8px 10px;
  width:240px;min-width:0;font-family:'Barlow',sans-serif;font-size:14px
}
.meta-field .fi:focus{box-shadow:none;outline:none}
@media (max-width:600px){ .meta-field{width:100%} .meta-field .fi{flex:1 1 auto;width:auto} }
.meta-field .label{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px
}

.chan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){ .chan-grid{grid-template-columns:1fr} }

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.comms{min-width:1050px}
table.chans{min-width:0}
table.t th{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);
  white-space:nowrap;background:var(--paper)
}
table.t td{padding:4px 4px;border-bottom:1px solid rgba(48,47,44,.06);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:rgba(244,162,88,.04)}

.idx{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--muted);font-size:12px;text-align:center;width:32px;letter-spacing:.04em}
.idx.green{color:var(--green-dark)}

/* Comms input fields — scoped so the gallery's .fi (larger) isn't overridden */
#view-comms .fi{
  font-family:'Barlow',sans-serif;font-size:13px;
  padding:6px 9px;border:1px solid var(--rule);border-radius:5px;
  background:var(--paper-2);color:var(--text);outline:none;width:100%;
  transition:border-color .12s,box-shadow .12s;font-weight:400
}
#view-comms .fi:hover{border-color:var(--rule-dark)}
#view-comms .fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,162,88,.15)}
#view-comms .fi::placeholder{color:rgba(48,47,44,.3);font-weight:400}
#view-comms select.fi{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6' fill='%238a8278'%3E%3Cpath d='M0 0l5 6 5-6z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;background-size:8px 5px}

.dev-cell{text-align:center;cursor:pointer;user-select:none;min-width:62px;padding:4px 6px !important}
.dev-pill{
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
  min-width:34px;padding:4px 9px;border-radius:5px;
  background:transparent;border:1px solid var(--rule-dark);
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.04em;color:var(--muted);transition:all .12s
}
.dev-cell:hover .dev-pill{border-color:var(--accent);color:var(--text)}
.dev-pill.on{color:#fff;border-color:transparent}
.dev-pill.on.bolero{background:var(--green)}
.dev-pill.on.panel {background:var(--purple)}
.dev-pill.on.walkie{background:var(--blue)}
.dev-pill.on.wire4 {background:var(--amber)}

.rm-btn{
  background:transparent;border:1px solid rgba(200,0,0,.18);color:rgba(200,0,0,.65);
  width:26px;height:26px;border-radius:4px;cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all .12s
}
.rm-btn:hover{background:rgba(200,0,0,.08);color:var(--red);border-color:rgba(200,0,0,.4)}

.add-btn{
  margin-top:12px;background:var(--text);color:var(--paper);border:none;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;cursor:pointer;
  transition:background .12s
}
.add-btn:hover{background:#000}
.add-btn.ghost{background:transparent;color:var(--text-2);border:1px solid var(--rule-dark)}
.add-btn.ghost:hover{background:rgba(48,47,44,.04);color:var(--text)}

.empty-row{padding:18px 8px;color:var(--muted);font-size:13px;text-align:center;font-style:italic}

/* Synced-from-gallery person row — subtle visual cue */
tr.synced-row td:first-child{position:relative}
tr.synced-row td:first-child::before{
  content:'';position:absolute;left:-2px;top:6px;bottom:6px;width:3px;
  background:var(--accent);border-radius:2px;opacity:.7
}
tr.synced-row .rm-btn{display:none}
tr.synced-row td:last-child::after{
  content:'gallery';display:inline-block;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);opacity:.65;
  padding:2px 5px;border:1px solid var(--accent);border-radius:3px
}
.synced-note{font-size:11px;color:var(--muted);font-style:italic;margin-left:6px}

/* Purple/blue/amber for device pill colours — append to :root if missing */

/* ── Masthead (3-column grid: left info | centred logo | right info) ──── */
.logo-bar{display:none}
header.head{display:none}

.masthead [hidden]{display:none !important}

.masthead{
  background:var(--text);color:var(--paper);
  border-radius:8px;padding:12px 18px;margin:0 0 12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.06);
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;column-gap:24px;row-gap:6px;
  min-height:52px
}

.mast-left,
.mast-right{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;min-width:0
}
.mast-left{justify-self:start}
.mast-right{justify-self:end;align-items:center}

/* Centred brand column — logo + studio caption inline */
.mast-centre{
  display:flex;align-items:center;gap:14px;flex-shrink:0;justify-self:center
}
.mast-logo{height:36px;width:auto;fill:var(--paper);display:block}
.mast-loc{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(239,237,227,.55);
  white-space:nowrap
}

/* Individual blocks within left/right columns */
.mast-block{display:flex;align-items:baseline;gap:8px;min-width:0}

.show-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;
  letter-spacing:.005em;text-transform:uppercase;line-height:1;color:var(--paper);
  white-space:nowrap
}
.mast-block.meta{
  font-family:'Barlow',sans-serif;font-size:13px;color:rgba(239,237,227,.6);
  white-space:nowrap
}
.mast-block .lbl,
.mast-block .cnt-label{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(239,237,227,.45);
  flex-shrink:0;white-space:nowrap
}
.prod-val{
  font-family:'Barlow',sans-serif;font-weight:600;font-size:15px;color:var(--paper);
  white-space:nowrap
}

.cnt-name-text{
  font-family:'Barlow',sans-serif;font-weight:700;font-size:20px;
  color:var(--paper);letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px
}
.cnt-email-text{
  font-family:'Barlow',sans-serif;font-weight:400;font-size:13px;
  color:rgba(239,237,227,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px
}
.cnt-mail-link{
  flex-shrink:0;
  color:rgba(239,237,227,.55);text-decoration:none;font-size:14px;
  padding:2px 6px;border-radius:4px;line-height:1;
  transition:color .12s,background .12s;display:inline-block
}
.cnt-mail-link:hover{color:var(--accent);background:rgba(244,162,88,.12)}
.cnt-mail-link.disabled{opacity:.2;pointer-events:none}

/* Status inline at the end of the right column */
.mast-right .status{position:static;margin-left:6px}

/* Below ~1100px: drop emails to keep on one line */
@media (max-width:1200px){ .cnt-email-text{display:none} }
@media (max-width:1000px){
  .cnt-name-text{font-size:18px;max-width:180px}
}

/* Below 800px: collapse the grid to a single column (logo stays centred) */
@media (max-width:800px){
  .masthead{
    grid-template-columns:1fr;row-gap:8px;padding:10px 14px;min-height:0
  }

#printView{display:none}

@media print{
  html,body{background:#fff!important;color:#000!important;margin:0;padding:0}
  body > *{display:none!important}
  #printView{display:block!important;position:static;background:#fff;color:#000;
    font-family:'Barlow',sans-serif;font-size:8.5pt;line-height:1.25}
  @page{size:A4 landscape;margin:9mm}

  .pv-page{page-break-after:always}
  .pv-page:last-child{page-break-after:auto}

  /* Header strip */
  .pv-h{display:flex;align-items:baseline;justify-content:space-between;gap:8mm;
    border-bottom:1.5pt solid #302f2c;padding-bottom:2mm;margin-bottom:3mm}
  .pv-h h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18pt;
    margin:0;text-transform:uppercase;letter-spacing:.01em;line-height:1}
  .pv-h .pv-h-meta{font-size:9pt;color:#444;text-align:right;line-height:1.3}
  .pv-h .pv-h-meta b{color:#000}

  .pv-supline{display:flex;gap:8mm;font-size:9pt;color:#444;margin-bottom:4mm}
  .pv-supline b{color:#000;margin-right:1mm}

  .pv-section{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10pt;
    letter-spacing:.08em;text-transform:uppercase;color:#000;
    border-bottom:0.8pt solid #302f2c;padding-bottom:1mm;margin:0 0 2mm 0}
  .pv-section.bol{color:#239658;border-bottom-color:#239658}

  /* PAGE 1: floor plan + positions side by side */
  .pv-row{display:flex;gap:5mm;align-items:flex-start}
  .pv-fp-cell{flex:0 0 60%;max-width:60%}
  .pv-pos-cell{flex:1 1 40%;min-width:0}
  .pv-fp svg{width:100%;height:auto;display:block;max-height:170mm}
  .pv-fp .coord-log,.pv-fp #coordLog{display:none!important}
  .pv-fp .mk{cursor:default}

  .pv-pos-grid{column-count:1;column-gap:3mm}
  .pv-zone{break-inside:avoid;margin-bottom:2mm}
  .pv-zone-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:8.5pt;
    letter-spacing:.06em;text-transform:uppercase;background:#302f2c;color:#fff;
    padding:0.6mm 2mm;margin:0}
  .pv-zone table{width:100%;border-collapse:collapse;font-size:8pt;margin-top:0.5mm}
  .pv-zone td{padding:0.5mm 1.5mm;border-bottom:0.5pt solid #f1f1f1;vertical-align:top}

  const el = document.getElementById('statusBar');
  if(!el) return;
  // Suppress the preview indicator entirely — clients shouldn't see "preview"
  if(cls === 'preview'){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = text;
  el.className = 'status ' + (cls || 'idle');
}
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(iso){
  if(!iso) return '';
  try { return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return iso; }
}

async function fetchJobs(){
  try {
    const r = await fetch(SB_URL+'/rest/v1/app_data?key=eq.jobs&select=value', { headers: SB_HEADERS });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    if(rows && rows[0] && Array.isArray(rows[0].value)) return rows[0].value;
    return [];
  } catch(e){ console.error('fetchJobs error:', e); return null; }
}
async function saveJobsRow(jobsArr){
  try {
    const r = await fetch(SB_URL+'/rest/v1/app_data', {
      method: 'POST', headers: SB_HEADERS,
      body: JSON.stringify([{ key:'jobs', value: jobsArr, updated_at: new Date().toISOString() }])
    });
    return r.ok;
  } catch(e){ console.error('saveJobsRow error:', e); return false; }
}

function posState(id){
  const def = POSITIONS.find(p => p.id === id);
  const ov  = (currentJob && currentJob.galleryS1 && currentJob.galleryS1.positions && currentJob.galleryS1.positions[id]) || {};
  return {
    role:  (ov.role != null ? ov.role : def.defaultRole) || '',
    name:  ov.name  || '',
    panel: !!ov.panel,
    inactive: !!ov.inactive
  };
}
function setPos(id, key, val){
  // In preview mode, role edits become new defaults (saved to localStorage)
  // rather than per-job overrides — since there's no job context to save against.
  if(isPreview && key === 'role'){
    const p = POSITIONS.find(x => x.id === id);
    if(p){
      p.defaultRole = val;
      saveRoleOverride(id, val);
    }
    return;
  }
  if(!currentJob.galleryS1) currentJob.galleryS1 = { positions:{} };
  if(!currentJob.galleryS1.positions) currentJob.galleryS1.positions = {};
  if(!currentJob.galleryS1.positions[id]) currentJob.galleryS1.positions[id] = {};
  currentJob.galleryS1.positions[id][key] = val;
  // Sync to comms when name / panel / inactive changes — these affect which
  // gallery positions auto-create panel entries in Crew Comms.
  if(key === 'name' || key === 'panel' || key === 'inactive'){
    syncGalleryToComms();
    markCommsDirty();
  }
  if(!isPreview) queueSave();
}

function isUnlocked(j){
  if(!j || !j.password) return true;
  return sessionStorage.getItem(pwStorageKey(j.id)) === j.password;
}

async function loadAndRender(){
  const jParam = getParam('j');
  const nParam = getParam('job') || getParam('n');

  if(!jParam && !nParam){
    isPreview = true;
    currentJob = { id:'preview', name:'Preview Mode', galleryS1:{ positions:{} }, comms:{ people:[], channels:[], boleroChannels:[], supervisor:'', supplier:'' } };
    currentJobId = 'preview';
    document.title = 'London S1 — Preview';
    renderMasthead();
    setStatus('Preview', 'preview');
    renderGallery();
    renderComms();
    return;
  }

  setStatus('Loading', 'saving');
  const jobs = await fetchJobs();
  if(!jobs){
    document.getElementById('content').innerHTML = '<div class="error-state"><strong>Connection failed</strong>Could not reach the database. Check your connection and reload.</div>';
    document.getElementById('commsContent').innerHTML = '<div class="error-state"><strong>Connection failed</strong>Could not reach the database.</div>';
    setStatus('Error', 'error'); return;
  }
  let j = null;
  if(jParam) j = jobs.find(x => String(x.id) === String(jParam));
  if(!j && nParam){
    const rx = new RegExp(nParam, 'i');
    j = jobs.find(x => rx.test(x.name||''));
  }
  if(!j){
    const msg = '<div class="error-state"><strong>No matching job</strong>Append <code>?j=1</code> (job ID) or <code>?job=name</code> to the URL, or open with no parameters for <code>Preview</code> mode.</div>';
    document.getElementById('content').innerHTML = msg;
    document.getElementById('commsContent').innerHTML = msg;
    setStatus('Not found', 'error'); return;
  }

  currentJob = j;
  currentJobId = j.id;
  if(!j.galleryS1) j.galleryS1 = { positions:{} };
  if(!j.galleryS1.positions) j.galleryS1.positions = {};
  if(!j.comms) j.comms = {};
  if(!Array.isArray(j.comms.people))         j.comms.people = [];
  if(!Array.isArray(j.comms.channels))       j.comms.channels = [];
  if(!Array.isArray(j.comms.boleroChannels)) j.comms.boleroChannels = [];
  if(typeof j.comms.supervisor !== 'string') j.comms.supervisor = '';
  if(typeof j.comms.supplier   !== 'string') j.comms.supplier = '';
  if(typeof j.productionCo !== 'string') j.productionCo = '';
  if(!j.techMgr   || typeof j.techMgr   !== 'object') j.techMgr   = { name:'', email:'' };
  if(!j.studioMgr || typeof j.studioMgr !== 'object') j.studioMgr = { name:'', email:'' };

  document.title = (j.name||'Loading') + ' — London S1';
  renderMasthead();

  // Sync gallery → comms before first render so panel-ticked names appear
  syncGalleryToComms();

  setStatus('Saved', 'saved');
  // Embed mode (?embed=1 + actually inside an iframe) — bypass password gate AND hide tab nav.
  // The iframe check prevents anyone from using ?embed=1 outside the parent app.
  const isEmbed = (getParam('embed') === '1') && (window.self !== window.top);
  if(isEmbed){
    document.body.classList.add('embed-mode');
  }
  // Legacy: ?p=<password> still works for direct unlock links (not used by the main-app iframe).
  const pParam = getParam('p');
  if(pParam && j.password && pParam === j.password){
    try { sessionStorage.setItem(pwStorageKey(j.id), j.password); } catch(e){}
  }
  if(!isEmbed && !isUnlocked(j)){
    await showPasswordGate(j);
  }
  renderGallery();
  renderComms();
}

// Compute label positions based on marker labelDir
function labelPos(p){
  const dir = p.labelDir || 'top';
  if(dir === 'rotate-left')  return { rx: p.cx - 75, ry: p.cy, nx: p.cx - 105, ny: p.cy, anchor: 'middle', rotate: -90 };
  if(dir === 'rotate-right') return { rx: p.cx + 75, ry: p.cy, nx: p.cx + 105, ny: p.cy, anchor: 'middle', rotate: 90 };
  if(dir === 'rotate-top')   return { rx: p.cx, ry: p.cy - 115, nx: p.cx + 30, ny: p.cy - 115, anchor: 'middle', rotate: -90 };
  if(dir === 'right')        return { rx: p.cx + 50, ry: p.cy - 6,  nx: p.cx + 50, ny: p.cy + 22, anchor: 'start' };
  if(dir === 'left')         return { rx: p.cx - 50, ry: p.cy - 6,  nx: p.cx - 50, ny: p.cy + 22, anchor: 'end' };
  if(dir === 'bottom')       return { rx: p.cx, ry: p.cy + 80, nx: p.cx, ny: p.cy + 110, anchor: 'middle' };
  return                          { rx: p.cx, ry: p.cy - 95, nx: p.cx, ny: p.cy - 60, anchor: 'middle' };
}

function renderSVG(){
  const markers = POSITIONS.map(p => {
    const st = posState(p.id);
    const isAssigned = !!st.name.trim();
    const isInactive = st.inactive;
    let cls = 'mk';
    if(isInactive) cls += ' inactive';
    else if(isAssigned) cls += ' assigned';
    const roleText = st.role || p.defaultRole;
    const lp = labelPos(p);
    const roleT = lp.rotate ? ` transform="rotate(${lp.rotate} ${lp.rx} ${lp.ry})"` : '';
    const nameT = lp.rotate ? ` transform="rotate(${lp.rotate} ${lp.nx} ${lp.ny})"` : '';
    return `
      <g class="${cls}" id="mk-${p.id}" onclick="onDeskClick(${p.id})" onmousedown="startDrag(event, ${p.id})">
        <circle class="mk-bg" cx="${p.cx}" cy="${p.cy}" r="${MK_R}"/>
        ${!isInactive ? `<text class="mk-role" x="${lp.rx}" y="${lp.ry}" text-anchor="${lp.anchor}"${roleT}>${escHtml(roleText)}</text>` : ''}
        ${isAssigned && !isInactive ? `<text class="mk-name" x="${lp.nx}" y="${lp.ny}" text-anchor="${lp.anchor}"${nameT}>${escHtml(st.name)}</text>` : ''}
        <text class="mk-num" x="${p.cx}" y="${p.cy + FS_NUM/3}" font-size="${FS_NUM}">${p.id}</text>
      </g>
    `;
  }).join('');

  return `<svg class="fp-svg" viewBox="0 0 ${IMG_W} ${IMG_H}" xmlns="http://www.w3.org/2000/svg" onmousemove="onSvgMove(event)" onclick="onSvgClick(event)">
    <image href="${FP_IMG}" x="0" y="0" width="${IMG_W}" height="${IMG_H}"/>
    <g class="room-titles" style="pointer-events:none">
      <text x="640"  y="760"  font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#302f2c" text-anchor="middle">Sound</text>
      <text x="1080" y="880"  font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#302f2c" text-anchor="middle">Production</text>
      <text x="2100" y="745"  font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#302f2c" text-anchor="middle">Lighting / Vision</text>
      <text x="300"  y="1245" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#302f2c" text-anchor="middle">Ingest</text>
    </g>
    <g class="console-outlines" style="pointer-events:none">
      <!-- Vision Mixing Desk — clear empty outline on the bench in front of 7 & 8 -->
      <rect x="1382" y="295" width="304" height="105" fill="none" stroke="#302f2c" stroke-width="2" rx="4"/>
    </g>
    ${markers}
  </svg>
  <div class="coord-log" id="coordLog">x: —, y: —</div>`;
}

function renderSidebar(){
  const zones = {};
  POSITIONS.forEach(p => { (zones[p.zone] = zones[p.zone] || []).push(p); });
  return ZONES.filter(z => zones[z]).map(z => {
    const items = zones[z];
    const rows = items.map(p => {
      const st = posState(p.id);
      const isAssigned = !!st.name.trim();
      const isInactive = st.inactive;
      let pillCls = 'pos-num';
      if(isInactive) pillCls += ' inactive';
      else if(isAssigned) pillCls += ' assigned';
      const pillTitle = isInactive ? 'Position not in use — click to re-enable' : 'Click to mark this position as not in use';
      return `
        <div class="pos-row ${isInactive?'inactive':''}" id="row-${p.id}">
          <div class="${pillCls}" onclick="toggleInactive(${p.id})" title="${pillTitle}">${p.id}</div>
          <input class="fi" placeholder="${escHtml(p.defaultRole)}" value="${escHtml(st.role)}" oninput="setPos(${p.id},'role',this.value);refreshMarker(${p.id})" ${isInactive?'disabled':''}/>
          <input class="fi" placeholder="Name…" value="${escHtml(st.name)}" oninput="setPos(${p.id},'name',this.value);refreshMarker(${p.id})" ${isInactive?'disabled':''}/>
          <div class="cp-wrap"><input type="checkbox" class="cp" ${st.panel?'checked':''} onchange="setPos(${p.id},'panel',this.checked)" ${isInactive?'disabled':''} title="Comms panel needed at this position?"/></div>
        </div>`;
    }).join('');
    const label = ZONE_LABELS[z] || z;
    return `<div class="zone-block"><div class="zone-head"><span>${escHtml(label)}</span><span class="zct">${items.length} ${items.length===1?'position':'positions'}</span></div><div class="col-labels"><span>#</span><span>Role</span><span>Name</span><span>Comms Panel</span></div>${rows}</div>`;
  }).join('');
}

  const banner = isPreview ? `<div class="preview-banner"><strong>Preview Mode —</strong>No job context. Role edits here set the <em>default</em> values (saved locally for export). To save assignments against a job, append <code>?j=&lt;jobId&gt;</code> or <code>?job=&lt;name&gt;</code> to the URL.</div>` : '';
  document.getElementById('content').innerHTML = banner + `
    <div class="split">
      <div class="card no-pad" style="position:relative">
        <div class="cal-bar">
          <div class="cal-hint">Hold <kbd>Shift</kbd> + drag a marker to reposition it · Shift+hover for pixel coords</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="cal-btn ghost" onclick="resetRoles()">Reset roles</button>
            <button class="cal-btn ghost" onclick="resetPositions()">Reset positions</button>
            <button class="cal-btn" onclick="exportPositions()">Export positions</button>
          </div>
        </div>
        ${renderSVG()}

      Type into the sidebar — names appear at the matching desk on the layout automatically.
      Click a <kbd>#</kbd> on either side to highlight its twin.
    </div>`;
}

function refreshMarker(id){
  const old = document.getElementById('mk-'+id);
  if(!old) return;
  const p = POSITIONS.find(x => x.id === id);
  const st = posState(id);
  const isAssigned = !!st.name.trim();
  const isInactive = st.inactive;
  let cls = 'mk';
  if(isInactive) cls += ' inactive';
  else if(isAssigned) cls += ' assigned';
  const roleText = st.role || p.defaultRole;
  const lp = labelPos(p);
  const roleT = lp.rotate ? ` transform="rotate(${lp.rotate} ${lp.rx} ${lp.ry})"` : '';
  const nameT = lp.rotate ? ` transform="rotate(${lp.rotate} ${lp.nx} ${lp.ny})"` : '';
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  g.setAttribute('class', cls);
  g.setAttribute('id', 'mk-'+id);
  g.setAttribute('onclick', 'onDeskClick('+id+')');
  g.setAttribute('onmousedown', 'startDrag(event, '+id+')');
  g.innerHTML =
    `<circle class="mk-bg" cx="${p.cx}" cy="${p.cy}" r="${MK_R}"/>`+
    (!isInactive ? `<text class="mk-role" x="${lp.rx}" y="${lp.ry}" text-anchor="${lp.anchor}"${roleT}>${escHtml(roleText)}</text>` : '')+
    (isAssigned && !isInactive ? `<text class="mk-name" x="${lp.nx}" y="${lp.ny}" text-anchor="${lp.anchor}"${nameT}>${escHtml(st.name)}</text>` : '')+
    `<text class="mk-num" x="${p.cx}" y="${p.cy + FS_NUM/3}" font-size="${FS_NUM}">${id}</text>`;
  old.parentNode.replaceChild(g, old);
  const pill = document.querySelector('#row-'+id+' .pos-num');
  if(pill){
    pill.classList.toggle('assigned', isAssigned && !isInactive);
    pill.classList.toggle('inactive', isInactive);
  }
}

function onDeskClick(id){
  // Don't trigger when finishing a drag
  if(dragId != null) return;
  const row = document.getElementById('row-'+id);
  if(!row) return;
  row.scrollIntoView({block:'center', behavior:'smooth'});
  row.classList.add('highlight');
  setTimeout(()=> row.classList.remove('highlight'), 1200);
  const inputs = row.querySelectorAll('input:not([disabled])');
  if(inputs[1]) inputs[1].focus();
}

function toggleInactive(id){
  const st = posState(id);
  const newVal = !st.inactive;
  if(!currentJob.galleryS1) currentJob.galleryS1 = { positions:{} };
  if(!currentJob.galleryS1.positions) currentJob.galleryS1.positions = {};
  if(!currentJob.galleryS1.positions[id]) currentJob.galleryS1.positions[id] = {};
  currentJob.galleryS1.positions[id].inactive = newVal;
  // Re-render this row in place to flip disabled state on inputs
  const row = document.getElementById('row-'+id);
  if(row){
    const p = POSITIONS.find(x => x.id === id);
    const st2 = posState(id);
    const isAssigned = !!st2.name.trim();
    const isInactive = st2.inactive;
    let pillCls = 'pos-num';
    if(isInactive) pillCls += ' inactive';
    else if(isAssigned) pillCls += ' assigned';
    const pillTitle = isInactive ? 'Position not in use — click to re-enable' : 'Click to mark this position as not in use';
    row.classList.toggle('inactive', isInactive);
    row.innerHTML =
      `<div class="${pillCls}" onclick="toggleInactive(${id})" title="${pillTitle}">${id}</div>`+
      `<input class="fi" placeholder="${escHtml(p.defaultRole)}" value="${escHtml(st2.role)}" oninput="setPos(${id},'role',this.value);refreshMarker(${id})" ${isInactive?'disabled':''}/>`+
      `<input class="fi" placeholder="Name…" value="${escHtml(st2.name)}" oninput="setPos(${id},'name',this.value);refreshMarker(${id})" ${isInactive?'disabled':''}/>`+

// ── Shift+hover coordinate logger + Shift+drag marker repositioning ──
let dragId = null;
const POS_OVERRIDES_KEY = 'versa.galleryS1.positionOverrides';
const ROLE_OVERRIDES_KEY = 'versa.galleryS1.roleOverrides';

// On boot, merge any locally-saved position and role overrides into POSITIONS
(function loadOverrides(){
  try {
    const rawPos = localStorage.getItem(POS_OVERRIDES_KEY);
    if(rawPos){
      const ov = JSON.parse(rawPos);
      POSITIONS.forEach(p => {
        if(ov[p.id]){ p.cx = ov[p.id].cx; p.cy = ov[p.id].cy; }
      });
      console.log('Loaded position overrides for', Object.keys(ov).length, 'markers');
    }
  } catch(e){ console.error('Failed to load position overrides:', e); }
  try {
    const rawRole = localStorage.getItem(ROLE_OVERRIDES_KEY);
    if(rawRole){
      const ov = JSON.parse(rawRole);
      POSITIONS.forEach(p => {
        if(ov[p.id]){ p.defaultRole = ov[p.id]; }
      });
      console.log('Loaded role overrides for', Object.keys(ov).length, 'positions');
    }
  } catch(e){ console.error('Failed to load role overrides:', e); }
})();

function saveOverride(id){
  try {
    const raw = localStorage.getItem(POS_OVERRIDES_KEY);
    const ov = raw ? JSON.parse(raw) : {};
    const p = POSITIONS.find(x => x.id === id);
    if(!p) return;
    ov[id] = { cx: Math.round(p.cx), cy: Math.round(p.cy) };
    localStorage.setItem(POS_OVERRIDES_KEY, JSON.stringify(ov));
  } catch(e){ console.error('Failed to save override:', e); }
}

function saveRoleOverride(id, val){
  try {
    const raw = localStorage.getItem(ROLE_OVERRIDES_KEY);
    const ov = raw ? JSON.parse(raw) : {};
    if(val && val.trim()){
      ov[id] = val;
    } else {
      delete ov[id];
    }
    localStorage.setItem(ROLE_OVERRIDES_KEY, JSON.stringify(ov));
  } catch(e){ console.error('Failed to save role override:', e); }
}

function startDrag(e, id){
  if(!e.shiftKey) return;
  dragId = id;
  e.preventDefault();
  e.stopPropagation();
  const mk = document.getElementById('mk-'+id);
  if(mk) mk.classList.add('dragging');
}

function clientToSvg(svg, clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

document.addEventListener('mousemove', (e) => {
  if(dragId == null) return;
  const svg = document.querySelector('.fp-svg');
  if(!svg) return;
  const cur = clientToSvg(svg, e.clientX, e.clientY);
  const p = POSITIONS.find(x => x.id === dragId);
  if(p){
    p.cx = cur.x;
    p.cy = cur.y;
    refreshMarker(dragId);
    const log = document.getElementById('coordLog');
    if(log){
      log.textContent = `#${dragId}: (${Math.round(p.cx)}, ${Math.round(p.cy)})`;
      log.classList.add('show');
    }
  }
});

document.addEventListener('mouseup', () => {
  if(dragId == null) return;
  const p = POSITIONS.find(x => x.id === dragId);
  if(p){
    console.log(`Marker ${dragId} (${p.defaultRole}): (${Math.round(p.cx)}, ${Math.round(p.cy)})`);
    saveOverride(dragId);
  }
  const mk = document.getElementById('mk-'+dragId);
  if(mk) mk.classList.remove('dragging');
  dragId = null;
  setTimeout(()=>{
    const log = document.getElementById('coordLog');
    if(log) log.classList.remove('show');
  }, 800);
});

function onSvgMove(ev){
  if(dragId != null) return;  // dragging takes precedence
  const log = document.getElementById('coordLog');
  if(!log) return;
  if(ev.shiftKey){
    const cur = clientToSvg(ev.currentTarget, ev.clientX, ev.clientY);
    log.textContent = `x: ${Math.round(cur.x)}, y: ${Math.round(cur.y)}`;
    log.classList.add('show');
  } else {
    log.classList.remove('show');
  }
}
function onSvgClick(ev){
  if(!ev.shiftKey || dragId != null) return;
  const cur = clientToSvg(ev.currentTarget, ev.clientX, ev.clientY);
  console.log(`Shift-clicked at (${Math.round(cur.x)}, ${Math.round(cur.y)})`);
}

function queueSave(){
  if(isPreview) return;
  setStatus('Editing', 'saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1200);
}
async function doSave(){
  if(isPreview) return;
  if(saving){ saveTimer = setTimeout(doSave, 300); return; }
  saving = true;
  setStatus('Saving', 'saving');
  const freshJobs = await fetchJobs();
  if(!freshJobs){ setStatus('Save failed', 'error'); saving = false; return; }
  const target = freshJobs.find(x => x.id === currentJobId);
  if(!target){ setStatus('Job no longer exists', 'error'); saving = false; return; }
  target.galleryS1 = currentJob.galleryS1 || { positions: {} };
  if(!target.comms) target.comms = {};
  target.comms.people         = currentJob.comms.people         || [];
  target.comms.channels       = currentJob.comms.channels       || [];
  target.comms.boleroChannels = currentJob.comms.boleroChannels || [];
  target.comms.supervisor     = currentJob.comms.supervisor     || '';
  target.comms.supplier       = currentJob.comms.supplier       || '';
  const ok = await saveJobsRow(freshJobs);
  setStatus(ok ? 'Saved' : 'Save failed', ok ? 'saved' : 'error');
  saving = false;
}

// ── Gallery → Comms sync ─────────────────────────────────────────────────
// Any gallery position with `panel:true`, a non-empty name, and not inactive
// auto-creates a Crew Comms person tagged `fromGallery: <pos id>`. Untick the
// panel, clear the name, or mark the seat inactive and the synced entry is
// removed. Manually-added comms people (no fromGallery flag) are left alone.
function syncGalleryToComms(){
  if(!currentJob) return;
  if(!currentJob.galleryS1) currentJob.galleryS1 = { positions:{} };
  if(!currentJob.comms) currentJob.comms = { people:[], channels:[], boleroChannels:[], supervisor:'', supplier:'' };
  if(!Array.isArray(currentJob.comms.people)) currentJob.comms.people = [];

  const positions = currentJob.galleryS1.positions || {};

  // Build the desired set from gallery state
  const desired = [];
  POSITIONS.forEach(p => {
    const st = positions[p.id] || {};
    if(st.inactive) return;
    if(!st.panel)   return;
    const nm = (st.name || '').trim();
    if(!nm) return;
    desired.push({
      posId: p.id,
      name:  nm,
      role:  (st.role || p.defaultRole || '').trim(),
      zone:  p.zone
    });
  });

  // Remove stale synced entries (still tagged fromGallery, but no longer in desired)
  currentJob.comms.people = currentJob.comms.people.filter(p => {
    if(p == null) return false;
    if(p.fromGallery == null) return true; // keep manual entries
    return desired.some(d => String(d.posId) === String(p.fromGallery));
  });

  // Add or update synced entries
  desired.forEach(d => {
    let existing = currentJob.comms.people.find(p => p && String(p.fromGallery) === String(d.posId));
    if(existing){
      existing.name  = d.name;
      existing.role  = d.role;
      existing.panel = true; // ensure the panel pill stays on
    } else {
      currentJob.comms.people.push({
        name: d.name,
        role: d.role,
        bolero: false,
        panel:  true,
        walkie: false,
        wire4:  false,
        fromGallery: d.posId
      });
    }
  });
}

        posHtml += name
          ? '<td class="nm">' + escHtml(name) + '</td>'
          : '<td class="nm e">\u2014</td>';
        posHtml += '<td class="cp">' + cp + '</td>';
        posHtml += '</tr>';
      });
      posHtml += '</tbody></table></div>';
    });
    document.getElementById('pvPositions').innerHTML = posHtml;

    // Crew comms list
    const people = Array.isArray(c.people) ? c.people : [];
    let bC=0, pC=0, wC=0;
    const devIds = people.map(p => {
      const r = {};
      if(p.bolero){ bC++; r.bolero = bC; }
      if(p.panel) { pC++; r.panel  = pC; }
      if(p.walkie){ wC++; r.walkie = wC; }
      return r;
    });
    const devCell = (on, num, kind) => on
      ? '<td class="c dev' + (kind === 'bolero' ? ' bol' : '') + '">#' + num + '</td>'
      : '<td class="c dev off">\u2014</td>';

    let crewRows = '';
    if(people.length){
      people.forEach((p, i) => {
        const d = devIds[i];
        crewRows += '<tr>';
        crewRows += '<td class="n">' + (i+1) + '</td>';
        crewRows += '<td class="nm">' + escHtml((p.name||'').trim() || '\u2014') + '</td>';
        crewRows += '<td class="rl">' + escHtml((p.role||'').trim() || '') + '</td>';
        crewRows += devCell(!!p.bolero, d.bolero, 'bolero');
        crewRows += devCell(!!p.panel,  d.panel,  'panel');
        crewRows += devCell(!!p.walkie, d.walkie, 'walkie');
        crewRows += '<td class="hs">' + escHtml(p.headset || '') + '</td>';
        crewRows += '<td class="nt">' + escHtml(p.notes   || '') + '</td>';
        crewRows += '</tr>';
      });
    } else {
      crewRows = '<tr class="empty"><td colspan="8">No crew added yet.</td></tr>';
    }
    document.getElementById('pvCrew').innerHTML =
      '<table class="pv-crew">' +
        '<thead><tr>' +
          '<th>#</th><th>Name</th><th>Role</th>' +
          '<th class="c">Bolero</th><th class="c">Panel</th><th class="c">Walkie</th>' +
          '<th>Headset</th><th>Notes</th>' +
        '</tr></thead>' +
        '<tbody>' + crewRows + '</tbody>' +
      '</table>';

    // Channels side-by-side
    const renderChans = (arr, title, accent) => {
      const titleClass = accent === 'bol' ? 'pv-section bol' : 'pv-section';
      let rows = '';
      if(Array.isArray(arr) && arr.length){
        arr.forEach((ch, i) => {
          rows += '<tr>';
          rows += '<td class="n">' + (i+1) + '</td>';
          rows += '<td class="cname">' + escHtml((ch.name||'').trim()  || '\u2014') + '</td>';
          rows += '<td class="cnotes">' + escHtml((ch.notes||'').trim() || '') + '</td>';
          rows += '</tr>';
        });
      } else {
        rows = '<tr class="empty"><td colspan="3">No channels.</td></tr>';
      }
      return '<div class="pv-chan"><div class="' + titleClass + '">' + escHtml(title) + '</div>' +
        '<table><tbody>' + rows + '</tbody></table></div>';
    };
    document.getElementById('pvChannels').innerHTML =
      renderChans(c.channels,       'Walkie / Comms Channels', '') +
      renderChans(c.boleroChannels, 'Bolero Channels',         'bol');

    setTimeout(() => window.print(), 80);
  }catch(err){
    console.error('Export PDF failed:', err);
    alert('Export PDF failed: ' + (err && err.message ? err.message : err));
  }
}
function setText(id, txt){ const el = document.getElementById(id); if(el) el.textContent = txt; }


</script>
</body>
</html>
