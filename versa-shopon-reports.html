<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>ShopOn TV Engineering Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#efede3;
  --ink:#302f2c;
  --muted:#999;
  --soft:#e8e5dc;
  --soft2:#eae7df;
  --line:#d4d0c8;
  --card:#fff;
  --field:#f5f3ee;
  --field-bd:#e0ddd5;
  --accent:#2850a0;
  --shop-pink:#d80084;
  --accent-deep:#1a3a80;
  --green:#22c55e;
  --green-deep:#16a34a;
  --green-bg:rgba(34,197,94,.08);
  --orange:#2850a0;
  --orange-bg:rgba(40,80,160,.1);
  --red:#ef4444;
  --red-deep:#dc2626;
  --red-bg:rgba(239,68,68,.08);
  --font:'Barlow',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;padding:20px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding-top:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.hd{padding:18px 24px 16px;border-bottom:1px solid var(--soft);display:flex;flex-direction:column;align-items:stretch;gap:0}
.hd-link{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#2850a0 0%,#3a6cc0 50%,#148cc8 100%);padding:10px 18px;border-radius:10px;font-family:var(--cond);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:all .15s;border:none;box-shadow:0 2px 6px rgba(40,80,160,.25)}
.hd-link:hover{background:linear-gradient(135deg,#1a3a80 0%,#2850a0 50%,#0e6ea0 100%);box-shadow:0 4px 10px rgba(40,80,160,.35);transform:translateY(-1px)}
.hd-logos{display:flex;align-items:center;gap:14px}
.hd-logos img{height:34px}
.hd-div{width:1px;height:32px;background:var(--line)}
.hd-right{font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.4}
.hd-refresh{background:var(--ink);color:var(--card);border:none;border-radius:8px;padding:8px 16px;font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.hd-refresh:hover{opacity:.85}
.hd-refresh:disabled{opacity:.5;cursor:default}

/* Filter section */
.sec{padding:18px 28px;border-bottom:1px solid var(--soft2)}
.sec:last-child{border-bottom:none}
.lbl{font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:10px}

/* Period segmented control */
.seg{display:flex;gap:6px;background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:4px}
.seg-btn{flex:1;padding:14px 14px;border-radius:7px;font-family:var(--cond);font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .15s}
.seg-btn.active{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(48,47,44,.12)}
.seg-btn:hover:not(.active){color:var(--ink)}

/* Search + mode dropdown row */
.frow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.search{flex:0 1 380px;min-width:200px;max-width:380px;background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:11px 14px 11px 38px;font-family:var(--font);font-size:14px;color:var(--ink);outline:none;transition:border-color .15s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 16 16\' fill=\'none\' stroke=\'%23999\' stroke-width=\'1.5\'><circle cx=\'6.5\' cy=\'6.5\' r=\'5\'/><path d=\'M10.5 10.5L14 14\' stroke-linecap=\'round\'/></svg>");
  background-repeat:no-repeat;background-position:13px center;background-size:16px}
.search:focus{border-color:var(--accent)}
.mode-sel{background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:11px 14px;font-family:var(--font);font-size:14px;color:var(--ink);outline:none;cursor:pointer;font-weight:500;min-width:140px}
.mode-sel:focus{border-color:var(--accent)}

/* Stats */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:14px 22px;display:inline-flex;align-items:center;gap:14px;flex:0 0 auto}
.stat-num{font-family:var(--cond);font-size:42px;font-weight:900;line-height:1;color:var(--ink);flex-shrink:0}
.stat-lbl{font-family:var(--cond);font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75;line-height:1.15;white-space:nowrap}
.stat.green .stat-num{color:var(--green-deep)}
.stat.orange .stat-num{color:var(--accent-deep)}

/* Report list */
.list-sec{padding:18px 28px}
#reportList{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:1000px){#reportList{grid-template-columns:1fr 1fr}}
@media (min-width:1400px){#reportList{grid-template-columns:1fr 1fr 1fr}}
#reportList .empty,#reportList .loading,#reportList .error{grid-column:1/-1}

/* Week separator — spans full row */
.wk-sep{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:18px 4px 10px;margin-top:8px;border-top:2px solid var(--soft);position:relative}
.wk-sep:first-child{margin-top:0;border-top:none;padding-top:4px}
.wk-sep-line{flex:1;height:2px;background:linear-gradient(to right,var(--soft),transparent);min-width:20px}
.wk-sep-lbl{font-family:var(--cond);font-size:22px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);white-space:nowrap;line-height:1}
.wk-sep-cnt{font-family:var(--cond);font-size:13px;font-weight:800;color:#fff;background:var(--accent);padding:5px 12px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase}

/* Month quick-jump bar */
.month-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:0}
.month-chip{font-family:var(--cond);background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:14px 22px;color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:14px}
.month-chip:hover{border-color:var(--accent)}
.month-chip.active{background:linear-gradient(135deg,#2850a0 0%,#3a6cc0 50%,#148cc8 100%);border-color:transparent;color:#fff}
.month-chip-cnt{font-size:42px;font-weight:900;line-height:1;color:var(--ink);flex-shrink:0;letter-spacing:-.01em}
.month-chip-lbl{font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75;line-height:1.15;white-space:nowrap}
.month-chip.active .month-chip-cnt,.month-chip.active .month-chip-lbl{color:#fff;opacity:1}

/* Calendar */
.cal-wrap{margin-top:14px;background:var(--field);border:1.5px solid var(--field-bd);border-radius:10px;padding:14px;display:none;overflow:hidden}
.cal-wrap.open{display:block}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.cal-nav-btn{background:var(--card);border:1.5px solid var(--field-bd);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:18px;font-weight:800;transition:all .15s;flex-shrink:0}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-nav-title{font-family:var(--cond);font-size:20px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-dow{font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;min-width:0;overflow:hidden}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--field-bd);border-radius:8px;font-family:var(--cond);font-size:15px;font-weight:700;color:var(--ink);cursor:default;position:relative;transition:all .15s;min-width:0;overflow:hidden}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.today{border-color:var(--accent);color:var(--accent-deep);font-weight:900}
.cal-day.has-report{cursor:pointer;background:var(--card);border-color:var(--accent)}
.cal-day.has-report:hover{background:linear-gradient(135deg,#2850a0 0%,#3a6cc0 50%,#148cc8 100%);color:#fff;border-color:transparent}
.cal-day.has-report.str{background:var(--orange-bg)}
.cal-day.has-report.ntr{background:var(--green-bg);border-color:var(--green-deep)}
.cal-day.has-report.ntr:hover{background:var(--green-deep);color:#fff}
.cal-day.selected{background:linear-gradient(135deg,#2850a0 0%,#3a6cc0 50%,#148cc8 100%)!important;color:#fff!important;border-color:transparent!important}
.cal-day-cnt{position:absolute;top:2px;right:4px;font-size:9px;font-weight:900;background:var(--accent);color:#fff;padding:1px 5px;border-radius:8px;line-height:1.4}
.cal-day.ntr .cal-day-cnt{background:var(--green-deep)}
@media (max-width:600px){
  .cal-wrap{padding:10px}
  .cal-grid{gap:3px}
  .cal-day{font-size:13px;border-radius:6px;border-width:1px}
  .cal-day-cnt{font-size:8px;padding:0 4px;top:1px;right:2px}
  .cal-dow{font-size:9px;padding:4px 0}
  .cal-nav-title{font-size:15px}
  .cal-nav-btn{width:32px;height:32px;font-size:15px}
}
.cal-clear{margin-top:10px;font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1.5px solid var(--field-bd);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s;display:none}
.cal-clear:hover{border-color:var(--accent);color:var(--accent)}
.cal-clear.show{display:inline-block}
.cal-toggle-btn{background:var(--field);border:1.5px solid var(--field-bd);color:var(--ink);border-radius:8px;padding:8px 14px;font-family:var(--cond);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.cal-toggle-btn:hover,.cal-toggle-btn.active{border-color:var(--accent);color:var(--accent-deep);background:var(--orange-bg)}
.report{background:var(--card);border:1.5px solid var(--soft2);border-radius:10px;overflow:hidden;transition:box-shadow .15s,border-color .15s,transform .15s;box-shadow:0 1px 3px rgba(48,47,44,.06)}
.report:hover{box-shadow:0 3px 10px rgba(40,80,160,.12);border-color:rgba(40,80,160,.4)}
.r-head{padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap}
.r-mode{font-family:var(--cond);font-size:11.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px;border-radius:6px;flex-shrink:0}
.r-mode.ntr{background:var(--green-bg);color:var(--green-deep)}
.r-mode.str{background:var(--orange-bg);color:var(--accent-deep)}
.r-date{font-family:var(--cond);font-size:18px;font-weight:900;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.r-dir{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:600}
.r-spacer{flex:1}
.r-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.r-tag{font-family:var(--cond);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--soft);color:var(--ink)}
.r-tag.urgent{background:var(--red-bg);color:var(--red-deep)}
.r-chev{width:24px;height:24px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);transition:transform .2s}
.report.open .r-chev{transform:rotate(180deg)}
.report-body{display:none;padding:0 18px 16px;border-top:1px solid var(--soft2);background:rgba(239,237,227,.4)}
.report.open .report-body{display:block}
@media (min-width:1000px){.report.open{grid-column:1/-1}}
.body-row{margin-top:14px}
.body-grid{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 32px;align-items:baseline}
.body-pair{display:inline-flex;align-items:baseline;gap:8px;min-width:0}
.body-pair.full{flex-basis:100%}
.body-lbl{font-family:var(--cond);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.55;flex-shrink:0}
.body-txt{font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;word-wrap:break-word;font-weight:500;letter-spacing:-.005em;min-width:0}
.body-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kit-pill{font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:5px;background:var(--card);border:1px solid var(--soft);color:var(--ink)}
.body-actions{margin-top:14px;padding-top:12px;border-top:1px dashed var(--soft);display:flex;justify-content:flex-end}
.btn-delete{background:transparent;border:1px solid var(--field-bd);color:var(--muted);padding:6px 12px;border-radius:6px;font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-delete:hover{background:var(--red-bg);border-color:var(--red);color:var(--red-deep)}
.btn-delete:disabled{opacity:.5;cursor:default}

/* Empty / loading / error */
.empty,.loading,.error{background:var(--field);border:1.5px dashed var(--field-bd);border-radius:10px;padding:40px 24px;text-align:center;color:var(--muted);font-size:14px}
.error{border-color:rgba(239,68,68,.3);color:var(--red-deep);background:var(--red-bg)}
.spinner{width:24px;height:24px;border:2.5px solid var(--field-bd);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:600px){
  body{padding:14px 12px 50px}
  .hd{padding:16px 18px}
  .sec{padding:14px 18px}
  .list-sec{padding:14px 18px}
  .hd-logos img{height:28px}
  .r-date{font-size:14px}
  .r-meta{width:100%;margin-top:4px}
  .seg-btn{padding:8px 10px;font-size:12px}
}
/* ---- Month calendar (same shape as the Morning Live archive) ---- */
#scCal{margin-bottom:20px}
.sc-mstrip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px;position:relative}
.sc-mstrip::-webkit-scrollbar{display:none}
.sc-mopt{font-family:var(--cond);font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  background:var(--field);border:1.5px solid var(--field-bd);border-radius:8px;padding:8px 13px;
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1}
.sc-mopt:hover{border-color:var(--accent)}
.sc-mopt.is-on{background:var(--accent);border-color:var(--accent);color:#fff}
.sc-mopt.newyear{margin-left:12px}
.sc-mopt.newyear::before{content:"";position:absolute;margin-left:-13px;width:1.5px;height:20px;background:var(--line)}
.sc-mopt em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;
  background:var(--ink);color:var(--bg);border-radius:3px;padding:2px 4px;line-height:1}
.sc-mopt.is-on em{background:rgba(255,255,255,.9);color:var(--accent)}
.sc-mopt i{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0}
.sc-mhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px}
.sc-calname{font-family:var(--cond);font-size:26px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink);line-height:1}
.sc-calcount{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-calkey{display:flex;flex-wrap:wrap;gap:14px;margin-left:auto}
.sc-calkey span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sc-calkey i{width:11px;height:11px;border-radius:3px;display:inline-block}

.sc-dgrid{display:grid;grid-template-columns:repeat(5,1fr) .4fr .4fr;gap:6px}
.sc-dgrid.sc-weekend{grid-template-columns:repeat(7,1fr)}
.sc-dgrid > :nth-child(7n+6),
.sc-dgrid > :nth-child(7n+7){background:none}
.sc-dgrid.sc-weekend > :nth-child(7n+6),
.sc-dgrid.sc-weekend > :nth-child(7n+7){background:var(--soft)}
.sc-dgrid.sc-weekend > .sc-dcell.empty{background:none}
.sc-dgrid > :nth-child(6).sc-ddow,
.sc-dgrid > :nth-child(7).sc-ddow{font-size:13px}
.sc-dgrid > :nth-child(7n+6) .sc-dnum,
.sc-dgrid > :nth-child(7n+7) .sc-dnum{font-size:11.5px;opacity:.65}
.sc-ddow{font-family:var(--cond);font-size:17px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:0 2px 4px;line-height:1}
.sc-dcell{min-height:118px;border-radius:12px;background:var(--soft);padding:8px;
  display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden}
.sc-dbox{background:rgba(255,255,255,.62);border-radius:8px;padding:5px 7px;min-width:0;overflow:hidden}
.sc-dbox.notes{flex:1 0 auto;min-height:30px}
.sc-dboxh{font-family:var(--cond);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(13,13,13,.45);margin-bottom:3px;line-height:1}
.sc-dcell.plan .sc-dbox{background:rgba(255,255,255,.75)}
.sc-dcell.empty{background:none}
.sc-dnum{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.sc-dcell.has .sc-dnum{color:#0d0d0d;font-weight:800}
.sc-dcell.has{background:var(--soft2)}
.sc-dcell.ntr{background:#d2e7d6}
.sc-dcell.str{background:#cfdcf0}
.sc-dcell.urgent{background:#f4d4d0;box-shadow:inset 0 0 0 2px var(--red-deep)}
.sc-dcell.plan{background:var(--soft2)}
.sc-dcell.sel{box-shadow:inset 0 0 0 2.5px var(--accent)}
.sc-dcell.today .sc-dnum::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin-left:5px;vertical-align:middle}
.sc-dentry{cursor:pointer;border-radius:6px;margin:0 -3px;padding:3px;transition:background .08s;min-width:0}
.sc-dentry:hover{background:rgba(13,13,13,.09)}
.sc-dmeta{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(13,13,13,.52);margin-bottom:2px;flex-wrap:wrap;line-height:1.2}
.sc-dmeta .sc-durg{color:#8f2f16}
.sc-dtxt{font-size:11.5px;font-weight:500;line-height:1.35;color:#0d0d0d;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sc-dcell.multi .sc-dtxt{-webkit-line-clamp:2}
.sc-dcell.multi .sc-dentry:nth-child(n+4){display:none}
.sc-dcell.multi.open .sc-dentry{display:block}
.sc-dmore{background:none;border:none;padding:2px 0 0;cursor:pointer;text-align:left;font-family:var(--cond);
  font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(13,13,13,.58)}
.sc-dmore:hover{color:#0d0d0d;text-decoration:underline}

.sc-dlist{display:none}
.sc-daybar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:2px 2px 4px}
.sc-daybar-lbl{font-family:var(--cond);font-size:20px;font-weight:900;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink);line-height:1}
.sc-daybar-x{font-family:var(--cond);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--field);border:1.5px solid var(--field-bd);border-radius:8px;padding:6px 14px;
  color:var(--ink);cursor:pointer}
.sc-daybar-x:hover{border-color:var(--accent)}
#reportList.sc-dayview{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){
  .sc-dgrid{display:none}
  .sc-dlist{display:block}
  .sc-calkey{display:none}
  .sc-dcell.multi .sc-dentry:nth-child(n+4){display:block}

/* ---- Versa Control look (17 Nov): the archive in the same materials as the Report page there ---- */
:root{--bg:#e4e3df; --ink:#141414; --muted:#4e4e49; --soft:#e6e5e1; --soft2:#cfcec8; --line:rgba(20,20,20,.12);

/* month strip, tape, search */

/* month head */

/* more definition (17 Nov): the month keys sit on a grey track, the weekday names in their own cells */

.sc-ddow,.sc-dgrid > :nth-child(6).sc-ddow,.sc-dgrid > :nth-child(7).sc-ddow{background:var(--soft2); border-radius:8px; padding:9px 12px; margin-bottom:2px;

.sc-dbox{box-shadow:inset 0 0 0 1px rgba(20,20,20,.05)}

.sc-mx{background:var(--soft); border:0; border-radius:9px; width:40px; height:40px; font-size:24px; line-height:1; cursor:pointer; color:var(--ink); flex:none}
.sc-mx:hover{background:var(--soft2)}
.sc-mw{background:var(--soft2); border-radius:10px; padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}
.sc-mw.sc-mnone{color:var(--muted); font-weight:600; font-size:15px}
.sc-mstat{display:inline-flex; align-items:center; gap:8px; font-size:17px; font-weight:700}
.sc-mstat::before{content:""; width:12px; height:12px; border-radius:4px; background:#d2e7d6; box-shadow:inset 0 0 0 1px rgba(20,20,20,.1)}
.sc-mstat.str::before{background:#cfdcf0}
.sc-mrows{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px 16px}
.sc-mrow{display:flex; flex-direction:column; gap:2px; background:var(--field); border-radius:8px; padding:8px 11px}
.sc-mrow span{font-size:12.5px; font-weight:600; color:var(--muted)}
.sc-mrow b{font-size:15px; font-weight:700}
.sc-mtxt{background:var(--field); border-radius:8px; padding:12px 14px; font-size:15px; line-height:1.5; white-space:pre-wrap}
.sc-mkit{display:flex; flex-wrap:wrap; gap:6px}
.sc-mkit span{background:var(--field); border-radius:7px; padding:6px 10px; font-size:13px; font-weight:600}
.sc-mfoot{display:flex; justify-content:flex-end}
.sc-mday{flex-direction:row; gap:16px; align-items:flex-start}
.sc-mcol{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px}
.sc-mcol.narrow{flex:0 0 220px}
.sc-mk{font-size:12.5px; font-weight:600; color:var(--muted)}
.sc-mval{font-size:15px; font-weight:700; color:var(--so-blue)}
.sc-mnote{width:100%; background:var(--field); border:0; border-radius:8px; padding:10px 12px; font:inherit; font-size:15px; line-height:1.45; color:var(--ink); resize:vertical; outline:none}
.sc-mnote:focus{box-shadow:inset 0 0 0 2px var(--so-blue)}
.sc-mday .sc-dengbtn{font-size:15px; padding:6px 18px 6px 0}
@media (max-width:700px){.sc-mday{flex-direction:column}.sc-mcol.narrow{flex:none}}
/* the pop-up, tighter */
.sc-ov{padding:32px 20px}
.sc-md{max-width:720px; padding:14px 16px 16px; gap:8px}
.sc-mdh{padding-bottom:2px}
.sc-mdd{font-size:21px}
.sc-mddir{font-size:12px; margin-top:2px}
.sc-mx{width:34px; height:34px; font-size:21px}
.sc-mw{padding:10px 12px 12px; gap:8px}
.sc-mstat{font-size:15px}
.sc-mrows{grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.sc-mrow{padding:6px 9px}
.sc-mrow span{font-size:11.5px}
.sc-mrow b{font-size:14px}
.sc-mtxt{padding:9px 11px; font-size:14px; line-height:1.45}
.sc-mfoot{margin-top:-2px}
.sc-mfoot .sc-btn{padding:8px 14px; font-size:14px}
.sc-mday{gap:12px}
.sc-mcol.narrow{flex:0 0 190px}
.sc-mk{font-size:11.5px}
.sc-mk em{font-style:normal; color:#16a34a; margin-left:6px}
.sc-mnote{padding:8px 10px; font-size:14px; box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.12); cursor:text}
.sc-mnote::placeholder{color:var(--muted)}
.sc-mday .sc-btn{padding:8px 12px; font-size:14px}
@media (max-width:700px){.sc-mrows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sc-mtape{background:var(--shop-pink); color:#fff; border-radius:8px; padding:9px 12px; font-size:15px; font-weight:700}
.sc-mwho{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sc-mwc{background:var(--soft2); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; min-width:0}
.sc-mwc span{font-size:12px; font-weight:600; color:var(--muted)}
.sc-mwc b{font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
.sc-mwc .sc-dengbtn{font-size:20px; font-weight:700; letter-spacing:-.02em; padding:0 18px 0 0; color:var(--ink); background-position:right center}
.sc-mwc .sc-dengbtn:not(.set){color:var(--muted)}
.sc-mrows{grid-template-columns:repeat(3,minmax(0,1fr))}
/* the Report and Notes boxes stand out from the day */
.sc-dgrid .sc-dbox{background:#fff; border:1.5px solid rgba(20,20,20,.16); box-shadow:0 1px 2px rgba(20,20,20,.06)}
.sc-dgrid .sc-dboxh{color:var(--ink); font-weight:700; padding-bottom:4px; margin-bottom:5px; border-bottom:1px solid rgba(20,20,20,.1)}
.sc-dtxt.ntr{text-transform:uppercase; font-weight:700; letter-spacing:.03em}
/* the engineer at the foot of the day in capitals, as the director is at its head */
.sc-dmark .sc-dengbtn,.sc-dmark .sc-deng{text-transform:uppercase; letter-spacing:.05em; font-size:12.5px; font-weight:700}
.sc-dmark .sc-dengbtn:not(.set){font-weight:600}
.sc-dgrid .sc-dmark{display:flex; justify-content:center; text-align:center}
.sc-md.sc-fd{max-width:1180px}
.sc-ff{display:block; width:100%; height:560px; border:0; background:transparent; border-radius:10px}

.sc-drep{font-size:11.5px; line-height:1.3; color:var(--ink); margin-top:4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.sc-drep b{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-right:3px}
.sc-mrep{background:var(--field); border-radius:8px; padding:9px 11px; display:flex; flex-direction:column; gap:3px}
.sc-mrep span{font-size:11.5px; font-weight:600; color:var(--muted)}
.sc-mrep div{font-size:14px; line-height:1.45; white-space:pre-wrap}
body.sc-formview .wrap{max-width:1040px !important}
/* the note fills its whole box; the box itself shows when it is being typed in */
.sc-dgrid .sc-dbox.notes{display:flex; flex-direction:column}
.sc-dgrid .sc-dbox.notes .sc-dnotein{flex:1 1 auto; height:auto; min-height:40px; padding:0 !important; border-radius:0 !important; background:none !important; box-shadow:none !important}
.sc-dgrid .sc-dbox.notes:focus-within{border-color:var(--so-blue); box-shadow:0 0 0 1px var(--so-blue)}
/* days outside the month keep the grid's shape */
.sc-dgrid > .sc-dcell.empty{background:rgba(20,20,20,.035) !important; box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.09) !important; border:0 !important}
/* phones: the same day boxes as the wide calendar, one per line */
.sc-dwd{display:none}
@media (max-width:900px){
  .sc-dlist{display:none !important}
  .sc-dgrid{display:grid !important; grid-template-columns:minmax(0,1fr) !important; gap:8px !important}
  .sc-dgrid > .sc-ddow, .sc-dgrid > .sc-dcell.empty{display:none !important}
  .sc-dgrid > .sc-dcell:not(.empty){display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"head head" "tape tape" "rep notes" "mark mark";
    gap:6px 8px; min-height:0 !important; padding:10px !important}
  .sc-dgrid .sc-dhead{grid-area:head; display:flex; align-items:baseline; gap:8px; margin:0}
  .sc-dgrid .sc-dwd{display:block; font-size:15px; font-weight:700; color:var(--ink)}
  .sc-dgrid .sc-ddir{margin-left:auto; text-align:right}
  .sc-dgrid .sc-dtape{grid-area:tape; justify-self:start}
  .sc-dgrid .sc-dbox.report{grid-area:rep; margin:0}
  .sc-dgrid .sc-dbox.notes{grid-area:notes; margin:0}
  .sc-dgrid .sc-dmark{grid-area:mark; margin:0}
  #scTitle{white-space:normal !important; font-size:22px !important; line-height:1.15; padding:0 !important}
  .sc-mcol{min-width:0; width:100%}
  .sc-mnote{width:100% !important; box-sizing:border-box}
}

<script>
var SB_URL='https://dttwgmoyxthczlzxjgag.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ';

var _allReports=[];

function ymKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmtDate(iso){if(!iso)return '\u2014';try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}}
function fmtDateShort(iso){if(!iso)return '\u2014';try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});}catch(e){return iso;}}
function fmtSubmitted(iso){if(!iso)return '';try{return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function escHtml(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function scSplitReports(txt){
  var out={main:String(txt||''),dir:'',eng:''};
  var m=out.main.match(/\n\nEngineer\u2019s report: ([\s\S]*)$/); if(m){out.eng=m[1].trim();out.main=out.main.slice(0,m.index);}
  m=out.main.match(/(?:^|\n\n)Director\u2019s report: ([\s\S]*)$/); if(m){out.dir=m[1].trim();out.main=out.main.slice(0,m.index);}
  return out;
}
function parseExtras(txt){
  var _sr=scSplitReports(txt); txt=_sr.main;
  var _r=parseExtras0(txt); _r.dirRep=_sr.dir; _r.engRep=_sr.eng; return _r;
}
function parseExtras0(txt){
  if(!txt)return {clean:'',temp:'',delay:'',eng:''};
  /* The form has written the [Temperature | Delay] block at the front on some
     days and at the end on others. Read it from either end. */
  var tagStr='',rest=txt;
  var m=txt.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
  if(m){tagStr=m[1];rest=m[2]||'';}
  else{
    var m2=txt.match(/^([\s\S]*?)\s*\[([^\]]+)\]\s*$/);
    if(m2){tagStr=m2[2];rest=m2[1]||'';}
  }
  if(!tagStr)return {clean:txt,temp:'',delay:'',eng:''};
  var temp='',delay='',eng='';
  tagStr.split('|').forEach(function(t){
    t=t.trim();
    var tm=t.match(/^Temperature:\s*(.+)$/i);if(tm)temp=tm[1].trim();
    var dm=t.match(/^Delay:\s*(.+)$/i);if(dm)delay=dm[1].trim();
    var em=t.match(/^Engineer:\s*(.+)$/i);if(em)eng=em[1].trim();
  });
  if(!temp&&!delay&&!eng)return {clean:txt,temp:'',delay:'',eng:''};
  rest=rest.replace(/[\s\u2014\u2013-]+$/,'').trim();
  return {clean:rest,temp:temp,delay:delay,eng:eng};
}

function _sbHead(){return {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};}

/* ---- The day record: engineer, notes and tape playout ------------------- */
var SC_DAYS_KEY='shopon_cal_days';

async function scLoadDays(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/app_data?select=value&key=eq.'+SC_DAYS_KEY,{headers:_sbHead()});
    if(!r.ok)return;
    var rows=await r.json();
    _scDays=(rows[0]&&rows[0].value)||{};
  }catch(e){console.warn('day record load failed',e);}
}

async function scSaveDay(iso,patch){
  /* Re-read before writing, so two people on different days do not wipe
     each other's entries. */
  var all={};
  try{
    var r=await fetch(SB_URL+'/rest/v1/app_data?select=value&key=eq.'+SC_DAYS_KEY,{headers:_sbHead()});
    if(r.ok){var rows=await r.json();all=(rows[0]&&rows[0].value)||{};}
  }catch(e){}
  var d=Object.assign({},all[iso]||{},patch);
  if(!d.eng&&!String(d.note||'').trim()&&!d.tape)delete all[iso];
  else{if(!d.eng)delete d.eng;if(!String(d.note||'').trim())delete d.note;if(!d.tape)delete d.tape;all[iso]=d;}
  var res=await fetch(SB_URL+'/rest/v1/app_data?on_conflict=key',{
    method:'POST',
    headers:Object.assign({},_sbHead(),{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({key:SC_DAYS_KEY,value:all,updated_at:new Date().toISOString()})
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  _scDays=all;
}

/* ---- The planner's ShopOn engineer row ---------------------------------- */
/* The planner publishes its ShopOn row — and nothing else — to 'shopon_roster'
   on every load and save, because planner_data itself is closed to this key. */
async function scLoadRoster(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/app_data?select=value&key=eq.shopon_roster',{headers:_sbHead()});
    if(!r.ok)return;
    var rows=await r.json();
    if(rows[0]&&rows[0].value&&typeof rows[0].value==='object')_scRoster=rows[0].value;
  }catch(e){console.warn('roster load failed',e);}
}

/* The engineer comes from the planner's ShopOn row and nowhere else. */
function scEngOn(iso){var d=_scDays[iso];return (d&&d.eng)||_scRoster[iso]||'';}
function scEngFrom(iso){var d=_scDays[iso];return (d&&d.eng)?'planned here':(_scRoster[iso]?'from the planner':'');}
function scRepEng(items){var n='';(items||[]).some(function(r){n=parseExtras(r.summary_text||'').eng||'';return !!n;});return n;}
var SC_ENGINEERS=['Ian Curry','James Forshaw'];
function scEngineerNames(){
  var out=[],seen={};
  function add(n){n=String(n||'').trim();if(!n)return;var k=n.toLowerCase();if(seen[k])return;seen[k]=1;out.push(n);}
  SC_ENGINEERS.forEach(add);
  _allReports.forEach(function(r){add(parseExtras(r.summary_text||'').eng);});
  Object.keys(_scDays).forEach(function(d){add(_scDays[d].eng);});
  Object.keys(_scRoster).forEach(function(d){add(_scRoster[d]);});
  return out;
}
async function scSetEng(v){
  if(v==='__other'){v=prompt('Engineer');if(v===null){applyFilters();return;}}
  try{await scSaveDay(_dateFilter,{eng:String(v||'').trim()});}
  catch(e){alert('Could not save the engineer.\n\n'+e.message);}
  applyFilters();
}

async function loadReports(){
  if(!_scMonth)_scMonth=ymKey(new Date());
  var listEl=document.getElementById('reportList');
  listEl.innerHTML='<div class="loading"><div class="spinner"></div>Loading reports\u2026</div>';
  try{
    /* a dropped connection (a phone hotspot losing its DNS for a moment) is tried again, not reported at once */
    var r=null, lastErr=null;
    for(var attempt=1;attempt<=4;attempt++){
      try{
        r=await fetch(SB_URL+'/rest/v1/engineering_reports?show_name=eq.ShopOn%20TV&select=*&order=show_date.desc,submitted_at.desc&limit=500',{headers:_sbHead()});
        if(r.ok)break;
        lastErr=new Error('HTTP '+r.status); r=null;
      }catch(err){lastErr=err; r=null;}
      if(attempt<4){
        listEl.innerHTML='<div class="loading"><div class="spinner"></div>Connection dropped \u2014 trying again\u2026</div>';
        await new Promise(function(res){setTimeout(res,attempt*1500);});
      }
    }
    if(!r)throw lastErr||new Error('Load failed');
    _allReports=await r.json();
    _reportsByDate={};
    _allReports.forEach(function(x){
      if(!x.show_date)return;
      (_reportsByDate[x.show_date]=_reportsByDate[x.show_date]||[]).push(x);
    });
    if(!_scMonth)_scMonth=ymKey(new Date());
    applyFilters();
    /* The day record and the planner's row are small and separate: the month is
       already on screen while they arrive. */
    await Promise.all([scLoadDays(),scLoadRoster()]);
    applyFilters();
  }catch(e){
    listEl.innerHTML='<div class="error">Could not reach the reports \u2014 '+escHtml(e.message)+'. Check the internet connection. <button type="button" class="sc-btn go" onclick="loadReports()" style="margin-left:10px">Try again</button></div>';
  }
}
/* when the connection comes back, load again by itself */
window.addEventListener('online',function(){if(!_allReports.length)loadReports();});

function applyFilters(){
  var el=document.getElementById('searchInput');
  var q=el?el.value.trim().toLowerCase():'';
  var base=_allReports.filter(function(r){
    if(!q)return true;
    var hay=((r.summary_text||'')+' '+(r.tagged_kit_names||[]).join(' ')+' '+(r.urgent_details||'')).toLowerCase();
    return hay.indexOf(q)>-1;
  });
  scRenderCal(base);
  scRenderDay(base);
  if(_scModalIso)scModalRender();
}

/* ---- The month grid ---------------------------------------------------- */
function scInitials(n){
  return String(n||'').trim().split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,3).toUpperCase()||'\u2014';
}
function scIsUrgent(r){
  if(String(r.urgent_action||'').toLowerCase()==='yes')return true;
  return !!String(r.urgent_details||'').trim();
}
function scState(items){
  if(items.some(scIsUrgent))return 'urgent';
  return items.some(function(r){return (r.summary_mode||'').toLowerCase()==='str';})?'str':'ntr';
}
/* The directors on a day, each once, for the line beside the day number. */
function scDirectors(items){
  var seen={},out=[];
  (items||[]).forEach(function(r){
    var n=String(r.versa_tech_manager||'').trim(),k=n.toLowerCase();
    if(n&&!seen[k]){seen[k]=1;out.push(n);}
  });
  return out;
}
function scEntry(r,noDir){
  var mode=(r.summary_mode||'str').toLowerCase();
  var p=parseExtras(r.summary_text||'');
  var txt=p.clean||(mode==='ntr'?'Nothing to report':'');
  var kit=(r.tagged_kit_names||[]).length;
  var meta=(noDir===true?'':'<span>'+escHtml(scInitials(r.versa_tech_manager))+'</span>')
      +(p.delay?'<span>Delay '+escHtml(p.delay)+'</span>':'')
      +(kit?'<span>'+kit+' kit</span>':'')
      +(scIsUrgent(r)?'<span class="sc-durg">Urgent</span>':'');
  return '<div class="sc-dentry" onclick="event.stopPropagation();scPick(\''+escHtml(r.show_date||'')+'\')">'
    +(meta?'<div class="sc-dmeta">'+meta+'</div>':'')
    +(p.dirRep
      ? '<div class="sc-drep"><b>Director</b> '+escHtml(p.dirRep)+'</div>'+(String(txt).trim()?'<div class="sc-drep"><b>Engineer</b> '+escHtml(txt)+'</div>':'')
      : '<div class="sc-dtxt'+(/^nothing to report\.?$/i.test(String(txt).trim())?' ntr':'')+'">'+escHtml(txt)+'</div>')
    +(p.engRep?'<div class="sc-drep"><b>Engineer</b> '+escHtml(p.engRep)+'</div>':'')
  +'</div>';
}

/* The strip runs from the first report to a year ahead, so days that have not
   happened yet can be given an engineer, a note or a playout. */
function scMonthList(rows){
  var keys={};
  rows.forEach(function(r){var d=(r.show_date||'').slice(0,7);if(d)keys[d]=1;});
  Object.keys(_scDays).forEach(function(d){keys[d.slice(0,7)]=1;});
  Object.keys(_scRoster).forEach(function(d){keys[d.slice(0,7)]=1;});
  var all=Object.keys(keys).sort();
  var now=new Date();
  var start=all.length?all[0]:ymKey(now);
  if(ymKey(now)<start)start=ymKey(now);
  var endD=new Date(now.getFullYear(),now.getMonth()+12,1);
  var last=all.length?all[all.length-1]:ymKey(now);
  if(ymKey(endD)>last)last=ymKey(endD);
  var out=[],c=new Date(+start.slice(0,4),+start.slice(5,7)-1,1);
  for(var i=0;i<400;i++){
    var k=ymKey(c);
    out.push(k);
    if(k===last)break;
    c.setMonth(c.getMonth()+1);
  }
  return out;
}

function scRenderCal(rows){
  var host=document.getElementById('scCal');
  if(!host)return;
  var keepY=window.scrollY;

  var DATA={};
  rows.forEach(function(r){
    var ds=(r.show_date||'').slice(0,10); if(!ds)return;
    var k=ds.slice(0,7);
    if(!DATA[k])DATA[k]={};
    var d=parseInt(ds.slice(8,10),10);
    (DATA[k][d]=DATA[k][d]||[]).push(r);
  });

  var MONTHS=scMonthList(rows);
  if(MONTHS.indexOf(_scMonth)<0)_scMonth=MONTHS[MONTHS.length-1];

  function urgentIn(k){
    var days=DATA[k]||{},n=0;
    Object.keys(days).forEach(function(d){n+=days[d].filter(scIsUrgent).length;});
    return n;
  }

  var lastYear=null,lastShown=false;
  var strip=MONTHS.map(function(k){
    var dt=new Date(k+'-01T12:00:00');
    var yr=k.slice(0,4),newYear=(yr!==lastYear);lastYear=yr;
    var u=urgentIn(k);
    var wasShown=lastShown;lastShown=true;
    return '<button class="sc-mopt'+(k===_scMonth?' is-on':'')+(newYear&&wasShown?' newyear':'')+'" type="button" onclick="scGo(\''+k+'\')">'
      +dt.toLocaleDateString('en-GB',{month:'short'}).replace('Sept','Sep')
      +(newYear?'<em>'+yr+'</em>':'')
      +(u?'<i title="'+u+' urgent"></i>':'')
    +'</button>';
  }).join('');

  var searchVal='';
  var sv=document.getElementById('searchInput');
  if(sv)searchVal=sv.value;

  var k=_scMonth,days=DATA[k]||{};
  var y=+k.slice(0,4),m=+k.slice(5,7);
  var first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,last=new Date(y,m,0).getDate();
  var n=Object.keys(days).reduce(function(a,d){return a+days[d].length;},0);
  var urg=urgentIn(k);
  var now=new Date(),todayKey=ymKey(now);

  var top='<div class="sc-top">'
    +'<div class="sc-mstrip">'+strip+'</div>'
    +'<span class="sc-tape'+(_scArm?' armed':'')+'" draggable="true" ondragstart="scDragNew(event)" onclick="scArmTape(event)">Tape playout</span>'
    +'<input type="text" class="search" id="searchInput" placeholder="Search" oninput="applyFilters()" value="'+escHtml(searchVal)+'"/>'
  +'</div>';

  var head='<div class="sc-mhead">'
      +'<span class="sc-calname">'+escHtml(first.toLocaleDateString('en-GB',{month:'long',year:'numeric'}))+'</span>'
      +'<span class="sc-calcount">'+n+' report'+(n===1?'':'s')+(urg?' \u00b7 '+urg+' urgent':'')+'</span>'
      +'<span class="sc-calkey">'
        +'<span><i style="background:#d2e7d6"></i>Nothing to report</span>'
        +'<span><i style="background:#cfdcf0"></i>Something to report</span>'
        +'<span><i style="background:#f4d4d0;box-shadow:inset 0 0 0 2px #dc2626"></i>Urgent</span>'
        +'<span><i style="background:var(--shop-pink)"></i>Tape playout</span>'
      +'</span>'
    +'</div>';

  var dow=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var grid=dow.map(function(d){return '<div class="sc-ddow">'+d+'</div>';}).join('');
  for(var p=0;p<lead;p++)grid+='<div class="sc-dcell empty"></div>';
  var weekendUsed=false;
  for(var d=1;d<=last;d++){
    var items=days[d];
    var iso=k+'-'+String(d).padStart(2,'0');
    var rec=_scDays[iso]||{};
    var eng=scRepEng(items)||scEngOn(iso);
    var planned=!!(rec.tape||rec.note||eng);
    if((items||planned)&&(function(){var wd=new Date(y,m-1,d).getDay();return wd===0||wd===6;})())weekendUsed=true;
    var cls=['sc-dcell'];
    if(items)cls.push('has',scState(items));
    else if(planned)cls.push('has','plan');
    if(items&&items.length>1)cls.push('multi');
    if(k===todayKey&&d===now.getDate())cls.push('today');
    if(_scOpen[iso])cls.push('open');
    var repEng=scRepEng(items);
    var marks='<div class="sc-dmark">'+(repEng?'<span class="sc-deng">'+escHtml(repEng)+'</span>':scEngSelect(iso,scEngOn(iso)))+'</div>';
    /* the director's name sits beside the day number; the initials stay in the
       report line only when one day has reports from more than one director */
    var dirs=scDirectors(items),oneDir=dirs.length<2;
    var boxes='<div class="sc-dbox report"><div class="sc-dboxh">Report</div>'
          +(items?items.map(function(r){return scEntry(r,oneDir);}).join(''):'')
          +(items&&items.length>2?'<button class="sc-dmore" type="button" onclick="event.stopPropagation();scMore(this)">+'+(items.length-2)+' more</button>':'')
        +'</div>'
        +'<div class="sc-dbox notes" onclick="event.stopPropagation();var t=this.querySelector(\'textarea\');if(t&&event.target!==t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}"><div class="sc-dboxh">Notes</div>'
          +'<textarea class="sc-dnotein" data-iso="'+iso+'" rows="2" onblur="scNoteBlur(this)" onkeydown="if(event.key===\'Escape\')this.blur()">'+escHtml(rec.note||'')+'</textarea>'
        +'</div>';
    grid+='<div class="'+cls.join(' ')+'" data-iso="'+iso+'" ondragover="scDragOver(event)" ondragleave="scDragOff(event)" ondrop="scDrop(event,\''+iso+'\')" onclick="scPick(\''+iso+'\')">'
      +'<div class="sc-dhead"><div class="sc-dnum">'+d+'</div><div class="sc-dwd">'+new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long'})+'</div>'
        +(dirs.length?'<div class="sc-ddir">'+dirs.map(escHtml).join('<br>')+'</div>':'')
      +'</div>'
      +(rec.tape?'<span class="sc-dtape" draggable="true" ondragstart="scDragMove(event,\''+iso+'\')">Tape playout<button type="button" class="sc-dtapex" title="Remove" onclick="event.stopPropagation();scRemoveTape(\''+iso+'\')">\u00d7</button></span>':'')
      +boxes
      +marks
    +'</div>';
  }

  var listDays={};
  Object.keys(days).forEach(function(d){listDays[d]=1;});
  Object.keys(_scDays).forEach(function(iso){if(iso.slice(0,7)===k)listDays[parseInt(iso.slice(8,10),10)]=1;});
  var list=Object.keys(listDays).map(Number).sort(function(a,b){return a-b;}).map(function(d){
    var dt=new Date(y,m-1,d),iso=k+'-'+String(d).padStart(2,'0'),rec=_scDays[iso]||{},eng=scEngOn(iso);
    return '<div class="sc-dday" onclick="scPick(\''+iso+'\')">'
      +'<div class="sc-ddate">'+dt.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit'}).replace(',','')+'</div>'
      +'<div class="sc-dbody">'
        +'<div class="sc-dbox report"><div class="sc-dboxh">Report</div>'+((days[d]||[]).map(scEntry).join(''))+'</div>'
        +'<div class="sc-dbox notes"><div class="sc-dboxh">Notes</div>'+(rec.note?'<div class="sc-dnote">'+escHtml(rec.note)+'</div>':'')+'</div>'
        +((eng||rec.tape)?'<div class="sc-dmark">'+(rec.tape?'<span class="sc-dtape">Tape</span>':'')+(eng?'<span class="sc-deng">'+escHtml(eng)+'</span>':'')+'</div>':'')
      +'</div>'
    +'</div>';
  }).join('');

  host.innerHTML=top+head+'<div class="sc-dgrid'+(weekendUsed?' sc-weekend':'')+'">'+grid+'</div>'
    +'<div class="sc-dlist">'+list+'</div>';

  var on=host.querySelector('.sc-mopt.is-on');
  if(on){var strip=on.parentNode; if(on.offsetLeft<strip.scrollLeft||on.offsetLeft+on.offsetWidth>strip.scrollLeft+strip.clientWidth)strip.scrollLeft=Math.max(0,on.offsetLeft-strip.clientWidth/2+on.offsetWidth/2);}
  window.scrollTo(0,keepY);
}

function scGo(k){_scMonth=k;_dateFilter='';applyFilters();}

var _scOpen={};   /* days whose reports are opened out in full */
var _scArm=false; /* the tape key has been pressed: the next day clicked takes it */
function scArmTape(e){
  e.stopPropagation();
  _scArm=!_scArm;
  document.querySelectorAll('.sc-tape').forEach(function(t){t.classList.toggle('armed',_scArm);});
  document.body.classList.toggle('sc-arming',_scArm);
}
async function scPlaceTape(iso){
  _scArm=false; document.body.classList.remove('sc-arming');
  try{await scSaveDay(iso,{tape:true});}
  catch(err){alert('Could not save the playout.\n\n'+err.message);}
  applyFilters();
}
function scPick(iso){
  if(!iso)return;
  if(_scArm){scPlaceTape(iso);return;}
  scModalOpen(iso);
}

/* ---- The report form, opened in the page rather than on a page of its own ---- */
/* the form is a page of this page: the calendar steps aside and the form takes its place */
function scFormShow(on){
  var pg=document.getElementById('scFormPage'), cal=document.getElementById('scCal'), list=document.getElementById('reportList'), key=document.getElementById('scFormKey');
  if(!pg)return;
  if(on){
    if(!pg.querySelector('iframe')){
      pg.innerHTML='<iframe class="sc-ff" scrolling="no" src="versa-shopon-report.html?embed=1&v='+Date.now()+'" title="Engineering report"></iframe>';
      var fr=pg.querySelector('iframe');
      fr.onload=function(){try{var d=fr.contentDocument;var fit=function(){fr.style.height=Math.ceil(d.body.getBoundingClientRect().height+4)+'px';d.documentElement.scrollTop=0;};fit();new ResizeObserver(fit).observe(d.body);window.scrollTo(0,0);}catch(e){}};
    }
    pg.hidden=false; cal.hidden=true; if(list)list.hidden=true; document.body.classList.add('sc-formview');
    if(key)key.innerHTML='<span style="font-size:14px">\u2190</span> Calendar';
    var t=document.getElementById('scTitle'); if(t)t.textContent='Engineering Report';

    pg.hidden=true; pg.innerHTML=''; cal.hidden=false; if(list)list.hidden=false; document.body.classList.remove('sc-formview');
    if(key)key.innerHTML='Submit Report <span style="font-size:14px">\u2192</span>';
    document.title='ShopOn TV Engineering Reports';
    var t2=document.getElementById('scTitle'); if(t2)t2.textContent='Engineering Report Archive';
  }
  window.scrollTo(0,0);
}

function scFormClose(){ if(location.hash==='#report')scFormBack(); }

      +'<div class="sc-mfoot"><button type="button" class="sc-btn del" onclick="deleteReport(\''+escHtml(r.id)+'\',event)">Delete report</button></div>'

  }).join('');
  m.innerHTML='<div class="sc-md" role="dialog" aria-modal="true">'

var _scNoteT=null;
function scModalNoteTyped(el){clearTimeout(_scNoteT);var f=document.getElementById('scMSaved');if(f)f.textContent='';_scNoteT=setTimeout(function(){scModalNoteSave(el);},900);}
function scModalNoteSave(el){
  clearTimeout(_scNoteT);

async function scModalTape(iso){

function scEngSelect(iso,eng){

    +escHtml(eng||'None')+'</button>';

function scEngMenu(btn){

  var items=[{v:'',t:'None'}].concat(names.map(function(n){return {v:n,t:n};}),[{v:'__other',t:'Other\u2026'}]);

  m.innerHTML=items.map(function(it){

  }).join('');

  document.body.appendChild(m);
  var r=btn.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  var left=Math.max(12, Math.min(r.left-8, window.innerWidth-mw-12));
  var above=r.top-mh-12>=12;
  m.style.left=left+'px'; m.style.top=(above?r.top-mh-10:r.bottom+10)+'px';
  m.classList.toggle('below',!above);
  m.style.setProperty('--arrow', Math.max(14, Math.min(mw-26, r.left+10-left))+'px');
}

window.addEventListener('scroll',scEngMenuClose,true);
window.addEventListener('resize',scEngMenuClose);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){scEngMenuClose();if(_scModalIso&&!document.getElementById('scEngMenu'))scModalClose();if(_scArm){_scArm=false;document.body.classList.remove('sc-arming');document.querySelectorAll('.sc-tape').forEach(function(t){t.classList.remove('armed');});}}});

/* a note typed into a day's box is kept when you leave the box */
function scNoteBlur(el){
  var iso=el.getAttribute('data-iso'), v=el.value;
  var cur=((_scDays[iso]||{}).note)||'';
  if(v.trim()===cur.trim())return;
  scSaveDay(iso,{note:v}).then(function(){applyFilters();}).catch(function(e){alert('Could not save the note.\n\n'+e.message);});
}

function scMore(btn){
  var cell=btn.closest('.sc-dcell');
  var open=cell.classList.toggle('open');
  btn.textContent=open?'Show less':'+'+(cell.querySelectorAll('.sc-dentry').length-2)+' more';
}

function clearDateFilter(){_dateFilter='';applyFilters();}

/* ---- Dragging a tape playout onto a day -------------------------------- */
function scDragNew(e){e.dataTransfer.setData('text/plain','tape:new');e.dataTransfer.effectAllowed='copy';}
function scDragMove(e,from){e.stopPropagation();e.dataTransfer.setData('text/plain','tape:'+from);e.dataTransfer.effectAllowed='move';}
function scDragOver(e){
  var cell=e.currentTarget;
  if(cell.classList.contains('empty'))return;
  e.preventDefault();cell.classList.add('drop');
}
function scDragOff(e){e.currentTarget.classList.remove('drop');}
async function scDrop(e,iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  var d=String(e.dataTransfer.getData('text/plain')||'');
  if(d.indexOf('tape:')!==0)return;
  var from=d.slice(5);
  try{
    if(from!=='new'&&from!==iso)await scSaveDay(from,{tape:false});
    await scSaveDay(iso,{tape:true});
  }catch(err){alert('Could not save the playout.\n\n'+err.message);}
  applyFilters();
}

/* ---- The day panel ----------------------------------------------------- */
function scRenderDay(base){
  var listEl=document.getElementById('reportList');
  if(!listEl)return;
  listEl.className='';listEl.innerHTML='';return;   /* everything is edited in the day's own box; nothing opens down here */
  if(!_dateFilter){listEl.className='';listEl.innerHTML='';return;}
  var iso=_dateFilter;
  var rec=_scDays[iso]||{};
  var eng=scEngOn(iso);
  var day=base.filter(function(r){return r.show_date===iso;});
  listEl.className='sc-dayview';
  listEl.innerHTML='<div class="sc-daybar">'
      +'<span class="sc-daybar-lbl">'+fmtDate(iso)+'</span>'
      +'<button type="button" class="sc-daybar-x" onclick="clearDateFilter()">Close</button>'
    +'</div>'
    +'<div class="sc-panel">'
      +'<div class="sc-pfield">'
        +'<label>Versa engineer</label>'
        +'<select onchange="scSetEng(this.value)">'
          +'<option value=""'+(eng?'':' selected')+'>None</option>'
          +scEngineerNames().map(function(n){return '<option value="'+escHtml(n)+'"'+(n===eng?' selected':'')+'>'+escHtml(n)+'</option>';}).join('')
          +'<option value="__other">Other\u2026</option>'
        +'</select>'
        +(eng&&scEngFrom(iso)?'<span class="sc-psaid">'+scEngFrom(iso)+'</span>':'')
      +'</div>'
      +'<div class="sc-pfield">'
        +'<label>Tape playout</label>'
        +'<div class="sc-prow">'
          +'<button type="button" class="sc-btn'+(rec.tape?' on':'')+'" onclick="scToggleTape()">'+(rec.tape?'On this day':'Not on this day')+'</button>'
          +(rec.tape?'<button type="button" class="sc-btn del" onclick="scRemoveTape(\''+iso+'\')">Delete</button>':'')
        +'</div>'
      +'</div>'
    +'</div>'
    +day.map(renderCard).join('');
}

async function scRemoveTape(iso){
  try{await scSaveDay(iso,{tape:false});}
  catch(e){alert('Could not remove the playout.\n\n'+e.message);}
  applyFilters();
}
async function scToggleTape(){
  var rec=_scDays[_dateFilter]||{};
  try{await scSaveDay(_dateFilter,{tape:!rec.tape});}
  catch(e){alert('Could not save the playout.\n\n'+e.message);}
  applyFilters();
}
async function scSaveNote(){
  var el=document.getElementById('scNote');
  if(!el)return;
  var said=document.getElementById('scSaid');
  if(said)said.textContent='Saving\u2026';
  try{
    await scSaveDay(_dateFilter,{note:el.value});
    if(said)said.textContent='Saved';
    applyFilters();
  }catch(e){
    if(said)said.textContent='';
    alert('Could not save the note.\n\n'+e.message);
  }
}

function renderCard(r){
  var mode=(r.summary_mode||'str').toLowerCase();
  var modeLbl=mode==='ntr'?'Nothing to Report':'Something to Report';
  var parsed=parseExtras(r.summary_text||'');
  var temp=parsed.temp;var delay=parsed.delay;
  var bodyText=parsed.clean||r.summary_text||'';
  var isOpen=!!_expandedIds[r.id];
  var tempTag='';
  if(temp){
    var cls='r-tag';if(/not ok/i.test(temp))cls+=' urgent';
    tempTag='<span class="'+cls+'">'+escHtml(temp.length>32?temp.slice(0,32)+'…':temp)+'</span>';
  }
  var delayTag=delay?'<span class="r-tag">Delay: '+escHtml(delay)+'</span>':'';
  var kitNames=Array.isArray(r.tagged_kit_names)?r.tagged_kit_names:[];
  var kitTag=kitNames.length?'<span class="r-tag">'+kitNames.length+' kit tagged</span>':'';

  return '<div class="report'+(isOpen?' open':'')+'" data-id="'+escHtml(r.id)+'">'
    +'<div class="r-head" onclick="toggleReport(\''+escHtml(r.id)+'\')">'
      +'<span class="r-mode '+mode+'">'+modeLbl+'</span>'
      +'<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><div class="r-date">'+fmtDateShort(r.show_date)+'</div><div class="r-dir">'+escHtml(r.versa_tech_manager||'—')+'</div></div>'
      +'<div class="r-spacer"></div>'
      +'<div class="r-meta">'+tempTag+delayTag+kitTag+'</div>'
      +'<div class="r-chev">▾</div>'
    +'</div>'
    +'<div class="report-body">'
      +'<div class="body-grid">'
        +'<div class="body-pair"><div class="body-lbl">Show Date</div><div class="body-txt">'+fmtDate(r.show_date)+'</div></div>'
        +'<div class="body-pair"><div class="body-lbl">Director</div><div class="body-txt">'+escHtml(r.versa_tech_manager||'—')+'</div></div>'
        +(parsed.eng?'<div class="body-pair"><div class="body-lbl">Versa Engineer</div><div class="body-txt">'+escHtml(parsed.eng)+'</div></div>':'')
        +(temp?'<div class="body-pair"><div class="body-lbl">Studio Temp</div><div class="body-txt">'+escHtml(temp)+'</div></div>':'')
        +(delay?'<div class="body-pair"><div class="body-lbl">TX Delay</div><div class="body-txt">'+escHtml(delay)+'</div></div>':'')
      +'</div>'
      +(bodyText?'<div class="body-grid"><div class="body-pair full"><div class="body-lbl">'+(mode==='ntr'?'Status':'Technical Info')+'</div><div class="body-txt">'+escHtml(bodyText)+'</div></div></div>':'')
      +(kitNames.length?'<div class="body-grid"><div class="body-pair full"><div class="body-lbl">Tagged Equipment</div><div class="body-tags">'+kitNames.map(function(k){return '<span class="kit-pill">'+escHtml(k)+'</span>';}).join('')+'</div></div></div>':'')
      +(r.submitted_at?'<div class="body-grid"><div class="body-pair full"><div class="body-lbl">Submitted</div><div class="body-txt" style="color:var(--muted);font-size:13px;font-weight:500">'+escHtml(fmtSubmitted(r.submitted_at))+'</div></div></div>':'')
      +'<div class="body-actions"><button class="btn-delete" onclick="deleteReport(\''+escHtml(r.id)+'\',event)">🗑 Delete Report</button></div>'
    +'</div>'
  +'</div>';
}

function toggleReport(id){_expandedIds[id]=!_expandedIds[id];applyFilters();}

async function deleteReport(id,ev){
  if(ev){ev.stopPropagation();}
  // Find the report so we can show useful info in the confirm
  var r=_allReports.find(function(x){return x.id===id;});
  var label=r&&r.show_date?fmtDate(r.show_date):'this report';
  if(!confirm('Permanently delete the report for '+label+'?\n\nThis cannot be undone.'))return;

  var btn=ev&&ev.target?ev.target:null;
  if(btn){btn.disabled=true;btn.textContent='Deleting…';}
  try{
    var res=await fetch(SB_URL+'/rest/v1/engineering_reports?id=eq.'+encodeURIComponent(id),{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'}
    });
    if(!res.ok){
      var msg='Delete failed (HTTP '+res.status+').';
      if(res.status===401||res.status===403)msg+='\n\nCheck Supabase RLS policy allows DELETE on engineering_reports.';
      throw new Error(msg);
    }
    // Reload fresh data from Supabase to guarantee consistent state
    delete _expandedIds[id];
    await loadReports();
  }catch(e){
    alert('Could not delete report.\n\n'+e.message);
    if(btn){btn.disabled=false;btn.textContent='🗑 Delete Report';}
  }
}

loadReports();
</script>
