/* ── the jobs, read only ───────────────────────────────────────────────── */
const JOBS_Q = '/rest/v1/app_data?select=key,name:value->>name,status:value->>status,color:value->color,' +
  'start:value->>start,end:value->>end,archived:value->archived&key=like.job:*';
let jobsReady = null;
JOB.ready = new Promise(r => { jobsReady = r; });
async function loadJobs(){
  if (JOB.busy) return;
  JOB.busy = true;
  JOB.at = Date.now();
  try {
    // the public key rides in the address, so this is a plain read with no preflight request either
    const r = await net(DB_URL + JOBS_Q + '&apikey=' + encodeURIComponent(SB_KEY), {cache: 'no-store', signal: timeout(20000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!Array.isArray(d)) throw new Error('Unexpected reply');
    const list = d.map(x => {
      const id = String((x && x.key) || '').slice(4);
      if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) return null;
      const j = paintJob({id, scope: 'job:' + id, name: String(x.name || '').trim() || 'Untitled job', status: String(x.status || ''),
        color: x.color && typeof x.color === 'object' ? x.color : null,
        start: x.start ? String(x.start).slice(0, 10) : '', end: x.end ? String(x.end).slice(0, 10) : '',
        archived: x.archived === true || x.archived === 'true'});
      j.cat = jobCat(j);
      j.offered = j.cat === 'active' || j.cat === 'upcoming';
      return j;
    }).filter(Boolean).sort((a, b) => a.scope < b.scope ? -1 : 1);
    const sig = JSON.stringify(list), was = JOB.state;
    JOB.state = 'ok';
    if (sig !== JOB.sig || was !== 'ok'){ JOB.sig = sig; JOBS.splice(0, JOBS.length, ...list); jobsChanged(); }
  } catch (e) {
    console.warn('Notes: job list not loaded', e);
    if (JOB.state === 'loading'){ JOB.state = 'failed'; jobsChanged(); }
  } finally {
    JOB.busy = false;
    jobsReady();
  }
}
function jobsChanged(){
  if (!booted) return;
  if (SYNC.loaded){ keepNames(true); commitSoon(); }
  refreshPickers();
  render({remote: true});
}
const jobsMaybe = () => { if (Date.now() - JOB.at > 30000) loadJobs(); };

/* ── signing in (the live page only) ───────────────────────────────────── */
const OWN = {tok: 'vsNotes_token', ref: 'vsNotes_refresh', email: 'vsNotes_email', out: 'vsNotes_signedOut'};
function jwtExp(t){
  try {
    const b = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return (JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))).exp || 0) * 1000;
  } catch (e) { return 0; }
}
async function authUser(token){
  const r = await net(SB_URL + '/auth/v1/user', {headers: {apikey: SB_KEY, Authorization: 'Bearer ' + token}, cache: 'no-store', signal: timeout(15000)});
  if (r.status === 401 || r.status === 403) return null;
  if (!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  const u = await r.json();
  return u && u.email ? String(u.email).toLowerCase() : null;
}
async function grant(type, body){
  const r = await net(SB_URL + '/auth/v1/token?grant_type=' + type, {method: 'POST', cache: 'no-store', signal: timeout(20000),
    headers: {apikey: SB_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let d = null;
  try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d || !d.access_token){
    const e = new Error((d && (d.error_description || d.msg || d.message)) || 'Sign-in failed'); e.status = r.status; throw e;
  }
  return d;
}
function keepSession(d){
  ls.set(OWN.tok, d.access_token);
  if (d.refresh_token) ls.set(OWN.ref, d.refresh_token);
  if (d.user && d.user.email) ls.set(OWN.email, String(d.user.email).toLowerCase());
  ls.del(OWN.out);
}
const dropSession = () => [OWN.tok, OWN.ref, OWN.email].forEach(k => ls.del(k));
/* Who is signed in: this page's own session (refreshed if it has run out), then the Dashboard's on
   this site, else nobody. With no connection, the account last signed in here is taken on trust
   (the board then shows read-only from this device, or not at all, until it loads). */
async function whoIsIn(){
  const tok = ls.get(OWN.tok), ref = ls.get(OWN.ref), em = String(ls.get(OWN.email) || '').toLowerCase();
  if (tok || ref){
    try {
      let who = tok && jwtExp(tok) > Date.now() + 30000 ? await authUser(tok) : null;
      if (!who && ref){ const d = await grant('refresh_token', {refresh_token: ref}); keepSession(d); who = await authUser(d.access_token); }
      if (who) return who;
      dropSession();
    } catch (e) {
      if (!(e.status >= 400 && e.status < 500) && em) return em;
      dropSession();
    }
  }
  if (ls.get(OWN.out) !== '1'){
    const dt = ls.get('_vsToken'), de = String(ls.get('_vsEmail') || '').toLowerCase();
    if (dt && de && ACCOUNTS[de]){
      try { const who = await authUser(dt); if (who) return who; }
      catch (e) { if (isOffline(e)) return de; }
    }
  }
  return null;
}
/* the page's own session is refreshed before it runs out */
setInterval(async () => {
  if (!LIVE) return;
  const tok = ls.get(OWN.tok), ref = ls.get(OWN.ref);
  if (!tok || !ref || jwtExp(tok) - Date.now() > 5 * 60000) return;
  try { keepSession(await grant('refresh_token', {refresh_token: ref})); } catch (e) {}
}, 4 * 60000);

function showSignIn(msg){
  setGate('signin');
  const g = $('#gate');
  g.innerHTML = '<form class="signin" id="siForm" novalidate>' +
    '<h2>Sign in</h2><p class="si-sub">With your Versa Dashboard email and password.</p>' +
    '<label class="si-l" for="siEmail">Email</label>' +
    '<input class="sf-in" id="siEmail" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">' +
    '<label class="si-l" for="siPass">Password</label>' +
    '<input class="sf-in" id="siPass" name="password" type="password" autocomplete="current-password" enterkeyhint="go">' +
    '<p class="si-msg" role="alert"></p>' +
    '<button type="submit" class="si-go">Sign in</button></form>';
  const em = ls.get(OWN.email) || ls.get('_vsEmail');

async function onSignIn(e){
  e.preventDefault();

  const email = f.elements.email.value.trim().toLowerCase(), pw = f.elements.password.value;

/* Sign out: anything unsaved goes first (what cannot go stays in this browser for next time) */

    }
  }
  dropSession();
  ls.set(OWN.out, '1');
  if (SYNC.key) ls.del(cacheKey());
  location.replace(location.pathname + location.search);
}

  tb.textContent = MODE === 'mock'
    ? 'Test copy — reads and saves through the test server at ' + MOCK.replace(/^http:\/\//, '')
    : 'Test copy — reads the live job list; saves only in this browser';
  tb.hidden = false;
}
setGate('loading');
applyLayer();
render();
booted = true;
loadJobs();
setInterval(() => { if (document.visibilityState !== 'hidden') loadJobs(); }, 4 * 60000);
start();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  $$('select.fsel, #topDest, .np-dest, .np-sdest').forEach(fitSelect);
  autosize(pads.main.ta);
  planKey = '';   // the columns were planned before Inter arrived; plan them again at true heights
  render({remote: true});
});
})();
</script>

</body>
</html>
