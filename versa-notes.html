}

/* a completed item leaves the list it was in (the grid with "Hide completed", or a notes page's
   To do while its Completed list is shut), so it lingers a moment and offers Undo */
const leavesOnDone = () => S.page ? !S.doneOpen.has(S.page) : S.hideDone;
function tick(id){
  const it = get(id);
  if (!it) return;
  it.done = !it.done;
  if (it.done && leavesOnDone()){
    S.linger = id;
    setTimeout(() => { if (S.linger === id){ S.linger = null; render({flip: true}); } }, 900);
    snack('Completed: ' + short(it.text), {scope: it.scope, undo: () => { it.done = false; render({fresh: id, flip: true}); }});
  }
  render({ticked: it.done ? id : null, flip: true});
}
function toggleDone(id){
  const it = get(id);
  if (!it) return;
  it.done = !it.done;
  if (it.done) closeOpen();
  if (it.done && leavesOnDone()) snack('Completed: ' + short(it.text), {scope: it.scope, undo: () => { it.done = false; render({fresh: id, flip: true}); }});
  render({flip: true});
}
function togglePin(id){
  const it = get(id);
  it.pinned = !it.pinned;
  render({flip: true});
}
function del(id){
  const idx = items.findIndex(i => i.id === id);
  if (idx < 0) return;
  if (S.openId === id) closeOpen();
  const it = items.splice(idx, 1)[0];
  render({flip: true});
  snack('Deleted “' + short(it.text, 30) + '”', {scope: it.scope, undo: () => {
    if (!validScope(it.scope)) it.scope = 'me';
    items.splice(Math.min(idx, items.length), 0, it);
    S.shown.add(it.scope);
    render({fresh: it.id, flip: true});
  }});
}
function moveItem(id, to){
  const it = get(id);
  if (!it || !to || to === it.scope) return;
  if (S.openId) closeOpen();
  const from = it.scope, was = it.order;
  it.scope = to;
  it.order = topOrder();   // it arrives at the top of its new list
  S.shown.add(to);
  if (qWords().length) S.pass.add(id);
  render({landed: id, flip: true});
  snack('Moved to ' + nameOf(to), {scope: to, undo: () => {
    if (validScope(from)){ it.scope = from; it.order = was; }
    render({landed: id, flip: true});
  }});
}
function addShow(s){
  if (!s) return;
  S.shown.add(s);
  S.filter = 'all';
  render();
  const card = cardEls.get(s);
  if (card){
    card.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'start'});
    const ta = $('textarea[data-comp="' + s + '"]', card);
    if (ta) ta.focus({preventScroll: true});
  }
}
function setFilter(v){
  S.filter = v;
  render();
  const grid = $('#grid'), bar = $('#dock');
  const top = grid.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 14;
  if (window.scrollY > top) window.scrollTo({top, behavior: 'auto'});
}
function replay(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 2300);
}
function jump(s, id){
  if (S.page) return;
  let dirty = false;
  if (S.filter !== 'all' && S.filter !== s){ S.filter = 'all'; dirty = true; }
  if (id && qWords().length && !itemHit(get(id))){ S.q = ''; $('#q').value = ''; $('#qx').hidden = true; dirty = true; }
  if (!id && qWords().length && !cardScopes().includes(s)){ S.q = ''; $('#q').value = ''; $('#qx').hidden = true; dirty = true; }
  if (id && S.hideDone && get(id) && get(id).done){ S.hideDone = false; dirty = true; }
  if (dirty) render();
  const card = cardEls.get(s);
  if (!card) return;
  const target = id ? card.querySelector('.it[data-id="' + id + '"]') : card;
  if (!target) return;
  target.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: id ? 'center' : 'start'});
  replay(target, id ? 'landed' : 'ping');
}

/* ── sections: the new-section form, rename, colour, delete ────────────── */
/* one form, moved to wherever it was asked for: the end of the grid, in the composer, inside
   the notepad, under an item's Move to…, under the Showing filter, or under a section's cover */
const SF = {el: null, o: null, tint: null, orig: null};
function sfBuild(){
  const el = document.createElement('div');
  el.className = 'secform';
  el.setAttribute('role', 'group');
  el.setAttribute('aria-labelledby', 'sfT');
  el.innerHTML =
    '<p class="sf-t" id="sfT"></p>' +
    '<input class="sf-in" id="sfName" type="text" maxlength="40" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" spellcheck="false" placeholder="Section name" aria-labelledby="sfT" data-fkey="sfname">' +
    '<div class="sf-sw" role="group" aria-label="Colour">' +
      PALETTE.map(p => '<button type="button" class="sw" data-act="sfsw" data-tint="' + p.tint + '" data-fkey="sw:' + p.tint + '" style="--sw-l:' + p.tint + ';--sw-d:' + deepen(p.tint) + '" aria-label="' + p.name + '" aria-pressed="false"></button>').join('') +
    '</div>' +
    '<div class="sf-foot"><p class="sf-msg" role="alert"></p>' +
      '<span class="sf-acts"><button type="button" class="act sf-x" data-act="sfcancel">Cancel</button><button type="button" class="act sf-go" data-act="sfgo"></button></span>' +
    '</div>';
  return el;
}
function nextTint(){
  const used = new Set(SECTIONS.map(x => x.tint));
  const free = PALETTE.find(p => !used.has(p.tint));
  return (free || PALETTE[SECTIONS.length % PALETTE.length]).tint;
}
function paintSwatches(){
  $$('.sw', SF.el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tint === SF.tint)));
}
function openSecForm(o){
  if (SF.o) closeSecForm(true);
  if (!SF.el) SF.el = sfBuild();
  SF.o = Object.assign({mode: 'new'}, o);
  const m = SF.o.mode, el = SF.el, sec = SF.o.sec || null;
  $('.sf-t', el).textContent = m === 'new' ? 'New section' : m === 'rename' ? 'Rename section' : 'Section colour';
  $('.sf-in', el).hidden = m === 'colour';
  $('.sf-sw', el).hidden = m === 'rename';
  $('.sf-in', el).value = m === 'rename' && sec ? sec.name : '';
  $('.sf-go', el).textContent = m === 'new' ? 'Create' : 'Save';
  $('.sf-msg', el).textContent = '';
  SF.tint = sec ? sec.tint : nextTint();
  SF.orig = sec ? sec.tint : null;
  paintSwatches();
  mountSecForm();
  if (!SF.o) return;
  const f = m === 'colour' ? $('.sw[aria-pressed="true"]', el) : $('.sf-in', el);
  if (f) f.focus({preventScroll: true});
  // in full page the form is already on the screen, and the page behind holds its place
  if (!FP.on) el.scrollIntoView({block: 'nearest', behavior: reduced() ? 'auto' : 'smooth'});
}
function mountSecForm(){
  if (!SF.o) return;
  const root = S.page ? $('#pg') : $('#main');
  const slot = root.querySelector('[data-slot="' + SF.o.slot + '"]');
  if (!slot){ closeSecForm(true); return; }
  if (SF.el.parentNode !== slot){
    slot.appendChild(SF.el);
    if (S.page) sizePad();   // a form under the cover moves the pad down; it still ends at the screen's foot
  }
  $$('.addshow').forEach(a => a.classList.toggle('forming', a.contains(SF.el)));
}
function closeSecForm(quiet){
  if (!SF.o) return;
  const o = SF.o;
  SF.o = null;
  // a colour tried but not saved goes back
  if (o.mode === 'colour' && o.sec && !o.saved && SF.orig && o.sec.tint !== SF.orig){
    paint(o.sec, SF.orig);
    refreshSection(secScope(o.sec));
  }
  const had = SF.el.contains(document.activeElement);
  SF.el.remove();
  $$('.addshow.forming').forEach(a => a.classList.remove('forming'));
  if (S.page) sizePad();
  // the control that opened the form may have been redrawn (a colour preview repaints the cover),
  // so look for it again by its key
  const back = o.back && (o.back.isConnected ? o.back : o.back.dataset.fkey ? document.querySelector('[data-fkey="' + o.back.dataset.fkey + '"]') : null);
  if (!quiet && had && back) back.focus({preventScroll: true});
  if (o.onClose) o.onClose();
}
function sfSubmit(){
  const o = SF.o;
  if (!o) return;
  const el = SF.el, msg = $('.sf-msg', el), inp = $('.sf-in', el);
  if (o.mode !== 'colour'){
    const name = inp.value.replace(/\s+/g, ' ').trim();
    if (!name){ msg.textContent = 'Enter a name for the section.'; inp.focus(); return; }
    const clash = allScopes().find(s => nameOf(s).toLowerCase() === name.toLowerCase() && !(o.sec && s === secScope(o.sec)));
    if (clash){ msg.textContent = '“' + nameOf(clash) + '” is already in use. Choose another name.'; inp.focus(); inp.select(); return; }
    if (o.mode === 'new'){
      const s = secScope(newSection(name, SF.tint));
      orderAddSection(s);
      S.shown.add(s);
      o.saved = true;
      closeSecForm(true);
      refreshPickers();
      if (o.onCreate) o.onCreate(s); else render();
      return;
    }
    o.sec.name = name;
  } else paint(o.sec, SF.tint);
  o.saved = true;
  const back = o.back;
  closeSecForm(true);
  refreshSection(secScope(o.sec));
  const again = back && back.dataset.fkey ? document.querySelector('[data-fkey="' + back.dataset.fkey + '"]') : null;
  if (again) again.focus({preventScroll: true});
}
/* a section's name or colour changed: every place it shows is redrawn */
function refreshSection(s){
  refreshPickers();
  const el = cardEls.get(s);
  if (el) paintCardChrome(el, s);
  if (S.page === s) paintPageChrome(s);
  planKey = '';
  render();
}
let pickKey = null;
function refreshPickers(){
  const opts = scopeOptions();
  const fix = s => validScope(s) ? s : 'me';
  S.topScope = fix(S.topScope);
  const td = $('#topDest');
  const P = pads.main;
  P.fs = fix(P.fs); P.fileScope = fix(P.fileScope); P.ss = fix(P.ss);
  const fd = $('.np-dest', P.root), sd = $('.np-sdest', P.root);
  // the options are only rebuilt when they have changed (a picker open on a phone stays open)
  if (opts !== pickKey){ td.innerHTML = opts; fd.innerHTML = opts; sd.innerHTML = opts; pickKey = opts; }
  td.value = S.topScope; fitSelect(td); paintTop();
  fd.value = P.fs;
  sd.value = P.ss;
  if (P.file) paintFile(P);
  if (P.save) paintSave(P);
  if (S.filter !== 'all' && !validScope(S.filter)) S.filter = 'all';
  fselKey = '';
}
/* deleting a section moves its items, and its notes page under "From <name>", into General */
function deleteSection(s){
  const idx = SECTIONS.findIndex(x => secScope(x) === s);
  if (idx < 0) return;
  const sec = SECTIONS[idx];
  if (S.openId) closeOpen();
  closeSecForm(true);
  const moved = items.filter(i => i.scope === s).sort(byOrder).map(i => i.id);
  // they arrive under General's own items, in the order they had
  const wasOrd = new Map(moved.map(id => [id, get(id).order]));
  const gEnd = items.filter(i => i.scope === 'me').reduce((m, i) => Math.max(m, i.order), -1);
  moved.forEach((id, k) => { const it = get(id); it.scope = 'me'; it.order = gEnd + 1 + k; });
  syncOrder();
  const oi = CARD_ORDER.indexOf(s);
  if (oi >= 0) CARD_ORDER.splice(oi, 1);
  const sp = pageOf(s), g = pageOf('me'), gWas = g.text, gWasEd = g.edited;
  let block = '';
  if (sp.text.trim()){
    block = 'From ' + sec.name + '\n' + sp.text.replace(/\s+$/, '');
    g.text = (gWas.trim() ? gWas.replace(/\s+$/, '') + '\n\n' : '') + block;
    g.edited = clockNow();
  }
  const gAfter = g.text;
  const wasFilter = S.filter === s, wasTop = S.topScope === s;
  SECTIONS.splice(idx, 1);
  delete PAGES[s];
  S.shown.delete(s);
  const card = cardEls.get(s);
  if (card){ card.remove(); cardEls.delete(s); }
  if (S.page === s) leaveNow();
  refreshPickers();
  render();
  snack('Deleted ' + sec.name + ' · items moved to General', {scope: 'me', undo: () => {
    SECTIONS.splice(Math.min(idx, SECTIONS.length), 0, sec);
    PAGES[s] = sp;
    S.shown.add(s);
    if (!CARD_ORDER.includes(s)) CARD_ORDER.splice(Math.min(Math.max(oi, 0), CARD_ORDER.length), 0, s);
    moved.forEach(id => { const it = get(id); if (it && it.scope === 'me'){ it.scope = s; it.order = wasOrd.get(id); } });
    if (block){
      if (g.text === gAfter){ g.text = gWas; g.edited = gWasEd; }
      else {
        const i = g.text.lastIndexOf(block);
        if (i >= 0) g.text = (g.text.slice(0, i).replace(/\s+$/, '') + g.text.slice(i + block.length)).replace(/^\s*\n/, '');
      }
      if (S.page === 'me') padLoad(pads.page);
    }
    if (wasFilter) S.filter = s;
    if (wasTop) S.topScope = s;
    refreshPickers();
    planKey = '';
    render();
  }});
}

/* ── moving between the main page and a notes page ─────────────────────── */
/* each place has an address: the main page (no hash), a notes page (#show-3), and either of
   those with its pad in full page (#notepad/full, #show-3/full). S.depth counts the entries
   pushed since the main page, full page included, so Back always unwinds one step at a time */
const H = {
  set(how, v, d, full){
    const st = {nv: v, d: d, full: !!full};
    const url = v === 'home'
      ? location.pathname + location.search + (full ? '#notepad/full' : '')
      : '#' + hashOf(v) + (full ? '/full' : '');
    try { history[how](st, '', url); return true; }
    catch (e){ try { history[how](st, ''); return true; } catch (e2){ return false; } }
  },
};
function routeOfHash(h){
  h = String(h || '').replace(/^#/, '');
  const full = /\/full$/.test(h);
  if (full) h = h.slice(0, -5);
  const s = scopeOfHash(h);
  return {v: s || 'home', full: full && (!!s || h === 'notepad')};
}
function applyLayer(){
  const on = !!S.page;
  document.documentElement.classList.toggle('layer', on);
  $('#main').inert = on;
  $('#pg').inert = !on;
}
function openPage(s, o){
  o = o || {};
  if (!validScope(s)) return;
  if (S.arr) setArrange(false, {quiet: true});
  if (FP.on) exitFull({replace: true, quiet: true});
  const was = S.page;
  if (was === s) return;
  if (S.openId) closeOpen();
  closeSecForm(true);
  if (was){ closeFile(pads.page); }
  S.page = s;
  paintPageChrome(s);
  padLoad(pads.page);
  if (o.push !== false && H.set('pushState', s, S.depth + 1)) S.depth++;
  const pane = $('#pg');
  applyLayer();
  render();
  pane.scrollTop = 0;
  sizePad();
  if (was && !reduced()){
    $('.pg-in').animate([{opacity: 0, transform: 'translateX(28px)'}, {opacity: 1, transform: 'none'}], {duration: 300, easing: EASE});
  }
  // with a keyboard the caret lands on "‹ Notes"; otherwise the page itself takes focus, quietly
  const bk = $('#pg .back');

}
/* the notes page goes; the main page is where it was, and focus goes back to the cover */
function leavePage(){
  if (!S.page) return;
  if (S.arr) setArrange(false, {quiet: true});
  if (FP.on) exitFull({fromHistory: true, quiet: true});   // the caller looks after the address
  const s = S.page;
  if (S.openId) closeOpen();
  closeSecForm(true);
  closeFile(pads.page);
  S.page = null;
  document.title = BASE_TITLE;
  applyLayer();
  render();

  const link = card ? $('.cl', card) : null;
  if (link && card.isConnected) link.focus({preventScroll: true});

/* leave at once (the page's section has gone), then bring the address back to the main page */
function leaveNow(){
  const d = S.depth;
  S.depth = 0;
  leavePage();
  if (d > 0) history.go(-d); else H.set('replaceState', 'home', 0);
}
function back(){
  if (!S.page) return;
  if (FP.on) exitFull({replace: true, quiet: true});
  if (S.depth > 0) history.go(-S.depth);
  else { H.set('replaceState', 'home', 0); leavePage(); }
}
window.addEventListener('popstate', e => {
  const st = e.state || {};
  const r = st.nv ? {v: st.nv, full: !!st.full} : routeOfHash(location.hash);
  let v = r.v || 'home', full = r.full;
  if (v !== 'home' && !validScope(v)){ v = 'home'; full = false; H.set('replaceState', 'home', 0); }
  S.depth = (v === 'home' && !full) ? 0 : (typeof st.d === 'number' ? st.d : S.depth + 1);
  // full page goes first (Back from #show-3/full is #show-3), then the page, then full page again
  // if this entry has it (Forward)
  const want = full ? (v === 'home' ? 'main' : 'page') : null;
  const moving = v === 'home' ? !!S.page : v !== S.page;
  if (FP.on && (moving || FP.P.key !== want)) exitFull({fromHistory: true, how: 'history', quiet: moving});
  if (v === 'home'){ if (S.page) leavePage(); }
  else if (v !== S.page) openPage(v, {push: false});
  if (want && !FP.on) enterFull(pads[want], {push: false});

/* ── full page ─────────────────────────────────────────────────────────── */
/* One pad over the whole screen. The pad element itself is fixed over the screen (its text, caret,
   selection and undo history never move), a stand-in of the same height keeps its place in the
   page, and everything around it is made inert. The page's scroll is held and given back. */
const FP = {on: false, P: null, hold: null, inert: [], pushed: false, byKey: false, esc: false,
  anim: null, winY: 0, pgY: 0, vh: 0};
const mqBar = mq2;   // from 720px the bar carries the footer's save state and actions

/* where the caret's line sits inside a textarea, measured on a hidden copy of its text */
let mirror = null;
const MIRROR = ['boxSizing','paddingTop','paddingRight','paddingBottom','paddingLeft','fontFamily','fontSize','fontWeight',
  'fontStyle','fontStretch','fontFeatureSettings','fontVariantNumeric','letterSpacing','wordSpacing','lineHeight','textTransform',
  'textIndent','tabSize'];
function caretY(ta){
  if (!mirror){
    mirror = document.createElement('div');
    mirror.setAttribute('aria-hidden', 'true');
    mirror.style.cssText = 'position:fixed;top:0;left:-10000px;visibility:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;border:0;height:auto;overflow:hidden';
    document.body.appendChild(mirror);
  }
  const cs = getComputedStyle(ta), m = mirror.style;
  MIRROR.forEach(k => { m[k] = cs[k]; });
  m.boxSizing = 'content-box';
  m.width = Math.max(0, ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + 'px';
  mirror.textContent = ta.value.slice(0, ta.selectionEnd);
  const mark = document.createElement('span');
  mark.textContent = '​';
  mirror.appendChild(mark);
  const y = mark.offsetTop;
  mirror.textContent = '';
  return y;
}
const lineH = ta => parseFloat(getComputedStyle(ta).lineHeight) || 26;
function caretShown(ta){
  const y = caretY(ta);
  return y + lineH(ta) > ta.scrollTop && y < ta.scrollTop + ta.clientHeight;
}
/* scroll the text, not the page, so the caret's line is in view */
function ensureCaret(ta){
  const y = caretY(ta), lh = lineH(ta), top = ta.scrollTop, h = ta.clientHeight;
  if (y < top) ta.scrollTop = Math.max(0, y - 8);
  else if (y + lh > top + h) ta.scrollTop = y + lh - h + 8;
}

/* everything beside the pad, and beside each of its parents, goes inert; the Undo bar stays live */
function inertAround(el){
  const done = [];
  for (let n = el; n.parentElement && n !== document.body; n = n.parentElement){
    for (const sib of n.parentElement.children){

      sib.inert = true;

}
/* a still copy of the pad as it looks now, for the moment the two views cross over */

  const g = P.root.cloneNode(true);

  g.inert = true;

  $$('[id],[aria-live],[aria-labelledby]', g).forEach(x => ['id', 'aria-live', 'aria-labelledby'].forEach(a => x.removeAttribute(a)));
  if (P.root.matches(':focus-within')) g.style.setProperty('--pe', 'var(--edge-hi)');

function paintFpBtn(P, on){

/* the footer's save state and actions ride up into the bar from 720px, and come home after */

/* size the box to what is visible: a phone's keyboard takes the bottom of the screen, and the
   box (bar, text and all) sits in what is left */
function fpFit(){
  if (!FP.on) return;

  const lay = root.clientHeight || window.innerHeight;

  if (vv && vv.scale < 1.05){ top = Math.max(0, Math.round(vv.offsetTop)); h = Math.round(vv.height); }
  root.style.setProperty('--vvt', top + 'px');

  const box = FP.P.root.getBoundingClientRect(), foot = $('.np-foot', FP.P.root);
  const under = foot.parentElement === FP.P.root ? foot.offsetHeight : 0;

let fitT = 0;

function enterFull(P, o){

    hold.appendChild(g);

    if (FP.pushed) S.depth++;

    const nr = el.getBoundingClientRect();
    el.style.transformOrigin = Math.round(r.left + r.width / 2 - nr.left) + 'px ' + Math.round(r.top + r.height / 2 - nr.top) + 'px';
    const a = el.animate([{opacity: 0, transform: 'scale(.96)'}, {opacity: 1, transform: 'none'}], {duration: 240, easing: EASE});

function settleFull(){
  if (!FP.on) return;

}
/* o.how: 'key' (Exit full page from the keyboard), 'pointer', 'esc' or 'history';
   o.fromHistory: the address has already moved; o.replace: the address is rewritten in place
   (something else is about to navigate); o.quiet: leave focus to whatever comes next */
function exitFull(o){
  if (!FP.on) return;
  o = o || {};

  if (FP.anim){ const a = FP.anim; FP.anim = null; a.cancel(); }
  const had = document.activeElement === ta;
  const at = ta.scrollTop / Math.max(1, ta.scrollHeight);
  const motion = !o.quiet && !reduced() && !!el.animate;
  // a still copy of the full page stays on top and fades, while the pad is already back in place
  let g = null;
  if (motion){

    g = ghostOf(P);
    g.style.cssText = 'top:' + r.top + 'px;left:' + r.left + 'px;right:auto;width:' + r.width + 'px;height:' + r.height + 'px';

  placeFoot(P);
  paintFpBtn(P, false);
  if (FP.hold){ FP.hold.remove(); FP.hold = null; }
  FP.inert.forEach(x => { x.inert = false; });
  FP.inert = [];

    const a = g.animate([{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'scale(.96)'}], {duration: 200, easing: EASE, fill: 'forwards'});

/* ── arranging: arrange mode, the arrows, Alt+↑/↓ and dragging ─────────── */
/* what the arrows and the keys say, politely, to a screen reader */
let liveT = 0;
function announce(msg){
  const el = $('#live');
  el.textContent = '';
  clearTimeout(liveT);
  liveT = setTimeout(() => { el.textContent = msg; }, 60);
}

/* Arrange mode, on any device: the covers come down to a slim header, every card and open item
   shows its grip and two arrows, and tapping does nothing else. Done or Escape puts the page back
   exactly as it was (the same scroll position, focus on Arrange), in the new order. */
const ARR = {winY: 0, pgY: 0};
function setArrange(on, o){
  o = o || {};

  const root = document.documentElement;
  if (on){
    if (FP.on) return;
    if (S.openId) closeOpen();
    closeSecForm(true);
    closeComp();
    [pads.main, pads.page].forEach(P => { closeFile(P); closeSave(P); });
    ARR.winY = window.scrollY;
    ARR.pgY = $('#pg').scrollTop;
    S.arr = true;
    root.classList.add('arr');
    planKey = '';
    render();
    if (S.page) $('#pg').scrollTop = 0; else window.scrollTo(0, 0);
    const done = $((S.page ? '#pg' : '#main') + ' .arr-done');
    if (done) done.focus({preventScroll: true});
    announce('Arrange: drag or use the arrows');
  } else {
    if (DR.st) cancelDrag();
    S.arr = false;
    root.classList.remove('arr');
    planKey = '';
    render();
    window.scrollTo(0, ARR.winY);
    $('#pg').scrollTop = ARR.pgY;
    if (!o.quiet){
      const b = S.page ? $('#arrBtnPg') : $('#arrBtn');
      if (b) b.focus({preventScroll: true});
    }

/* one place up or down its list (the arrows, and Alt+↑/↓ on a focused item); pinned items stay first */
function moveItemBy(id, dir){
  const it = get(id);
  if (!it || it.done) return;
  const c = orderCtx(it), nb = c.vis[c.vi + dir];
  if (c.vi < 0) return;
  if (!nb){ announce(dir < 0 ? 'Already at the top' : 'Already at the bottom'); return; }
  if (nb.pinned !== it.pinned){ announce(it.pinned ? 'Already at the bottom of the pinned items' : 'Pinned items stay first'); return; }
  const full = c.full;
  full.splice(full.indexOf(it), 1);
  full.splice(full.indexOf(nb) + (dir > 0 ? 1 : 0), 0, it);
  renumber(full);
  render({flip: true});
  announce((dir < 0 ? 'Moved up, ' : 'Moved down, ') + (c.vi + dir + 1) + ' of ' + c.vis.length);
  const el = document.getElementById(iid(it, vctx()));
  if (el) el.scrollIntoView({block: 'nearest', behavior: reduced() ? 'auto' : 'smooth'});

/* the cards: their places slide, as items do */
function cardBoxes(){
  const m = new Map();
  cardEls.forEach((el, s) => { if (el.isConnected) m.set(s, el.getBoundingClientRect()); });
  return m;
}

  if (!before || reduced()) return;

    const r = el.getBoundingClientRect(), dx = b.left - r.left, dy = b.top - r.top;
    if (Math.abs(dx) > .5 || Math.abs(dy) > .5)

  syncOrder();
  CARD_ORDER.splice(CARD_ORDER.indexOf(s), 1);
  CARD_ORDER.splice(CARD_ORDER.indexOf(nb) + (dir > 0 ? 1 : 0), 0, s);
  const before = reduced() ? null : cardBoxes();
  render();
  flipCards(before);
  announce((dir < 0 ? 'Moved up, ' : 'Moved down, ') + (i + dir + 1) + ' of ' + vis.length);
  const el = cardEls.get(s);

/* ── dragging: one Pointer Events engine for mouse, pen and touch ──────── */
/* A drag starts from a grip once the pointer has moved 6px. The row (or card) lifts and follows
   the pointer; a row's landing place is a 2px ink line, a card's a dashed slot of its own size
   that moves through the grid. Near the top or bottom edge the page scrolls. Escape cancels.
   A row can be dropped anywhere in its own list, or onto another card (a move, with Undo); on a
   notes page it stays within that page's list. */

  gh.classList.add('drag-ghost');

/* ── undo bar ──────────────────────────────────────────────────────────── */
let snackT = 0, snackUndo = null, snackActFn = null, snackAnim = null, snackEnd = 0, snackLeft = 0;
function snack(msg, o){
  o = o || {};

  const undo = o.undo || null, act = o.act || null;
  // an Undo lasts 9 seconds; a way to it (Show, Open) alone 5
  const ms = undo ? 9000 : act ? 5000 : 2600;
  // a small cover of the one it concerns, so "Moved to…" shows where at a glance
  const cov = $('.sn-cov', el);
  cov.hidden = !o.scope;
  el.classList.toggle('has-cov', !!o.scope);
  if (o.scope) cov.style.cssText = coverStyle(o.scope);
  $('.msg', el).textContent = msg;
  const ab = $('.sn-act', el);
  ab.hidden = !act;
  if (act) ab.textContent = act.label;
  $('.sn-undo', el).hidden = !undo;
  const bar = $('.timer', el);
  bar.hidden = !(undo || act);
  snackUndo = undo;
  snackActFn = act ? act.fn : null;
  el.classList.add('show');
  // its buttons are only in the tab order while it shows (so Tab never lands on an invisible Undo)
  $$('.undo', el).forEach(x => { x.tabIndex = 0; });

  snackEnd = Date.now() + ms;

  if (snackAnim) snackAnim.cancel();

  if (!$('#snack').classList.contains('show')) return;

  else padInsert(ta, a, a, '\n' + m[1] + m[2] + ' ');
}

/* the line under the caret, or the words selected (a selection across lines takes whole lines) */
function padTarget(P){
  const v = P.ta.value;
  if (!P.sel) return null;
  let a = Math.min(P.sel[0], v.length), b = Math.min(P.sel[1], v.length);
  const ls = i => v.lastIndexOf('\n', i - 1) + 1;
  const le = i => { const j = v.indexOf('\n', i); return j < 0 ? v.length : j; };
  if (a !== b){
    const s = v.slice(a, b);
    if (!s.includes('\n') && s.trim()) return {a, b, text: s.trim(), part: true};
    if (v[b - 1] === '\n') b -= 1;
    a = ls(a); b = le(Math.max(a, b));
  } else { a = ls(a); b = le(a); }
  const text = v.slice(a, b);
  return text.replace(BULLET, '').trim() ? {a, b, text} : null;
}
function padItemText(t){
  const lines = t.split('\n');
  return lines.length === 1 ? t.replace(BULLET, '').trim() : cleanText(t);
}
/* take the filed words off the pad; a line left empty goes too */
function padCut(v, t){
  let a = t.a, b = t.b;
  if (t.part){
    let nv = v.slice(0, a) + v.slice(b);
    if (nv[a - 1] === ' ' && (a === nv.length || nv[a] === ' ' || nv[a] === '\n')){ nv = nv.slice(0, a - 1) + nv.slice(a); a -= 1; }
    const ls = nv.lastIndexOf('\n', a - 1) + 1;
    let le = nv.indexOf('\n', a); if (le < 0) le = nv.length;
    if (nv.slice(ls, le).replace(BULLET, '').replace(/^\s*[•·\-–*]\s*$/, '').trim()) return {value: nv, at: a};
    v = nv; a = ls; b = le;
  }
  if (b < v.length) b += 1; else if (a > 0) a -= 1;
  return {value: v.slice(0, a) + v.slice(b), at: a};
}
/* a show or section named on the line is the likely home; "print" is likely something to print */
function padGuess(text){
  const low = text.toLowerCase();
  const s = allScopes().find(x => x !== 'me' && low.includes(nameOf(x).toLowerCase()));
  return {scope: s || null, kind: /\bprint/.test(low) ? 'print' : null};
}
/* put words back on a pad (or straight into its page, if that page is not open any more) */
function restoreText(k, fn){
  if (k !== 'main' && !validScope(k)) return;
  const P = k === 'main' ? pads.main : (S.page === k ? pads.page : null);
  const st = storeOf(k);
  const r = fn(P ? P.ta.value : st.text);
  if (P) padSet(P, r.value, r.at);
  else { st.text = r.value; st.edited = clockNow(); }
}

function paintFile(P){
  const t = padTarget(P);
  const key = t ? t.text : '';
  if (key !== P.fileText){
    P.fileText = key;
    const g = padGuess(key);
    if (!P.fkPicked) P.fk = g.kind || P.fileKind;
    if (!P.fsPicked) P.fs = g.scope || P.fileScope;
  }
  const dest = padHome(P) || P.fs;
  const q = $('.np-q', P.root);
  if (!t) q.innerHTML = '<span class="np-lbl">Place the cursor on a line, or select text, to file it.</span>';
  else {
    const lines = padItemText(t.text).split('\n');
    q.innerHTML = '<span class="np-lbl">File</span> “' + esc(short(lines[0], 140)) + '”' +
      (lines.length > 1 ? ' <span class="np-lbl">and ' + (lines.length - 1) + ' more line' + (lines.length > 2 ? 's' : '') + '</span>' : '');
  }
  $$('.np-kinds .kw', P.root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === P.fk)));
  const sel = $('.np-dest', P.root);
  if (sel){ sel.value = dest; fitSelect(sel); }
  $('.np-fdot', P.root).style.setProperty('--full', place(dest).full);
  const go = $('[data-act="filego"]', P.root);
  setDis(go, !t);
  go.setAttribute('aria-label', 'File to ' + nameOf(dest));
}
function openFile(P, byKey){
  if (P.save) closeSave(P);
  P.file = true;
  P.fkPicked = P.fsPicked = false;
  P.fileText = null;
  paintFile(P);
  const f = $('.np-file', P.root);
  f.hidden = false;
  $('[data-act="fileline"]', P.root).setAttribute('aria-expanded', 'true');
  if (byKey){ const k = $('.np-kinds .kw[aria-pressed="true"]', P.root); if (k) k.focus(); }
  // on a touch screen put the keyboard away, so the choices are in view
  else if (!mqFine.matches && document.activeElement === P.ta){
    P.ta.blur();
    if (!FP.on) f.scrollIntoView({block: 'nearest', behavior: reduced() ? 'auto' : 'smooth'});
  }
}
function closeFile(P, back){
  if (!P.file) return;
  const f = $('.np-file', P.root), btn = $('[data-act="fileline"]', P.root);
  const inside = f.contains(document.activeElement);
  P.file = false;
  f.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  if (SF.o && SF.o.from === 'file' && SF.o.slot === 'pad:' + P.key) closeSecForm(true);
  if (inside && back) btn.focus({preventScroll: true});
}
function fileLine(P){
  const t = padTarget(P);
  if (!t){ paintFile(P); return; }
  const text = padItemText(t.text);
  if (!text.trim()) return;
  const ta = P.ta, before = ta.value, kind = P.fk, scope = padHome(P) || P.fs, k = padKey(P);
  if (S.openId) closeOpen();
  P.fileKind = kind;
  if (!padHome(P)) P.fileScope = scope;
  const it = addItem(kind, scope, text);
  const cut = padCut(before, t), after = cut.value;
  closeFile(P);
  padSet(P, after, cut.at);
  render({fresh: it.id, flip: true});
  if (mqFine.matches){ ta.focus({preventScroll: true}); ta.setSelectionRange(cut.at, cut.at); }
  snack('Filed to ' + nameOf(scope), {scope, undo: () => {
    const i = items.findIndex(x => x.id === it.id);
    if (i >= 0) items.splice(i, 1);
    restoreText(k, cur => {
      if (cur === after) return {value: before, at: t.a};
      // the pad has moved on since: put the line back on its own line, near where it was
      const at = Math.min(cut.at, cur.length), ls = cur.lastIndexOf('\n', at - 1) + 1;
      return {value: cur.slice(0, ls) + t.text + '\n' + cur.slice(ls), at: ls};
    });
    render({flip: true});
  }});
}
function clearPad(P){
  const before = P.ta.value;
  if (!before.trim()) return;
  const k = padKey(P);
  closeFile(P);
  closeSave(P);
  padSet(P, '', 0);
  if (mqFine.matches) P.ta.focus({preventScroll: true});
  snack(k === 'main' ? 'Notepad cleared' : nameOf(k) + ' notes cleared', {undo: () => {
    restoreText(k, cur => ({value: cur.trim() ? before.replace(/\s+$/, '') + '\n' + cur : before, at: null}));
    render();
  }});
}

/* "Save to…": the whole pad goes onto a notes page under a dated line, and the pad starts clear */
function paintSave(P){
  const sel = $('.np-sdest', P.root);
  if (!sel) return;
  sel.value = P.ss;
  fitSelect(sel);
  $('.np-sdot', P.root).style.setProperty('--full', place(P.ss).full);
  const go = $('[data-act="savego"]', P.root);
  setDis(go, !P.ta.value.trim());
  go.setAttribute('aria-label', 'Save to ' + nameOf(P.ss) + ' notes');
}
function openSave(P, byKey){
  if (P.file) closeFile(P);
  P.save = true;
  P.ss = 'me';
  paintSave(P);
  const f = $('.np-save', P.root);
  f.hidden = false;
  $('[data-act="saveto"]', P.root).setAttribute('aria-expanded', 'true');
  if (byKey) $('.np-sdest', P.root).focus();
  else if (!mqFine.matches && document.activeElement === P.ta){
    P.ta.blur();
    if (!FP.on) f.scrollIntoView({block: 'nearest', behavior: reduced() ? 'auto' : 'smooth'});
  }
}
function closeSave(P, back){
  if (!P.save) return;
  const f = $('.np-save', P.root), btn = $('[data-act="saveto"]', P.root);
  const inside = f.contains(document.activeElement);
  P.save = false;
  f.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  if (SF.o && SF.o.from === 'save' && SF.o.slot === 'pad:' + P.key) closeSecForm(true);
  if (inside && back) btn.focus({preventScroll: true});
}
function savePad(P){
  const before = P.ta.value;
  const text = before.replace(/\s+$/, '').replace(/^(\s*\n)+/, '');
  if (!text.trim()) return;
  const to = P.ss, pg = pageOf(to), was = pg.text, wasEd = pg.edited;
  const now = clockNow();
  const block = now.getDate() + ' ' + MON[now.getMonth()] + ' ' + hhmm(now) + '\n' + text;
  pg.text = (was.trim() ? was.replace(/\s+$/, '') + '\n\n' : '') + block;
  pg.edited = now;
  const after = pg.text;
  S.shown.add(to);
  closeSave(P);
  padSet(P, '', 0);
  P.ta.focus({preventScroll: true});
  render();
  snack('Saved to ' + nameOf(to) + ' notes', {scope: to, act: {label: 'Open', fn: () => openPage(to)}, undo: () => {
    // take the saved words back off the page, and put them back on the pad
    if (PAGES[to]){
      if (pg.text === after){ pg.text = was; pg.edited = wasEd; }
      else {
        const i = pg.text.lastIndexOf(block);
        if (i >= 0) pg.text = (pg.text.slice(0, i).replace(/\s+$/, '') + pg.text.slice(i + block.length)).replace(/^\s*\n/, '');
      }
      if (S.page === to) padLoad(pads.page);
    }
    restoreText('main', cur => ({value: cur.trim() ? before.replace(/\s+$/, '') + '\n' + cur : before, at: null}));
    render();
  }});
}

/* ── events ────────────────────────────────────────────────────────────── */
const isField = t => t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable);

/* what still works while the board is read-only (or not yet loaded): looking, not changing */
const RO_OK = new Set(['theme', 'page', 'back', 'jump', 'jumpitem', 'filter', 'filterall', 'hidedone', 'doneopen',
  'fullpage', 'clearq', 'snackact', 'compclose', 'arrdone', 'filecancel', 'savecancel', 'sfcancel']);
document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const a0 = t.closest('[data-act]'), act0 = a0 ? a0.dataset.act : null;
  if (act0 === 'retry'){ e.preventDefault(); retryLoad(); return; }
  if (act0 === 'signout'){ e.preventDefault(); signOut(); return; }
  if (!SYNC.loaded && (!act0 || !RO_OK.has(act0))){
    if (a0 && a0.tagName === 'A') e.preventDefault();
    return;
  }
  // arrange mode: only the arrows, Done, the theme and the Undo bar do anything
  if (S.arr){
    const a = t.closest('[data-act]'), act = a ? a.dataset.act : null;
    if (a && a.tagName === 'A') e.preventDefault();
    if (act === 'arrdone') setArrange(false);
    else if (act === 'itemup' || act === 'itemdown') moveItemBy(a.closest('.it').dataset.id, act === 'itemup' ? -1 : 1);
    else if (act === 'cardup' || act === 'carddown') moveCardBy(a.closest('.card').dataset.scope, act === 'cardup' ? -1 : 1);
    else if (act === 'theme') setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
    else if (act === 'undo') doUndo();
    else if (act === 'snackact') doSnackAct();
    return;
  }
  const itemEl = t.closest('.it');
  let dirty = false;

  // tapping anywhere outside the open item closes it (and keeps its wording)
  if (S.openId && (!itemEl || itemEl.dataset.id !== S.openId) && !t.closest('.snack')){
    closeOpen();
    dirty = true;
  }

  const actEl = t.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : null;
  const host = t.closest('.card, #pg');
  const scope = host ? host.dataset.scope : null;
  if (actEl && actEl.tagName === 'A') e.preventDefault();
  const P = actEl ? padOf(actEl) : null;

  switch (act){
    case 'move': case 'addshow': break;   // native pickers: handled on change
    case 'theme': setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true); break;
    case 'compose': if (compOpen()) closeComp(true); else openComp(); break;
    case 'compclose': closeComp(true); break;
    case 'arrange': setArrange(true); dirty = false; break;
    case 'kind': {
      const k = actEl.dataset.kind;
      if (actEl.closest('#topKinds')){ setTopKind(k); $('#topText').focus({preventScroll: true}); }
      else if (actEl.closest('.np-kinds')){ P.fk = k; P.fkPicked = true; paintFile(P); }
      else if (scope){
        S.footKind[scope] = k;
        $$('.foot .kw', host).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === k)));
        const ta = $('textarea[data-comp]', host);
        if (ta) ta.focus({preventScroll: true});
      }
      break;
    }
    case 'add': {
      const ta = actEl.id === 'topAdd' ? $('#topText') : actEl.parentElement.querySelector('textarea');
      if (dirty){ render(); dirty = false; }
      if (ta) submit(ta);
      break;
    }
    case 'tick': if (dirty){ render(); dirty = false; } tick(itemEl.dataset.id); break;
    case 'done': toggleDone(itemEl.dataset.id); dirty = false; break;
    case 'pin': togglePin(itemEl.dataset.id); dirty = false; break;
    case 'del': del(itemEl.dataset.id); dirty = false; break;
    case 'page': if (dirty){ render(); dirty = false; } openPage(actEl.dataset.scope || scope, {byKey: e.detail === 0}); break;
    case 'back': back(); break;
    case 'jump': if (dirty){ render(); dirty = false; } jump(actEl.dataset.scope); break;
    case 'jumpitem': {
      if (dirty){ render(); dirty = false; }
      const it = get(actEl.dataset.id);
      if (it) jump(it.scope, it.id);
      break;
    }
    case 'filter': setFilter(actEl.dataset.v); dirty = false; break;
    case 'filterall': setFilter('all'); dirty = false; break;
    case 'hidedone': S.hideDone = !S.hideDone; S.linger = null; planKey = ''; render({flip: true}); dirty = false; break;
    case 'doneopen': {
      if (S.doneOpen.has(S.page)) S.doneOpen.delete(S.page); else S.doneOpen.add(S.page);
      render({flip: true}); dirty = false;
      break;
    }
    case 'fileline': if (!isDis(actEl)){ if (P.file) closeFile(P); else openFile(P, e.detail === 0); } break;
    case 'filecancel': closeFile(P, true); break;
    case 'filego': if (!isDis(actEl)) fileLine(P); break;
    case 'saveto': if (!isDis(actEl)){ if (P.save) closeSave(P); else openSave(P, e.detail === 0); } break;
    case 'savecancel': closeSave(P, true); break;
    case 'savego': if (!isDis(actEl)) savePad(P); break;
    case 'padclear': if (!isDis(actEl)) clearPad(P); break;
    case 'fullpage':
      if (FP.on && FP.P === P) exitFull({how: e.detail === 0 ? 'key' : 'pointer'});
      else enterFull(P, {byKey: e.detail === 0});
      break;
    case 'newsec':
      openSecForm({slot: 'grid', back: actEl, onCreate: s => {
        render();
        const card = cardEls.get(s);
        if (card){ card.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'nearest'}); replay(card, 'ping'); }
        snack('Section created: ' + nameOf(s), {scope: s, act: {label: 'Open', fn: () => openPage(s)}});
      }});
      break;
    case 'secrename': openSecForm({slot: 'page', mode: 'rename', sec: secOf(S.page), back: actEl}); break;
    case 'seccolour': openSecForm({slot: 'page', mode: 'colour', sec: secOf(S.page), back: actEl}); break;
    case 'secdelete': deleteSection(S.page); break;
    case 'removecard': removeCard(S.page); break;
    case 'sfsw': {
      SF.tint = actEl.dataset.tint;
      paintSwatches();
      // a section being recoloured shows the colour straight away; Cancel puts it back
      if (SF.o && SF.o.mode === 'colour' && SF.o.sec){ paint(SF.o.sec, SF.tint); refreshSection(secScope(SF.o.sec)); }
      break;
    }
    case 'sfgo': sfSubmit(); break;
    case 'sfcancel': closeSecForm(); break;
    case 'clearq': S.q = ''; S.pass.clear(); $('#q').value = ''; $('#qx').hidden = true; render(); $('#q').focus(); dirty = false; break;
    case 'undo': doUndo(); break;
    case 'snackact': doSnackAct(); break;
    default:
      if (itemEl && !itemEl.classList.contains('open') && !t.closest('button,a,select,textarea,input,label,[data-grip]')){
        openItem(itemEl.dataset.id, mqFine.matches);
        return;
      }
  }
  if (dirty) render();
});

// keep the caret in the field when a kind word, an add button, a pad action or Full page is pressed
document.addEventListener('mousedown', e => {
  const t = e.target instanceof Element ? e.target.closest('.kw,.add,.comp-add,.np-acts .act,.np-fp') : null;
  if (t) e.preventDefault();
});

document.addEventListener('keydown', e => {
  const t = e.target;
  const enter = e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229;
  const esc = e.key === 'Escape' && !e.isComposing;
  // while a drag is under way the keys wait, and Escape cancels it
  if (DR.st && DR.st.on){ e.preventDefault(); if (e.key === 'Escape') cancelDrag(); return; }
  if (esc && S.arr){ e.preventDefault(); setArrange(false); return; }
  // an Escape that has just closed full page arms the next one to close the notes page
  const armed = FP.esc;
  FP.esc = false;
  // a pad keeps its keys: Return is a new line, and Cmd/Ctrl+Z is its own
  if (t.classList && t.classList.contains('np-ta')){
    const P = padOf(t);
    if (esc && (P.file || P.save)){ e.preventDefault(); closeFile(P); closeSave(P); }
    else if (esc && FP.on && FP.P === P){ e.preventDefault(); exitFull({how: 'esc'}); }
    else if (esc && armed && S.page && P === pads.page){ e.preventDefault(); back(); }
    return;
  }
  if (t.id === 'sfName'){
    if (enter){ e.preventDefault(); sfSubmit(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeSecForm(); }
    return;
  }
  if (e.key === 'Escape' && SF.o && SF.el.contains(t)){ e.preventDefault(); closeSecForm(); return; }
  if (e.key === 'Escape' && t.closest && t.closest('.np-panel')){
    const P = padOf(t);
    e.preventDefault(); closeFile(P, true); closeSave(P, true);
    return;
  }
  // anywhere in the composer, Escape closes it and focus goes back to "+ Add"
  if (esc && t.closest && t.closest('#comp')){ e.preventDefault(); closeComp(true); return; }
  // anywhere else in full page (the bar, the Undo bar), Escape leaves full page first
  if (esc && FP.on){ e.preventDefault(); exitFull({how: 'esc'}); return; }
  if (t.id === 'topText' || (t.dataset && t.dataset.comp !== undefined)){
    // with a keyboard, Enter adds and Shift+Enter starts a new line; a phone keyboard has no
    // Shift+Return, so there Return is a new line (for lists like the rig schedule) and + adds
    if (enter && mqFine.matches){ e.preventDefault(); submit(t); }
    else if (e.key === 'Escape'){ t.blur(); }
    return;
  }
  if (t.classList && t.classList.contains('edit')){
    // a phone keyboard has no Shift+Return, so there Return adds a line (how the rig schedule gets
    // its bullets) and tapping anywhere else saves; with a mouse, Enter saves as before
    if ((enter && mqFine.matches) || e.key === 'Escape'){
      e.preventDefault();
      const id = S.openId;
      closeOpen(e.key === 'Escape');
      render();
      const back = document.querySelector('[data-fkey="txt:' + vctx() + ':' + id + '"]');
      if (back && mqFine.matches) back.focus({preventScroll: true});
    }
    return;
  }
  // Alt+↑ / Alt+↓ on an item moves it one place in its list; on a cover, the card among the cards
  if (SYNC.loaded && e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && !isField(t) && !FP.on && t.closest){
    const dir = e.key === 'ArrowUp' ? -1 : 1;
    const row = t.closest('.it[data-id]');
    if (row && !row.classList.contains('done')){ e.preventDefault(); moveItemBy(row.dataset.id, dir); return; }
    const card = t.closest('.card');
    if (card && t.closest('.cover') && S.filter === 'all'){ e.preventDefault(); moveCardBy(card.dataset.scope, dir); return; }
  }
  if (SYNC.loaded && t.classList && t.classList.contains('txt') && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    const itemEl = t.closest('.it');
    if (itemEl) openItem(itemEl.dataset.id, true);
    return;
  }
  if (e.key === 'Escape' && S.openId){ closeOpen(); render(); return; }
  if (e.key === 'Escape' && S.page && !isField(t)){ e.preventDefault(); back(); return; }
  if (e.key === '/' && !isField(t) && !S.page && !FP.on && !S.arr){ e.preventDefault(); $('#q').focus(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !isField(t) && snackUndo){ e.preventDefault(); doUndo(); }
});

document.addEventListener('pointerdown', () => { FP.esc = false; }, true);

document.addEventListener('beforeinput', e => {
  // nothing is typed into the board until it has loaded (read-only)

document.addEventListener('change', e => {
  const t = e.target;
  const isNew = t.value === '__new';
  // read-only: the Showing picker still shows; nothing else changes anything
  if (!SYNC.loaded){
    if (t.classList.contains('fsel')){ if (isNew){ t.value = S.filter; fitSelect(t); } else setFilter(t.value); }
    return;
  }
  if (t.id === 'topDest'){
    if (isNew){
      t.value = S.topScope;
      openSecForm({slot: 'top', back: t, onCreate: s => { S.topScope = s; refreshPickers(); render(); $('#topText').focus({preventScroll: true}); }});
      return;
    }
    S.topScope = t.value; fitSelect(t); paintTop(); return;
  }
  if (t.classList.contains('np-dest')){
    const P = padOf(t);
    if (isNew){
      t.value = P.fs;
      openSecForm({slot: 'pad:' + P.key, from: 'file', back: t, onCreate: s => { P.fs = s; P.fsPicked = true; render(); paintFile(P); }});
      return;
    }
    P.fs = t.value; P.fsPicked = true; paintFile(P); return;
  }
  if (t.classList.contains('np-sdest')){
    const P = padOf(t);
    if (isNew){
      t.value = P.ss;
      openSecForm({slot: 'pad:' + P.key, from: 'save', back: t, onCreate: s => { P.ss = s; render(); paintSave(P); }});
      return;
    }
    P.ss = t.value; paintSave(P); return;
  }
  if (t.classList.contains('fsel')){
    if (isNew){
      t.value = S.filter; fitSelect(t);
      openSecForm({slot: 'filter', back: t, onCreate: s => setFilter(s)});
      return;
    }
    setFilter(t.value); return;
  }
  if (t.id === 'addShow'){ const v = t.value; t.selectedIndex = 0; addShow(v); return; }
  if (t.dataset && t.dataset.act === 'move'){
    const itemEl = t.closest('.it');
    if (!itemEl) return;
    const id = itemEl.dataset.id;
    if (isNew){
      t.selectedIndex = 0;
      openSecForm({slot: 'move:' + id, back: t, onCreate: s => moveItem(id, s)});
      return;
    }
    moveItem(id, t.value);
  }
});

/* ── the board's record: this page's working copy, and back ────────────── */
const PAD_WAIT = 1200;          // a pad (or an item being edited) saves this long after typing stops
const TOMB = '\u0000deleted';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sameVer = (a, b) => a === b || (!!a && !!b && Date.parse(a) === Date.parse(b));
const isOffline = e => (typeof navigator !== 'undefined' && navigator.onLine === false) ||
  !!(e && (e.name === 'TypeError' || e.name === 'AbortError' || e.name === 'TimeoutError'));
const toISO = d => d ? (d instanceof Date ? d.toISOString() : String(d)) : null;
/* what a record says, without when it was said: a change here is what earns a new stamp */
const recItem = it => {
  const r = {id: it.id, kind: it.kind, text: String(it.text == null ? '' : it.text), scope: it.scope,
    pinned: !!it.pinned, done: !!it.done, order: Number.isFinite(+it.order) ? +it.order : 0, createdAt: it.createdAt || null};
  if (it.done && it.doneAt) r.doneAt = it.doneAt;
  return r;
};
const recSec = x => ({id: x.id, name: x.name, tint: x.tint});
const shownList = () => Array.from(S.shown).filter(isJob).sort();
const namesSorted = () => { const o = {}; Object.keys(NAMES).sort().forEach(k => { o[k] = NAMES[k]; }); return o; };
/* what each record said when last stamped (or read): anything that differs now is an edit made here */
const LAST = new Map();

/* the last name of each show on the board. "all" (a new job list, or a fresh load) brings every
   name up to date; otherwise only a show with no name yet gets one, so a device with an older job
   list never keeps writing its older names over newer ones */
function keepNames(all){
  if (JOB.state !== 'ok') return;
  jobScopes().forEach(s => {
    const j = jobOf(s);
    if (j && isShown(s) && (all ? NAMES[s] !== j.name : !NAMES[s])) NAMES[s] = j.name;
  });
}

/* Give every record that has changed since the last look a new stamp, and every one that has
   gone a tombstone. Returns whether anything had changed. */
function stamp(){
  if (!SYNC.loaded) return false;
  keepNames(false);
  let at = null, changed = false;
  const now = () => at || (at = clockISO());
  const seenKeys = new Set();
  const check = (k, c, fn) => { seenKeys.add(k); if (LAST.get(k) !== c){ LAST.set(k, c); fn(now()); changed = true; } };
  items.forEach(it => {
    if (it.done && !it.doneAt) it.doneAt = now();
    if (!it.done && it.doneAt) delete it.doneAt;
    check('i:' + it.id, JSON.stringify(recItem(it)), t => { it.updatedAt = t; TOMBS.items.delete(it.id); });
  });
  SECTIONS.forEach(x => check('s:' + x.id, JSON.stringify(recSec(x)), t => { x.updatedAt = t; TOMBS.sections.delete(x.id); }));
  Object.keys(PAGES).forEach(s => {
    const p = PAGES[s], k = 'p:' + s, text = String(p.text == null ? '' : p.text);
    // a page never written on is not a record (and an empty one never undoes a deletion)
    if (!text.trim() && (!LAST.has(k) || LAST.get(k) === TOMB)) return;
    check(k, JSON.stringify({text}), t => { p.updatedAt = t; if (!p.edited) p.edited = new Date(t); TOMBS.pages.delete(s); });
  });
  check('notepad', MAINPAD.text, t => { MAINPAD.updatedAt = t; if (!MAINPAD.edited) MAINPAD.edited = new Date(t); });
  check('cardOrder', CARD_ORDER.join('\n'), t => { META.cardOrderAt = t; });
  check('shown', shownList().join('\n'), t => { META.shownAt = t; });
  check('names', JSON.stringify(namesSorted()), () => {});
  LAST.forEach((c, k) => {
    if (seenKeys.has(k) || c === TOMB) return;
    const id = k.slice(2), t = now();
    if (k.startsWith('i:')) TOMBS.items.set(id, {id, deleted: true, updatedAt: t});
    else if (k.startsWith('s:')) TOMBS.sections.set(id, {id, deleted: true, updatedAt: t});
    else if (k.startsWith('p:')) TOMBS.pages.set(id, {deleted: true, updatedAt: t});
    else return;
    LAST.set(k, TOMB);
    changed = true;
  });
  SYNC.typed = false;
  if (changed) refreshDirty();
  return changed;
}

/* the whole board as a record; for a save, tombstones over 30 days old are let go */
function buildDoc(forSave){
  if (forSave){
    const cut = Date.now() - NotesCore.TOMB_DAYS * 864e5, old = r => NotesCore.tms(r.updatedAt) < cut;
    [TOMBS.items, TOMBS.sections, TOMBS.pages].forEach(m => m.forEach((r, k) => { if (old(r)) m.delete(k); }));
  }
  const doc = {v: 1,
    items: items.map(it => Object.assign(recItem(it), {updatedAt: it.updatedAt || null})).concat(Array.from(TOMBS.items.values())),
    sections: SECTIONS.map(x => Object.assign(recSec(x), {updatedAt: x.updatedAt || null})).concat(Array.from(TOMBS.sections.values())),
    pages: {},
    notepad: {text: MAINPAD.text, updatedAt: MAINPAD.updatedAt || null},
    cardOrder: {list: CARD_ORDER.slice(), updatedAt: META.cardOrderAt},
    shown: {list: shownList(), updatedAt: META.shownAt},
    names: namesSorted()};
  Object.keys(PAGES).forEach(s => {
    const k = 'p:' + s;
    if (!LAST.has(k) || LAST.get(k) === TOMB) return;
    const p = PAGES[s];
    doc.pages[s] = {text: String(p.text == null ? '' : p.text), edited: toISO(p.edited), updatedAt: p.updatedAt || null};
  });
  TOMBS.pages.forEach((r, s) => { doc.pages[s] = r; });
  const d = NotesCore.normDoc(doc);
  return forSave ? NotesCore.prune(d, Date.now()) : d;
}

/* Put a board into the working copy. Objects are updated in place (an Undo still holds the item it
   changed); what each record says is noted, so only a later change here counts as an edit. */
function applyDoc(doc){
  const d = NotesCore.normDoc(doc);
  const byId = new Map(items.map(i => [i.id, i])), next = [];
  TOMBS.items.clear();
  d.items.forEach(r => {
    seen(r.updatedAt);
    if (r.deleted){ TOMBS.items.set(r.id, r); return; }
    const it = byId.get(r.id) || {};
    Object.keys(it).forEach(k => { delete it[k]; });
    next.push(Object.assign(it, r));
  });
  items.splice(0, items.length, ...next);
  const secs = new Map(SECTIONS.map(x => [x.id, x])), ns = [];
  TOMBS.sections.clear();
  d.sections.forEach(r => {
    seen(r.updatedAt);
    if (r.deleted){ TOMBS.sections.set(r.id, r); return; }
    const x = secs.get(r.id) || {};
    x.id = r.id; x.name = r.name; x.updatedAt = r.updatedAt;
    ns.push(paint(x, r.tint));
  });
  SECTIONS.splice(0, SECTIONS.length, ...ns);
  TOMBS.pages.clear();
  const live = new Set();
  Object.keys(d.pages).forEach(s => {
    const r = d.pages[s];
    seen(r.updatedAt);
    if (r.deleted){ TOMBS.pages.set(s, r); return; }
    const p = PAGES[s] || (PAGES[s] = {});
    p.text = r.text;
    p.edited = r.edited ? new Date(r.edited) : r.updatedAt ? new Date(r.updatedAt) : null;
    p.updatedAt = r.updatedAt;
    live.add(s);
  });
  Object.keys(PAGES).forEach(s => { if (!live.has(s) && (TOMBS.pages.has(s) || String(PAGES[s].text || '').trim())) delete PAGES[s]; });
  MAINPAD.text = d.notepad.text;
  MAINPAD.updatedAt = d.notepad.updatedAt;
  MAINPAD.edited = d.notepad.updatedAt ? new Date(d.notepad.updatedAt) : null;
  CARD_ORDER.splice(0, CARD_ORDER.length, ...d.cardOrder.list);
  META.cardOrderAt = d.cardOrder.updatedAt;
  S.shown = new Set(d.shown.list);
  META.shownAt = d.shown.updatedAt;
  NAMES = Object.assign({}, d.names);
  [d.notepad.updatedAt, d.cardOrder.updatedAt, d.shown.updatedAt].forEach(seen);
  LAST.clear();
  d.items.forEach(r => LAST.set('i:' + r.id, r.deleted ? TOMB : JSON.stringify(recItem(r))));
  d.sections.forEach(r => LAST.set('s:' + r.id, r.deleted ? TOMB : JSON.stringify(recSec(r))));
  Object.keys(d.pages).forEach(s => LAST.set('p:' + s, d.pages[s].deleted ? TOMB : JSON.stringify({text: d.pages[s].text})));
  LAST.set('notepad', MAINPAD.text);
  LAST.set('cardOrder', CARD_ORDER.join('\n'));
  LAST.set('shown', shownList().join('\n'));
  LAST.set('names', JSON.stringify(namesSorted()));
  // an item whose section has gone (deleted on one device as it was moved there on another), or
  // whose place is unreadable, comes to General; the next save records the move
  items.forEach(it => { if (!(it.scope === 'me' || isJob(it.scope) || secOf(it.scope))) it.scope = 'me'; });
}
/* the working copy emptied, before a fresh load (a read-only copy on screen is simply replaced) */
function resetWorking(){
  if (S.openId) S.openId = null;
  items.splice(0, items.length);
  SECTIONS.splice(0, SECTIONS.length);
  Object.keys(PAGES).forEach(s => { delete PAGES[s]; });
  Object.assign(MAINPAD, {text: '', edited: null, updatedAt: null});
  CARD_ORDER.splice(0, CARD_ORDER.length);
  S.shown = new Set();
  NAMES = {};
  META.cardOrderAt = META.shownAt = null;
  TOMBS.items.clear(); TOMBS.sections.clear(); TOMBS.pages.clear();
  LAST.clear();
}

/* ── saving: where the board is kept ───────────────────────────────────── */
/* Two keepers with one interface, so the merge and the conflicts run the same way in a test copy
   as live: get() → {value, updated_at} | null; version(); insert(value, ver) and
   put(value, base, ver) → {ok, ver} when written, {conflict} when someone else saved first. */
function restAdapter(origin, key){
  // enforced here, not just by habit: only the live page keeps its board in the live database
  if (origin === SB_URL && MODE !== 'live') throw new Error('Refused: a test copy never keeps its board in the live database');
  if (!/^notesboard_[a-z0-9_]+$/.test(key)) throw new Error('Refused: not a notes board');
  const hdr = extra => Object.assign({apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY}, extra || {});
  const K = 'key=eq.' + encodeURIComponent(key);
  async function call(q, o){
    const r = await net(origin + '/rest/v1/app_data' + q, Object.assign({cache: 'no-store'}, o));
    const t = await r.text();
    if (!r.ok){ const e = new Error('HTTP ' + r.status + (t ? ' ' + t.slice(0, 200) : '')); e.status = r.status; throw e; }
    let d;
    try { d = t ? JSON.parse(t) : []; } catch (e) { throw new Error('Unreadable reply'); }
    if (!Array.isArray(d)) throw new Error('Unexpected reply');
    return d;
  }
  const wrote = (d, ver) => d.length ? {ok: true, ver: d[0].updated_at || ver} : {conflict: true};
  // leaving the page, the save rides on a keepalive request (which has a 64 KB limit)
  const keep = (body, o) => !!(o && o.keepalive) && body.length < 60000;
  return {
    kind: 'rest',
    async get(){
      const d = await call('?select=value,updated_at&' + K, {headers: hdr(), signal: timeout(25000)});
      return d.length ? {value: d[0].value, updated_at: d[0].updated_at} : null;
    },
    async version(){
      const d = await call('?select=updated_at&' + K, {headers: hdr(), signal: timeout(15000)});
      return d.length ? d[0].updated_at : null;
    },
    // the first save: an insert that stands aside if the row already exists (never an upsert)
    async insert(value, ver, o){
      const body = JSON.stringify([{key, value, updated_at: ver}]);
      return wrote(await call('?on_conflict=key&select=updated_at', {method: 'POST', body, keepalive: keep(body, o), signal: timeout(25000),
        headers: hdr({'Content-Type': 'application/json', Prefer: 'resolution=ignore-duplicates,return=representation'})}), ver);
    },
    // every later save: only if the row is still the version it was based on
    async put(value, base, ver, o){
      const body = JSON.stringify({value, updated_at: ver});
      return wrote(await call('?' + K + '&updated_at=eq.' + encodeURIComponent(base) + '&select=updated_at',
        {method: 'PATCH', body, keepalive: keep(body, o), signal: timeout(25000),
          headers: hdr({'Content-Type': 'application/json', Prefer: 'return=representation'})}), ver);
    },
  };
}
/* a test copy's board: this browser's storage, with the same versions and the same conflicts */
function localAdapter(k){
  const read = () => { const raw = localStorage.getItem(k); return raw == null ? null : JSON.parse(raw); };
  const write = (value, ver) => { localStorage.setItem(k, JSON.stringify({value, updated_at: ver})); return {ok: true, ver}; };
  return {
    kind: 'local',
    async get(){ const r = read(); return r ? {value: r.value, updated_at: r.updated_at} : null; },
    async version(){ const r = read(); return r ? r.updated_at : null; },
    async insert(value, ver){ return read() ? {conflict: true} : write(value, ver); },
    async put(value, base, ver){ const r = read(); return (!r || r.updated_at !== base) ? {conflict: true} : write(value, ver); },
  };
}

const SYNC = {
  adapter: null, key: null,
  loaded: false, loading: false, ro: false,   // saved only once loaded; never while read-only
  state: 'ok',                                 // ok | offline | error | refused
  ver: null,                                   // the version of the saved board this copy is based on
  base: NotesCore.empty(),                     // the saved board this copy last agreed with
  dirty: false, dirtyKeys: [], typed: false,
  saving: false, again: false, sending: null, t: 0, first: 0, retryT: 0, fails: 0,
  pulling: false, pullAgain: false, pullT: 0, pollT: 0, loadT: 0, rt: null, merged: [],
};
const TAB = uid('t');

/* ── this browser's copies: unsaved changes, and the board last seen ───── */
const pendPrefix = () => 'vsNotes_pending:' + MODE + ':' + SYNC.key + ':';
const cacheKey = () => 'vsNotes_cache:' + MODE + ':' + SYNC.key;
/* which records differ from the saved board: those are the unsaved changes */
function refreshDirty(doc){
  if (!SYNC.loaded) return;
  doc = doc || buildDoc();
  SYNC.dirtyKeys = NotesCore.diffKeys(doc, SYNC.base);
  SYNC.dirty = SYNC.dirtyKeys.length > 0;
  writePending(doc);
}
/* every unsaved change is kept in this browser until it is saved (with what the saved board said
   then), so a tab closed too soon loses nothing: the next load merges it in */
function writePending(doc){
  if (!SYNC.loaded || !SYNC.key) return;
  const k = pendPrefix() + TAB;
  if (!SYNC.dirty){ ls.del(k); return; }
  doc = doc || buildDoc();
  ls.set(k, JSON.stringify({at: new Date().toISOString(),
    doc: NotesCore.partial(doc, SYNC.dirtyKeys), base: NotesCore.partial(SYNC.base, SYNC.dirtyKeys)}));
}
function readPendings(){
  const pre = pendPrefix(), out = [];
  ls.keys().forEach(k => {
    if (k.indexOf(pre) !== 0) return;
    const raw = ls.get(k);
    try { const p = JSON.parse(raw); if (p && p.doc) out.push({k, raw, p}); else ls.del(k); }
    catch (e) { ls.del(k); }
  });
  return out.sort((a, b) => NotesCore.tms(a.p.at) - NotesCore.tms(b.p.at));
}
/* the copies merged in at load go once they are safely saved (unless a tab has written them again) */
function clearMergedPendings(){
  SYNC.merged.forEach(([k, raw]) => { if (ls.get(k) === raw) ls.del(k); });
  SYNC.merged = [];
}
function writeCache(){
  if (!SYNC.loaded || !SYNC.key) return;
  ls.set(cacheKey(), JSON.stringify({at: new Date().toISOString(), doc: buildDoc()}));
}
function readCache(){
  try { const c = JSON.parse(ls.get(cacheKey()) || 'null'); return c && c.doc ? c : null; } catch (e) { return null; }
}

/* ── saving: when ──────────────────────────────────────────────────────── */
/* a change is saved ~0.7s later (a pad ~1.2s after the typing stops), and never more than 4s later
   however busy the page is */
function commitSoon(ms){
  if (!SYNC.loaded || SYNC.ro) return;
  ms = ms == null ? 700 : ms;
  const now = Date.now();
  if (!SYNC.first) SYNC.first = now;
  clearTimeout(SYNC.t);
  SYNC.t = setTimeout(commit, Math.max(0, Math.min(ms, SYNC.first + 4000 - now)));
}
function commit(){
  SYNC.first = 0;
  if (!SYNC.loaded || SYNC.ro) return;
  stamp();
  if (SYNC.dirty) save();
  paintSync();
}
/* leaving (another app, another tab, closing): everything goes now, on a request that outlives the page */
function flushHidden(){
  if (!SYNC.loaded || SYNC.ro) return;
  clearTimeout(SYNC.t);
  SYNC.first = 0;
  stamp();
  if (SYNC.dirty && !SYNC.saving) save({keepalive: true});
}
function nextVer(){
  let v = clockISO();
  if (SYNC.ver && Date.parse(v) <= Date.parse(SYNC.ver)) v = new Date(Date.parse(SYNC.ver) + 1).toISOString();
  return v;
}
/* the other device's words, when a pad both changed keeps them */
function fromLabel(){ const d = new Date(); return 'From another device, ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + hhmm(d); }

/* ── saving: how ───────────────────────────────────────────────────────── */
/* Write the board only over the version it was based on. If another device saved first, read
   theirs, merge record by record and try again (a few times, backing off). */
async function save(o){
  o = o || {};
  if (!SYNC.loaded || SYNC.ro) return;
  if (SYNC.saving){ SYNC.again = true; return; }
  clearTimeout(SYNC.t);
  clearTimeout(SYNC.retryT);
  SYNC.first = 0;
  stamp();
  if (!SYNC.dirty){ paintSync(); return; }
  SYNC.saving = true;
  paintSync();
  let ok = false;
  try {
    for (let attempt = 0; attempt < 6 && !ok; attempt++){
      if (attempt) await sleep(Math.min(3000, 200 * Math.pow(2, attempt - 1)) + Math.random() * 200);
      stamp();
      const doc = buildDoc(true), ver = nextVer();
      SYNC.sending = ver;
      const res = SYNC.ver == null
        ? await SYNC.adapter.insert(doc, ver, o)
        : await SYNC.adapter.put(doc, SYNC.ver, ver, o);
      if (res.ok){
        SYNC.ver = res.ver; seen(res.ver);
        SYNC.base = doc;
        ok = true;
        break;
      }
      // someone else saved first: theirs, merged with this copy, then again
      const row = await SYNC.adapter.get();
      if (!row){ SYNC.ver = null; SYNC.base = NotesCore.empty(); refreshDirty(); continue; }
      if (sameVer(row.updated_at, SYNC.ver)){
        // the row is still the version this was based on, yet the write was turned away
        const e = new Error('The database refused the change'); e.refused = true; throw e;
      }
      mergeRemote(row);
    }
    if (!ok) throw new Error('Not saved after several tries');
    SYNC.fails = 0;
    SYNC.state = 'ok';
    refreshDirty();         // anything edited while this was on its way is still to go
    writeCache();
    clearMergedPendings();
  } catch (e) {
    SYNC.fails++;
    SYNC.state = e && e.refused ? 'refused' : isOffline(e) ? 'offline' : 'error';
    console.warn('Notes: not saved', e);
    const ms = Math.min(60000, 2000 * Math.pow(2, Math.min(5, SYNC.fails - 1)));
    SYNC.retryT = setTimeout(() => save(), ms);
  } finally {
    SYNC.saving = false;
    SYNC.sending = null;
    const again = SYNC.again;
    SYNC.again = false;
    paintSync();
    if (ok && (again || SYNC.dirty)) commitSoon(250);
    if (SYNC.pullAgain){ SYNC.pullAgain = false; pullSoon(); }
  }
}

/* Another device's board, merged into this one: this copy's changes are stamped first, so an edit
   made here since the last save counts as the newer; a pad both changed keeps this device's words
   and adds the other's new lines. */
function mergeRemote(row){
  const value = row.value;
  if (value && typeof value === 'object' && (+value.v || 0) > 1){
    // saved by a newer version of this page: stop, rather than save over what it cannot read
    SYNC.loaded = false;
    loadFailed(Object.assign(new Error('newer'), {newer: true}));
    throw Object.assign(new Error('newer'), {refused: true});
  }
  stamp();
  const local = buildDoc(), remote = NotesCore.normDoc(value);
  const merged = NotesCore.mergeDocs(local, remote, {base: SYNC.base, now: clockISO(), label: fromLabel()});
  SYNC.ver = row.updated_at; seen(row.updated_at);
  SYNC.base = remote;
  const changed = JSON.stringify(merged) !== JSON.stringify(local);
  if (changed) applyDoc(merged);
  refreshDirty();
  writeCache();
  if (changed) afterRemote();
}
/* the page follows a change from elsewhere without disturbing what is being typed */
function afterRemote(){
  if (S.openId){
    const it = get(S.openId), ta = document.querySelector('.it[data-id="' + S.openId + '"] .edit');
    if (!it) S.openId = null;
    // an item open for editing, not yet typed in, takes the other device's words where it stands
    else if (ta && ta.value === S.openOrig && it.text !== ta.value){ ta.value = it.text; S.openOrig = it.text; autosize(ta); }
  }
  if (S.page && !validScope(S.page)) leaveNow();
  if (S.filter !== 'all' && !validScope(S.filter)) S.filter = 'all';
  refreshPickers();
  [pads.main, pads.page].forEach(P => {
    if (P.key === 'page' && !S.page) return;
    const want = padStore(P).text;
    if (P.ta.value !== want) padReplace(P, want);
  });
  render({remote: true});
  paintSync();
}
/* a pad takes new words; with the caret in it, the caret keeps its place in the words before it */
function padReplace(P, text){
  const ta = P.ta, had = document.activeElement === ta;
  const a = ta.selectionStart, b = ta.selectionEnd, old = ta.value, top = ta.scrollTop;
  ta.value = text;
  if (had){
    const at = text.startsWith(old.slice(0, a)) ? a : Math.min(a, text.length);
    const end = text.startsWith(old.slice(0, b)) ? b : at;
    try { ta.setSelectionRange(at, Math.max(at, end)); } catch (e) {}
    P.sel = [at, Math.max(at, end)];

  ta.scrollTop = top;
  autosize(ta);

/* ── changes from another device ───────────────────────────────────────── */
async function pull(){
  if (!SYNC.loaded || SYNC.ro) return;
  if (SYNC.saving || SYNC.pulling){ SYNC.pullAgain = true; return; }
  SYNC.pulling = true;
  try {
    const row = await SYNC.adapter.get();
    reached();
    if (!row){
      // the saved board has gone: this copy writes it again with its next save
      if (SYNC.ver != null){ SYNC.ver = null; SYNC.base = NotesCore.empty(); refreshDirty(); }
    } else if (!sameVer(row.updated_at, SYNC.ver)) mergeRemote(row);
  } catch (e) { unreached(e); }
  finally { SYNC.pulling = false; }
  if (SYNC.dirty) commitSoon(300);
  paintSync();
  if (SYNC.pullAgain){ SYNC.pullAgain = false; pullSoon(); }
}
const pullSoon = () => { clearTimeout(SYNC.pullT); SYNC.pullT = setTimeout(pull, 250); };
/* the fallback to the live connection: ask only for the version, and read the board if it moved */
async function check(){
  if (!SYNC.loaded || SYNC.ro || SYNC.saving || SYNC.pulling) return;
  try {
    const v = await SYNC.adapter.version();
    reached();
    if (!sameVer(v, SYNC.ver)) pull();
  } catch (e) { unreached(e); }
}
function reached(){
  if (SYNC.state === 'offline'){
    SYNC.state = 'ok';
    SYNC.fails = 0;
    if (SYNC.dirty) save();
  }
  paintSync();
}
function unreached(e){ if (isOffline(e) && SYNC.state === 'ok'){ SYNC.state = 'offline'; paintSync(); } }
function startPoll(){
  clearInterval(SYNC.pollT);
  SYNC.pollT = setInterval(() => { if (document.visibilityState !== 'hidden') check(); }, 30000);
}
/* live: Supabase realtime on this board's row only (the poll stays as the fallback) */
function startLive(){
  if (!LIVE || SYNC.rt) return;
  SYNC.rt = 'loading';
  const el = document.createElement('script');
  el.src = SUPABASE_JS;
  el.async = true;
  el.onload = () => {
    try {
      const client = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false}});
      SYNC.rt = client.channel('notes-' + SYNC.key)
        .on('postgres_changes', {event: '*', schema: 'public', table: 'app_data', filter: 'key=eq.' + SYNC.key}, p => {
          const r = (p && (p.new || p.old)) || {};
          // this page's own save coming back: nothing to do
          if (r.updated_at && (sameVer(r.updated_at, SYNC.ver) || sameVer(r.updated_at, SYNC.sending))) return;
          pullSoon();
        })
        .subscribe();
    } catch (e) { SYNC.rt = 'failed'; console.warn('Notes: live updates unavailable', e); }
  };
  el.onerror = () => { SYNC.rt = 'failed'; };
  document.head.appendChild(el);
}

/* ── the save state: plain words in the pads' footers ──────────────────── */
function syncLine(){
  if (!SYNC.loaded) return SYNC.ro ? 'Read-only' : '';
  const unsaved = SYNC.dirty || SYNC.saving || SYNC.typed;
  if (SYNC.state === 'offline') return unsaved ? 'Offline — kept on this device, will save when back' : 'Offline';
  if (SYNC.state === 'error' && unsaved) return 'Not saved yet — kept on this device, trying again';
  if (SYNC.state === 'refused' && unsaved) return 'Not saved — the database refused the change; kept on this device';
  if (unsaved) return 'Saving…';
  const v = Date.parse(SYNC.ver || '');
  if (!v) return '';
  const d = new Date(v);
  return 'Saved ' + (sameDay(d, new Date()) ? hhmm(d) : fmtDate(d));
}
let syncSaid = '';
function paintSync(){
  const t = syncLine();
  $$('.np-saved').forEach(el => { if (el.textContent !== t) el.textContent = t; });
  const serious = /^(Offline —|Not saved)/.test(t) ? t : '';
  if (serious && serious !== syncSaid) announce(serious);
  syncSaid = serious;
}

/* ── loading ───────────────────────────────────────────────────────────── */
let GATE = 'loading', ROUTED = false;
async function loadBoard(){
  if (SYNC.loading || !SYNC.adapter) return;
  SYNC.loading = true;
  clearTimeout(SYNC.loadT);
  let row;
  try { row = await SYNC.adapter.get(); }
  catch (e) { SYNC.loading = false; console.warn('Notes: not loaded', e); loadFailed(e); return; }
  SYNC.loading = false;
  const value = row ? row.value : null;
  if (row && (!value || typeof value !== 'object' || Array.isArray(value))){ loadFailed(new Error('The saved board is not readable')); return; }
  if (row && (+value.v || 0) > 1){ loadFailed(Object.assign(new Error('newer'), {newer: true})); return; }
  const remote = NotesCore.normDoc(value);
  // unsaved changes a closed tab left in this browser, merged in by when they were made
  const pend = readPendings();
  let doc = remote;
  pend.forEach(x => { doc = NotesCore.mergeDocs(x.p.doc, doc, {base: x.p.base || null, now: clockISO(), label: fromLabel()}); });
  SYNC.merged = pend.map(x => [x.k, x.raw]);
  resetWorking();
  SYNC.ver = row ? row.updated_at : null;
  seen(SYNC.ver);
  SYNC.base = remote;
  applyDoc(doc);
  SYNC.loaded = true;
  SYNC.ro = false;
  SYNC.state = 'ok';
  SYNC.fails = 0;
  keepNames(true);
  stamp();
  refreshDirty();
  writeCache();
  setGate('ready');
  afterLoad();
  if (SYNC.dirty) commitSoon(0); else clearMergedPendings();
  startLive();
  startPoll();
}
/* A load that failed: the copy last seen on this device, read-only, or nothing at all; either way
   nothing is saved (a failed load that saved an empty board once wiped the Dashboard's job list) */
function loadFailed(e){
  SYNC.loaded = false;
  const c = !(e && e.newer) && readCache();
  if (c){
    resetWorking();
    applyDoc(c.doc);
    SYNC.ro = true;
    $('#roMsg').textContent = 'Could not load your notes. This is the copy last opened on this device, read-only; nothing will be saved until they load.';
    setGate('ro');
    afterLoad();
  } else {
    SYNC.ro = false;
    setGate(e && e.newer ? 'newer' : 'failed');
  }
  clearTimeout(SYNC.loadT);
  if (!(e && e.newer)) SYNC.loadT = setTimeout(() => { if (!SYNC.loaded) loadBoard(); }, 30000);
}
function retryLoad(){
  if (!SYNC.adapter){ start(); return; }
  if (SYNC.ro) $('#roMsg').textContent = 'Trying again…';
  else setGate('loading');
  loadBoard();
}
function afterLoad(){
  refreshPickers();
  padLoad(pads.main);
  if (S.page){ if (validScope(S.page)) padLoad(pads.page); else leaveNow(); }
  planKey = '';
  render({remote: true});
  paintSync();
  if (!ROUTED){
    ROUTED = true;
    // a link to a show's page may need the job list first
    const wait = /^#show-/.test(HASH0) && JOB.state === 'loading';
    (wait ? Promise.race([JOB.ready, sleep(6000)]) : Promise.resolve()).then(routeInitial);
  }
}
/* a reload or a shared link on a notes page opens it straight away, with the main page behind it,
   and one on a full page (#notepad/full, #show-3/full) opens that pad in full page on top */
function routeInitial(){
  const r0 = routeOfHash(HASH0), s0 = r0.v !== 'home' ? r0.v : null;
  H.set('replaceState', 'home', 0);
  if (s0 && S.page !== s0){

  if (s0) requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('instant')));

/* ── the gate: loading, signing in, an account that may not, a failed load ── */
function setGate(state){
  GATE = state;
  const root = document.documentElement, g = $('#gate');
  root.classList.toggle('gated', state !== 'ready' && state !== 'ro');
  root.classList.toggle('ro', state === 'ro');
  $('#roBanner').hidden = state !== 'ro';
  $$('.np-ta').forEach(t => { t.readOnly = state !== 'ready'; });
  $('#pfoot').hidden = !(LIVE && USER.email && state !== 'signin');
  $('#pfWho').textContent = USER.email ? 'Signed in as ' + USER.email : '';
  if (state === 'ready' || state === 'ro' || state === 'signin') { if (state !== 'signin') g.innerHTML = ''; return; }
  const box = (msg, act) => '<div class="banner" role="alert"><p>' + msg + '</p>' + act + '</div>';
  g.innerHTML =
    state === 'loading' ? '<p class="gate-msg">Loading your notes…</p>' :
    state === 'failed' ? box('Could not load your notes. Nothing has been changed, and nothing will be saved until they load.', '<button type="button" class="act" data-act="retry">Retry</button>') :
    state === 'newer' ? box('These notes were saved by a newer version of this page. Reload the page to update it; nothing here will be saved.', '<button type="button" class="act" data-act="retry">Retry</button>') :
    state === 'denied' ? '<p class="gate-msg" style="color:var(--ink)">This page is not available for this account.</p>' +
