<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Versa Studios — End of Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#efede3;color:#302f2c;font-family:'Barlow',sans-serif;min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:680px;margin:0 auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.hd{padding:22px 28px;border-bottom:1px solid #e8e5dc;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-left{display:flex;flex-direction:column;gap:2px}
.hd-brand{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#b5b0a6}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#302f2c}
.hd-date{font-family:'Barlow',sans-serif;font-size:13px;color:#999;margin-top:2px}
.sec{padding:20px 28px;border-bottom:1px solid #eae7df}
.sec:last-child{border-bottom:none}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:12px}
.task-list{list-style:none;counter-reset:tasks}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0ede6}
.task-item:last-child{border-bottom:none}
.task-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:#d4d0c8;min-width:24px;text-align:center;padding-top:2px}
.task-input{flex:1;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:8px;color:#302f2c;padding:10px 14px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s}
.task-input:focus{border-color:#5B5F8D}
.task-input::placeholder{color:#c5c0b6}
.task-rm{background:none;border:none;color:#d4d0c8;font-size:18px;cursor:pointer;padding:4px;line-height:1;transition:color .15s}
.task-rm:hover{color:#DA6B51}
.add-btn{width:100%;padding:10px;background:#f5f3ee;border:1.5px dashed #d4d0c8;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999;cursor:pointer;transition:all .15s;margin-top:8px}
.add-btn:hover{border-color:#5B5F8D;color:#5B5F8D}
.inp{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:14px 16px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s}
.inp:focus{border-color:#5B5F8D}
.inp::placeholder{color:#c5c0b6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pick-btn{padding:12px 16px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:2px solid #ddd8cf;background:#f8f6f1;color:#999;transition:all .15s;flex:1;min-width:90px;text-align:center}
.pick-btn.active{background:rgba(91,95,141,.08);border-color:#5B5F8D;color:#5B5F8D}
.status-txt{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#b5b0a6;margin-bottom:10px}
.submit-btn{width:100%;padding:16px;background:#5B5F8D;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer;transition:opacity .15s}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.submit-btn:not(:disabled):hover{opacity:.9}
.priority-high{border-left:3px solid #DA6B51;padding-left:7px}
.priority-med{border-left:3px solid #C8923A;padding-left:7px}
.priority-low{border-left:3px solid #7A9A80;padding-left:7px}
.pri-sel{display:flex;gap:4px;flex-shrink:0}
.pri-dot{width:22px;height:22px;border-radius:50%;border:2px solid #e0ddd5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;transition:all .12s}
.pri-dot.hi{background:#DA6B51;border-color:#DA6B51}
.pri-dot.md{background:#C8923A;border-color:#C8923A}
.pri-dot.lo{background:#7A9A80;border-color:#7A9A80}
.success{display:none;text-align:center;padding:40px 28px}
.suc-icon{font-size:48px;margin-bottom:16px}
.suc-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#5B5F8D;margin-bottom:8px}
.suc-detail{font-size:14px;color:#999;margin-bottom:24px;line-height:1.6}
.suc-again{padding:12px 24px;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hd">
      <div class="hd-left">
        <div class="hd-brand">Versa Studios</div>
        <div class="hd-title">End of Day</div>
        <div class="hd-date" id="hdDate"></div>
      </div>
    </div>

    <div id="formView">

      <div class="sec">
        <div class="lbl">What Needs Doing Tomorrow</div>
        <div id="taskList"></div>
        <button class="add-btn" onclick="addTask()">+ Add Task</button>
      </div>

      <div class="sec">
        <div class="lbl">Any Other Notes <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:#b5b0a6">(optional)</span></div>
        <textarea class="inp" id="otherNotes" style="min-height:80px;resize:vertical" placeholder="Anything else to hand over..." oninput="checkReady()"></textarea>
      </div>

      <div class="sec" style="border:none;padding-top:14px">
        <div class="status-txt" id="statusTxt">Add at least one task</div>
        <button class="submit-btn" id="submitBtn" onclick="doSubmit()" disabled>Submit End of Day</button>
      </div>
    </div>

    <div class="success" id="successView">
      <div class="suc-icon">✅</div>
      <div class="suc-title">End of Day Submitted</div>
      <div class="suc-detail" id="successDetail"></div>
      <button class="suc-again" onclick="doReset()">Submit Another</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
var SB_URL='https://dttwgmoyxthczlzxjgag.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ';
var EJS_SERVICE='service_883826m',EJS_TEMPLATE='template_hhvnzss',EJS_KEY='-WB5uUr8yu-oIKc5v';

var _name='Andrew Rowell';
var _tasks=[{text:'',priority:''}];

document.addEventListener('DOMContentLoaded',function(){
  var now=new Date();
  document.getElementById('hdDate').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(window.emailjs) emailjs.init({publicKey:EJS_KEY});
  renderTasks();
});

function addTask(){
  _tasks.push({text:'',priority:''});
  renderTasks();
  // Focus the new input
  var inputs=document.querySelectorAll('.task-input');
  if(inputs.length) inputs[inputs.length-1].focus();
}

function removeTask(idx){
  if(_tasks.length<=1) return;
  _tasks.splice(idx,1);
  renderTasks();
  checkReady();
}

function setTaskText(idx,val){
  _tasks[idx].text=val;
  checkReady();
}

function setTaskPriority(idx,pri){
  _tasks[idx].priority=_tasks[idx].priority===pri?'':pri;
  renderTasks();
}

function renderTasks(){
  var el=document.getElementById('taskList');
  el.innerHTML=_tasks.map(function(t,i){
    var priClass=t.priority==='high'?'priority-high':t.priority==='med'?'priority-med':t.priority==='low'?'priority-low':'';
    return '<div class="task-item '+priClass+'">'
      +'<div class="task-num">'+(i+1)+'</div>'
      +'<input class="task-input" value="'+((t.text||'').replace(/"/g,'&quot;'))+'" placeholder="Task '+(i+1)+'..." oninput="setTaskText('+i+',this.value)"/>'
      +'<div class="pri-sel">'
      +'<div class="pri-dot'+(t.priority==='high'?' hi':'')+'" onclick="setTaskPriority('+i+',\'high\')" title="High">!</div>'
      +'<div class="pri-dot'+(t.priority==='med'?' md':'')+'" onclick="setTaskPriority('+i+',\'med\')" title="Medium">•</div>'
      +'<div class="pri-dot'+(t.priority==='low'?' lo':'')+'" onclick="setTaskPriority('+i+',\'low\')" title="Low">–</div>'
      +'</div>'
      +(_tasks.length>1?'<button class="task-rm" onclick="removeTask('+i+')">×</button>':'')
      +'</div>';
  }).join('');
}

function checkReady(){
  var hasTasks=_tasks.some(function(t){return t.text.trim();});
  document.getElementById('submitBtn').disabled=!hasTasks;
  document.getElementById('statusTxt').textContent=hasTasks?'Ready to submit':'Add at least one task';
}

function buildTaskSummary(){
  var priLabels={high:'🔴',med:'🟡',low:'🟢'};
  return _tasks.filter(function(t){return t.text.trim();}).map(function(t,i){
    return (i+1)+'. '+(priLabels[t.priority]||'⚪')+' '+t.text.trim();
  }).join('\n');
}

async function doSubmit(){
  var hasTasks=_tasks.some(function(t){return t.text.trim();});
  if(!_name||!hasTasks) return;

  var today=new Date().toISOString().split('T')[0];
  var taskSummary=buildTaskSummary();
  var notes=document.getElementById('otherNotes').value.trim();
  var fullSummary='TOMORROW:\n'+taskSummary+(notes?'\n\nNOTES:\n'+notes:'');

  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';

  try{
    // Save to Supabase
    var r=await fetch(SB_URL+'/rest/v1/engineering_reports',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify({
        versa_tech_manager:_name,
        bbc_tech_manager:'',
        show_date:today,
        show_name:'End of Day',
        summary_mode:'str',
        summary_text:fullSummary,
        tagged_kit:[],
        tagged_kit_names:[],
        urgent_action:'No',
        urgent_details:'',
        submitted_at:new Date().toISOString()
      })});

    // Send email
    try{
      if(window.emailjs){
        var tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
        var tomorrowStr=tomorrow.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
        await emailjs.send(EJS_SERVICE,EJS_TEMPLATE,{
          show_date:'End of Day — '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),
          versa_tech:_name,
          bbc_tech:'End of Day Report',
          summary:'Tasks for '+tomorrowStr+':\n'+taskSummary+(notes?'\n\nNotes: '+notes:''),
          urgent:'No',
          urgent_details:'--',
          tagged_kit:'--',
          submitted_at:new Date().toLocaleString('en-GB')
        });
      }
    }catch(em){console.warn('Email error:',em);}

    if(r.ok){
      document.getElementById('formView').style.display='none';
      document.getElementById('successView').style.display='block';
      var detail=_name+' · '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'\n\n'+taskSummary;
      document.getElementById('successDetail').innerHTML=detail.replace(/\n/g,'<br>');
    } else alert('Submit failed — please try again');
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false;btn.textContent='Submit End of Day';
}

function doReset(){
  document.getElementById('formView').style.display='';
  document.getElementById('successView').style.display='none';
  document.getElementById('otherNotes').value='';
  _tasks=[{text:'',priority:''}];
  renderTasks();
  checkReady();
}
</script>
</body>
</html>
