function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.innerHTML += '<div class="'+cls+'">'+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Importing...';
  log('Starting import of ' + RECORDS.length + ' records...', 'info');

  let ok = 0, fail = 0, skip = 0;

  for (let i = 0; i < RECORDS.length; i++) {
    const rec = RECORDS[i];
    const label = rec.show_date + ' — ' + rec.versa_tech_manager;

    // Check if already exists for this date+show
    try {
      const check = await fetch(
        SB_URL + '/rest/v1/engineering_reports?show_date=eq.' + rec.show_date + '&show_name=eq.Morning%20Live&limit=1',
        { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
      );
      const existing = await check.json();
      if (Array.isArray(existing) && existing.length > 0) {
        log('[' + (i+1) + '/' + RECORDS.length + '] SKIPPED (already exists): ' + label, 'info');
        skip++;
        continue;
      }
    } catch(e) {}

    try {
      const resp = await fetch(SB_URL + '/rest/v1/engineering_reports', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          Prefer: 'return=minimal'
        },
        body: JSON.stringify(rec)
      });
      if (resp.ok) {
        log('[' + (i+1) + '/' + RECORDS.length + '] ✓ ' + label, 'ok');
        ok++;
      } else {
        const txt = await resp.text();
        log('[' + (i+1) + '/' + RECORDS.length + '] ✗ FAILED ' + label + ': ' + txt, 'err');
        fail++;
      }
    } catch(e) {
      log('[' + (i+1) + '/' + RECORDS.length + '] ✗ ERROR ' + label + ': ' + e.message, 'err');
      fail++;
    }

    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 120));
  }

  log('---', 'info');
  log('Done! Imported: ' + ok + ' | Skipped: ' + skip + ' | Failed: ' + fail, ok > 0 ? 'ok' : 'err');
  btn.textContent = 'Import Complete';
}
