// _opsStart = OPS_CAL index of the first visible month. View = [start, start+1, start+2]
var _opsStart=null;

function opsTodayMonthIdx(){
  // Find OPS_CAL index for today's month, clamped to the available range
  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var n=new Date();var key=monthNames[n.getMonth()]+' '+n.getFullYear();
  for(var i=0;i<OPS_CAL.length;i++){
    if(OPS_CAL[i].month.toLowerCase()===key.toLowerCase())return i;
  }
  // Out of range — clamp
  var firstParts=OPS_CAL[0].month.split(' ');var firstYr=parseInt(firstParts[1]);
  var lastParts=OPS_CAL[OPS_CAL.length-1].month.split(' ');var lastYr=parseInt(lastParts[1]);
  var nowVal=n.getFullYear()*12+n.getMonth();
  var firstVal=firstYr*12+monthNames.indexOf(firstParts[0]);
  var lastVal=lastYr*12+monthNames.indexOf(lastParts[0]);
  if(nowVal<firstVal)return 0;
  return OPS_CAL.length-1;
}

function opsClampStart(idx){
  if(idx<0)return 0;
  if(idx>OPS_CAL.length-1)return OPS_CAL.length-1;
  return idx;
}

function opsCurrentStart(){
  // Track focal month — falls back to today's month
  return _opsStart!=null?_opsStart:opsTodayMonthIdx();
}

function opsLabelForStart(start){
  var mo=OPS_CAL[start].month;
  var moShort=mo.split(' ')[0].slice(0,3);
  var yr=mo.split(' ')[1];
  return moShort+' '+yr;
}

function opsShowFromIdx(start){
  start=opsClampStart(start);
  _opsStart=start;
  var todayIdx=opsTodayMonthIdx();
  // Targeting a past month auto-reveals past months
  if(start<todayIdx)_opsShowingPast=true;
  // All months at-or-after today always visible; past months gated by toggle
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(s,i){
    if(i<todayIdx&&!_opsShowingPast)s.style.display='none';
    else s.style.display='block';
  });
  _opsUpdatePrevBtn();
  // Highlight matching legacy quarter button if present (no-op now)
  document.querySelectorAll('#opsQnav2 .ops-qbtn').forEach(function(b,i){
    b.classList.toggle('active',i===start);
  });
  // Wait for layout to settle (display:block toggles above), then scroll using
  // getBoundingClientRect deltas — robust against any offsetParent/positioning
  // quirks that throw off sec.offsetTop.
  requestAnimationFrame(function(){
    var sc=document.getElementById('opsScroll2');
    var sec=document.getElementById('opsMs2-'+start);
    if(sc&&sec){
      var scRect=sc.getBoundingClientRect();
      var secRect=sec.getBoundingClientRect();
      sc.scrollTop=sc.scrollTop+(secRect.top-scRect.top);
    }
  });
  updatePlanLbl(opsLabelForStart(start));
}

function _saSetupScrollObserver(){
  if(!('IntersectionObserver' in window))return;
  if(_saScrollObs)_saScrollObs.disconnect();
  _saScrollObs=new IntersectionObserver(function(entries){
    var topmostIdx=-1;var topmostTop=Infinity;
    entries.forEach(function(e){
      if(!e.isIntersecting)return;
      var rect=e.target.getBoundingClientRect();
      var idStr=e.target.id||'';
      var m=idStr.match(/^opsMs2-(\d+)$/);
      if(!m)return;
      var idx=parseInt(m[1]);
      if(rect.top<topmostTop&&rect.bottom>80){
        topmostTop=rect.top;
        topmostIdx=idx;
      }
    });
    if(topmostIdx>=0){
      _opsStart=topmostIdx;
      updatePlanLbl(opsLabelForStart(topmostIdx));
    }
  },{threshold:[0,0.05,0.1]});
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec){
    _saScrollObs.observe(sec);
  });
}

  _opsZoomVal=v;
  var el=document.getElementById('opsScroll2');if(el){el.style.zoom=(v===100?'':String(v/100));el.style.setProperty('--ns-zoom',String(v/100));}
  try{localStorage.setItem('opsZoom2',String(v));}catch(e){}
  document.querySelectorAll('[data-zoom-lbl]').forEach(function(l){l.textContent=v+'%';});
  var inp=document.getElementById('nsZoom');if(inp&&+inp.value!==v)inp.value=v;
  document.querySelectorAll('table.ops-tbl').forEach(function(t){delete t.dataset.rdFit;});

}

// Park today's column centre-left so most of the visible width is what's ahead
function _saScrollTodayX(){
  var cell=document.querySelector('#opsScroll2 .ops-dh.td');
  if(!cell)return;
  var td=cell.closest('td');
  if(!td)return;
  // Each month section scrolls independently — park today within ITS scroller
  var sec=td.closest('.ops-ms2');
  if(!sec)return;
  var labelW=150;
  var x=td.offsetLeft-labelW-(sec.clientWidth-labelW)*0.22;
  sec.scrollLeft=Math.max(0,x);
}

// opsShowFromIdx: scroll to a given month index

  _saScrollToMonth(start,false);
}

// Override the main-app's opsReRender to re-render visible stacked months
function opsReRender(){
  if(!_saMonthsRendered)return;
  // Rebuilding cells must NOT move the view: capture each month's horizontal
  // scroll and the page's vertical scroll, restore after the DOM swap.
  var winY=window.pageYOffset;
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec,i){
    if(sec.style.display!=='none'){
      var sl=sec.scrollLeft;
      sec.innerHTML=opsRenderMonth(OPS_CAL[i],i);
      sec.scrollLeft=sl;
    }
  });
  window.scrollTo(0,winY);
  // Re-observe (new DOM nodes inside sections don't need re-observation, but
  // be defensive in case sections got replaced)
  _saSetupScrollObserver();
}
function opsReRenderAll(){opsReRender();}

function opsCrewFormSave(){
  var ed=_nsCmEdit;if(!ed)return;
  var g=function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
  var name=g('nsCfName');if(!name){document.getElementById('nsCfName').focus();toast('Add a name');return;}
  var data={name:name,role:g('nsCfRole'),type:_nsCmType,phone:g('nsCfPhone'),email:g('nsCfEmail')};
  var lc=name.toLowerCase(),now=Date.now(),list=window._opsCrewList=window._opsCrewList||[];
  var taken=_nsCrewDirectory().some(function(c){return c.name.toLowerCase()===lc&&c.name.toLowerCase()!==ed.name.toLowerCase();});
  if(taken){toast(name+' is already on the list');return;}
  if(ed.di<0){
    var old=list.find(function(c){return c.name.toLowerCase()===lc;});
    var entry=Object.assign({},data,{updated:now});
    if(old){Object.keys(old).forEach(function(k){delete old[k];});Object.assign(old,entry);}else list.push(entry);
    toast(name+' added');
  }else{
    var prev=_nsCrewDirectory().find(function(c){return c.name.toLowerCase()===ed.name.toLowerCase();})||{};
    var e=_nsCrewEntryFor(ed.name);
    if(lc!==ed.name.toLowerCase()){
      // New name: keep one record per name so other devices merge it cleanly
      list.push(Object.assign({},data,{updated:now}));
      e.removed=true;e.updated=now;
    }else{Object.assign(e,data,{updated:now});delete e.removed;}
    var patch={};
    if(name!==ed.name)patch.name=name;
    if(data.type!==_nsCrewType(prev))patch.type=data.type;
    if(Object.keys(patch).length)_nsCrewUpdateBookings(ed.name,patch);
    toast('Saved');
  }
  saveCrewList();
  _nsCmEdit=null;_nsRenderCrewMgr();
  if(typeof opsReRender==='function')opsReRender();
}

function _nsCrewEntryFor(name){
  var list=window._opsCrewList=window._opsCrewList||[],lc=name.toLowerCase();
  var hit=list.find(function(c){return c.name.toLowerCase()===lc;});
  if(!hit){var d=_nsCrewDirectory().find(function(c){return c.name.toLowerCase()===lc;})||{name:name};hit={name:d.name,role:d.role||'',type:d.type||'tech',phone:d.phone||'',email:d.email||''};list.push(hit);}
  return hit;
}
// Apply a change to every booking of a person (rename and/or section)
function _nsCrewUpdateBookings(oldName,patch){
  var lc=oldName.toLowerCase();
  Object.keys(_opsD).forEach(function(k){
    var p=k.split('|');if(p.length!==3||p[2].indexOf('st_')!==0||!Array.isArray(_opsD[k]))return;
    var changed=false;
    var next=_opsD[k].map(function(v){
      if(!v||typeof v!=='object'||!v.crew)return v;
      var hit=v.crew.some(function(c){return c.name.toLowerCase()===lc;});if(!hit)return v;
      changed=true;v=Object.assign({},v);
      v.crew=v.crew.map(function(c){return c.name.toLowerCase()===lc?Object.assign({},c,patch):c;});
      return v;
    });
    if(changed)os(p[0],+p[1],p[2],next);
  });
}

function _rdGroupOf(tr){

  if(_nsIsTeam(r))return 'staff';
  if(r==='ml'||r==='mlg'||r==='shopon')return 'rota';

function _rdFitTable(tbl){
  var compact=document.body.classList.contains('rd-compact');
  var max=compact?(window.innerWidth<=640?17:20):(window.innerWidth<=640?20:28),min=12,groups={};var hmax=compact?40:58;
  tbl.querySelectorAll('td.ops-rlbl .nm').forEach(function(el){var g=_rdGroupOf(el.closest('tr'));(groups[g]=groups[g]||[]).push(el);});
  Object.keys(groups).forEach(function(k){
    var size=max;
    groups[k].forEach(function(el){var f=max;el.style.fontSize=f+'px';
      while(f>min&&!(el.scrollWidth<=el.clientWidth+1&&el.scrollHeight<=hmax)){f--;el.style.fontSize=f+'px';}
      if(f<size)size=f;});
    groups[k].forEach(function(el){el.style.fontSize=size+'px';});
  });
  tbl.dataset.rdFit='1';
}
function _rdPass(force){
  if(_opsDrag||document.body.classList.contains('ops-drag-active'))return;
  document.querySelectorAll('.ops-chip:not([data-rd])').forEach(function(ch){
    var bg=ch.style.backgroundColor||'';
    if(!bg&&ch.style.background)bg=ch.style.background;
    if(bg){ch.style.setProperty('--cc',bg);ch.style.removeProperty('background');ch.style.removeProperty('background-color');ch.style.removeProperty('color');ch.style.removeProperty('border-color');}
    var tx=(ch.textContent||'').trim();
    var pb=_nsPastel(tx,ch);if(pb)ch.style.setProperty('--ns-bg',pb);
    // Crew tags under this box take the job's colour
    for(var ct=ch.nextElementSibling;ct&&ct.classList.contains('ns-crew-tag');ct=ct.nextElementSibling){if(pb)ct.style.setProperty('--job',pb);else ct.style.removeProperty('--job');}
    if(/^(day off|leave|holiday|sick)\b/i.test(tx))ch.classList.add('ns-alert');
    var td=ch.closest('td');
    if(td&&td.colSpan>1&&td.dataset.mi!=null&&!ch.querySelector('.ns-rng')&&ch===td.querySelector('.ops-chip')){

// ── LOAD STATE FROM SUPABASE ON BOOT ─────────────────────────────────────────
async function bootstrap(){
  window._opsBooted=true;
  setStatus('work','Loading…');
  try{
    // Fetch in parallel: opsPlanner, opsBrk, jobs, bank_holidays, ml_tech_managers
    var KEYS=['opsPlanner','opsBrk','jobs','bank_holidays','ml_tech_managers','shopon_engineers','crew_list','ops_seeded'];
    // Test mode also fetches the *_test copies; the first run starts from a copy of live data
    var WRITABLE=['opsPlanner','opsBrk','ml_tech_managers','shopon_engineers','crew_list','ops_seeded'];
    var FETCH=_SB_TEST?KEYS.concat(WRITABLE.map(_k)):KEYS;
    var r=await fetch(_SB_URL+'/rest/v1/app_data?select=key,value,updated_at&key=in.('+FETCH.join(',')+')',{headers:_sbGet()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json();
    var map={};rows.forEach(function(row){map[row.key]=row.value;if(row.key===_k('opsPlanner'))_opsStamp=Date.parse(row.updated_at)||null;});
    if(_SB_TEST)WRITABLE.forEach(function(k){if(map.hasOwnProperty(_k(k)))map[k]=map[_k(k)];});
    if(map.opsPlanner&&typeof map.opsPlanner==='object'){
      Object.keys(map.opsPlanner).forEach(function(k){_opsD[k]=map.opsPlanner[k];});
      _opsBase=_opsSnap(map.opsPlanner); // what the server had, before any load-time tidy-ups
    }
    if(Array.isArray(map.opsBrk)){
      map.opsBrk.forEach(function(b){_opsBrk.push(b);});
    }
    if(Array.isArray(map.jobs)){
      map.jobs.forEach(function(j){jobs.push(j);});
    }
    if(Array.isArray(map.bank_holidays)){
      window._opsHolidays=map.bank_holidays.slice();
    }
    if(Array.isArray(map.ml_tech_managers)){
      window._opsTMCustom=map.ml_tech_managers.slice();
    }
    if(Array.isArray(map.ops_seeded))map.ops_seeded.forEach(function(id){_opsSeeded.add(id);});
    if(Array.isArray(map.crew_list)){
      window._opsCrewList=map.crew_list.slice();
    }
    if(Array.isArray(map.shopon_engineers)){
      window._opsSOEng=map.shopon_engineers.slice();
    }
    // Now seed studios from jobs (uses og/os — will trigger saves, so we suspend them)
    var _origSave=saveData;saveData=function(){};
    try{_mlFixJobsInMemory();}catch(e){console.warn('ML mem-fix err',e);}
    try{opsSeedFromJobs();}catch(e){console.warn('seed err',e);}
    try{_opsCleanStaleStudioEntries();}catch(e){console.warn('cleanup err',e);}
    try{_opsDedupeStudioCells();}catch(e){console.warn('dedupe err',e);}
    var _seedChanged=false;
    try{_seedChanged=_opsCleanSeedJunk();}catch(e){console.warn('seed-junk cleanup err',e);}
    try{_seedChanged=_opsReconcileMLStaff()||_seedChanged;}catch(e){console.warn('ML reconcile err',e);}
    try{_seedChanged=_opsReconcileMLG()||_seedChanged;}catch(e){console.warn('MLG reconcile err',e);}
    saveData=_origSave;
    // Persist seed-junk cleanup to Supabase so it sticks across reloads
    if(_seedChanged){try{saveData();}catch(e){console.warn('seed-junk save err',e);}}
    // Force a save with the cleaned-up state
    saveData();
    setStatus('','Synced');
  }catch(e){
    console.error('Bootstrap failed:',e);
    setStatus('err','Offline');
    toast('Could not connect to Supabase');
  }
  // Render initial view
  _rdLoadHid();
  _rdApplyDensity(_rdDensity());
  setPlanView('month');
  _rdRenderStuPanel();

  _nsHistOn=true;_nsHistLoad();
}

  try{if(window.crypto&&crypto.subtle){
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
  }}catch(e){}
  var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return 'f'+h.toString(16);
}
async function _nsSavePin(row,h){

    if(r.ok){var rows=await r.json();if(rows&&rows[0]&&rows[0].value&&typeof rows[0].value==='object'&&!Array.isArray(rows[0].value))latest=rows[0].value;}
    var merged=Object.assign({},_nsPins,latest);merged[row]={h:h,at:Date.now()};_nsPins=merged;
    var w=await fetch(_SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',headers:_sbHeaders(),body:JSON.stringify({key:_k('team_pins'),value:merged,updated_at:new Date().toISOString()})});

}

async function _nsPinDone(){
  var st=_nsPinSt,pin=st.buf,i,t;
  try{
    if(st.stage==='enter'){
      await _nsLoadPins();
      for(i=0;i<NS_TEAM.length;i++){t=NS_TEAM[i];if(_nsPins[t.row]&&_nsPins[t.row].h===await _nsPinHash(t.row,pin))return _nsSignIn(t.row);}
      if(pin===NS_LOCK_CODE){_nsPinSt={stage:'who',buf:'',who:null,first:'',busy:false};return _nsRenderPin();}
      return _nsPinFail("That PIN isn't right");
    }
    if(st.stage==='new'){
      if(pin===NS_LOCK_CODE)return _nsPinFail('Pick a different PIN');
      for(i=0;i<NS_TEAM.length;i++){t=NS_TEAM[i];if(t.row!==st.who&&_nsPins[t.row]&&_nsPins[t.row].h===await _nsPinHash(t.row,pin))return _nsPinFail('Pick a different PIN');}
      _nsPinSt={stage:'confirm',buf:'',who:st.who,first:pin,busy:false};return _nsRenderPin();
    }
    if(st.stage==='confirm'){
      if(pin!==st.first){_nsPinSt={stage:'new',buf:'',who:st.who,first:'',busy:false};_nsRenderPin();return _nsPinFail("Those didn't match, try again");}
      var ok=await _nsSavePin(st.who,await _nsPinHash(st.who,pin));
      return _nsSignIn(st.who,ok?null:"Signed in, but your PIN couldn't be saved");
    }
  }catch(e){console.warn('sign-in error',e);_nsPinFail('Something went wrong, try again');}
}

// in their own record per month (ops_hist_<person>_<yyyy-mm>) so saves never collide.
var _nsHist={},_nsHistDirty={},_nsHistPrev={},_nsHistTimer=null,_nsHistSaving=false,_nsHistOn=false,_nsLastInput=0;

function _nsHistEntries(v){
  return (Array.isArray(v)?v:[]).map(function(x){
    if(typeof x==='string')return {t:x,n:'',c:[],ct:{},s:1,col:''};
    if(!x)return null;
    var ct={};(x.crew||[]).forEach(function(c){ct[c.name]=JSON.stringify(c.times||{});});
    return {t:_opsTextOf(x)||'',n:x.note||'',c:(x.crew||[]).map(function(c){return c.name;}),ct:ct,s:x.span||1,col:x.color||''};
  }).filter(function(x){return x&&x.t;});
}
function _nsHistDiff(a,b){
  var A=_nsHistEntries(a),B=_nsHistEntries(b),parts=[],q=function(t){return '\u201c'+t+'\u201d';};
  var at=A.map(function(e){return e.t;}),bt=B.map(function(e){return e.t;});
  var added=B.filter(function(e){return at.indexOf(e.t)<0;}),removed=A.filter(function(e){return bt.indexOf(e.t)<0;});
  if(added.length===1&&removed.length===1)parts.push('Changed '+q(removed[0].t)+' to '+q(added[0].t));
  else{added.forEach(function(e){parts.push('Added '+q(e.t));});removed.forEach(function(e){parts.push('Removed '+q(e.t));});}
  B.forEach(function(e){
    var o=A.find(function(x){return x.t===e.t;});if(!o)return;
    if(o.n!==e.n)parts.push(e.n?(o.n?'Edited the note on ':'Added a note to ')+q(e.t):'Removed the note from '+q(e.t));
    var ca=e.c.filter(function(n){return o.c.indexOf(n)<0;}),cr=o.c.filter(function(n){return e.c.indexOf(n)<0;});
    if(ca.length)parts.push('Booked '+ca.join(', ')+' on '+q(e.t));
    if(cr.length)parts.push('Took '+cr.join(', ')+' off '+q(e.t));
    var tc=e.c.filter(function(n){return o.ct[n]!=null&&o.ct[n]!==e.ct[n];});
    if(tc.length)parts.push('Changed times for '+tc.join(', ')+' on '+q(e.t));
    if(o.s!==e.s)parts.push(q(e.t)+' now '+e.s+' day'+(e.s===1?'':'s'));
    if(o.col!==e.col)parts.push('Changed the colour of '+q(e.t));
  });

}
function _nsHistRecord(key,before,after){
  if(!_nsHistOn)return;
  var me=_nsMe();if(!me)return;
  if(Date.now()-_nsLastInput>8000)return; // only changes someone made, not background tidy-ups
  var now=Date.now(),hit=null;
  Object.keys(_nsHistPrev).forEach(function(id){
    var it=_nsHist[id];
    if(!it||now-it.t>60000){delete _nsHistPrev[id];return;}
    if(it.by===me&&it.k===key)hit=it;
  });
  if(hit){hit.w=_nsHistDiff(_nsHistPrev[hit.id],after);hit.t=now;_nsHistDirty[hit.id]=1;}
  else{
    var w=_nsHistDiff(before,after);if(!w)return;
    var id=me+'-'+now.toString(36)+'-'+Math.random().toString(36).slice(2,6);
    _nsHist[id]={id:id,at:now,t:now,by:me,k:key,w:w};
    _nsHistPrev[id]=before==null?null:JSON.parse(JSON.stringify(before));
    _nsHistDirty[id]=1;
  }
  clearTimeout(_nsHistTimer);_nsHistTimer=setTimeout(_nsHistSave,2500);
}
function _nsHistMonth(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

async function _nsHistSave(){
  if(_nsHistSaving){clearTimeout(_nsHistTimer);_nsHistTimer=setTimeout(_nsHistSave,1500);return;}
  var ids=Object.keys(_nsHistDirty);if(!ids.length)return;
  _nsHistSaving=true;_nsHistDirty={};
  var groups={};
  ids.forEach(function(id){var it=_nsHist[id];if(!it)return;var key=_nsHistKey(it.by,_nsHistMonth(it.at));(groups[key]=groups[key]||[]).push(it);});
  try{
    for(var key in groups){
      var latest=[];
      var r=await fetch(_SB_URL+'/rest/v1/app_data?select=value&key=eq.'+key,{headers:_sbGet()});
      if(!r.ok)throw new Error('HTTP '+r.status);
      var rows=await r.json();if(rows&&rows[0]&&Array.isArray(rows[0].value))latest=rows[0].value;
      var by={};
      latest.concat(groups[key]).forEach(function(it){if(it&&it.id&&(!by[it.id]||(it.t||0)>=(by[it.id].t||0)))by[it.id]=it;});
      var list=Object.keys(by).map(function(x){return by[x];}).sort(function(a,b){return a.at-b.at;});
      if(list.length>3000)list=list.slice(-3000);
      var w=await fetch(_SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',headers:_sbHeaders(),body:JSON.stringify({key:key,value:list,updated_at:new Date().toISOString()})});
      if(!w.ok)throw new Error('HTTP '+w.status);
    }
  }catch(e){
    console.warn('history save failed',e);

    clearTimeout(_nsHistTimer);_nsHistTimer=setTimeout(_nsHistSave,15000);
  }finally{_nsHistSaving=false;}

async function _nsHistLoad(){

function _nsCrewJobs(){
  var jobs={};
  Object.keys(_opsD).forEach(function(k){
    var p=k.split('|');if(p.length!==3||p[2].indexOf('st_')!==0||!Array.isArray(_opsD[k]))return;
    var month=p[0],d0=+p[1],px=OPS_MPX[month],m=OPS_CAL.find(function(x){return x.month===month;});
    if(!px||!m)return;
    var last=m.days[m.days.length-1].day;
    _opsD[k].forEach(function(v){
      if(!v||typeof v!=='object'||!v.crew||!v.crew.length)return;
      var text=_opsTextOf(v),key=_nsShowKey(text.toLowerCase())||text.toLowerCase(),span=v.span>1?v.span:1;
      var j=jobs[key]=jobs[key]||{key:key,name:_nsShowName(text)||text,people:{},days:{},studios:{},first:'9999',last:''};
      for(var off=0;off<span&&d0+off<=last;off++){
        var iso=px+'-'+String(d0+off).padStart(2,'0');
        j.days[iso]=1;j.studios[_rdRowName(p[2])]=1;
        if(iso<j.first)j.first=iso;if(iso>j.last)j.last=iso;
        v.crew.forEach(function(c){
          var pk=c.name.toLowerCase(),t=(c.times&&c.times[off])||{},mins=_nsMins(t.s,t.e);
          var pp=j.people[pk]=j.people[pk]||{name:c.name,role:c.role||'',type:_nsCrewType(c),recs:[]};
          pp.recs.push({iso:iso,text:text,studio:_rdRowName(p[2]),role:c.role||'',s:t.s||'',e:t.e||'',m:mins});
        });
      }
    });
  });
  return Object.keys(jobs).map(function(k){
    var j=jobs[k];
    j.list=Object.keys(j.people).map(function(pk){
      var pp=j.people[pk];
      pp.recs.sort(function(a,b){return a.iso<b.iso?-1:a.iso>b.iso?1:0;});
      pp.days=Object.keys(pp.recs.reduce(function(o,r){o[r.iso]=1;return o;},{})).length;
      pp.mins=pp.recs.reduce(function(a,r){return a+(r.m||0);},0);
      return pp;
    }).sort(function(a,b){

  }).sort(function(a,b){return a.first<b.first?1:a.first>b.first?-1:0;});
}

function _nsRenderTimes(){
  var body=document.getElementById('nsTimesBody');if(!body)return;
  var cut=new Date(OPS_TODAY+'T00:00:00Z');cut.setUTCDate(cut.getUTCDate()-45);var cutIso=_mlIso(cut);
  _nsTmJobs=_nsCrewJobs().filter(function(j){return _nsTmRange==='all'||j.last>=cutIso;});
  if(!_nsTmJobs.length){body.innerHTML='<p class="ml-empty ns-cm-empty">'+(_nsTmRange==='all'?'No crew booked yet.':'No crew booked on recent jobs. Choose All to see older jobs.')+'</p>';return;}
  var ex=function(ji,pi,label){return '<button type="button" class="ns-tm-ex" aria-label="'+_rdEsc(label)+'" title="'+_rdEsc(label)+'" onclick="event.stopPropagation();opsTmMenu(this,'+ji+','+pi+')">'+NS_EXPORT+'</button>';};
  var h='';
  _nsTmJobs.forEach(function(j,ji){
    var tmp=document.createElement('div');tmp.className='ops-chip '+opsChip(j.name);
    h+='<section class="ns-tj"><div class="ns-tj-head"><i class="ns-cr-dot" style="background:'+(_nsPastel(j.name,tmp)||'#cfcdc7')+'"></i>'
      +'<span class="ns-tj-name"><b>'+_rdEsc(j.name)+'</b><small>'+_rdEsc(_nsTmDates(j.first,j.last)+' · '+Object.keys(j.studios).join(', '))+'</small></span>'
      +'<span class="ns-tj-sum">'+j.list.length+' '+(j.list.length===1?'person':'people')+(j.mins?' · <b>'+_nsHrs(j.mins)+'</b>':'')+'</span>'+ex(ji,-1,'Export '+j.name)+'</div>';
    j.list.forEach(function(p,pi){
      h+='<div class="ns-tp">'+_nsCrewDot(p.type)+'<span class="ns-tp-name"><b>'+_rdEsc(p.name)+'</b>'+(p.role?'<small>'+_rdEsc(p.role)+'</small>':'')+'</span>'
        +'<span class="ns-tp-days">'+p.days+' day'+(p.days===1?'':'s')+'</span><span class="ns-tp-hrs">'+(p.mins?_nsHrs(p.mins):'')+'</span>'+ex(ji,pi,'Export '+p.name+' on '+j.name)+'</div>';
    });
    h+='</section>';
  });
  body.innerHTML=h;
}
// Small menu under an export button: Copy text / Download CSV
function _nsTmMenuClose(){var m=document.getElementById('nsTmMenu');if(m)m.remove();}
function opsTmMenu(btn,ji,pi){
  var open=document.getElementById('nsTmMenu');_nsTmMenuClose();
  if(open&&open.dataset.for===ji+'_'+pi)return;
  var m=document.createElement('div');m.id='nsTmMenu';m.className='ns-tm-menu';m.dataset.for=ji+'_'+pi;m.setAttribute('role','menu');
  m.innerHTML='<button type="button" role="menuitem" onclick="opsTmExport('+ji+','+pi+',\'copy\')">Copy text</button><button type="button" role="menuitem" onclick="opsTmExport('+ji+','+pi+',\'csv\')">Download CSV</button>';
  document.body.appendChild(m);
  var r=btn.getBoundingClientRect();
  m.style.top=Math.min(r.bottom+4,window.innerHeight-m.offsetHeight-8)+'px';
  m.style.left=Math.max(8,r.right-m.offsetWidth)+'px';
  m.querySelector('button').focus();
}
document.addEventListener('click',function(e){var m=document.getElementById('nsTmMenu');if(m&&!m.contains(e.target)&&!(e.target.closest&&e.target.closest('.ns-tm-ex')))_nsTmMenuClose();},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('nsTmMenu')){e.stopImmediatePropagation();_nsTmMenuClose();}},true);
function opsTmExport(ji,pi,how){
  _nsTmMenuClose();
  var j=_nsTmJobs[ji];if(!j)return;
  var people=pi>=0?[j.list[pi]]:j.list;if(!people[0])return;
  var dshort=function(iso){return _mlUtc(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});};
  var tstr=function(r){return (r.s||r.e)?(r.s||'?')+'–'+(r.e||'?')+(r.m!=null?' ('+_nsHrs(r.m)+')':''):'no times';};
  var title=pi>=0?people[0].name+' — '+j.name:j.name+' — crew hours';
  var dates=_mlUtc(j.first).toLocaleDateString('en-GB',{day:'numeric',month:'long',timeZone:'UTC'})+(j.first!==j.last?' – '+_mlUtc(j.last).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):' '+j.first.slice(0,4));
  var slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(how==='copy'){
    var out=title+'\n'+dates+'\n';
    if(pi>=0){
      var p=people[0];
      out+=[p.role,_nsCrewTypeName(p.type)].filter(Boolean).join(' · ')+'\n';
      out+='Days: '+p.days+(p.mins?' · Hours: '+_nsHrs(p.mins):'')+'\n\n';
      p.recs.forEach(function(r){out+=dshort(r.iso)+': '+tstr(r)+' — '+r.text+', '+r.studio+'\n';});
    }else{
      out+=people.length+' '+(people.length===1?'person':'people')+(j.mins?' · Hours: '+_nsHrs(j.mins):'')+'\n';
      people.forEach(function(p){
        out+='\n'+p.name+(p.role?' ('+p.role+')':'')+': '+p.days+' day'+(p.days===1?'':'s')+(p.mins?', '+_nsHrs(p.mins):'')+'\n';
        p.recs.forEach(function(r){out+='  '+dshort(r.iso)+': '+tstr(r)+'\n';});
      });
    }
    out=out.replace(/\s+$/,'');
    var done=function(ok){toast(ok?'Copied':'Copy failed');};
    var legacy=function(){var ta=document.createElement('textarea');ta.value=out;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();done(ok);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(out).then(function(){done(true);},legacy);else legacy();
    return;
  }
  var q=function(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  var lines=['Name,Role,Section,Date,Day,Entry,Studio,Start,Finish,Hours'];
  people.forEach(function(p){p.recs.forEach(function(r){
    lines.push([p.name,r.role,_nsCrewTypeName(p.type),r.iso,_mlUtc(r.iso).toLocaleDateString('en-GB',{weekday:'long',timeZone:'UTC'}),r.text,r.studio,r.s,r.e,r.m!=null?_nsHrsDec(r.m):''].map(q).join(','));
  });});
  lines.push('');lines.push('Name,Days,Hours');
  people.forEach(function(p){lines.push([p.name,p.days,p.mins?_nsHrsDec(p.mins):''].map(q).join(','));});
  if(pi<0)lines.push(['Total','',j.mins?_nsHrsDec(j.mins):''].map(q).join(','));
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Downloaded');
}
document.addEventListener('click',function(e){var el=document.getElementById('nsTimes');if(el&&!el.hidden&&e.target===el)opsCloseTimes();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')opsCloseTimes();});



// Month header bar (b105): lifted out of the month's sideways-scrolling table so it cannot
// move with the columns. Safari ignores sticky inside the zoomed calendar, and nudging it on
// every scroll made it jitter and lag, so the bar is now its own strip above the table.
var _nsBarObs=null;
function _nsBarShow(sec){
  var bar=sec.previousElementSibling;
  if(bar&&bar.classList.contains('ns-mbar'))bar.style.display=(sec.style.display==='none')?'none':'';
}
function _nsExtractBars(){
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec){
    var mh=sec.querySelector('table .ns-mh');
    if(mh){
      var prev=sec.previousElementSibling;
      if(prev&&prev.classList.contains('ns-mbar'))prev.remove();
      var bar=document.createElement('div');bar.className='ns-mbar';
      bar.appendChild(mh);
      sec.parentNode.insertBefore(bar,sec);
      sec.classList.add('ns-has-bar');
    }
    _nsBarShow(sec);
  });
  // a month can be hidden from several places (past months, week/year views) — follow it
  if(!_nsBarObs&&window.MutationObserver){
    _nsBarObs=new MutationObserver(function(ms){ms.forEach(function(m){if(m.target.classList&&m.target.classList.contains('ops-ms2'))_nsBarShow(m.target);});});
    document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec){_nsBarObs.observe(sec,{attributes:true,attributeFilter:['style']});});
  }
}
function _nsFloatHeadQueue(){setTimeout(_nsExtractBars,0);}
window.addEventListener('resize',_nsFloatHeadQueue);

// Near-live sync (b80): every 2s ask only for the last-saved time (tiny request) and
// download the planner only when someone else has saved. Also checks when the tab
// becomes visible again and when an edit popup closes.
var _opsPolling=false;
async function _opsPollOnce(){
  if(!window._opsBooted||_opsPolling||_opsSaving||_opsEd||document.hidden)return;
  _opsPolling=true;
  try{
    var r=await fetch(_SB_URL+'/rest/v1/app_data?select=updated_at&key=eq.'+_k('opsPlanner'),{headers:_sbGet()});
    if(!r.ok)return;
    var rows=await r.json(),stamp=rows&&rows[0]&&Date.parse(rows[0].updated_at);
    if(!stamp||stamp===_opsStamp)return;
    var fresh=await _opsFetchPlanner();
    if(_opsEd||_opsSaving)return; // try again next tick
    var local=_opsChangedKeys();
    var changed=_opsAdoptServer(fresh,local);
    var base=_opsSnap(fresh);
    local.forEach(function(k){if(_opsBase&&_opsBase.hasOwnProperty(k))base[k]=_opsBase[k];else delete base[k];});
    _opsBase=base;_opsStamp=stamp;
    if(changed)opsReRender();
  }catch(e){}
  finally{_opsPolling=false;}
}
setInterval(_opsPollOnce,2000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)_opsPollOnce();});
window.addEventListener('focus',_opsPollOnce);
</script>
