*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Roboto SemiBold','Roboto',-apple-system,system-ui,sans-serif;
  --cond:'Barlow Condensed',Impact,sans-serif;
  --cream:#efede3;
  --charcoal:#302f2c;
  --marigold:#F4A258;
  --white:#fff;
  --pure:#fff;
  --dark:#1a1a1c;
  --near-black:#0d0d0f;
  --border:rgba(216,90,97,.2);
  --muted:rgba(48,47,44,.5);
  --subtle:rgba(48,47,44,.7);
  --accent:#d85a61;
}
html,body{height:100%;background:#efede3;color:#302f2c;font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px}
body{margin:0;padding:0;min-height:100vh}

/* Top hero — wordmark logo + Ops Planner title, sits at top of page and scrolls naturally */
.sa-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 16px;background:transparent;flex-shrink:0;text-align:center}
.sa-logo-svg{height:38px;width:auto;color:#302f2c;flex-shrink:0}
.sa-title{font-family:var(--cond);font-size:32px;font-weight:900;color:#302f2c;letter-spacing:.10em;text-transform:uppercase;line-height:1}
.onav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Month header — restore the original Barlow Condensed look (MAY) +
   Barlow Regular for the year span (2026) which inherits font-family.
   Override the crushed negative letter-spacing for legibility. */
.ops-tbl tr.ops-mhdr > td{font-family:'Barlow',-apple-system,system-ui,sans-serif}
.ops-mhdr-txt{font-family:'Barlow Condensed',Impact,sans-serif !important;letter-spacing:0.03em !important}

/* Sticky left column — row labels stay visible when scrolling horizontally.
   Forced opaque cream so cells scrolling underneath don't bleed through.
   Red separator uses inset box-shadow (not border-right) because the table
   has border-collapse:collapse which would attach the border to the seam
   between sticky and non-sticky cells and make it drift. inset puts the
   red strip INSIDE the sticky cell, fixed to its right edge. */
.ops-tbl td.ops-rlbl{position:sticky !important;left:0 !important;background:#efede3 !important;z-index:2 !important;border-right:none !important;box-shadow:inset -1px 0 0 0 rgba(216,90,97,.25), 4px 0 8px -2px rgba(0,0,0,.06) !important}
/* Month/year header — pin its content to the left edge while the cell scrolls.
   Add left padding so the MAY text has breathing room from the cell edge. */
.ops-tbl tr.ops-mhdr > td{position:sticky;left:0;z-index:3}
.ops-tbl tr.ops-mhdr > td > div{position:sticky;left:0;width:calc(100vw - 52px);padding-left:24px;justify-content:flex-start}
/* Day header row's leftmost (empty) cell — sticky at BOTH top and left so it
   stays in the top-left corner no matter how you scroll. Same inset red strip. */
.ops-tbl tr.ops-dhdr > td:first-child{position:sticky !important;left:0 !important;top:0 !important;z-index:12 !important;background:#efede3 !important;border-right:none !important;box-shadow:inset -1px 0 0 0 rgba(216,90,97,.25), 4px 0 8px -2px rgba(0,0,0,.06) !important}
/* Section rows (ops-srow) and gap rows span all columns — sticky their first cell */
.ops-tbl tr.ops-srow > td,.ops-tbl tr.ops-gap > td,.ops-tbl tr.ops-bigbreak > td{position:sticky;left:0;z-index:1}

var jobs=[];

// ── HELPERS INLINED FROM MAIN APP ────────────────────────────────────────────
// Prefix a label with the job name ("ShopOn TX 30"). Avoids double-prefixing
// if the user typed the job name into the label themselves. For Morning Live,
// strips the redundant "ML" abbreviation.
function _jdJobPrefixedLabel(j, rawLabel){
  if(!j||!j.name)return (rawLabel||'').toString();
  var base=((rawLabel==null?'':rawLabel)+'').trim();
  if(!base)return j.name;
  if(j.name==='Morning Live'){
    base=base.replace(/^ML\s+/i,'');
    // Strip "ML" between "Morning Live" and the rest, preserving the separator
    // (handles em-dash, en-dash, hyphen, or just whitespace).
    base=base.replace(/^(Morning Live)([\s\u2014\u2013-]+)ML\s+/i,'$1$2');
  }
  if(!base)return j.name;
  if(base.toLowerCase().indexOf(j.name.toLowerCase())===0)return base;
  return j.name+' '+base;
}
// Stub of opsSeedFromJobs (the standalone reads from Supabase's saved opsPlanner,
// so we only need the cleanup pass — full seed runs in the main app).
// A job is treated as inactive for planner seeding if it's flag-archived,
// status-archived, or cancelled — the app has both archive mechanisms.
function _opsJobArchived(j){return !!(j&&(j.archived===true||/^(archived|cancelled|finished|complete|completed)$/i.test(String(j.status||'').trim())));}
function opsSeedFromJobs(){
  jobs.forEach(function(j){
    if(!j||_opsJobArchived(j)||!j.txDates||!j.studio)return;
    var stuKeys=j.studios?j.studios:[j.loc==='London'?'London S1':j.studio];
    j.txDates.forEach(function(td,di){
      var val=td.date;if(!val)return;
      var ds=val.split('-');if(ds.length!==3)return;
      var yr=parseInt(ds[0]),mo=parseInt(ds[1]),day=parseInt(ds[2]);
      for(var mi=0;mi<OPS_CAL.length;mi++){
        var px=OPS_MPX[OPS_CAL[mi].month];if(!px)continue;
        var parts=px.split('-').map(Number);
        if(parts[0]===yr&&parts[1]===mo){
          var rawLabel=(td.label||('RX '+(di+1)));
          var label=_jdJobPrefixedLabel(j, rawLabel);
          stuKeys.forEach(function(sk){
            var row='st_'+sk;
            var cur=og(OPS_CAL[mi].month,day,row).slice();
            var changed=false;
            if(rawLabel!==label){
              var rawIdx=cur.indexOf(rawLabel);
              if(rawIdx>=0){cur.splice(rawIdx,1);changed=true;}
              var oldAuto=j.name+' RX '+(di+1);
              if(oldAuto!==label){
                var oai=cur.indexOf(oldAuto);
                if(oai>=0){cur.splice(oai,1);changed=true;}
              }
              // Old fully-prefixed form (before ML-strip)
              var oldFullPrefix=j.name+' '+rawLabel;
              if(oldFullPrefix!==label){
                var ofpi=cur.indexOf(oldFullPrefix);
                if(ofpi>=0){cur.splice(ofpi,1);changed=true;}
              }
            }
            if(!cur.includes(label)){cur.push(label);changed=true;}
            if(changed)os(OPS_CAL[mi].month,day,row,cur);
            if(typeof _opsStu!=='undefined'&&!_opsStu.has(sk))_opsStu.add(sk);
          });
          break;
        }
      }
    });
  });
  // Also seed rig / rehearsal / derig / custom dates (same pattern, add-if-missing)
  jobs.forEach(function(j){
    if(!j||!j.name||_opsJobArchived(j))return;
    var stuKeys=(j.studios?j.studios:[(j.loc==='London'?'London S1':j.studio)]).filter(function(sk){return !!sk;});
    if(!stuKeys.length)return;
    var extras=[];
    (j.rigDates||[]).forEach(function(r){if(r&&r.date)extras.push({date:r.date,label:r.note||'Rig Day'});});
    (Array.isArray(j.drigDates)?j.drigDates:[]).forEach(function(d){
      var di=(typeof d==='string')?d:(d&&d.date);
      var dl=(typeof d==='object'&&d&&d.label)||'Derig';
      if(di)extras.push({date:di,label:dl});
    });
    (j.rehDates||[]).forEach(function(r){if(r&&r.date)extras.push({date:r.date,label:r.label||r.note||'Rehearsal'});});
    (j.scheduleCustom||[]).forEach(function(c){if(c&&c.date)extras.push({date:c.date,label:c.label||'Event'});});
    extras.forEach(function(e){
      var ds=e.date.split('-');if(ds.length!==3)return;
      var yr=parseInt(ds[0]),mo=parseInt(ds[1]),day=parseInt(ds[2]);
      for(var mi=0;mi<OPS_CAL.length;mi++){
        var px=OPS_MPX[OPS_CAL[mi].month];if(!px)continue;
        var parts=px.split('-').map(Number);
        if(parts[0]!==yr||parts[1]!==mo)continue;
        var label=_jdJobPrefixedLabel(j, e.label);
        stuKeys.forEach(function(sk){
          var row='st_'+sk;
          var cur=og(OPS_CAL[mi].month,day,row).slice();
          if(!cur.includes(label)){cur.push(label);os(OPS_CAL[mi].month,day,row,cur);}
          if(typeof _opsStu!=='undefined'&&!_opsStu.has(sk))_opsStu.add(sk);
        });
        break;
      }
    });
  });

  // Personal calendars: any job a person is crewed on lands on their row for
  // every scheduled date. Names match exactly (full name or bare first name).
  var PERSONAL_ROWS=[
    {row:'andrew',names:['andrew rowell','andrew']},
    {row:'ian',names:['ian curry','ian']},
    {row:'chris',names:['chris warden','chris']}

          var valsI=_opsD[m.month+'|'+dayI+'|'+row]||[];
          if(valsI.length!==1){i++;continue;}
          var v0=valsI[0];
          if(v0&&typeof v0==='object'&&v0.span&&v0.span>1){i+=v0.span;continue;}
          var textI=(typeof v0==='string')?v0:(v0&&v0.text?v0.text:'');
          if(!textI){i++;continue;}
          var j=i+1;
          while(j<m.days.length){
            var dayJ=m.days[j].day;
            var valsJ=_opsD[m.month+'|'+dayJ+'|'+row]||[];
            if(valsJ.length!==1)break;
            var vJ=valsJ[0];
            if(vJ&&typeof vJ==='object'&&vJ.span&&vJ.span>1)break;
            var textJ=(typeof vJ==='string')?vJ:(vJ&&vJ.text?vJ.text:'');
            if(textJ!==textI)break;
            j++;
          }
          var len=j-i;
          if(len>1){
            var spanEntry={text:textI,span:len};
            if(v0&&typeof v0==='object'){
              if(v0.cls)spanEntry.cls=v0.cls;
              if(v0.color)spanEntry.color=v0.color;
            }
            _opsD[m.month+'|'+dayI+'|'+row]=[spanEntry];
            for(var kk=i+1;kk<j;kk++){
              _opsD[m.month+'|'+m.days[kk].day+'|'+row]=[];
            }
            changed=true;
          }
          i=j;
        }
      });
    });
  }catch(e){}
  // Strip corrupt/dead entries:
  //   - Object span entries with no/empty text  (the "phantom merge" bug)
  //   - null/undefined entries
  //   - empty or whitespace-only string entries
  //   - Span attribute on entries where absorbed cells aren't empty (inconsistent state)
  try{
    Object.keys(_opsD).forEach(function(k){
      var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
      var cleaned=arr.map(function(v){
        if(v==null)return null;
        if(typeof v==='string')return v.trim()?v:null;
        if(typeof v==='object'){
          var t=(typeof v.text==='string')?v.text.trim():'';
          if(v.span&&v.span>1&&!t)return null; // corrupt span with no text → drop
          if(!t&&!v.person&&!v.cls&&!v.color)return null; // empty object → drop
          return v;
        }
        return v;
      }).filter(function(v){return v!==null;});
      if(cleaned.length!==arr.length){_opsD[k]=cleaned;changed=true;}
    });
    // Validate span entries: if cell at L has {text, span:N}, cells L+1..L+N-1
    // MUST be empty. If they have content, the span is inconsistent — strip the span.
    OPS_CAL.forEach(function(m){
      Object.keys(_opsD).forEach(function(k){
        var p=k.split('|');if(p.length!==3||p[0]!==m.month)return;
        var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
        var d=parseInt(p[1]),row=p[2];
        var dayIdx=m.days.findIndex(function(x){return x.day===d;});
        if(dayIdx<0)return;
        arr.forEach(function(v,i){
          if(!v||typeof v!=='object'||!v.span||v.span<=1)return;
          var bad=false;
          for(var off=1;off<v.span;off++){
            if(dayIdx+off>=m.days.length){bad=true;break;}
            var nd=m.days[dayIdx+off].day;
            var nv=_opsD[m.month+'|'+nd+'|'+row];
            if(Array.isArray(nv)&&nv.length){bad=true;break;}
          }
          if(bad){
            var copy=Object.assign({},v);delete copy.span;
            var ks=Object.keys(copy);
            arr[i]=(ks.length===1&&ks[0]==='text')?copy.text:copy;
            changed=true;
          }
        });
      });
    });
  }catch(e){}
  return changed;
}
// Aggressive cleanup: remove studio-row labels that match job-sync patterns
// (prefixed OR legacy auto-labels) and no longer correspond to a current job.
function _opsCleanStaleStudioEntries(){
  // ShopOn preference: one entry per day, never a long span bar — expand any
  // ShopOn span objects into daily plain entries (across month boundaries).
  var _mnByPx={};Object.keys(OPS_MPX).forEach(function(mn){_mnByPx[OPS_MPX[mn]]=mn;});
  var _isoAdd=function(iso,n){var p=iso.split('-').map(Number);var dt=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return dt.toISOString().split('T')[0];};
  Object.keys(_opsD).slice().forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3||parts[2].indexOf('st_')!==0)return;
    var arr=_opsD[k];if(!Array.isArray(arr))return;
    var spans=arr.filter(function(v){return v&&typeof v==='object'&&v.span>1&&/shop\s*_?on/i.test(v.text||'');});
    if(!spans.length)return;
    _opsD[k]=arr.filter(function(v){return spans.indexOf(v)===-1;});
    spans.forEach(function(sp){
      var px=OPS_MPX[parts[0]];if(!px)return;
      var startIso=px+'-'+String(parts[1]).padStart(2,'0');
      for(var n=0;n<sp.span;n++){
        var iso=_isoAdd(startIso,n);
        var mn=_mnByPx[iso.slice(0,7)];if(!mn)continue;
        var day=parseInt(iso.slice(8,10),10);
        var cur=og(mn,day,parts[2]).slice();
        if(cur.indexOf(sp.text)===-1){cur.push(sp.text);os(mn,day,parts[2],cur);}
      }
    });
  });
  // Remap strays: early seeds wrote London jobs to 'st_London', but the visible
  // row key is 'st_London S1' — merge anything saved under the old key across.
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3||parts[2]!=='st_London')return;
    var dest=parts[0]+'|'+parts[1]+'|st_London S1';
    var cur=Array.isArray(_opsD[dest])?_opsD[dest].slice():[];
    (Array.isArray(_opsD[k])?_opsD[k]:[]).forEach(function(v){if(cur.indexOf(v)===-1)cur.push(v);});
    _opsD[dest]=cur;
    delete _opsD[k];
  });
  if(!Array.isArray(jobs)||!jobs.length)return;
  var jobNames=jobs.map(function(j){return (j&&j.name)?j.name.toLowerCase().trim():'';}).filter(Boolean);
  if(!jobNames.length)return;
  var validKeys={};
  function _addEntry(j, stuKeys, date, rawLabel){
    if(!date||!rawLabel)return;
    var ds=date.split('-');if(ds.length!==3)return;
    var yr=parseInt(ds[0]),mo=parseInt(ds[1]),day=parseInt(ds[2]);
    var monthName=null;
    Object.keys(OPS_MPX).forEach(function(mn){
      var p=OPS_MPX[mn].split('-').map(Number);
      if(p[0]===yr&&p[1]===mo)monthName=mn;
    });
    if(!monthName)return;
    // Only the prefixed form validates — raw forms are considered stale legacy
    var labelPrefixed=_jdJobPrefixedLabel(j, rawLabel);
    stuKeys.forEach(function(sk){
      if(!sk)return;
      validKeys[monthName+'|'+day+'|st_'+sk+'|'+labelPrefixed]=true;
    });
  }
  var personalValid={};
  var PR_CLEAN=[
    {row:'andrew',names:['andrew rowell','andrew']},
    {row:'ian',names:['ian curry','ian']},
    {row:'chris',names:['chris warden','chris']}
  ];
  jobs.forEach(function(j){
    if(!j||!j.name)return;
    if(_opsJobArchived(j))return; // inactive jobs validate nothing — their labels get pruned
    var _dts=[];
    (j.txDates||[]).forEach(function(t){if(t&&t.date)_dts.push(t.date);});
    (j.rigDates||[]).forEach(function(r){if(r&&r.date)_dts.push(r.date);});
    (Array.isArray(j.drigDates)?j.drigDates:[]).forEach(function(d){var di=(typeof d==='string')?d:(d&&d.date);if(di)_dts.push(di);});
    (j.rehDates||[]).forEach(function(r){if(r&&r.date)_dts.push(r.date);});
    (j.scheduleCustom||[]).forEach(function(c){if(c&&c.date)_dts.push(c.date);});
    var _crew=Array.isArray(j.crew)?j.crew:[];
    var _isML=/^morning live$/i.test((j.name||'').trim());
    if(!_isML)PR_CLEAN.forEach(function(pr){
      var onJob=_crew.some(function(c){var n=((c&&c.name)||'').toLowerCase().trim();return pr.names.indexOf(n)!==-1;});
      if(!onJob)return;
      _dts.forEach(function(iso){
        var ds=String(iso).split('-');if(ds.length!==3)return;
        var mn=null;Object.keys(OPS_MPX).forEach(function(kk){if(OPS_MPX[kk]===ds[0]+'-'+ds[1])mn=kk;});
        if(mn)personalValid[mn+'|'+parseInt(ds[2])+'|'+pr.row+'|'+j.name.toLowerCase()]=true;
      });
    });
    var stuKeys=j.studios?j.studios:[(j.loc==='London'?'London S1':j.studio)];
    (j.txDates||[]).forEach(function(t,i){
      if(!t)return;
      _addEntry(j,stuKeys,t.date,t.label||'TX');
      _addEntry(j,stuKeys,t.date,'RX '+(i+1));
      _addEntry(j,stuKeys,t.date,'Filming Day');
    });
    (j.rigDates||[]).forEach(function(r){if(r)_addEntry(j,stuKeys,r.date,r.note||'Rig Day');});
    (j.drigDates||[]).forEach(function(d){
      var di=(typeof d==='string')?d:(d&&d.date);
      var dl=(typeof d==='object'&&d&&d.label)||'Derig';
      if(di)_addEntry(j,stuKeys,di,dl);
    });
    (j.rehDates||[]).forEach(function(r){if(r)_addEntry(j,stuKeys,r.date,r.label||r.note||'Rehearsal');});
    (j.scheduleCustom||[]).forEach(function(c){if(c)_addEntry(j,stuKeys,c.date,c.label||'Event');});
  });
  var AUTO_PATTERN=/^(tx(\s*\d+)?|rx[\s-]?\d+|filming\s*day|rig(\s*day)?(\s*\d+)?|de[-\s]?rig|event)$/i;
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3||parts[2].indexOf('st_')!==0)return;
    var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
    var kept=arr.filter(function(lbl){
      // Coloured/custom entries are objects — judge them by their text, same
      // as plain strings, so manual duplicates of seeded labels prune too.
      var txt=(typeof lbl==='string')?lbl:((lbl&&typeof lbl==='object'&&typeof lbl.text==='string')?lbl.text:null);
      if(txt===null)return true;
      var lc=txt.toLowerCase().trim();
      var matchedJobPrefix=jobNames.some(function(jn){return jn&&lc.indexOf(jn)===0;});
      // Old names of since-renamed jobs — labels starting with these are treated
      // as job-derived so stale duplicates prune away
      var LEGACY_PREFIXES=['whisper pilot'];
      var matchedLegacy=LEGACY_PREFIXES.some(function(p){return lc.indexOf(p)===0;});
      var looksJobAuto=AUTO_PATTERN.test(txt.trim());
      if(!matchedJobPrefix&&!matchedLegacy&&!looksJobAuto)return true;
      return !!validKeys[k+'|'+txt];
    });
    if(kept.length!==arr.length)_opsD[k]=kept;
  });
  // Personal rows: prune labels that exactly equal a job name (current or
  // archived) but aren't backed by a crew assignment. Free-text survives.
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3)return;
    if(['andrew','ian','chris'].indexOf(parts[2])===-1)return;
    var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
    var kept=arr.filter(function(lbl){
      var txt=(typeof lbl==='string')?lbl:((lbl&&typeof lbl==='object'&&typeof lbl.text==='string')?lbl.text:null);
      if(txt===null)return true;
      var lc=txt.toLowerCase().trim();
      // Morning Live never belongs on a personal row — the ML TM row covers it
      if(lc==='morning live')return false;
      var isJobName=jobNames.indexOf(lc)!==-1;
      if(!isJobName)return true;
      return !!personalValid[parts[0]+'|'+parts[1]+'|'+parts[2]+'|'+lc];
    });
    if(kept.length!==arr.length)_opsD[k]=kept;
  });
}

// When the Ops Planner ML row changes, mirror the value into the matching
// txDate's crew['Tech Manager'] on the Morning Live job. Keeps the job's
// Schedule tab in sync with whatever's set in the planner.
function _opsSyncMLToJob(month,day,vals){
  if(!Array.isArray(jobs))return;
  var mlJob=jobs.find(function(j){return j&&j.name==='Morning Live';});
  if(!mlJob||!Array.isArray(mlJob.txDates))return;
  var prefix=OPS_MPX[month];if(!prefix)return;
  var iso=prefix+'-'+String(day).padStart(2,'0');
  var td=mlJob.txDates.find(function(t){return t&&t.date===iso;});
  if(!td)return;
  var person=(vals&&vals.length)?vals[0]:'';
  if(person&&typeof person==='object')person=person.person||person.text||'';
  if(typeof person!=='string')return;
  if(person==='Break / Off Air')person='';

// Sync Andrew/Ian rows to match the ML assignment. Strips any stale

// Returns true if anything in _opsD changed.
function _opsSyncMLToStaff(month,day,vals){

      var td=mlJob.txDates.find(function(t){return t&&t.date===iso;});
      if(td&&td.label)episode=td.label;

const _opsBrk=[];const _opsStu=new Set();const _opsHidStu=new Set();
function opsIsWk(dow){const d=(dow||'').toUpperCase();return d==='SATURDAY'||d==='SUNDAY';}
function opsDStr(month,day){return(OPS_MPX[month]||'2026-03')+'-'+String(day).padStart(2,'0');}
function opsMlColor(name){
  if(!name)return'#2d7dd2';
  // Exact full-name match against the known TM colours (e.g. "James Laishley")
  const k=Object.keys(OPS_ML_COLORS).find(k=>name.toLowerCase()===k.toLowerCase());
  if(k)return OPS_ML_COLORS[k];
  // Deterministic colour from name hash for unknown TMs. Use a stronger mix
  // (char-code * position) so e.g. "James Forshaw" and "James Laishley" differ.
  var palette=['#3a8a55','#3a5aaa','#7a4aaa','#1a8a8a','#aa6a2a','#c0524a','#5a8a3a','#aa3a7a','#3a6aaa','#8a5a3a'];
  var sum=0;for(var i=0;i<name.length;i++)sum=(sum*31+name.charCodeAt(i))>>>0;
  return palette[sum%palette.length];
}
// Short display name for ML chips — "James Laishley" → "James L", "James Forshaw" →
// "James F". Falls back to just the single token if there's no surname.
function opsMlShortName(name){
  var parts=String(name||'').trim().split(/\s+/);
  if(parts.length<2)return parts[0]||'';
  return parts[0]+' '+parts[1].charAt(0).toUpperCase();
}
function opsInBrk(ds){return _opsBrk.find(b=>ds>=b.start&&ds<=b.end)||null;}
function opsChip(t){var u=t.toUpperCase();if(/^\[MCR\]/.test(u))return'ops-mcr';if(/^\[LDN\]/.test(u))return'ops-ldn';/* Job-specific colours — match the responsible-staff row's chip styling so a job is visually consistent everywhere it appears. */if(/DRAGON/.test(u))return'ops-andrew';if(/MORNING LIVE|\bML\b/.test(u))return'ops-ian';if(/SHOP.?ON|DRAG.RACE|RUPAUL/.test(u))return'ops-show';if(/RIG|DERIG|REHEAR|CAMERA RIG/.test(u))return'ops-prod';if(/\bRX\s*\d|\bDARK\b/.test(u))return'ops-prod';if(/MEET|RECCE|EVENT/.test(u))return'ops-event';return'ops-note';}
function opsRChips(vals,fc){
  if(!vals.length)return'<div class="ops-mt"></div>';
  return vals.map(function(v){
    // Normalise: handle string OR object {text, cls?, color?, ...}
    var text=(typeof v==='string')?v:(v&&typeof v.text==='string'?v.text:'');
    if(!text)return'';
    // Per-entry color override: v.cls (user's explicit pick) takes priority over
    // fc (row's default color), so picking Pink on an Andrew-row chip actually
    // makes it pink. Fallback chain: v.cls → fc → opsChip auto-detect.
    var cls=(v&&typeof v==='object'&&v.cls)?v.cls:(fc||opsChip(text));
    var style=(v&&typeof v==='object'&&v.color)?' style="background:'+v.color+'"':'';
    return'<div class="ops-chip '+cls+'"'+style+' title="'+text.replace(/"/g,'&quot;')+'">'+text+'</div>';
  }).join('');
}

// ── ONE-TIME SEED LOOP (runs over OPS_CAL) ───────────────────────────────────
OPS_CAL.forEach(m=>{
  m.days.forEach(d=>{
    if(d.ml&&d.ml.length){
      var mlk=m.month+'|'+d.day+'|ml';
      if(!_opsD.hasOwnProperty(mlk)){
        const p=d.ml[0].person||'';
        const matched=OPS_TM.find(t=>t.split(' ')[0].toLowerCase()===p.toLowerCase());
        if(matched)_opsD[mlk]=[matched];
      }
    }
    ['andrew','chris','ian'].forEach(p=>{
      var dk=m.month+'|'+d.day+'|'+p;
      if((d[p]||[]).length&&!_opsD.hasOwnProperty(dk))_opsD[dk]=d[p].slice();
    });
  });
});

// ── RENDERERS ────────────────────────────────────────────────────────────────
function opsMlSpans(month,days){
  const spans=[],cov=new Set();let i=0;
  while(i<days.length){
    const d=days[i];const ds=opsDStr(month,d.day);
    const brk=opsInBrk(ds);
    if(brk){
      let j=i+1;
      while(j<days.length&&opsInBrk(opsDStr(month,days[j].day))===brk)j++;
      const ei=j-1;
      spans.push({si:i,ei,label:brk.name,isBreak:true});
      for(let k=i+1;k<=ei;k++)cov.add(k);
      i=j;continue;
    }
    // Weekends: merge Sat+Sun into one "Break" span when both are plain Break
    // cells. Weekend ML specials (a person assigned) still render individually.
    if(opsIsWk(d.dow)){
      const nd=days[i+1];
      const isBrkVal=vv=>!vv.length||vv[0]==='Break / Off Air';
      if(nd&&opsIsWk(nd.dow)&&!opsInBrk(opsDStr(month,nd.day))
         &&isBrkVal(og(month,d.day,'ml'))&&isBrkVal(og(month,nd.day,'ml'))){
        spans.push({si:i,ei:i+1,label:'Weekend',isBreak:true});
        cov.add(i+1);
        i+=2;continue;
      }
      i++;continue;
    }
    const v=og(month,d.day,'ml');
    if(v.length&&v[0]!=='Break / Off Air'){
      const person=v[0];let j=i+1;let crossedWknd=false;
      while(j<days.length){
        const nd=days[j];
        if(opsInBrk(opsDStr(month,nd.day)))break;
        // Weekend days: track that we've crossed into a new week
        if(opsIsWk(nd.dow)){crossedWknd=true;j++;continue;}
        // Always break at Monday — never span across week boundaries
        if(nd.dow.toUpperCase()==='MONDAY')break;
        const nv=og(month,nd.day,'ml');
        if(nv.length&&nv[0]===person)j++;
        else break;
      }
      let ei=j-1;
      while(ei>i&&opsIsWk(days[ei].dow))ei--;
      spans.push({si:i,ei,label:person,isBreak:false});
      for(let k=i+1;k<=ei;k++)cov.add(k);
      i=ei+1;
    }else i++;
  }
  return{spans,cov};
}

function opsRenderMonth(m,mi){
  const days=m.days;const n=days.length;if(!n)return'';
  // Auto-seed Sat/Sun as Break/Off Air for Morning Live
  days.forEach(function(d){
    if(opsIsWk(d.dow)){
      var cur=og(m.month,d.day,'ml');
      if(!cur.length||cur[0]==='Break / Off Air')
        os(m.month,d.day,'ml',['Break / Off Air']);
    }
  });
  const{spans,cov}=opsMlSpans(m.month,days);
  const spMap={};spans.forEach(sp=>spMap[sp.si]=sp);
  let h='<table class="ops-tbl">';
  h+='<tr class="ops-mhdr"><td colspan="'+(n+1)+'"><div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;">'
    +'<span class="ops-mhdr-txt" onclick="planOpenPicker()" style="cursor:pointer" title="Jump to a month">'+m.month.split(' ')[0].toUpperCase()+'</span>'
    +'<span style="font-size:18px;font-weight:800;letter-spacing:.04em;color:rgba(216,90,97,.7);padding-bottom:8px;">'+m.month.split(' ')[1]+'</span>'
    +'<span class="mnav">'
      +'<button class="mnav-b" onclick="opsShowFromIdx('+(mi-1)+')"'+(mi===0?' disabled':'')+' title="Previous month">&#8592;</button>'
      +'<button class="mnav-b" onclick="opsShowFromIdx('+(mi+1)+')"'+(mi===OPS_CAL.length-1?' disabled':'')+' title="Next month">&#8594;</button>'
      +'<button class="mnav-b" onclick="planToday()">Today</button>'
      +'<button class="mnav-b mnav-add" onclick="openOpsAddModal()">+ Add to Calendar</button>'
      +'<button class="mnav-b mnav-email" onclick="opsOpenEmail()">&#9993; ML Email</button>'
    +'</span>'

  +'</div></td></tr>';
  h+='<tr class="ops-dhdr"><td class="ops-rlbl" style="border-bottom:1px solid var(--border)"></td>';
  days.forEach(d=>{
    const wk=opsIsWk(d.dow);
    const td=opsDStr(m.month,d.day)===OPS_TODAY;
    const hol=opsHolidayFor(m.month,d.day);
    var holHTML='';
    if(hol){
      var safeName=(hol.name||'').replace(/"/g,'&quot;');
      holHTML='<div title="'+safeName+'" style="font-size:8px;font-weight:800;letter-spacing:.04em;color:#a06628;background:rgba(160,102,40,.12);margin:3px 4px 0;padding:2px 4px;border-radius:3px;text-transform:uppercase;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Bank Hol</div>';
    }
    // Today gets a beefier circle (44px vs 30, 22px font vs 16) with a soft
    // accent ring and stronger drop shadow, and the day-of-week label flips
    // to the accent red so the whole column reads as "today" at a glance.
    var dowColor=td?'#d85a61':'inherit';
    var dowSize=td?'15px':'13px';
    var circW=td?'44px':'30px';
    var circF=td?'22px':'16px';
    var circShadow=td?'box-shadow:0 0 0 3px rgba(216,90,97,.18),0 6px 14px rgba(216,90,97,.4);':'';
    h+='<td><div class="ops-dh'+(wk?' wk':'')+(td?' td':'')+(hol?' hol':'')+'"><span style="font-size:'+dowSize+';display:block;margin-bottom:4px;letter-spacing:.06em;font-weight:900;color:'+dowColor+';">'+d.dow.slice(0,3)+'</span><div class="dn-wrap" style="width:'+circW+';height:'+circW+';border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:'+circF+';font-weight:900;background:'+(td?'#d85a61':'rgba(216,90,97,.12)')+';color:'+(td?'#fff':'#d85a61')+';'+circShadow+'">'+d.day+'</div>'+holHTML+'</div></td>';
  });
  h+='</tr>';
  const cell=(idx,row,fc,rowCov)=>{
    if(rowCov&&rowCov.has(idx))return null;
    const d=days[idx];const wk=opsIsWk(d.dow);const td=opsDStr(m.month,d.day)===OPS_TODAY;
    const vals=og(m.month,d.day,row);
    const rid=('oc_'+mi+'_'+d.day+'_'+row).replace(/[^a-zA-Z0-9_]/g,'_');
    const cls='ops-cell'+(wk?' wk':'')+(td?' td':'');
    if(row==='ml'){
      if(cov.has(idx))return null;
      const sp=spMap[idx];const cs=sp?(sp.ei-sp.si+1):1;
      // Extract person safely from string OR object ({person, text, ...} from OPS_CAL seed)
      var rawPerson=vals.length?vals[0]:'';
      var person='';
      if(typeof rawPerson==='string')person=rawPerson;
      else if(rawPerson&&typeof rawPerson==='object')person=rawPerson.person||rawPerson.text||'';
      let chip;
      if(sp&&sp.isBreak)chip='<div class="ops-chip ops-brk">'+sp.label+'</div>';
      else if(!person)chip='<div class="ops-mt"></div>';
      else if(person==='Break / Off Air')chip='<div class="ops-chip ops-brk">'+(wk?'Weekend':'Break')+'</div>';
      else chip='<div class="ops-chip ops-ml" style="background:'+opsMlColor(person)+'">'+String(person)+'</div>';
      return'<td class="'+cls+'" colspan="'+cs+'" id="'+rid+'" data-mi="'+mi+'" data-day="'+d.day+'" data-row="ml" onclick="opsCk(this)">'+chip+'</td>';
    }
    // Non-ml: detect span entries (objects with span > 1) and render with colspan
    if(rowCov&&vals.length){
      var spanEntry=null;
      for(var si=0;si<vals.length;si++){
        var sv=vals[si];
        if(sv&&typeof sv==='object'&&sv.span&&sv.span>1&&(sv.text||'').trim()){spanEntry=sv;break;}
      }
      if(spanEntry){
        var spanLen=Math.min(spanEntry.span,days.length-idx);
        for(var sj=1;sj<spanLen;sj++)rowCov.add(idx+sj);
        var spText=spanEntry.text||'';
        var spCls=spanEntry.cls||opsChip(spText);
        var spStyle=spanEntry.color?' style="background:'+spanEntry.color+'"':'';
        // Render the span chip plus any other (non-span) entries in this cell
        var others=vals.filter(function(v){return v!==spanEntry;});
        var otherHtml=others.length?opsRChips(others,fc):'';
        return'<td class="'+cls+'" colspan="'+spanLen+'" id="'+rid+'" data-mi="'+mi+'" data-day="'+d.day+'" data-row="'+row+'" onclick="opsCk(this)"><div class="ops-chip '+spCls+'"'+spStyle+'>'+spText+'</div>'+otherHtml+'</td>';
      }
      // AUTO-FIT removed — chips render at data span. To extend a chip across days,
      // drag its right-edge handle.
    }
    return'<td class="'+cls+'" id="'+rid+'" data-mi="'+mi+'" data-day="'+d.day+'" data-row="'+row+'" onclick="opsCk(this)">'+opsRChips(vals,fc)+'</td>';
  };
  const srow=lbl=>'<tr class="ops-srow"><td colspan="'+(n+1)+'">'+lbl+'</td></tr>';
  const gap='<tr class="ops-gap"><td colspan="'+(n+1)+'"></td></tr>';
  const bigbreak='<tr class="ops-bigbreak"><td colspan="'+(n+1)+'"></td></tr>';
  const brow=(lbl,row,color,fc)=>{
    // Track which cells are covered by an earlier span entry in THIS row
    const rowCov=(row!=='ml')?new Set():null;
    const staffCls=(row==='andrew'||row==='chris'||row==='ian')?' staff':'';
    let r='<tr><td class="ops-rlbl'+staffCls+'" style="color:'+color+'">'+lbl+'</td>';
    days.forEach((_,i)=>{const c=cell(i,row,fc,rowCov);if(c)r+=c;});
    return r+'</tr>';
  };
  // Notes — free-text row at the top of the planner
  // Staff rows first — Andrew, Chris, Ian — then the red divider
  h+=brow('Andrew','andrew','#d85a61','ops-andrew');
  h+=gap;
  h+=brow('Chris','chris','#d85a61','ops-chris');
  h+=gap;
  h+=brow('Ian','ian','#d85a61','ops-ian');
  h+=bigbreak;
  // Morning Live (no extra header — the row label says it all)
  h+=brow('Morning Live TM','ml','#2d7dd2',null);
  // Studio location map — hardcoded base + job overrides
  var stuLocMap=Object.assign({},OPS_STU_LOC);
  jobs.forEach(function(jj){
    if(jj.studio&&jj.loc){
      stuLocMap[jj.studio]=jj.loc;
      if(jj.loc==='London')stuLocMap['London']='London';
    }
  });


  const stus=OPS_STUDIOS;
  stus.forEach(function(st){
    if(_opsHidStu.has(st))return;
    var loc=stuLocMap[st]||'';
    var lCol=loc==='Manchester'?'#2a6e3a':loc==='London'?'#1a4e8a':'rgba(154,112,48,.9)';
    var lBg=loc==='Manchester'?'rgba(42,110,58,.08)':loc==='London'?'rgba(26,78,138,.08)':'rgba(255,251,246,.9)';
    var locBadge='';
    let r='<tr><td class="ops-rlbl" style="color:'+lCol+';background:'+lBg+'">'+st+locBadge+'<span class="ops-rlbl-x" onclick="event.stopPropagation();opsToggleStu(\''+st.replace(/'/g,"\\'")+'\')" title="Hide '+st+'">&times;</span></td>';
    // Span tracking — see versa-opsplanner.html for explanation
    var stRowCov=new Set();
    days.forEach(function(d,idx){
      if(stRowCov.has(idx))return;
      const row='st_'+st;const wk=opsIsWk(d.dow);const td=opsDStr(m.month,d.day)===OPS_TODAY;
      const vals=og(m.month,d.day,row);
      const rid=('oc_'+mi+'_'+d.day+'_'+row).replace(/[^a-zA-Z0-9_]/g,'_');
      const cls='ops-cell'+(wk?' wk':'')+(td?' td':'');
      var spanEntry=null;
      for(var si=0;si<vals.length;si++){
        var sv=vals[si];
        if(sv&&typeof sv==='object'&&sv.span&&sv.span>1&&(sv.text||'').trim()){spanEntry=sv;break;}
      }
      if(spanEntry){
        var spanLen=Math.min(spanEntry.span,days.length-idx);
        for(var sj=1;sj<spanLen;sj++)stRowCov.add(idx+sj);
        var spText=spanEntry.text||'';
        var spCls=spanEntry.cls||opsChip(spText);
        var spStyle=spanEntry.color?' style="background:'+spanEntry.color+'"':'';
        var others=vals.filter(function(v){return v!==spanEntry;});
        var otherHtml=others.length?opsRChips(others,null):'';
        r+='<td class="'+cls+'" colspan="'+spanLen+'" id="'+rid+'" data-mi="'+mi+'" data-day="'+d.day+'" data-row="'+row+'" onclick="opsCk(this)"><div class="ops-chip '+spCls+'"'+spStyle+'>'+spText+'</div>'+otherHtml+'</td>';
      } else {
        // AUTO-FIT removed.
        r+='<td class="'+cls+'" id="'+rid+'" data-mi="'+mi+'" data-day="'+d.day+'" data-row="'+row+'" onclick="opsCk(this)">'+opsRChips(vals,null)+'</td>';
      }
    });
    r+='</tr>';h+=r;
  });
  // Events row sits under the studios (last entry in the studios block)
  h+=brow('Events','events','#20a0a0','ops-event');
  // Notes live at the very bottom
  h+=gap;
  h+=brow('Notes','notes','#5a5a5a',null);
  h+='</table>';
  return h;
}


// ── STUDIO TOGGLE / RESTORE ──────────────────────────────────────────────────
function opsPickStu(){const avail=OPS_STUDIOS.filter(s=>!_opsStu.has(s));if(!avail.length){alert('All studios added');return;}let html='<div id="opsStuPk" onclick="if(event.target===this)this.remove()" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center"><div style="background:var(--dark);border:1px solid var(--border);border-radius:4px;min-width:190px;overflow:hidden"><div style="padding:10px 13px;border-bottom:1px solid var(--border);font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)">Add Studio</div>';avail.forEach(s=>{html+='<div onclick="opsAddStu(\''+s+'\')" class="ops-co" style="padding:9px 13px;font-size:14px">'+s+'</div>';});html+='</div></div>';document.body.insertAdjacentHTML('beforeend',html);}
function opsAddStu(s){_opsStu.add(s);const pk=document.getElementById('opsStuPk');if(pk)pk.remove();opsReRender();}
function opsDelStu(s){_opsStu.delete(s);opsReRender();}
function opsToggleStu(s){
  if(_opsHidStu.has(s))_opsHidStu.delete(s);else _opsHidStu.add(s);
  opsReRenderAll();
  _opsUpdateRestoreStuBtn();
}
function opsRestoreAllStudios(){
  _opsHidStu.clear();
  opsReRenderAll();
  _opsUpdateRestoreStuBtn();
}
function _opsUpdateRestoreStuBtn(){
  var body=document.getElementById('opsBody2');
  if(!body)return;
  var btn=document.getElementById('opsRestoreStuBtn');
  var n=_opsHidStu.size;
  if(n===0){
    if(btn)btn.remove();
    return;
  }
  if(!btn){
    btn=document.createElement('button');
    btn.id='opsRestoreStuBtn';
    btn.className='ops-restore-stu';
    btn.onclick=opsRestoreAllStudios;
    // Insert just after the show-prev button if present, otherwise at top
    var prev=document.getElementById('opsShowPrevBtn');
    if(prev&&prev.nextSibling)body.insertBefore(btn,prev.nextSibling);
    else if(prev)body.appendChild(btn);
    else body.insertBefore(btn,body.firstChild);
  }
  btn.innerHTML='\u21A9 Show '+n+' hidden studio'+(n===1?'':'s');
}

// Auto-fit text in any element that uses text-overflow:ellipsis. Shrinks font-size
// (down to a floor of 8px) until the text fits. Re-runs after every render, on
// window resize, and via a MutationObserver as a catch-all for DOM changes.
function versaFitText(el){
  if(!el||!el.style)return;
  var cs=window.getComputedStyle(el);
  if(cs.textOverflow!=='ellipsis')return;
  el.style.fontSize='';
  if(el.scrollWidth<=el.clientWidth+0.5)return;
  var fs=parseFloat(cs.fontSize)||12;
  for(var i=0;i<16;i++){
    fs-=0.5;
    if(fs<8)break;
    el.style.fontSize=fs+'px';
    if(el.scrollWidth<=el.clientWidth+0.5)return;
  }
}
// Selectors covering every chip/box type in the app that truncates with ellipsis.
// Add new ones here to opt them into auto-fit; harmless if a selector matches
// nothing on a given page.
var VERSA_FIT_SEL='.ops-chip,.cal-bar,.drw-title,.td';
function versaFitAll(){
  document.querySelectorAll(VERSA_FIT_SEL).forEach(versaFitText);
}

(function(){
  var t=null;

    if(t)clearTimeout(t);

})();
// Catch any DOM mutation we don't explicitly hook into. childList:true watches
// node additions/removals only — setting style.fontSize from this function
// doesn't fire it back, avoiding loops. Debounced at 180ms.
(function(){
  if(!('MutationObserver' in window))return;
  var t=null;
  var schedule=function(){
    if(t)clearTimeout(t);
    t=setTimeout(versaFitAll,180);
  };
  var go=function(){
    if(!document.body)return;
    try{new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});}catch(e){}
  };
  if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
})();

// Position the cell editor popup next to the given cell, picking the side
// (below / above / pinned-top) that best fits in the visible viewport.
function _opsPositionCed(td){
  const ced=document.getElementById('opsCed');
  if(!ced||!td)return;
  const rect=td.getBoundingClientRect();
  var vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  var vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  var vtop=window.visualViewport?(window.visualViewport.offsetTop||0):0;
  var spaceBelow=(vtop+vh)-(rect.bottom+8);
  var spaceAbove=(rect.top)-(vtop+8);
  var top,maxH;
  // Prefer below if there's room; otherwise above; otherwise pin to top
  if(spaceBelow>=240||spaceBelow>=spaceAbove){
    top=rect.bottom+3;
    maxH=Math.max(160,spaceBelow);
  } else if(spaceAbove>=240){
    // Place above the cell. We'll measure after setting maxHeight.
    ced.style.maxHeight=spaceAbove+'px';
    var measuredH=ced.offsetHeight;
    top=rect.top-measuredH-3;
    maxH=spaceAbove;
  } else {
    top=vtop+8;
    maxH=vh-16;
  }
  ced.style.top=top+'px';
  ced.style.left=Math.max(4,Math.min(rect.left,vw-244))+'px';
  ced.style.maxHeight=maxH+'px';
}
// When the planner scrolls, reposition the open popup so it tracks its cell.
// If the cell is no longer in the viewport, hide the popup until it's back.
function _opsRepositionOpenCed(){
  if(!_opsEd)return;
  const ced=document.getElementById('opsCed');
  if(!ced||ced.style.display==='none')return;
  const td=document.getElementById(_opsEd.id);
  if(!td){opsCloseCed();return;}
  const rect=td.getBoundingClientRect();
  var vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  if(rect.bottom<-20||rect.top>vh+20){
    ced.style.visibility='hidden';
    return;
  }
  ced.style.visibility='visible';
  _opsPositionCed(td);
}
function opsOpt(el){if(!_opsEd)return;const val=el.dataset.v;const single=el.dataset.s==='1';const{month,day,row,id}=_opsEd;let cur=og(month,day,row).slice();if(single)cur=cur.includes(val)?[]:[val];else{if(cur.includes(val))cur=cur.filter(x=>x!==val);else cur.push(val);}os(month,day,row,cur);if(row==='ml'){opsReRender();}else{opsRefCell(id,month,day,row);}opsCloseCed();}
function opsCiAdd(){
  const inp=document.getElementById('opsCiTxt');

  const pending=window._opsPendingSpan;
  if(pending&&pending.month===month&&pending.row===row&&pending.lo===day){

    const entry={text:val,span:pending.span};

    for(var d=pending.lo+1;d<=pending.hi;d++){

  if(cls){

// Set an entry's span to an absolute number of days. Called from the days

  var info=_opsEd;
  var month=info.month,day=info.day,row=info.row,id=info.id;
  var m=OPS_CAL.find(function(x){return x.month===month;});
  if(!m){if(typeof toast==='function')toast('Month not found');return;}
  var dayIdx=m.days.findIndex(function(d){return d.day===day;});
  if(dayIdx<0){if(typeof toast==='function')toast('Day not found');return;}
  var cur=og(month,day,row).slice();
  if(idx<0||idx>=cur.length){if(typeof toast==='function')toast('Entry not found — try reopening the cell');return;}
  var v=cur[idx];
  var curSpan=(v&&typeof v==='object'&&v.span&&v.span>1)?v.span:1;
  var maxSpan=m.days.length-dayIdx;
  newSpan=Math.min(newSpan,maxSpan);
  if(newSpan===curSpan)return; // no change
  // Update the entry
  if(newSpan===1){
    // Drop span: object → object without span, or plain string if nothing else left
    if(typeof v==='object'&&v){
      var stripped=Object.assign({},v);delete stripped.span;
      var keys=Object.keys(stripped);
      if(keys.length===1&&keys[0]==='text')cur[idx]=stripped.text;
      else cur[idx]=stripped;
    }
  } else {
    var text=(typeof v==='string')?v:(v&&v.text?v.text:'');
    if(typeof v==='string')cur[idx]={text:text,span:newSpan};
    else cur[idx]=Object.assign({},v,{text:text,span:newSpan});
  }
  // If extending, clear absorbed cells so they don't render their own chips
  if(newSpan>curSpan){
    for(var k=curSpan;k<newSpan;k++){
      var absorbedDay=m.days[dayIdx+k].day;
      _opsD[month+'|'+absorbedDay+'|'+row]=[];
    }
  }
  os(month,day,row,cur);
  if(typeof opsReRender==='function')opsReRender();
  if(typeof toast==='function')toast('Span set to '+newSpan+' day'+(newSpan===1?'':'s'));
  // Reopen the editor so the user can keep adjusting
  var el=document.getElementById(id);
  if(el)opsCk(el);
}
// Kept for backwards compatibility — converts delta to absolute and delegates
function opsAdjustSpan(idx,delta){
  if(!_opsEd)return;
  var cur=og(_opsEd.month,_opsEd.day,_opsEd.row);
  if(idx<0||idx>=cur.length)return;
  var v=cur[idx];
  var curSpan=(v&&typeof v==='object'&&v.span&&v.span>1)?v.span:1;
  opsSetSpan(idx,curSpan+delta);
}

// ── DRAG INTERACTIONS ────────────────────────────────────────────────────────
// Two modes, selected automatically by where the drag ends:
//   • SAME row, same month → RESIZE. Span = endDay − startDay + 1.
//       Drag right past current end → extend. Drag left / inside merged cell
//       → shrink. Shrink to 1 removes the merge.
//   • DIFFERENT row OR month → MOVE. First entry from source is appended to
//       the destination cell. Span attribute is dropped on move.
// startDay always anchors to the source cell's data-day (the entry's true start
// for merged TDs). endDay uses a "virtual day" — X-position math inside wide
// cells — so you can drag to a position within a merged cell to shrink it.
var _opsDrag=null;
var _opsBlockClick=false;
// Map an in-cell mouse X to the day under the cursor, accounting for colspan.
function _opsVirtualDayAt(cell,clientX){
  var dataDay=+cell.dataset.day;
  var colspan=parseInt(cell.getAttribute('colspan')||'1',10);
  if(colspan<=1)return dataDay;
  var rect=cell.getBoundingClientRect();
  if(rect.width<=0)return dataDay;
  var perDay=rect.width/colspan;
  var offIdx=Math.max(0,Math.min(colspan-1,Math.floor((clientX-rect.left)/perDay)));
  return dataDay+offIdx;
}
function _opsDragMouseDown(ev){
  if(ev.button!==0&&ev.button!==undefined)return;
  var cell=ev.target&&ev.target.closest&&ev.target.closest('.ops-cell');
  if(!cell)return;
  if(ev.target.closest&&(ev.target.closest('button')||ev.target.closest('input,select,textarea')))return;
  var mi=+cell.dataset.mi;
  var row=cell.dataset.row;
  var dataDay=+cell.dataset.day;
  var month=OPS_CAL[mi]&&OPS_CAL[mi].month;
  if(!month)return;
  // Handle detection: chip ::before / ::after pseudo-elements occupy the left/right
  // ~9px with cursor:ew-resize. Pseudo-elements aren't event targets, so detect by
  // checking which edge of the chip the click landed near.
  var chipEl=ev.target&&ev.target.closest&&ev.target.closest('.ops-chip');
  var isHandle=false;
  var handleSide=null;
  if(chipEl){
    var cr=chipEl.getBoundingClientRect();
    var fromRight=cr.right-ev.clientX;
    var fromLeft=ev.clientX-cr.left;
    // Detection zone: 18px or 30% of chip width, whichever is smaller. On wide chips this
    // stays a narrow band at each edge; on narrow single-cell chips it expands so the handle
    // is hittable without trackpad-precision.
    var hz=Math.min(18,Math.max(10,cr.width*0.3));
    if(ev.clientY>=cr.top&&ev.clientY<=cr.bottom){
      if(fromRight>=0&&fromRight<hz){isHandle=true;handleSide='right';}
      else if(fromLeft>=0&&fromLeft<hz){isHandle=true;handleSide='left';}
    }
  }
  var clickVDay=(typeof _opsVirtualDayAt==='function')?_opsVirtualDayAt(cell,ev.clientX):dataDay;
  _opsDrag={
    mi:mi,row:row,month:month,
    startDay:dataDay,
    clickVDay:clickVDay,
    endDay:dataDay,
    startVals:og(month,dataDay,row).slice(),
    startX:ev.clientX,startY:ev.clientY,
    moved:false,
    mode:'span',
    handleMode:isHandle,
    handleSide:handleSide,
    targetCell:cell
  };
  console.log('[opsDrag] mousedown',{row:row,mi:mi,day:dataDay,hasContent:_opsDrag.startVals.length>0,handle:isHandle,side:handleSide});
  document.body.classList.add('ops-drag-active');
  if(isHandle){ev.preventDefault&&ev.preventDefault();}
}
function _opsDragMouseMove(ev){
  if(!_opsDrag)return;
  var dx=Math.abs(ev.clientX-_opsDrag.startX);
  var dy=Math.abs(ev.clientY-_opsDrag.startY);
  if(!_opsDrag.moved&&dx<4&&dy<4)return;
  _opsDrag.moved=true;
  var el=document.elementFromPoint(ev.clientX,ev.clientY);
  var cell=el?(el.closest&&el.closest('.ops-cell')):null;
  if(!cell)return;
  // Handle-drag (resize): pure cursor-position tracking, no thresholds
  if(_opsDrag.handleMode){
    if(cell.dataset.row!==_opsDrag.row||(+cell.dataset.mi)!==_opsDrag.mi)return;
    var virtualDay=_opsVirtualDayAt(cell,ev.clientX);
    var m=OPS_CAL[_opsDrag.mi];
    if(m)virtualDay=Math.max(m.days[0].day,Math.min(m.days[m.days.length-1].day,virtualDay));
    if(virtualDay===_opsDrag.endDay)return;
    _opsDrag.endDay=virtualDay;
    _opsDrag.targetCell=cell;
    _opsDrag.mode='span';
    _opsDragHighlight();
    return;
  }
  // Body-drag: MOVE to whichever cell the cursor ends up over. Same row OR different
  // row both work. Drag to source cell = no-op.
  var srcIsML=_opsDrag.row==='ml';
  var tgtIsML=cell.dataset.row==='ml';
  if(srcIsML!==tgtIsML)return;
  var hasContent=_opsDrag.startVals.length>0;
  if(!hasContent)return;
  if((+cell.dataset.mi)===_opsDrag.mi&&cell.dataset.row===_opsDrag.row&&(+cell.dataset.day)===_opsDrag.startDay)return;
  if(_opsDrag.targetCell===cell&&_opsDrag.mode==='move')return;
  _opsDrag.targetCell=cell;
  _opsDrag.mode='move';
  _opsDragHighlight();
}
function _opsDragMouseUp(ev){
  if(!_opsDrag)return;
  var drag=_opsDrag;_opsDrag=null;
  _opsDragClearHighlight();
  document.body.classList.remove('ops-drag-active');
  console.log('[opsDrag] mouseup',{moved:drag.moved,mode:drag.mode,handle:drag.handleMode,startDay:drag.startDay,endDay:drag.endDay});
  if(drag.moved||drag.handleMode){
    _opsBlockClick=true;
    setTimeout(function(){_opsBlockClick=false;},120);
  }
  if(!drag.moved)return;
  if(drag.mode==='move')_opsDragMove(drag);
  else if(drag.row==='ml')_opsDragSpanAdjustML(drag);
  else _opsDragSpanAdjust(drag);
}
function _opsDragHighlight(){
  if(!_opsDrag)return;
  _opsDragClearHighlight();
  if(_opsDrag.mode==='span'){
    // Predicted new chip range matches the actual clamping in _opsDragSpanAdjust:
    // right handle can't shrink below startDay or extend past maxDay; left handle
    // can't shrink past curHi or extend before day 1.
    var lo,hi;
    var v0=_opsDrag.startVals&&_opsDrag.startVals[0];
    var curSpan=(v0&&typeof v0==='object'&&v0.span&&v0.span>1)?v0.span:1;
    var curHi=_opsDrag.startDay+curSpan-1;
    var maxDay=(typeof OPS_CAL!=='undefined'&&OPS_CAL[_opsDrag.mi])?OPS_CAL[_opsDrag.mi].days.length:31;
    if(_opsDrag.handleSide==='left'){
      lo=Math.max(1,Math.min(curHi,_opsDrag.endDay));
      hi=curHi;
    } else {
      lo=_opsDrag.startDay;
      hi=Math.max(_opsDrag.startDay,Math.min(maxDay,_opsDrag.endDay));
    }
    var sel='.ops-cell[data-row="'+_opsDrag.row+'"][data-mi="'+_opsDrag.mi+'"]';
    document.querySelectorAll(sel).forEach(function(c){
      var day=+c.dataset.day;
      var colspan=parseInt(c.getAttribute('colspan')||'1',10);
      var inRange=false;
      for(var i=0;i<colspan;i++){if(day+i>=lo&&day+i<=hi){inRange=true;break;}}
      if(inRange)c.classList.add('ops-drag-sel');
    });
  } else if(_opsDrag.mode==='move'){
    var srcSel='.ops-cell[data-row="'+_opsDrag.row+'"][data-mi="'+_opsDrag.mi+'"][data-day="'+_opsDrag.startDay+'"]';
    var srcCell=document.querySelector(srcSel);
    if(srcCell)srcCell.classList.add('ops-drag-src');
    if(_opsDrag.targetCell)_opsDrag.targetCell.classList.add('ops-drag-dest');
  }
}
function _opsDragClearHighlight(){
  document.querySelectorAll('.ops-drag-sel,.ops-drag-src,.ops-drag-dest').forEach(function(c){
    c.classList.remove('ops-drag-sel');c.classList.remove('ops-drag-src');c.classList.remove('ops-drag-dest');
  });
}
// SAME-ROW (non-ML): adjust the chip's span based on where the drag ended.
// Anchor = source cell's leftmost day. Drag forward extends right; drag back
// past the anchor extends LEFTWARD (moves the data leftward and grows the
// span to cover endDay..curHi). Drag within the current span shrinks it.
function _opsDragSpanAdjust(drag){
  var m=OPS_CAL[drag.mi];if(!m)return;
  var month=drag.month,leftmost=drag.startDay,row=drag.row;
  var endDay=drag.endDay;
  var dayIdx=m.days.findIndex(function(d){return d.day===leftmost;});
  if(dayIdx<0)return;
  var minDay=m.days[0].day,maxDay=m.days[m.days.length-1].day;
  var cur=og(month,leftmost,row).slice();
  if(!cur.length){
    // Empty start → pending-span flow (works in either direction)
    var pendLo=Math.min(leftmost,endDay),pendHi=Math.max(leftmost,endDay);
    if(pendHi===pendLo)return;
    if(pendLo<minDay)pendLo=minDay;
    if(pendHi>maxDay)pendHi=maxDay;
    window._opsPendingSpan={month:month,row:row,lo:pendLo,hi:pendHi,span:pendHi-pendLo+1};
    var lc=document.querySelector('.ops-cell[data-mi="'+drag.mi+'"][data-day="'+pendLo+'"][data-row="'+row+'"]');
    console.log('[opsDrag] empty start primed',pendLo,'..',pendHi);
    if(lc)opsCk(lc);
    return;
  }
  var v0=cur[0];
  var curSpan=(v0&&typeof v0==='object'&&v0.span&&v0.span>1)?v0.span:1;
  var curHi=leftmost+curSpan-1;
  // RIGHT handle: anchor stays, newRight = endDay.
  // LEFT handle: anchor moves to endDay (clamped), newRight stays at curHi.
  var newLeft,newRight;
  if(drag.handleSide==='left'){
    newLeft=Math.max(minDay,Math.min(curHi,endDay));
    newRight=curHi;
  } else {
    newLeft=leftmost;
    newRight=Math.max(leftmost,Math.min(maxDay,endDay));
  }
  var newSpan=newRight-newLeft+1;
  if(newLeft===leftmost&&newSpan===curSpan){console.log('[opsDrag] no change');return;}
  var text=(typeof v0==='string')?v0:(v0&&v0.text?v0.text:'');
  if(!text)return;
  var newEntry;
  if(newSpan===1){
    if(typeof v0==='object'&&v0){
      var stripped=Object.assign({},v0);delete stripped.span;
      var ks=Object.keys(stripped);
      newEntry=(ks.length===1&&ks[0]==='text')?stripped.text:stripped;
    } else newEntry=v0;
  } else {
    newEntry=(typeof v0==='string')?{text:text,span:newSpan}:Object.assign({},v0,{text:text,span:newSpan});
  }
  // Clear union of old range and new range, then write new entry at newLeft.
  var clearLo=Math.min(leftmost,newLeft),clearHi=Math.max(curHi,newRight);
  for(var d=clearLo;d<=clearHi;d++)_opsD[month+'|'+d+'|'+row]=[];
  os(month,newLeft,row,[newEntry]);
  console.log('[opsDrag] resized',leftmost,'..',curHi,'→',newLeft,'..',newRight);
  if(typeof opsReRender==='function')opsReRender();
}
// SAME-ROW (ML): breaks/person-names span via repeated identical strings in
// consecutive cells. Drag-to-extend replicates the text; shrink clears extras.
function _opsDragSpanAdjustML(drag){
  var m=OPS_CAL[drag.mi];if(!m)return;
  var month=drag.month,anchor=drag.startDay,row=drag.row;
  var endDay=drag.endDay;
  var dayIdx=m.days.findIndex(function(d){return d.day===anchor;});
  if(dayIdx<0)return;
  var minDay=m.days[0].day,maxDay=m.days[m.days.length-1].day;
  var cur=og(month,anchor,row);
  if(!cur.length)return;
  var v0=cur[0];
  var text=(typeof v0==='string')?v0:(v0&&(v0.person||v0.text)?(v0.person||v0.text):'');
  if(!text)return;
  // Find current run of consecutive identical-text cells around the anchor
  var runStart=anchor,runEnd=anchor;
  for(var k=1;dayIdx+k<m.days.length;k++){
    var nd=m.days[dayIdx+k].day;
    var nv=og(month,nd,row);
    if(!nv.length)break;
    var nt=(typeof nv[0]==='string')?nv[0]:(nv[0].person||nv[0].text||'');
    if(nt===text)runEnd=nd;else break;
  }
  for(var k=1;dayIdx-k>=0;k++){
    var pd=m.days[dayIdx-k].day;
    var pv=og(month,pd,row);
    if(!pv.length)break;
    var pt=(typeof pv[0]==='string')?pv[0]:(pv[0].person||pv[0].text||'');
    if(pt===text)runStart=pd;else break;
  }
  var newLeft,newRight;
  if(drag.handleSide==='left'){
    newLeft=Math.max(minDay,Math.min(runEnd,endDay));
    newRight=runEnd;
  } else {
    newLeft=runStart;
    newRight=Math.max(runStart,Math.min(maxDay,endDay));
  }
  if(newLeft===runStart&&newRight===runEnd){console.log('[opsDrag-ml] no change');return;}
  var clearLo=Math.min(runStart,newLeft),clearHi=Math.max(runEnd,newRight);
  for(var d=clearLo;d<=clearHi;d++)_opsD[month+'|'+d+'|'+row]=[];
  for(var d=newLeft;d<=newRight;d++)os(month,d,row,[text]);
  console.log('[opsDrag-ml] adjusted',runStart,'..',runEnd,'→',newLeft,'..',newRight,'text=',text);
  if(typeof opsReRender==='function')opsReRender();
}
// CROSS-ROW / CROSS-MONTH: move the source cell's entries to the destination.
// Span attribute is stripped — destination just gets plain entries appended.
function _opsDragMove(drag){
  if(!drag.startVals||!drag.startVals.length)return;
  if(!drag.targetCell)return;
  var destMi=+drag.targetCell.dataset.mi;
  var destRow=drag.targetCell.dataset.row;
  if(destRow==='ml')return;
  var destMonth=OPS_CAL[destMi]&&OPS_CAL[destMi].month;
  if(!destMonth)return;
  var destDay=+drag.targetCell.dataset.day;
  if(destMonth===drag.month&&destDay===drag.startDay&&destRow===drag.row)return;
  // Strip span from each entry so the destination doesn't inherit a multi-day span
  var moveVals=drag.startVals.map(function(v){
    if(typeof v==='string')return v;
    if(v&&typeof v==='object'){
      var copy=Object.assign({},v);delete copy.span;
      var ks=Object.keys(copy);
      if(ks.length===1&&ks[0]==='text')return copy.text;
      return copy;
    }
    return v;
  });
  os(drag.month,drag.startDay,drag.row,[]);
  // REPLACE the destination cell's contents (not append). Avoids stacking chips
  // on occupied cells.
  os(destMonth,destDay,destRow,moveVals);
  // Clear any cells the source span was absorbing, so they don't linger.
  var srcSpan=(drag.startVals[0]&&typeof drag.startVals[0]==='object'&&drag.startVals[0].span>1)?drag.startVals[0].span:1;
  if(srcSpan>1){
    var srcM=OPS_CAL[drag.mi];
    if(srcM){
      var srcIdx=srcM.days.findIndex(function(d){return d.day===drag.startDay;});
      if(srcIdx>=0){
        for(var off=1;off<srcSpan;off++){
          if(srcIdx+off>=srcM.days.length)break;
          var sd=srcM.days[srcIdx+off].day;
          _opsD[drag.month+'|'+sd+'|'+drag.row]=[];
        }
      }
    }
  }
  console.log('[opsDrag] moved',moveVals.length,'entries',drag.row,drag.startDay,'→',destRow,destDay,'(replaced)');
  if(typeof opsReRender==='function')opsReRender();
}
// Block the cell-click that fires immediately after a drag-merge mouseup.
// Important: must NOT block clicks on actual buttons (×, ◀, ▶, swatches).
function _opsDragClickGuard(ev){
  if(!_opsBlockClick)return;
  if(ev.target&&ev.target.closest&&(ev.target.closest('button')||ev.target.closest('input')||ev.target.closest('select')))return;
  if(!ev.target||!ev.target.closest||!ev.target.closest('.ops-cell'))return;
  ev.preventDefault();ev.stopImmediatePropagation();
}
// Attach drag listeners once (delegated on document, so dynamically rendered cells work)
if(!window._opsDragInstalled){
  window._opsDragInstalled=true;
  document.addEventListener('mousedown',_opsDragMouseDown,true);
  document.addEventListener('mousemove',_opsDragMouseMove,true);
  document.addEventListener('mouseup',_opsDragMouseUp,true);
  document.addEventListener('click',_opsDragClickGuard,true);
  // Touch support — map to mouse handlers
  document.addEventListener('touchstart',function(ev){
    if(ev.touches.length!==1)return;
    var t=ev.touches[0];
    _opsDragMouseDown({target:t.target,clientX:t.clientX,clientY:t.clientY,button:0});
  },{passive:true,capture:true});
  document.addEventListener('touchmove',function(ev){
    if(ev.touches.length!==1)return;
    var t=ev.touches[0];
    _opsDragMouseMove({clientX:t.clientX,clientY:t.clientY});
  },{passive:true,capture:true});
  document.addEventListener('touchend',function(ev){_opsDragMouseUp({});},{passive:true,capture:true});
}
function opsCloseCed(){document.getElementById('opsCed').style.display='none';_opsEd=null;window._opsPendingSpan=null;}

// Console-callable cleanup. Run `opsCleanupNow()` to scrub corrupt entries
// (phantom merges, dead refs, broken spans) and re-render. Returns true if
// anything changed.
window.opsCleanupNow=function(){
  var changed=false;
  try{changed=_opsCleanSeedJunk()||changed;}catch(e){console.warn('cleanup error',e);}
  try{if(typeof _opsCleanStaleStudioEntries==='function')_opsCleanStaleStudioEntries();}catch(e){}
  if(changed){
    try{saveData();}catch(e){}
    try{opsReRender();}catch(e){}
    console.log('[opsCleanup] data cleaned & re-rendered');
  } else {
    console.log('[opsCleanup] nothing to clean');
  }
  return changed;
};

function opsAddRangeToList(){
  var s=document.getElementById('opsAddRangeStart').value;
  var e=document.getElementById('opsAddRangeEnd').value||s;
  if(!s)return;
  var skipWk=document.getElementById('opsAddSkipWk').checked;
  var d=new Date(s+'T00:00:00');
  var end=new Date(e+'T00:00:00');

  while(d.getTime()<=end.getTime()){

function _opsRenderAddDateChips(){

// ── Ops Planner navigation helpers (sliding 3-month window) ────────────────
// _opsStart = OPS_CAL index of the first visible month. View = [start, start+1, start+2]
var _opsStart=null;

function opsTodayMonthIdx(){
  // Find OPS_CAL index for today's month, clamped to the available range
  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var n=new Date();var key=monthNames[n.getMonth()]+' '+n.getFullYear();
  for(var i=0;i<OPS_CAL.length;i++){
    if(OPS_CAL[i].month.toLowerCase()===key.toLowerCase())return i;
  }
  // Out of range — clamp
  var firstParts=OPS_CAL[0].month.split(' ');var firstYr=parseInt(firstParts[1]);
  var lastParts=OPS_CAL[OPS_CAL.length-1].month.split(' ');var lastYr=parseInt(lastParts[1]);
  var nowVal=n.getFullYear()*12+n.getMonth();
  var firstVal=firstYr*12+monthNames.indexOf(firstParts[0]);
  var lastVal=lastYr*12+monthNames.indexOf(lastParts[0]);
  if(nowVal<firstVal)return 0;
  return OPS_CAL.length-1;
}

function opsClampStart(idx){
  if(idx<0)return 0;
  if(idx>OPS_CAL.length-1)return OPS_CAL.length-1;
  return idx;
}

function opsCurrentStart(){
  // Track focal month — falls back to today's month
  return _opsStart!=null?_opsStart:opsTodayMonthIdx();
}

function opsLabelForStart(start){
  var mo=OPS_CAL[start].month;
  var moShort=mo.split(' ')[0].slice(0,3);
  var yr=mo.split(' ')[1];
  return moShort+' '+yr;
}

function opsShowFromIdx(start){
  start=opsClampStart(start);
  _opsStart=start;
  var todayIdx=opsTodayMonthIdx();
  // Targeting a past month auto-reveals past months
  if(start<todayIdx)_opsShowingPast=true;
  // All months at-or-after today always visible; past months gated by toggle
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(s,i){
    if(i<todayIdx&&!_opsShowingPast)s.style.display='none';
    else s.style.display='block';
  });
  _opsUpdatePrevBtn();
  // Highlight matching legacy quarter button if present (no-op now)
  document.querySelectorAll('#opsQnav2 .ops-qbtn').forEach(function(b,i){
    b.classList.toggle('active',i===start);
  });
  // Wait for layout to settle (display:block toggles above), then scroll using
  // getBoundingClientRect deltas — robust against any offsetParent/positioning
  // quirks that throw off sec.offsetTop.
  requestAnimationFrame(function(){
    var sc=document.getElementById('opsScroll2');
    var sec=document.getElementById('opsMs2-'+start);
    if(sc&&sec){
      var scRect=sc.getBoundingClientRect();
      var secRect=sec.getBoundingClientRect();
      sc.scrollTop=sc.scrollTop+(secRect.top-scRect.top);
    }
  });
  updatePlanLbl(opsLabelForStart(start));
}

// State for past-month reveal
var _opsShowingPast=false;

function _opsUpdatePrevBtn(){
  var btn=document.getElementById('opsShowPrevBtn');
  if(!btn)return;
  if(_opsShowingPast){
    btn.innerHTML='&#8595; Back to current month';
    btn.onclick=opsBackToCurrent;
    btn.classList.add('ops-back-current');

    btn.innerHTML='&#8593; Show previous months';

}

// Public API used by planNav / planToday / planOpenPicker
function opsMonthIndex(year,month){
  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var key=monthNames[month]+' '+year;
  for(var i=0;i<OPS_CAL.length;i++){
    if(OPS_CAL[i].month.toLowerCase()===key.toLowerCase())return i;
  }
  return -1;
}

function opsJumpToMonth(year,month){
  var mi=opsMonthIndex(year,month);
  if(mi<0){
    // Out of range: clamp to nearest end
    var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var firstParts=OPS_CAL[0].month.split(' ');
    var firstYr=parseInt(firstParts[1]);var firstMo=monthNames.indexOf(firstParts[0]);
    if(year*12+month<firstYr*12+firstMo)mi=0;
    else mi=OPS_CAL.length-1;
  }
  opsShowFromIdx(mi);
}

function opsNav(d){
  var cur=opsCurrentStart();
  opsShowFromIdx(cur+d);

      +'</div>'

// ── PLAN VIEW WIRING (stacked months — scroll vertically) ────────────────────
var _saMonthsRendered=false;
var _saScrollObs=null;
var _saShowingPast=false;

function setPlanView(v){
  plannerView='month';
  var body=document.getElementById('opsBody2');
  if(!body)return;
  if(!_saMonthsRendered){
    _saBuildStackedMonths();
    _saMonthsRendered=true;
    // Open at today's month
    setTimeout(function(){_saScrollToMonth(opsTodayMonthIdx(),false);_saScrollTodayX();},80);
  }
}

function _saBuildStackedMonths(){
  var body=document.getElementById('opsBody2');
  if(!body)return;
  body.innerHTML='';
  var todayIdx=opsTodayMonthIdx();
  // "Show previous months" button — only if any past months exist
  if(todayIdx>0){
    var prevBtn=document.createElement('button');
    prevBtn.id='opsShowPrevBtn';
    prevBtn.className='ops-show-prev';
    prevBtn.innerHTML='&#8593; Show previous months';
    prevBtn.onclick=opsRevealPastMonths;
    body.appendChild(prevBtn);
  }
  // Render every month section once
  OPS_CAL.forEach(function(m,i){
    var sec=document.createElement('div');
    sec.className='ops-ms2';
    sec.id='opsMs2-'+i;
    if(i<todayIdx)sec.style.display='none'; // hide past months initially
    sec.innerHTML=opsRenderMonth(m,i);
    body.appendChild(sec);
  });
  // Set up scroll observer to track which month is in view → updates planLbl
  _saSetupScrollObserver();
}

function _saSetupScrollObserver(){
  if(!('IntersectionObserver' in window))return;
  if(_saScrollObs)_saScrollObs.disconnect();
  _saScrollObs=new IntersectionObserver(function(entries){
    var topmostIdx=-1;var topmostTop=Infinity;
    entries.forEach(function(e){
      if(!e.isIntersecting)return;
      var rect=e.target.getBoundingClientRect();
      var idStr=e.target.id||'';
      var m=idStr.match(/^opsMs2-(\d+)$/);
      if(!m)return;
      var idx=parseInt(m[1]);
      if(rect.top<topmostTop&&rect.bottom>80){
        topmostTop=rect.top;
        topmostIdx=idx;
      }
    });
    if(topmostIdx>=0){
      _opsStart=topmostIdx;
      updatePlanLbl(opsLabelForStart(topmostIdx));
    }
  },{threshold:[0,0.05,0.1]});
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec){
    _saScrollObs.observe(sec);
  });
}

function _saScrollToMonth(idx,smooth){
  var sec=document.getElementById('opsMs2-'+idx);
  if(!sec)return;
  // Reveal hidden past months if scrolling to one
  if(sec.style.display==='none')opsRevealPastMonths();
  // Scroll the window (page) to the section, accounting for hero height
  var rect=sec.getBoundingClientRect();
  var target=window.pageYOffset+rect.top-12;
  if(smooth!==false&&window.scrollTo){
    try{window.scrollTo({top:target,behavior:'smooth'});}catch(e){window.scrollTo(0,target);}
  } else {
    window.scrollTo(0,target);
  }
  _opsStart=idx;
  updatePlanLbl(opsLabelForStart(idx));
}

function planPrev(){

}
function planNext(){

try{var _z=parseInt(localStorage.getItem('opsZoom'));if(_z&&_z!==100)setTimeout(function(){opsSetZoom(_z);},50);}catch(e){}

function planToday(){

// Park today's column centre-left so most of the visible width is what's ahead
function _saScrollTodayX(){
  var sc=document.getElementById('opsScroll2');
  if(!sc)return;
  var cell=sc.querySelector('.ops-dh.td');
  if(!cell)return;
  var td=cell.closest('td');
  if(!td)return;
  var labelW=150;
  var x=td.offsetLeft-labelW-(sc.clientWidth-labelW)*0.22;
  sc.scrollLeft=Math.max(0,x);
}

// opsShowFromIdx: scroll to a given month index
function opsShowFromIdx(start){

}

// Override the main-app's opsReRender to re-render visible stacked months
function opsReRender(){
  if(!_saMonthsRendered)return;
  document.querySelectorAll('#opsBody2 .ops-ms2').forEach(function(sec,i){
    if(sec.style.display!=='none'){
      sec.innerHTML=opsRenderMonth(OPS_CAL[i],i);
    }
  });
  // Re-observe (new DOM nodes inside sections don't need re-observation, but
  // be defensive in case sections got replaced)
  _saSetupScrollObserver();
}
function opsReRenderAll(){opsReRender();}

// Stub plannerGoMonth — used by year view (which we don't render)
function plannerGoMonth(monthName){
  var mi=OPS_CAL.findIndex(function(m){return m.month===monthName;});
  if(mi>=0)_saScrollToMonth(mi,true);
}

// ── LOAD STATE FROM SUPABASE ON BOOT ─────────────────────────────────────────
async function bootstrap(){
  setStatus('work','Loading…');
  try{
    // Fetch in parallel: opsPlanner, opsBrk, jobs, bank_holidays, ml_tech_managers
    var KEYS=['opsPlanner','opsBrk','jobs','bank_holidays','ml_tech_managers'];
    var r=await fetch(_SB_URL+'/rest/v1/app_data?select=key,value&key=in.('+KEYS.join(',')+')',{headers:_sbGet()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json();
    var map={};rows.forEach(function(row){map[row.key]=row.value;});
    if(map.opsPlanner&&typeof map.opsPlanner==='object'){
      Object.keys(map.opsPlanner).forEach(function(k){_opsD[k]=map.opsPlanner[k];});
    }
    if(Array.isArray(map.opsBrk)){
      map.opsBrk.forEach(function(b){_opsBrk.push(b);});
    }
    if(Array.isArray(map.jobs)){
      map.jobs.forEach(function(j){jobs.push(j);});
    }
    if(Array.isArray(map.bank_holidays)){
      window._opsHolidays=map.bank_holidays.slice();
    }
    if(Array.isArray(map.ml_tech_managers)){
      window._opsTMCustom=map.ml_tech_managers.slice();
    }
    // Now seed studios from jobs (uses og/os — will trigger saves, so we suspend them)
    var _origSave=saveData;saveData=function(){};
    try{opsSeedFromJobs();}catch(e){console.warn('seed err',e);}
    try{_opsCleanStaleStudioEntries();}catch(e){console.warn('cleanup err',e);}
    var _seedChanged=false;
    try{_seedChanged=_opsCleanSeedJunk();}catch(e){console.warn('seed-junk cleanup err',e);}
    try{_seedChanged=_opsReconcileMLStaff()||_seedChanged;}catch(e){console.warn('ML reconcile err',e);}
    saveData=_origSave;
    // Persist seed-junk cleanup to Supabase so it sticks across reloads
    if(_seedChanged){try{saveData();}catch(e){console.warn('seed-junk save err',e);}}
    // Force a save with the cleaned-up state
    saveData();
    setStatus('','Synced');
  }catch(e){
    console.error('Bootstrap failed:',e);
    setStatus('err','Offline');
    toast('Could not connect to Supabase');
  }
  // Render initial view
  setPlanView('month');
}

// Boot
document.addEventListener('DOMContentLoaded',bootstrap);

// Light polling — every 30s pull latest opsPlanner so multi-user edits surface
setInterval(async function(){
  try{
    var r=await fetch(_SB_URL+'/rest/v1/app_data?select=value&key=eq.opsPlanner',{headers:_sbGet()});
    if(!r.ok)return;
    var rows=await r.json();
    if(rows&&rows[0]&&rows[0].value&&typeof rows[0].value==='object'){
      // Only update if not actively editing
      if(!_opsEd){
        var changed=false;var fresh=rows[0].value;
        Object.keys(fresh).forEach(function(k){
          var a=fresh[k],b=_opsD[k];
          if(JSON.stringify(a)!==JSON.stringify(b)){_opsD[k]=a;changed=true;}
        });
        Object.keys(_opsD).forEach(function(k){
          if(!fresh.hasOwnProperty(k)){delete _opsD[k];changed=true;}
        });
        if(changed)opsReRender();
      }
    }
  }catch(e){}
}, 30000);
