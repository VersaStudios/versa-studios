*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Roboto SemiBold','Roboto',-apple-system,system-ui,sans-serif;
  --cond:'Barlow Condensed',Impact,sans-serif;
  --cream:#efede3;
  --charcoal:#302f2c;
  --marigold:#F4A258;
  --white:#fff;
  --pure:#fff;
  --dark:#1a1a1c;
  --near-black:#0d0d0f;
  --border:rgba(216,90,97,.2);
  --muted:rgba(48,47,44,.5);
  --subtle:rgba(48,47,44,.7);
  --accent:#d85a61;
}
html,body{height:100%;background:#efede3;color:#302f2c;font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px}
body{margin:0;padding:0;min-height:100vh}

/* Top hero — wordmark logo + Ops Planner title, sits at top of page and scrolls naturally */
.sa-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 16px;background:transparent;flex-shrink:0;text-align:center}
.sa-logo-svg{height:38px;width:auto;color:#302f2c;flex-shrink:0}
.sa-title{font-family:var(--cond);font-size:32px;font-weight:900;color:#302f2c;letter-spacing:.10em;text-transform:uppercase;line-height:1}
.onav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Month header — restore the original Barlow Condensed look (MAY) +
   Barlow Regular for the year span (2026) which inherits font-family.
   Override the crushed negative letter-spacing for legibility. */
.ops-tbl tr.ops-mhdr > td{font-family:'Barlow',-apple-system,system-ui,sans-serif}
.ops-mhdr-txt{font-family:'Barlow Condensed',Impact,sans-serif !important;letter-spacing:0.03em !important}

/* Sticky left column — row labels stay visible when scrolling horizontally.
   Forced opaque cream so cells scrolling underneath don't bleed through.
   Red separator uses inset box-shadow (not border-right) because the table
   has border-collapse:collapse which would attach the border to the seam
   between sticky and non-sticky cells and make it drift. inset puts the
   red strip INSIDE the sticky cell, fixed to its right edge. */
.ops-tbl td.ops-rlbl{position:sticky !important;left:0 !important;background:#efede3 !important;z-index:2 !important;border-right:none !important;box-shadow:inset -1px 0 0 0 rgba(216,90,97,.25), 4px 0 8px -2px rgba(0,0,0,.06) !important}
/* Month/year header — pin its content to the left edge while the cell scrolls.
   Add left padding so the MAY text has breathing room from the cell edge. */
.ops-tbl tr.ops-mhdr > td{position:sticky;left:0;z-index:3}
.ops-tbl tr.ops-mhdr > td > div{position:sticky;left:0;width:calc((100vw - 52px) / var(--ns-zoom,1));padding-left:24px;justify-content:flex-start}
/* Day header row's leftmost (empty) cell — sticky at BOTH top and left so it
   stays in the top-left corner no matter how you scroll. Same inset red strip. */
.ops-tbl tr.ops-dhdr > td:first-child{position:sticky !important;left:0 !important;top:0 !important;z-index:12 !important;background:#efede3 !important;border-right:none !important;box-shadow:inset -1px 0 0 0 rgba(216,90,97,.25), 4px 0 8px -2px rgba(0,0,0,.06) !important}
/* Section rows (ops-srow) and gap rows span all columns — sticky their first cell */
.ops-tbl tr.ops-srow > td,.ops-tbl tr.ops-gap > td,.ops-tbl tr.ops-bigbreak > td{position:sticky;left:0;z-index:1}

.ops-srow td{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(184,79,85,.6);background:rgba(216,90,97,.06);padding:5px 14px;border-bottom:1px solid rgba(216,90,97,.15);border-top:2px solid rgba(216,90,97,.18)}
.ops-gap td{height:2px;background:transparent;border:none !important;padding:0}
.ops-bigbreak td{height:8px;background:#e9b8bc;border:none !important;padding:0}
.ops-dhdr td{background:rgba(255,251,246,.98);position:sticky;top:0;z-index:10}
.ops-dhdr td:first-child{z-index:11}
.ops-mhdr td{background:rgba(255,253,248,.98);padding:16px 20px 12px;border-bottom:2px solid rgba(216,90,97,.2)}
.ops-leg-row{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 16px;border-bottom:1px solid rgba(216,90,97,.15);flex-shrink:0;background:rgba(255,251,246,.95)}
.ops-leg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:rgba(184,79,85,.8)}
.ops-ldot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* Add-date helpers we need */
.fi{background:#fff;border:1.5px solid rgba(216,90,97,.25);color:#302f2c;padding:7px 10px;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:600;outline:none}
.fi:focus{border-color:#d85a61}
.flbl{font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(48,47,44,.6)}
.btn-p{background:#d85a61;color:#fff;border:1px solid #d85a61;padding:7px 14px;font-family:var(--cond);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;cursor:pointer}
.btn-p:hover{background:#b04048;border-color:#b04048}
.btn-sec{background:transparent;color:#d85a61;border:1px solid rgba(216,90,97,.3);padding:7px 14px;font-family:var(--cond);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;cursor:pointer}
.rm-btn{background:rgba(216,90,97,.1);border:1px solid rgba(216,90,97,.2);color:#d85a61;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.rm-btn:hover{background:#d85a61;color:#fff}

/* Modals */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:520px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(216,90,97,.15)}
.modal-title{font-family:var(--cond);font-size:18px;font-weight:900;letter-spacing:.04em;color:#302f2c}
.x-btn{background:transparent;border:none;font-size:20px;color:#302f2c;cursor:pointer;width:32px;height:32px;border-radius:50%}
.x-btn:hover{background:rgba(0,0,0,.06)}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid rgba(216,90,97,.12);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(40px);background:#302f2c;color:#fff;padding:10px 18px;border-radius:8px;font-family:var(--cond);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .3s,opacity .3s;opacity:0;z-index:9000;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Stacked-month layout */
.ops-ms2{padding:8px 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-margin-top:12px}
.ops-ms2:first-of-type{padding-top:0}

/* Mobile */
@media (pointer:coarse){
  .ops-cell{touch-action:auto}
}
@media (max-width:640px){
  .sa-sub{display:none}
  .vw-row{gap:6px;padding:8px 10px}
  .vw-lbl{min-width:auto;font-size:14px}
  .ops-leg-row{padding:6px 10px}

  /* ── Phone pass ── */
  /* Row labels: slimmer column so day cells get the width */
  .ops-rlbl{font-size:13px;width:88px;min-width:88px;padding:7px 8px;letter-spacing:.02em}

  /* Month banner: smaller name, tighter strip, buttons wrap under */
  .ops-mhdr-txt{font-size:clamp(26px,9vw,40px);min-width:0}
  .ops-tbl tr.ops-mhdr > td > div{width:calc((100vw - 20px) / var(--ns-zoom,1));padding-left:10px;gap:8px}
  .mnav{margin-left:0;gap:5px;padding-bottom:4px}
  .mnav-b{padding:5px 9px;font-size:12px;border-width:1.5px}

  /* Zoom pill: bottom-right where a thumb can reach, out of the banner's way */
  .ops-zoom{top:auto;bottom:14px;right:10px;padding:5px 10px}
  .ops-zoom input[type=range]{width:76px}

  /* Chips & cells: slightly denser */
  .ops-chip{font-size:12px;padding:3px 7px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ops-cell{min-width:96px}

  /* Modals fill the phone sensibly */
  .modal-ov > div, .modal{width:calc(100vw - 20px) !important;max-width:calc(100vw - 20px) !important;max-height:88vh;overflow-y:auto}

  /* Popup: never wider than the screen */
  .ops-ced{width:min(258px,calc(100vw - 16px))}
}

/* ════════════════════════════════════════════════════════════════════════════
   RUNDOWN THEME (b57) — white paper, charcoal rules, heavy condensed capitals.
   Everything below overrides earlier rules; delete this block to go back.
   ════════════════════════════════════════════════════════════════════════════ */
:root{--rd-ink:#302f2c;--rd-soft:#6b6a64;--rd-rule:#e7e4da;--rd-dash:#ebe8df;--rd-wk:#faf8f3;--rd-sel:#fff6e9;--rd-mari:#F4A258;--rd-red:#d85a61;--rd-cond:'Barlow Condensed','Arial Narrow',Impact,sans-serif}

.ops-tbl{background:#fff!important;box-shadow:0 0 0 2px var(--rd-ink)}
/* month banner */
.ops-mhdr td{background:#fff!important;border-bottom:2px solid var(--rd-ink)!important;padding:16px 20px 12px!important}
.ops-mhdr-txt{font-family:var(--rd-cond)!important;font-size:clamp(46px,6vw,76px)!important;font-weight:900!important;letter-spacing:.01em!important;color:var(--rd-ink)!important;line-height:.85!important}
.mnav-b{border:2px solid var(--rd-ink)!important;border-radius:4px!important;color:var(--rd-ink)!important;background:#fff!important;font-family:var(--rd-cond)!important;font-size:18px!important;font-weight:900!important;letter-spacing:.06em!important;padding:9px 15px!important}
.mnav-b:hover{background:var(--rd-sel)!important}
.mnav-b.mnav-add{background:var(--rd-mari)!important;color:var(--rd-ink)!important}
.mnav-b.mnav-email{background:var(--rd-ink)!important;color:#fff!important}
/* day header */
.ops-dhdr td{background:#fff!important;border-right:1px dashed var(--rd-dash)!important;border-bottom:2px solid var(--rd-ink)!important;min-width:128px!important}
.ops-tbl tr.ops-dhdr > td:first-child{min-width:220px!important;background:#fff!important;box-shadow:inset -2px 0 0 var(--rd-ink)!important}
.ops-dh{display:flex!important;align-items:baseline;justify-content:flex-start;gap:4px;padding:10px 8px 8px 10px!important;background:transparent!important;text-align:left!important}
.ops-dh>span{font-family:var(--rd-cond)!important;font-size:15px!important;font-weight:900!important;letter-spacing:.08em!important;color:var(--rd-soft)!important;margin:0!important;display:inline!important}
.ops-dh .dn-wrap{width:auto!important;height:auto!important;background:none!important;box-shadow:none!important;border-radius:0!important;margin:0!important;display:inline!important;font-family:var(--rd-cond)!important;font-size:34px!important;font-weight:900!important;color:var(--rd-ink)!important;line-height:1!important}
.ops-dh.wk{background:transparent!important}
.ops-dhdr td.rd-wk{background:var(--rd-wk)!important}
.ops-dh.td>span,.ops-dh.td .dn-wrap{color:var(--rd-red)!important}
.ops-dhdr td.rd-td{border-bottom-color:var(--rd-red)!important}
.ops-dh.hol{flex-wrap:wrap}
/* cells */
.ops-cell{background:#fff!important;border-right:1px dashed var(--rd-dash)!important;border-bottom:1px solid var(--rd-rule)!important;min-width:128px!important;height:64px;padding:5px!important;vertical-align:middle!important}
.ops-cell.wk{background:var(--rd-wk)!important}
.ops-cell.td{background:#fff!important;box-shadow:inset 2px 0 0 rgba(216,90,97,.35),inset -2px 0 0 rgba(216,90,97,.35)}
.ops-cell:hover{background:var(--rd-sel)!important}
.ops-cell.ops-drag-target,.ops-cell.ops-drag-sel{background:rgba(244,162,88,.2)!important}
.ops-mt::after{content:'+'!important;color:#d9d5ca!important;font-size:22px!important;font-weight:700!important;padding:0 6px!important}
.ops-cell:hover .ops-mt::after{color:var(--rd-soft)!important}
/* chips */
.ops-chip{--cc:#d85a61;font-family:var(--rd-cond)!important;font-size:18px!important;font-weight:800!important;letter-spacing:.03em!important;text-transform:uppercase;color:var(--rd-ink)!important;background:color-mix(in srgb,var(--cc) 13%,#fff)!important;border:none!important;border-left:5px solid var(--cc)!important;border-radius:0 3px 3px 0!important;box-shadow:none!important;-webkit-text-stroke:0!important;padding:7px 12px 7px 11px!important;line-height:1.1!important}
.ops-chip::before,.ops-chip::after{background:rgba(48,47,44,.1)!important}
.ops-chip:hover::before,.ops-chip:hover::after{background:rgba(48,47,44,.3)!important}
.ops-andrew{--cc:#3a8a55}.ops-chris{--cc:#b08a10}.ops-ian{--cc:#2060b0}.ops-event{--cc:#1a8a8a}.ops-lav{--cc:#8c6cc0}.ops-ldn{--cc:#1a4e8a}.ops-mcr{--cc:#2a6e3a}.ops-mint{--cc:#4aa874}.ops-note{--cc:#d85a61}.ops-prod{--cc:#c07326}.ops-rose{--cc:#c85a80}.ops-sand{--cc:#b89456}.ops-show{--cc:#c03030}.ops-sky{--cc:#4a8fc8}.ops-slate{--cc:#6a7c90}.ops-so{--cc:#8a3f8f}.ops-ml{--cc:#2d7dd2}
.ops-chip.ops-brk{--cc:#302f2c;background:repeating-linear-gradient(135deg,#f3f1ea 0 6px,#fff 6px 12px)!important;color:var(--rd-soft)!important;text-align:left!important;font-size:16px!important}
.ops-htl{font-family:var(--rd-cond)!important;background:#c9a24a!important;color:var(--rd-ink)!important;border:none!important;border-radius:2px!important;box-shadow:none!important;-webkit-text-stroke:0!important;font-size:14px!important;padding:3px 8px!important}
/* row labels */
.ops-tbl td.ops-rlbl{background:#fff!important;box-shadow:inset 12px 0 0 var(--bar,#d85a61),inset -2px 0 0 var(--rd-ink),inset 0 -1px 0 var(--rd-rule)!important;border:none!important;width:220px!important;min-width:220px!important;max-width:220px!important;height:64px;padding:0 10px 0 24px!important;font-family:var(--rd-cond)!important;white-space:normal!important}
.ops-rlbl .nm{display:block;color:var(--rd-ink);font-size:32px;font-weight:900;letter-spacing:.01em;line-height:.95;text-transform:uppercase;max-height:62px;overflow:hidden;padding:2px 0;word-break:keep-all}
.ops-rlbl-x{display:none!important}
.ops-bigbreak td{height:6px!important;background:var(--rd-ink)!important}
.ops-gap td{height:0!important}
/* cell popup */
.ops-ced{background:#fff!important;border:2px solid var(--rd-ink)!important;border-radius:4px!important;box-shadow:8px 8px 0 rgba(48,47,44,.16)!important;width:360px!important;padding:0!important;color:var(--rd-ink)}
.rd-ph{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:2px solid var(--rd-ink);position:sticky;top:0;background:#fff;z-index:2}
.rd-ph .when{font-size:17px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--rd-red)}
.rd-ph .who{font-size:38px;font-weight:900;line-height:.95;text-transform:uppercase}
.rd-ph button{margin-left:auto;flex-shrink:0;width:42px;height:42px;border:2px solid var(--rd-ink);border-radius:4px;background:#fff;font:900 24px/1 var(--rd-cond);color:var(--rd-ink);cursor:pointer}
.rd-add{display:flex;margin:12px 14px 6px;border:2px solid var(--rd-ink);border-radius:4px;overflow:hidden}
.rd-add .ops-ci{flex:1;min-width:0;width:auto!important;margin:0!important;border:none!important;border-radius:0!important;box-shadow:none!important;padding:12px!important;font:800 20px var(--rd-cond)!important;text-transform:uppercase;letter-spacing:.03em;color:var(--rd-ink)!important}
.rd-add .ops-ci::placeholder{text-transform:uppercase;color:#aaa69b}
.rd-add button{text-transform:uppercase;border:none;border-left:2px solid var(--rd-ink);background:var(--rd-mari);color:var(--rd-ink);font:900 19px var(--rd-cond);letter-spacing:.06em;padding:0 18px;cursor:pointer}
.ops-cs{font-family:var(--rd-cond)!important;font-size:15px!important;font-weight:900!important;letter-spacing:.12em!important;color:var(--rd-soft)!important;padding:12px 14px 4px!important;margin:0!important}
.ops-co{font-family:var(--rd-cond)!important;font-size:22px!important;font-weight:900!important;letter-spacing:.03em!important;text-transform:uppercase;color:var(--rd-ink)!important;padding:11px 14px!important;gap:12px!important;border-bottom:1px solid #eeebe2}
.ops-co:hover{background:var(--rd-sel)!important}
.ops-co.sel{background:var(--rd-sel)!important;box-shadow:inset 5px 0 0 var(--rd-mari)}
.ops-cd{width:14px!important;height:30px!important;border-radius:0!important;border:none!important}
.ops-ck{font-size:20px!important;color:var(--rd-ink)!important;font-weight:900}
.ops-div{height:0!important;margin:0!important;border-top:2px solid var(--rd-ink)}
.ops-ced .ops-ci-sw{width:auto!important;height:auto!important;display:inline-flex!important;align-items:center;padding:6px 10px!important;margin:3px 2px!important;border-radius:4px!important;border:2px solid var(--rd-rule);border-left:14px solid transparent!important;background-clip:border-box!important;box-shadow:inset 0 0 0 99px #fff;font:900 15px var(--rd-cond);letter-spacing:.05em;text-transform:uppercase;color:var(--rd-ink)}
.ops-ced .ops-ci-sw::after{content:attr(title)}
.ops-ced .ops-ci-sw[data-cls=""]{border-left-color:#d9d5ca!important}
@media (max-width:640px){
  .ops-ced{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;max-height:80vh!important;border-radius:10px 10px 0 0!important;border-bottom:none!important;box-shadow:0 -10px 30px rgba(48,47,44,.25)!important}
  .ops-tbl td.ops-rlbl{width:132px!important;min-width:132px!important;max-width:132px!important;box-shadow:inset 7px 0 0 var(--bar,#d85a61),inset -2px 0 0 var(--rd-ink),inset 0 -1px 0 var(--rd-rule)!important;padding-left:14px!important;padding-right:6px!important}
  .ops-tbl tr.ops-dhdr > td:first-child{min-width:132px!important}
  .ops-dhdr td,.ops-cell{min-width:118px!important}
  .ops-chip{font-size:16px!important}
}

body.rd-compact .ops-mhdr td{padding:10px 14px 8px!important}
body.rd-compact .ops-mhdr-txt{font-size:clamp(32px,4vw,48px)!important}

body.rd-compact .ops-dh .dn-wrap{font-size:22px!important}

/* Add to calendar (b60) */

.rd-a-text{margin:0 0 10px!important}
.rd-a-quick{display:flex;flex-wrap:wrap;gap:6px}

.rd-a-hint{margin:0 0 8px;font:800 16px var(--rd-cond);text-transform:uppercase;letter-spacing:.04em;color:var(--rd-soft)}
.rd-a-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.rd-a-mode{margin-left:0!important}

.rd-a-clr{color:#b8434b}
.rd-a-cal{border:2px solid var(--rd-ink);border-radius:4px;max-width:520px}
.rd-a-calhd{display:flex;align-items:center;justify-content:space-between;padding:6px;border-bottom:2px solid var(--rd-ink)}
.rd-a-calhd b{font:900 24px var(--rd-cond);text-transform:uppercase}
.rd-a-calhd button{width:44px;height:40px;border:2px solid var(--rd-ink);border-radius:4px;background:#fff;font:900 20px var(--rd-cond);cursor:pointer;color:var(--rd-ink)}
.rd-a-calhd button:disabled{opacity:.25;cursor:default}
.rd-a-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px}
.rd-a-dow{text-align:center;font:900 13px var(--rd-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--rd-soft);padding:2px 0}
.rd-a-day{height:48px;border:none;border-radius:4px;background:#fff;font:900 22px var(--rd-cond);color:var(--rd-ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.rd-a-day:hover{background:var(--rd-sel)}
.rd-a-day.wk{background:var(--rd-wk);color:var(--rd-soft)}
.rd-a-day.today{box-shadow:inset 0 0 0 2px var(--rd-red);color:var(--rd-red)}
.rd-a-day[aria-pressed="true"]{background:var(--rd-ink);color:#fff}
.rd-a-day.start{background:var(--rd-mari);color:var(--rd-ink)}
.rd-a-day:disabled{opacity:.2;cursor:default}
.rd-a-ft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:2px solid var(--rd-ink);position:sticky;bottom:0;background:#fff}
.rd-a-sum{flex:1;min-width:220px;font:800 18px var(--rd-cond);letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.rd-a-sum small{display:block;font-size:14px;color:var(--rd-soft);margin-top:2px}
.rd-a-need{color:var(--rd-soft)}
.rd-a-err{color:#b8434b}
.rd-a-btns{display:flex;gap:8px;margin-left:auto}
.rd-a-cancel,.rd-a-go{border:2px solid var(--rd-ink);border-radius:4px;font:900 20px var(--rd-cond);letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;cursor:pointer}
.rd-a-cancel{background:#fff;color:var(--rd-ink)}
.rd-a-go{background:var(--rd-mari);color:var(--rd-ink);min-width:120px}
#rdAdd button:focus-visible,#rdAdd input:focus-visible{outline:3px solid var(--rd-mari);outline-offset:2px}
@media (min-width:980px){

}

.mnav-b.rd-set{background:#fff!important}
.rd-x:focus-visible,.rd-sheet-ft button:focus-visible{outline:3px solid var(--rd-mari);outline-offset:2px}
@media (max-width:640px){.rd-sheet{align-items:flex-end;padding:0}.rd-sheet-in{width:100%;max-height:90vh;border-radius:10px 10px 0 0;border-bottom:none}}

.rd-fields{display:flex;gap:10px;padding:8px 14px;flex-wrap:wrap;align-items:flex-end}

.rd-f input,.rd-f select{border:2px solid var(--rd-ink);border-radius:4px;padding:9px 10px;font:800 19px var(--rd-cond);color:var(--rd-ink);background:#fff;min-width:0;width:100%;box-sizing:border-box}
.rd-btn{border:2px solid var(--rd-ink);border-radius:4px;background:var(--rd-mari);color:var(--rd-ink);font:900 18px var(--rd-cond);letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;cursor:pointer;flex:1}

.rd-sw button{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--rd-rule);border-radius:4px;background:#fff;padding:6px 10px 6px 8px;font:900 16px var(--rd-cond);letter-spacing:.05em;text-transform:uppercase;color:var(--rd-ink);cursor:pointer}
.rd-sw button::before{content:"";width:12px;height:22px;background:var(--cc)}
.rd-sw button[aria-pressed="true"]{border-color:var(--rd-ink);box-shadow:inset 0 -3px 0 var(--rd-mari)}

@media (max-width:640px){.rd-presets{margin-left:0}.rd-presets button{font-size:16px;padding:9px 11px}.rd-stu{font-size:20px;min-height:48px}}

/* ════════════════════════════════════════════════════════════════════════════
   NIGHT SHIFT THEME (b65) — Roll call look: dark rounded card, soft colours,
   Inter Tight. Sits on top of the Rundown layout rules; delete to go back.
   ════════════════════════════════════════════════════════════════════════════ */
:root{--ns-page:#ececec;--ns-card:#1a1a19;--ns-cell:#232322;--ns-cell2:#2c2b29;--ns-wk:#1f1f1e;--ns-text:#f2f1ee;--ns-soft:#8f8d88;--ns-ink:#111110;
--ns-orange:#f04b23;--ns-sage:#c3cfb2;--ns-sand:#d9d2c7;--ns-head:'Inter Tight','Inter',-apple-system,system-ui,sans-serif;--ns-body:'Inter',-apple-system,system-ui,sans-serif}
html,body{background:var(--ns-page)!important;color:var(--ns-ink)}
.ops-tbl,.ops-ced,#opsStuPanel,.rd-sheet-in{font-family:var(--ns-body)!important}
/* masthead */
.sa-top{flex-direction:row!important;justify-content:flex-start!important;align-items:center!important;gap:14px!important;padding:22px 24px 10px!important;text-align:left!important}
.sa-top::before{content:"";width:22px;height:34px;background:var(--ns-ink);flex-shrink:0;order:0}
.sa-title{order:1;font-family:var(--ns-head)!important;font-size:34px!important;font-weight:800!important;letter-spacing:-.03em!important;text-transform:none!important;color:var(--ns-ink)!important}
.sa-logo-svg{order:2;margin-left:auto;height:22px!important;color:var(--ns-ink)!important}
/* month card */
.ops-ms2{background:var(--ns-card);border-radius:28px;margin:10px 12px 16px;padding:8px 6px 12px!important}
.ops-show-prev,.ops-restore-stu{font-family:var(--ns-head)!important;border:none!important;border-radius:999px!important;background:var(--ns-sand)!important;color:var(--ns-ink)!important;font-size:14px!important;font-weight:700!important;letter-spacing:0!important;text-transform:none!important;padding:9px 18px!important}
.ops-tbl{border-collapse:separate!important;border-spacing:6px!important;background:transparent!important;box-shadow:none!important}
.ops-mhdr td{background:transparent!important;border:none!important;padding:10px 14px 6px!important}
.ops-mhdr-txt{font-family:var(--ns-head)!important;font-size:clamp(36px,4.6vw,56px)!important;font-weight:800!important;letter-spacing:-.035em!important;color:var(--ns-text)!important;line-height:1!important;text-transform:none!important}
.ops-mhdr td span[style]:not(.ops-mhdr-txt){color:var(--ns-soft)!important;font-family:var(--ns-body)!important;font-weight:500!important}
.mnav{gap:6px!important;margin-left:12px!important;padding-bottom:4px!important}
.mnav-b{font-family:var(--ns-head)!important;font-size:15px!important;font-weight:700!important;letter-spacing:-.005em!important;text-transform:none!important;border:none!important;border-radius:999px!important;padding:10px 16px!important;background:var(--ns-sage)!important;color:var(--ns-ink)!important}
.mnav-b:hover{filter:brightness(1.05)}
.mnav-b.mnav-add{background:var(--ns-orange)!important;color:var(--ns-ink)!important}
.mnav-b.mnav-email,.mnav-b.rd-set{background:var(--ns-sand)!important;color:var(--ns-ink)!important}
/* day header */
.ops-dhdr td,.ops-tbl tr.ops-dhdr > td:first-child{background:var(--ns-card)!important;border:none!important;box-shadow:none!important}
.ops-tbl tr.ops-dhdr > td:first-child{box-shadow:-6px 0 0 var(--ns-card),6px 0 0 var(--ns-card)!important}
.ops-dhdr td.rd-wk{background:var(--ns-card)!important}
.ops-dh{align-items:center!important;gap:6px!important;padding:6px 8px!important}
.ops-dh>span{font-family:var(--ns-body)!important;font-size:13px!important;font-weight:500!important;letter-spacing:0!important;color:var(--ns-soft)!important;display:inline-block!important;text-transform:lowercase}
.ops-dh>span::first-letter{text-transform:uppercase}
.ops-dh .dn-wrap{font-family:var(--ns-head)!important;font-size:22px!important;font-weight:800!important;letter-spacing:-.02em!important;color:var(--ns-text)!important;min-width:34px;height:34px!important;border-radius:50%!important;display:inline-flex!important;align-items:center;justify-content:center}
.ops-dh.td>span{color:var(--ns-text)!important}
.ops-dh.td .dn-wrap{background:var(--ns-orange)!important;color:var(--ns-ink)!important}
.ops-dh.wk .dn-wrap{color:#bdbbb5!important}
/* cells */
.ops-tbl .ops-cell{background:var(--ns-cell)!important;border:none!important;border-radius:14px;height:54px;padding:0!important;min-width:128px!important}
.ops-tbl .ops-cell.wk{background:var(--ns-wk)!important}
.ops-tbl .ops-cell.td{box-shadow:inset 0 0 0 1.5px rgba(240,75,35,.6)!important}
.ops-tbl .ops-cell:hover{background:var(--ns-cell2)!important}
.ops-tbl .ops-cell.ops-drag-target,.ops-tbl .ops-cell.ops-drag-sel,.ops-tbl .ops-cell.ops-drag-dest{background:rgba(240,75,35,.28)!important;outline:none!important}
.ops-mt::after{color:#4a4945!important;font-family:var(--ns-body)!important;font-weight:500!important;font-size:20px!important;text-align:center}
.ops-cell:hover .ops-mt::after{color:var(--ns-soft)!important}
/* chips */
.ops-tbl .ops-cell .ops-chip,.ops-chip{font-family:var(--ns-head)!important;font-size:15px!important;font-weight:700!important;letter-spacing:-.01em!important;text-transform:none!important;color:var(--ns-ink)!important;background:color-mix(in srgb,var(--cc) 40%,#f4f2ee)!important;border:none!important;border-radius:14px!important;padding:6px 14px!important;line-height:1.15!important;box-shadow:none!important;gap:8px}
.ops-tbl .ops-cell > .ops-chip:only-of-type{min-height:54px!important}
.ops-chip::before,.ops-chip::after{background:transparent!important}
.ops-chip:hover::before,.ops-chip:hover::after{background:rgba(17,17,16,.22)!important}
.ops-tbl .ops-cell .ops-chip.ns-alert,.ops-chip.ns-alert{background:var(--ns-orange)!important}
.ops-tbl .ops-cell .ops-chip.ops-brk,.ops-chip.ops-brk{background:#2a2928!important;color:var(--ns-soft)!important;font-weight:600!important}
.ns-rng{margin-left:auto;padding-left:10px;font-family:var(--ns-body);font-size:12px;font-weight:600;opacity:.6;white-space:nowrap;pointer-events:none}
.ops-htl{font-family:var(--ns-head)!important;background:var(--ns-text)!important;color:var(--ns-ink)!important;border-radius:999px!important;font-size:12px!important;padding:3px 8px!important}
/* row labels */
.ops-tbl td.ops-rlbl{background:var(--ns-card)!important;box-shadow:-6px 0 0 var(--ns-card),6px 0 0 var(--ns-card)!important;border:none!important;padding:0 8px 0 32px!important;height:54px}
.ops-tbl td.ops-rlbl::before{content:"";position:absolute;left:12px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--bar,#f04b23)}
.ops-rlbl .nm{font-family:var(--ns-head)!important;color:var(--ns-text)!important;font-weight:800!important;letter-spacing:-.02em!important;line-height:1.02!important;text-transform:none!important;max-height:54px}
.ops-bigbreak td{height:10px!important;background:transparent!important;box-shadow:none!important}
/* cell popup */
.ops-ced{background:#242423!important;color:var(--ns-text)!important;border:none!important;border-radius:28px!important;box-shadow:0 24px 60px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.2)!important;padding:10px 0 12px!important}
.rd-ph{background:#242423!important;border-bottom:none!important;padding:10px 16px 8px!important}
.rd-ph .who{font-family:var(--ns-head);font-size:30px!important;font-weight:800!important;letter-spacing:-.03em;text-transform:none!important;color:var(--ns-text)}
.rd-ph .when{font-family:var(--ns-body);font-size:14px!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;color:var(--ns-soft)!important}
.rd-ph button,.rd-x{border:none!important;border-radius:50%!important;background:#353432!important;color:var(--ns-text)!important;font:500 22px/1 var(--ns-body)!important}
.rd-add{border:none!important;border-radius:16px!important;gap:6px;background:transparent;overflow:visible!important}
.rd-add .ops-ci{background:#2f2e2c!important;color:var(--ns-text)!important;border-radius:16px!important;font:600 16px var(--ns-body)!important;text-transform:none!important;letter-spacing:0!important}
.rd-add .ops-ci::placeholder{text-transform:none!important;color:#7d7b76!important}
.rd-add button{border:none!important;border-radius:999px!important;background:var(--ns-orange)!important;color:var(--ns-ink)!important;font:700 16px var(--ns-head)!important;text-transform:none!important;letter-spacing:0!important;padding:0 20px!important}
.ops-cs{font-family:var(--ns-body)!important;font-size:13px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important;color:var(--ns-soft)!important;padding:10px 18px 6px!important}
.ops-co{font-family:var(--ns-head)!important;font-size:17px!important;font-weight:700!important;letter-spacing:-.01em!important;text-transform:none!important;color:var(--ns-text)!important;background:#2f2e2c;border:none!important;border-radius:14px;margin:0 12px 6px;padding:11px 14px!important}
.ops-co:hover{background:#3a3937!important}
.ops-co.sel{background:var(--ns-sage)!important;color:var(--ns-ink)!important;box-shadow:none!important}
.ops-cd{width:12px!important;height:12px!important;border-radius:50%!important}
.ops-ck{color:var(--ns-ink)!important}
.ops-div{border-top:none!important;height:6px!important;background:transparent!important}
.ops-ced .ops-ci-sw{border:none!important;border-left:14px solid transparent!important;border-radius:999px!important;box-shadow:inset 0 0 0 99px #2f2e2c!important;color:var(--ns-text)!important;font:600 14px var(--ns-body)!important;text-transform:none!important;letter-spacing:0!important}
.rd-fields{padding:6px 16px!important}
.rd-f span{font:600 13px var(--ns-body)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ns-soft)!important}
.rd-f input,.rd-f select{border:none!important;border-radius:14px!important;background:#2f2e2c!important;color:var(--ns-text)!important;font:600 16px var(--ns-body)!important;color-scheme:dark}
.rd-btn{border:none!important;border-radius:999px!important;background:var(--ns-orange)!important;color:var(--ns-ink)!important;font:700 15px var(--ns-head)!important;text-transform:none!important;letter-spacing:0!important}
.rd-sw{padding:4px 16px 12px!important}
.rd-sw button{border:none!important;border-radius:999px!important;background:#2f2e2c!important;color:var(--ns-text)!important;font:600 14px var(--ns-body)!important;text-transform:none!important;letter-spacing:0!important}
.rd-sw button::before{width:10px!important;height:10px!important;border-radius:50%}
.rd-sw button[aria-pressed="true"]{background:var(--ns-sage)!important;color:var(--ns-ink)!important;box-shadow:none!important}
/* sheets: settings + add to calendar */
#rdSettings #opsStuPanel{background:transparent!important;border:none!important}
.ops-dhdr td.ops-rlbl::before{display:none!important}
.rd-ph>div{display:flex;flex-direction:column-reverse}
.rd-sheet{background:rgba(17,17,16,.5)!important}
.rd-sheet-in{background:#242423!important;color:var(--ns-text)!important;border:none!important;border-radius:28px!important;box-shadow:0 30px 80px rgba(0,0,0,.5)!important}
.rd-sheet-hd,.rd-sheet-ft,.rd-a-ft{background:#242423!important;border:none!important}

.ex-totals{display:block!important}

.ex-totals span+span::before{content:" \00b7  "}
.ex-totals span b{background:none!important;padding:0!important;color:var(--ns-text)!important;font-weight:600!important}

/* b96: month picker in the planner style; small Undo in the bottom-right corner */
.ns-mpk{position:fixed;inset:0;z-index:998;background:rgba(17,17,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px}

.ns-mpk-in{width:min(300px,100%);max-height:72vh;overflow-y:auto;padding:8px 10px 12px;border-radius:24px;background:#242423;box-shadow:0 30px 80px rgba(0,0,0,.5)}
html.ns-light .ns-mpk-in{background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.14)}
.ns-mpk-y{margin:14px 12px 4px;font:600 12px var(--ns-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ns-soft)}
.ns-mpk-m{display:flex;align-items:baseline;justify-content:space-between;width:100%;border:none;border-bottom:1px solid var(--ns-cell2);background:none;padding:11px 12px;text-align:left;font:700 18px var(--ns-head);letter-spacing:-.02em;color:var(--ns-text);cursor:pointer}

.ns-undo{left:auto!important;right:20px!important;bottom:20px!important;gap:12px!important;padding:8px 8px 8px 14px!important;border-radius:12px!important;font:600 13px var(--ns-body)!important;transform:translateY(160%)!important}
.ns-undo.show{transform:translateY(0)!important}
.ns-undo button{background:none!important;color:var(--ns-orange,#f04b23)!important;font:700 13px var(--ns-body)!important;padding:4px 8px!important;border-radius:8px!important}
.ns-undo button:hover{background:rgba(255,255,255,.08)!important}

/* b97: crew popup with times + section pickers */
.ns-cr-day{margin:-2px 8px 4px;font:500 12px var(--ns-body);color:var(--ns-soft)}

.ns-cr-top{display:flex;align-items:baseline;gap:8px;min-width:0}

.ops-co.ns-cr-sec{display:flex;align-items:center;gap:8px;cursor:pointer}
.ns-cr-count{margin-left:auto;font:500 13px var(--ns-body);color:var(--ns-soft)}

.ns-cr-links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 4px 2px}
.ns-cr-links .ns-crew-edit{margin:0!important}
.ns-cp-in{width:min(460px,100%)!important;display:flex;flex-direction:column;overflow:hidden!important}
.ns-cp-hd{min-width:0}
.ns-cp-sub{margin:4px 0 0;font:500 14px var(--ns-body);color:var(--ns-soft)}
.ns-cp-body{padding:0 14px 8px!important}
.ops-co.ns-cp-row{display:flex;align-items:center;gap:8px;cursor:pointer}

.ns-cp-ft .ns-lock-link{background:none!important;color:var(--ns-soft)!important;font:600 13px var(--ns-body)!important;text-decoration:underline;padding:4px 0!important;border:none!important;box-shadow:none!important}
.ops-co.ns-cp-row .ops-ck{color:var(--ns-orange)!important;font-weight:800}

/* b98: one-line crew rows, click a name to add times */
.ns-cr-line{display:flex;align-items:center;gap:6px;min-height:40px;padding:2px 2px 2px 4px;border-bottom:1px solid var(--ns-cell2)}
.ns-cr-name{flex:0 1 auto;min-width:0;border:none;background:none;padding:6px 0;text-align:left;font:600 15px var(--ns-body);color:var(--ns-text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ns-cr-all.ns-cr-open{padding-right:34px}

// Seed-junk cleanup: date stubs, weekend ML, [MCR]/[LDN] strip,
// "ML Ep##" → "Morning Live Ep##" in studio rows, "Morning Live ML X" → "Morning Live X",
// and dedupe. "DD" entries intentionally NOT filtered (Andrew uses DD = Dragons Den).
// Returns true if anything changed.
function _opsCleanSeedJunk(){
  if(!_opsD)return false;
  var changed=false;
  var JUNK_DATE_RX=/^[A-Z][a-z]{2}-\d{2}$/;
  var LOC_PREFIX_RX=/^\[(MCR|LDN)\]\s*/;
  var ML_EP_RX=/^ML\s+(Ep\d|Episode)/i;
  var WKND={};
  try{
    OPS_CAL.forEach(function(m){
      m.days.forEach(function(d){
        if(/^SATURDAY|^SUNDAY/i.test(d.dow))WKND[m.month+'|'+d.day]=true;
      });
    });
  }catch(e){}
  Object.keys(_opsD).forEach(function(k){
    var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
    var parts=k.split('|');
    var rowKey=parts.length===3?parts[2]:'';
    var isWeekend=parts.length>=2?(WKND[parts[0]+'|'+parts[1]]||false):false;
    var isStudioRow=rowKey.indexOf('st_')===0;
    var filtered=arr.filter(function(v){
      var txt=(typeof v==='string')?v:(v&&typeof v.text==='string'?v.text:'');
      if(!txt)return true;
      if(JUNK_DATE_RX.test(txt))return false;
      if(rowKey==='ml'&&isWeekend&&/MORNING LIVE/i.test(txt))return false;
      return true;
    });
    var normalized=filtered.map(function(v){
      if(typeof v!=='string')return v;
      var out=v.replace(LOC_PREFIX_RX,'');
      // Strip "ML" between "Morning Live" and the rest, preserving the separator
      // (handles em-dash, en-dash, hyphen, or just whitespace).
      out=out.replace(/^(Morning Live)([\s\u2014\u2013-]+)ML\s+/i,'$1$2');
      if(isStudioRow)out=out.replace(ML_EP_RX,'Morning Live $1');
      return out;
    });

    normalized.forEach(function(v){
      var key=(typeof v==='string')?('s:'+v):JSON.stringify(v);
      if(!seen[key]){seen[key]=true;deduped.push(v);}
    });
    if(deduped.length!==arr.length||deduped.some(function(v,i){return JSON.stringify(v)!==JSON.stringify(arr[i]);})){_opsD[k]=deduped;changed=true;}
  });

  // silently cleared people's entries on neighbouring days. Blocks are made with Days.
  if(false)try{
    OPS_CAL.forEach(function(m){
      var rowsInMonth={};
      Object.keys(_opsD).forEach(function(k){
        var p=k.split('|');
        if(p[0]===m.month&&p.length===3)rowsInMonth[p[2]]=true;
      });
      Object.keys(rowsInMonth).forEach(function(row){
        if(row==='ml')return;
        var i=0;
        while(i<m.days.length){
          var dayI=m.days[i].day;
          var valsI=_opsD[m.month+'|'+dayI+'|'+row]||[];
          if(valsI.length!==1){i++;continue;}
          var v0=valsI[0];
          if(v0&&typeof v0==='object'&&v0.span&&v0.span>1){i+=v0.span;continue;}
          var textI=(typeof v0==='string')?v0:(v0&&v0.text?v0.text:'');
          if(!textI){i++;continue;}
          var j=i+1;
          while(j<m.days.length){
            var dayJ=m.days[j].day;
            var valsJ=_opsD[m.month+'|'+dayJ+'|'+row]||[];
            if(valsJ.length!==1)break;
            var vJ=valsJ[0];
            if(vJ&&typeof vJ==='object'&&vJ.span&&vJ.span>1)break;
            var textJ=(typeof vJ==='string')?vJ:(vJ&&vJ.text?vJ.text:'');
            if(textJ!==textI)break;
            if(((vJ&&typeof vJ==='object'&&vJ.note)||'')!==((v0&&typeof v0==='object'&&v0.note)||''))break;
            if(JSON.stringify((vJ&&typeof vJ==='object'&&vJ.crew)||[])!==JSON.stringify((v0&&typeof v0==='object'&&v0.crew)||[]))break;
            j++;
          }
          var len=j-i;
          if(len>1){
            var spanEntry={text:textI,span:len};
            if(v0&&typeof v0==='object'){
              if(v0.cls)spanEntry.cls=v0.cls;
              if(v0.color)spanEntry.color=v0.color;
              if(v0.note)spanEntry.note=v0.note;
              if(v0.crew&&v0.crew.length)spanEntry.crew=v0.crew;
            }
            _opsD[m.month+'|'+dayI+'|'+row]=[spanEntry];
            for(var kk=i+1;kk<j;kk++){
              _opsD[m.month+'|'+m.days[kk].day+'|'+row]=[];
            }
            changed=true;
          }
          i=j;
        }
      });
    });
  }catch(e){}

  //   - Object span entries with no/empty text  (the "phantom merge" bug)
  //   - null/undefined entries
  //   - empty or whitespace-only string entries
  //   - Span attribute on entries where absorbed cells aren't empty (inconsistent state)
  try{
    Object.keys(_opsD).forEach(function(k){
      var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
      var cleaned=arr.map(function(v){
        if(v==null)return null;
        if(typeof v==='string')return v.trim()?v:null;
        if(typeof v==='object'){
          var t=(typeof v.text==='string')?v.text.trim():'';
          if(v.span&&v.span>1&&!t)return null; // corrupt span with no text → drop
          if(!t&&!v.person&&!v.cls&&!v.color)return null; // empty object → drop
          return v;
        }
        return v;
      }).filter(function(v){return v!==null;});
      if(cleaned.length!==arr.length){_opsD[k]=cleaned;changed=true;}
    });
    // Validate span entries: if cell at L has {text, span:N}, cells L+1..L+N-1
    // MUST be empty. If they have content, the span is inconsistent — strip the span.
    OPS_CAL.forEach(function(m){
      Object.keys(_opsD).forEach(function(k){
        var p=k.split('|');if(p.length!==3||p[0]!==m.month)return;
        var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
        var d=parseInt(p[1]),row=p[2];
        var dayIdx=m.days.findIndex(function(x){return x.day===d;});
        if(dayIdx<0)return;
        arr.forEach(function(v,i){
          if(!v||typeof v!=='object'||!v.span||v.span<=1)return;
          var bad=false,maxSpan=m.days.length-dayIdx;
          if(v.span>maxSpan){var cl=Object.assign({},v);cl.span=maxSpan;arr[i]=v=cl;changed=true;if(maxSpan<=1){bad=true;}}
          for(var off=1;off<v.span&&!bad;off++){
            var nd=m.days[dayIdx+off].day;
            var nv=_opsD[m.month+'|'+nd+'|'+row];
            // One-off boxes inside a block are fine (they show under their day); only another block clashes
            if(Array.isArray(nv)&&nv.some(function(x){return x&&typeof x==='object'&&x.span>1;})){bad=true;break;}
          }
          if(bad){
            var copy=Object.assign({},v);delete copy.span;
            var ks=Object.keys(copy);
            arr[i]=(ks.length===1&&ks[0]==='text')?copy.text:copy;
            changed=true;
          }
        });
      });
    });
  }catch(e){}
  return changed;
}

      var onJob=_crew.some(function(c){var n=((c&&c.name)||'').toLowerCase().trim();return pr.names.indexOf(n)!==-1;});
      if(!onJob)return;
      _dts.forEach(function(iso){
        var ds=String(iso).split('-');if(ds.length!==3)return;
        var mn=null;Object.keys(OPS_MPX).forEach(function(kk){if(OPS_MPX[kk]===ds[0]+'-'+ds[1])mn=kk;});
        if(mn)personalValid[mn+'|'+parseInt(ds[2])+'|'+pr.row+'|'+j.name.toLowerCase()]=true;
      });
    });
    var stuKeys=j.studios?j.studios:[(j.loc==='London'?'London S1':j.studio)];
    (j.txDates||[]).forEach(function(t,i){
      if(!t)return;
      _addEntry(j,stuKeys,t.date,t.label||'TX');
      _addEntry(j,stuKeys,t.date,'RX '+(i+1));
      _addEntry(j,stuKeys,t.date,'Filming Day');
    });
    (j.rigDates||[]).forEach(function(r){if(r)_addEntry(j,stuKeys,r.date,r.note||'Rig Day');});
    (j.drigDates||[]).forEach(function(d){
      var di=(typeof d==='string')?d:(d&&d.date);
      var dl=(typeof d==='object'&&d&&d.label)||'Derig';
      if(di)_addEntry(j,stuKeys,di,dl);
    });
    (j.rehDates||[]).forEach(function(r){if(r)_addEntry(j,stuKeys,r.date,r.label||r.note||'Rehearsal');});
    (j.scheduleCustom||[]).forEach(function(c){if(c)_addEntry(j,stuKeys,c.date,c.label||'Event');});
  });
  var AUTO_PATTERN=/^(tx(\s*\d+)?|rx[\s-]?\d+|filming\s*day|rig(\s*day)?(\s*\d+)?|de[-\s]?rig|event)$/i;
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3||parts[2].indexOf('st_')!==0)return;
    var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
    var kept=arr.filter(function(lbl){
      // Coloured/custom entries are objects — judge them by their text, same
      // as plain strings, so manual duplicates of seeded labels prune too.
      var txt=(typeof lbl==='string')?lbl:((lbl&&typeof lbl==='object'&&typeof lbl.text==='string')?lbl.text:null);
      if(txt===null)return true;
      var lc=txt.toLowerCase().trim();
      var matchedJobPrefix=jobNames.some(function(jn){return jn&&lc.indexOf(jn)===0;});
      // Old names of since-renamed jobs — labels starting with these are treated
      // as job-derived so stale duplicates prune away
      var LEGACY_PREFIXES=['whisper pilot'];
      var matchedLegacy=LEGACY_PREFIXES.some(function(p){return lc.indexOf(p)===0;});
      var looksJobAuto=AUTO_PATTERN.test(txt.trim());
      if(!matchedJobPrefix&&!matchedLegacy&&!looksJobAuto)return true;
      var sid=k+'|'+txt;
      if(validKeys[sid]){_opsMarkSeeded(k,txt);return true;}
      // Stale: remove only if the planner added it and nobody has touched it since
      if(typeof lbl!=='string'||!_opsSeeded.has(sid))return true;
      _opsUnmarkSeeded(sid);return false;
    });
    if(kept.length!==arr.length)_opsD[k]=kept;
  });
  // Personal rows: prune labels that exactly equal a job name (current or
  // archived) but aren't backed by a crew assignment. Free-text survives.
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3)return;
    if(!_nsIsTeam(parts[2]))return;
    var arr=_opsD[k];if(!Array.isArray(arr)||!arr.length)return;
    var kept=arr.filter(function(lbl){
      var txt=(typeof lbl==='string')?lbl:((lbl&&typeof lbl==='object'&&typeof lbl.text==='string')?lbl.text:null);
      if(txt===null)return true;
      var lc=txt.toLowerCase().trim();
      var isJobName=jobNames.indexOf(lc)!==-1;
      if(!isJobName)return true;
      var pid=k+'|'+txt;
      if(personalValid[parts[0]+'|'+parts[1]+'|'+parts[2]+'|'+lc])return true;
      // Only remove job names the planner added itself (not typed in by a person)
      if(typeof lbl!=='string'||!_opsSeeded.has(pid))return true;
      _opsUnmarkSeeded(pid);return false;
    });
    if(kept.length!==arr.length)_opsD[k]=kept;
  });
  // A person's day showing the job twice — the planner's plain job name plus a fuller
  // label for the same job ("Mock the Week" and "Mock the Week RX2"). Keep the fuller one.
  Object.keys(_opsD).forEach(function(k){
    var parts=k.split('|');
    if(parts.length!==3||!_nsIsTeam(parts[2]))return;
    var arr=_opsD[k];if(!Array.isArray(arr)||arr.length<2)return;
    var kept=arr.filter(function(lbl){
      if(typeof lbl!=='string')return true;                 // never touch anything with details on it
      var pid=k+'|'+lbl;if(!_opsSeeded.has(pid))return true; // only labels the planner added
      var lc=lbl.toLowerCase().trim();
      var fuller=arr.some(function(o){var t=_opsTextOf(o).toLowerCase().trim();return t!==lc&&t.indexOf(lc)===0;});
      if(!fuller)return true;
      _opsUnmarkSeeded(pid);return false;
    });
    if(kept.length!==arr.length)_opsD[k]=kept;
  });
}

var _saveTimer=null;
function saveData(){
  try{if(window._opsBooted&&_opsReconcileMLG()&&!_opsDrag)setTimeout(function(){if(!_opsDrag&&typeof opsReRender==='function')opsReRender();},0);}catch(e){console.warn('MLG sync err',e);}
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_doSave,600);
}
// Merge-safe saving (b79): only the cells this browser changed are written, on top of
// the latest copy from the server, so several open planners can't wipe each other's edits.
var _opsBase=null,_opsSaving=false,_opsSaveAgain=false,_opsStamp=null;
function _opsSnap(o){return JSON.parse(JSON.stringify(o||{}));}
function _opsChangedKeys(){
  if(!_opsBase)return Object.keys(_opsD);
  var keys={},out=[];
  Object.keys(_opsD).forEach(function(k){keys[k]=1;});
  Object.keys(_opsBase).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(k){if(JSON.stringify(_opsD[k])!==JSON.stringify(_opsBase[k]))out.push(k);});
  return out;
}
async function _opsFetchPlanner(){
  var r=await fetch(_SB_URL+'/rest/v1/app_data?select=value&key=eq.'+_k('opsPlanner'),{headers:_sbGet()});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var rows=await r.json();
  return (rows&&rows[0]&&rows[0].value&&typeof rows[0].value==='object')?rows[0].value:{};
}
// Bring in other people's changes for cells this browser hasn't touched
function _opsAdoptServer(server,changed){
  var diff=false;
  Object.keys(server).forEach(function(k){if(changed.indexOf(k)<0&&JSON.stringify(_opsD[k])!==JSON.stringify(server[k])){_opsD[k]=server[k];diff=true;}});
  Object.keys(_opsD).forEach(function(k){if(changed.indexOf(k)<0&&!server.hasOwnProperty(k)&&_opsBase&&_opsBase.hasOwnProperty(k)){delete _opsD[k];diff=true;}});
  return diff;
}
async function _doSave(){
  if(_opsSaving){_opsSaveAgain=true;return;}
  _opsSaving=true;
  setStatus('work','Saving…');
  try{
    var changed=_opsChangedKeys();
    var latest=await _opsFetchPlanner();
    var merged=Object.assign({},latest);
    changed.forEach(function(k){if(_opsD.hasOwnProperty(k))merged[k]=_opsD[k];else delete merged[k];});
    var payload={key:_k('opsPlanner'),value:merged,updated_at:new Date().toISOString()};
    _opsStamp=Date.parse(payload.updated_at); // our own save shouldn't trigger a re-download
    var r=await fetch(_SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',headers:_sbHeaders(),body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    // Anything changed locally while we were saving stays marked as changed
    var stillChanged=changed.filter(function(k){return JSON.stringify(_opsD[k])!==JSON.stringify(merged[k]);});
    var pulled=_opsAdoptServer(merged,changed);
    _opsBase=_opsSnap(merged);
    if(pulled&&!_opsEd&&typeof opsReRender==='function')opsReRender();
    if(stillChanged.length)_opsSaveAgain=true;
    // Also save breaks (separate key)
    var bp={key:_k('opsBrk'),value:_opsBrk.slice(),updated_at:new Date().toISOString()};
    await fetch(_SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',headers:_sbHeaders(),body:JSON.stringify(bp)});
    setStatus('','Synced');
  }catch(e){
    console.error('Save failed:',e);
    setStatus('err','Save failed');
    toast('Save failed');
  }finally{
    _opsSaving=false;
    if(_opsSaveAgain){_opsSaveAgain=false;saveData();}
  }
}

const _opsD={};
function og(m,d,r){return _opsD[m+'|'+d+'|'+r]||[];}
// Search (b93): find any entry, note or crew name and jump to it on the calendar
function opsOpenSearch(){
  var el=document.getElementById('nsSearch');if(!el)return;
  if(typeof opsCloseCed==='function')opsCloseCed();
  el.hidden=false;document.body.style.overflow='hidden';
  var q=document.getElementById('nsSearchQ');q.focus();q.select();opsRunSearch();
}
function opsCloseSearch(){var el=document.getElementById('nsSearch');if(!el||el.hidden)return;el.hidden=true;document.body.style.overflow='';}
function opsRunSearch(){
  var q=(document.getElementById('nsSearchQ').value||'').trim().toLowerCase(),out=document.getElementById('nsSearchRes');
  if(q.length<2){out.innerHTML='<p class="ml-empty">Type at least two letters.</p>';return;}
  var res=[];
  Object.keys(_opsD).forEach(function(k){
    var p=k.split('|');if(p.length!==3||/_htl$/.test(p[2]))return;
    var mi=OPS_CAL.findIndex(function(m){return m.month===p[0];});if(mi<0)return;
    var iso=_nsIsoOf(p[0],+p[1]);if(!iso)return;
    (Array.isArray(_opsD[k])?_opsD[k]:[]).forEach(function(v){
      var t=_opsTextOf(v);if(!t||t==='Break / Off Air')return;
      var hay=[t,(v&&v.note)||''].concat((v&&v.crew||[]).map(function(c){return c.name+' '+(c.role||'');})).join(' ').toLowerCase();
      var rowName=_rdRowName(p[2]);
      if(hay.indexOf(q)<0&&rowName.toLowerCase()!==q)return;
      var crewHit=(v&&v.crew||[]).filter(function(c){return c.name.toLowerCase().indexOf(q)>=0;}).map(function(c){return c.name;});
      res.push({iso:iso,mi:mi,day:+p[1],row:p[2],rowName:rowName,text:t,span:(v&&v.span>1)?v.span:1,crewHit:crewHit});
    });
  });
  var today=OPS_TODAY;
  res.sort(function(a,b){var af=a.iso>=today,bf=b.iso>=today;if(af!==bf)return af?-1:1;return af?(a.iso<b.iso?-1:1):(a.iso>b.iso?-1:1);});
  if(!res.length){out.innerHTML='<p class="ml-empty">Nothing found.</p>';return;}
  var shown=res.slice(0,80),h='<div class="ml-head">'+res.length+' result'+(res.length===1?'':'s')+(res.length>80?' · showing the first 80':'')+'</div>',lastPast=null;
  shown.forEach(function(r){
    var past=r.iso<today;
    if(past&&lastPast===null){h+='<div class="ns-crew-grp">Earlier</div>';lastPast=true;}
    var d=_mlUtc(r.iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
    h+='<div class="ops-co ns-sr" role="button" tabindex="0" onclick="opsJumpTo('+r.mi+','+r.day+',\''+r.row.replace(/'/g,"\\'")+'\')" onkeydown="if(event.key===\'Enter\'){this.click();}"><span class="ns-sr-date">'+d+'</span><span class="ns-sr-main">'+_rdEsc(r.text)+(r.crewHit.length?'<small>'+_rdEsc(r.crewHit.join(', '))+'</small>':'')+'</span><span class="ns-sr-row">'+_rdEsc(r.rowName)+(r.span>1?' · '+r.span+' days':'')+'</span></div>';
  });
  out.innerHTML=h;
}
function opsJumpTo(mi,day,row){
  opsCloseSearch();
  var sec=document.getElementById('opsMs2-'+mi);if(!sec)return;
  if(sec.style.display==='none'&&typeof opsRevealPastMonths==='function')opsRevealPastMonths();
  var hiddenMsg='';
  if(row.indexOf('st_')===0&&_opsHidStu.has(row.slice(3)))hiddenMsg=row.slice(3)+' is hidden in Settings';
  if(_nsIsTeam(row)&&_opsHidTeam.has(row))hiddenMsg=_rdRowName(row)+' is hidden in Settings';
  setTimeout(function(){
    var td=null;
    document.querySelectorAll('#opsMs2-'+mi+' td.ops-cell[data-row="'+row.replace(/"/g,'\\"')+'"]').forEach(function(c){var d0=+c.dataset.day,n=c.colSpan||1;if(day>=d0&&day<d0+n)td=c;});
    if(!td){toast(hiddenMsg||'Could not find that day on the calendar');return;}
    td.scrollIntoView({block:'center',inline:'center'});
    td.classList.remove('ns-flash');void td.offsetWidth;td.classList.add('ns-flash');
    setTimeout(function(){td.classList.remove('ns-flash');},2600);
  },80);
}

// Deleting, moving and dragging offer an Undo bar that restores those cells.
var _nsUndoTx=null,_nsUndoTimer=null,_nsUndoLast=null,_nsUndoing=false,_nsUndoShown=null,_nsUndoHide=null;
function _nsUndoRecord(key){
  if(_nsUndoing||!window._opsBooted)return;
  if(!_nsUndoTx)_nsUndoTx={prev:{},at:Date.now()};
  if(!Object.prototype.hasOwnProperty.call(_nsUndoTx.prev,key))_nsUndoTx.prev[key]=Object.prototype.hasOwnProperty.call(_opsD,key)?JSON.parse(JSON.stringify(_opsD[key])):null;
  clearTimeout(_nsUndoTimer);_nsUndoTimer=setTimeout(function(){_nsUndoLast=_nsUndoTx;_nsUndoTx=null;},500);
}
function _nsOfferUndo(label){
  setTimeout(function(){
    var tx=_nsUndoTx||_nsUndoLast;
    if(!tx||Date.now()-tx.at>4000||!Object.keys(tx.prev).length)return;
    clearTimeout(_nsUndoTimer);_nsUndoLast=null;_nsUndoTx=null;
    _nsUndoShown=tx;
    var bar=document.getElementById('nsUndo');
    if(!bar){bar=document.createElement('div');bar.id='nsUndo';bar.className='ns-undo';bar.setAttribute('role','status');
      bar.innerHTML='<span></span><button type="button" onclick="opsUndo()">Undo</button>';document.body.appendChild(bar);}
    bar.querySelector('span').textContent=label;
    bar.classList.add('show');
    clearTimeout(_nsUndoHide);_nsUndoHide=setTimeout(function(){bar.classList.remove('show');_nsUndoShown=null;},10000);
  },60);
}
function opsUndo(){
  var tx=_nsUndoShown;if(!tx)return;
  _nsUndoShown=null;
  var bar=document.getElementById('nsUndo');if(bar)bar.classList.remove('show');
  _nsUndoing=true;
  try{Object.keys(tx.prev).forEach(function(k){var p=k.split('|');os(p[0],+p[1],p.slice(2).join('|'),tx.prev[k]||[]);});}
  finally{_nsUndoing=false;}
  if(typeof opsCloseCed==='function')opsCloseCed();
  if(typeof opsReRender==='function')opsReRender();
  toast('Undone');
}

// Nik or Sam on the Guarantee rota shows on their Team row (b94). Worked out from the whole
// rota — stretched and dragged boxes included — so the Team row always follows. Only the
// planner's own "Morning Live Guarantee" labels are touched.
function _opsSyncMLGToTeam(){return _opsReconcileMLG();}
function _nsIsMlgMirror(x){return (typeof x==='string'&&/^\s*morning live guarantee\s*$/i.test(x))||!!(x&&typeof x==='object'&&x.mlg);}
function _opsReconcileMLG(){
  var changed=false;
  OPS_CAL.forEach(function(m){
    var days=m.days,cover=days.map(function(){return {};});
    days.forEach(function(d,idx){
      og(m.month,d.day,'mlg').forEach(function(v){
        var who=_opsTextOf(v).split(' ')[0].toLowerCase();if(who!=='nik'&&who!=='sam')return;
        var n=(v&&typeof v==='object'&&v.span>1)?v.span:1;
        for(var k=0;k<n&&idx+k<days.length;k++)cover[idx+k][who]=true;
      });
    });
    ['nik','sam'].forEach(function(rk){
      days.forEach(function(d,idx){
        var want=[];
        if(cover[idx][rk]&&!(idx>0&&cover[idx-1][rk])){
          var len=1;while(idx+len<days.length&&cover[idx+len][rk])len++;
          want=[len>1?{text:'Morning Live Guarantee',span:len,mlg:1}:'Morning Live Guarantee'];
        }
        var key=m.month+'|'+d.day+'|'+rk,ex=Array.isArray(_opsD[key])?_opsD[key]:[];
        var kept=ex.filter(function(x){return !_nsIsMlgMirror(x);});
        if(want.length&&kept.some(function(x){return _opsTextOf(x).toLowerCase()==='morning live guarantee';}))want=[];
        if(JSON.stringify(ex.filter(_nsIsMlgMirror))===JSON.stringify(want))return;
        if(!Array.isArray(_opsD[key])&&!want.length)return;

}

// When the Ops Planner ML row changes, mirror the value into the matching
// txDate's crew['Tech Manager'] on the Morning Live job. Keeps the job's
// Schedule tab in sync with whatever's set in the planner.
function _opsSyncMLToJob(month,day,vals){
  if(!Array.isArray(jobs))return;
  var mlJob=jobs.find(function(j){return j&&j.name==='Morning Live';});
  if(!mlJob||!Array.isArray(mlJob.txDates))return;
  var prefix=OPS_MPX[month];if(!prefix)return;
  var iso=prefix+'-'+String(day).padStart(2,'0');
  var td=mlJob.txDates.find(function(t){return t&&t.date===iso;});
  if(!td)return;
  var person=(vals&&vals.length)?vals[0]:'';
  if(person&&typeof person==='object')person=person.person||person.text||'';
  if(typeof person!=='string')return;
  if(person==='Break / Off Air')person='';
  if(!td.crew)td.crew={};
  if(td.crew['Tech Manager']!==person){
    td.crew['Tech Manager']=person;
  }
}
// Reconcile every future day's Andrew/Ian mirror with the current ML row —
// so unassigning someone in the TM row clears their diary without having to
// re-touch each cell. History (before today) is never rewritten.
function _opsReconcileMLStaff(){
  var changed=false;
  OPS_CAL.forEach(function(m){
    var px=OPS_MPX[m.month];if(!px)return;
    // Days covered by a manually stretched chip on a staff row are left alone
    var covered={andrew:{},ian:{}};
    ['andrew','ian'].forEach(function(rk){
      m.days.forEach(function(d){
        (og(m.month,d.day,rk)||[]).forEach(function(v){
          if(v&&typeof v==='object'&&v.span&&v.span>1){
            for(var k=0;k<v.span;k++)covered[rk][d.day+k]=1;
          }
        });
      });
    });
    m.days.forEach(function(d){
      var iso=px+'-'+String(d.day).padStart(2,'0');
      if(iso<OPS_TODAY)return;
      if(opsIsWk(d.dow))return;
      if(covered.andrew[d.day]&&covered.ian[d.day])return;
      try{changed=_opsSyncMLToStaffSafe(m.month,d.day,og(m.month,d.day,'ml'),covered)||changed;}catch(e){}
    });
  });
  return changed;
}
// Wrapper: per-row skip for covered days
function _opsSyncMLToStaffSafe(month,day,vals,covered){
  var skip={andrew:!!(covered&&covered.andrew&&covered.andrew[day]),ian:!!(covered&&covered.ian&&covered.ian[day])};
  if(skip.andrew&&skip.ian)return false;
  window.__opsSyncSkip=skip;
  try{return _opsSyncMLToStaff(month,day,vals);}finally{window.__opsSyncSkip=null;}
}
// Sync Andrew/Ian rows to match the ML assignment. Strips any stale
// "Morning Live ..." entry and (if applicable) adds the proper episode label.
// Returns true if anything in _opsD changed.
function _opsSyncMLToStaff(month,day,vals){
  var prefix=OPS_MPX[month];if(!prefix)return false;
  var iso=prefix+'-'+String(day).padStart(2,'0');
  var episode='';
  if(Array.isArray(jobs)){
    var mlJob=jobs.find(function(j){return j&&j.name==='Morning Live';});
    if(mlJob&&Array.isArray(mlJob.txDates)){
      var td=mlJob.txDates.find(function(t){return t&&t.date===iso;});
      if(td&&td.label)episode=td.label;
    }
  }
  var fullLabel=episode?('Morning Live \u2014 '+episode):'Morning Live';
  var person=(vals&&vals.length)?vals[0]:'';
  // Older assignments are objects ({person,text}) — read the person out of them
  if(person&&typeof person==='object')person=person.person||person.text||'';
  if(typeof person!=='string')person='';
  var firstName=person.split(' ')[0].toLowerCase();
  var assignsTo='';
  if(firstName==='andrew'||firstName==='andy')assignsTo='andrew';
  else if(firstName==='ian')assignsTo='ian';
  var anyChanged=false;
  ['andrew','ian'].forEach(function(rk){
    if(window.__opsSyncSkip&&window.__opsSyncSkip[rk])return;
    var key=month+'|'+day+'|'+rk;
    var existing=_opsD[key]||[];
    // Strip any "Morning Live ..." entries — strings AND coloured object
    // entries (judged by their .text), so stale mirrors always clear.
    var stripped=existing.filter(function(x){
      // Manually stretched chips (span objects) are user-authored layout —
      // the reconcile must never dismantle them.
      if(x&&typeof x==='object'&&x.span&&x.span>1)return true;
      var t=(typeof x==='string')?x:((x&&typeof x==='object'&&typeof x.text==='string')?x.text:null);
      if(t===null)return true;
      // Only its own mirror labels ("Morning Live" / "Morning Live — Ep82"), and only plain ones
      if(typeof x!=='string')return true;
      return !/^\s*morning\s*live(\s*\u2014\s*ep\s*\d+)?\s*$/i.test(t);
    });
    var changed=stripped.length!==existing.length;
    // Add the new ML label if this row matches the assigned person
    if(rk===assignsTo){
      stripped.push(fullLabel);
      changed=true;
    }
    if(changed){
      _opsD[key]=stripped;
      anyChanged=true;
    }
  });
  return anyChanged;
}
// One-time reconciliation: walk every cell that has an explicit ML assignment

function _opsSyncAllMLOnce(){

    var month=parts[0],day=parseInt(parts[1]);

  });
  if(changed)saveData();
}
const _opsBrk=[];const _opsStu=new Set();const _opsHidStu=new Set();

function opsDStr(month,day){return(OPS_MPX[month]||'2026-03')+'-'+String(day).padStart(2,'0');}
function opsMlColor(name){
  if(!name)return'#2d7dd2';
  // Exact full-name match against the known TM colours (e.g. "James Laishley")
  const k=Object.keys(OPS_ML_COLORS).find(k=>name.toLowerCase()===k.toLowerCase());
  if(k)return OPS_ML_COLORS[k];
  // Deterministic colour from name hash for unknown TMs. Use a stronger mix
  // (char-code * position) so e.g. "James Forshaw" and "James Laishley" differ.
  var palette=['#3a8a55','#3a5aaa','#7a4aaa','#1a8a8a','#aa6a2a','#c0524a','#5a8a3a','#aa3a7a','#3a6aaa','#8a5a3a'];
  var sum=0;for(var i=0;i<name.length;i++)sum=(sum*31+name.charCodeAt(i))>>>0;
  return palette[sum%palette.length];
}
// Short display name for ML chips — "James Laishley" → "James L", "James Forshaw" →
// "James F". Falls back to just the single token if there's no surname.
function opsMlShortName(name){
  var parts=String(name||'').trim().split(/\s+/);

function opsInBrk(ds){return _opsBrk.find(b=>ds>=b.start&&ds<=b.end)||null;}
function opsChip(t){var u=t.toUpperCase();if(/^\[MCR\]/.test(u))return'ops-mcr';if(/^\[LDN\]/.test(u))return'ops-ldn';/* Job-specific colours — match the responsible-staff row's chip styling so a job is visually consistent everywhere it appears. */if(/DRAGON/.test(u))return'ops-andrew';if(/MORNING LIVE|\bML\b/.test(u))return'ops-ian';if(/SHOP.?ON|DRAG.RACE|RUPAUL/.test(u))return'ops-show';if(/RIG|DERIG|REHEAR|CAMERA RIG/.test(u))return'ops-prod';if(/\bRX\s*\d|\bDARK\b/.test(u))return'ops-prod';if(/MEET|RECCE|EVENT/.test(u))return'ops-event';return'ops-note';}
function opsRChips(vals,fc,idxMap){
  if(!vals.length)return'<div class="ops-mt"></div>';

    // Normalise: handle string OR object {text, cls?, color?, ...}

  }).join('');
}

// ── RENDERERS ────────────────────────────────────────────────────────────────
function opsMlSpans(month,days){
  const spans=[],cov=new Set();let i=0;
  while(i<days.length){
    const d=days[i];const ds=opsDStr(month,d.day);
    const brk=opsInBrk(ds);
    if(brk){
      let j=i+1;
      while(j<days.length&&opsInBrk(opsDStr(month,days[j].day))===brk)j++;
      const ei=j-1;
      spans.push({si:i,ei,label:brk.name,isBreak:true});
      for(let k=i+1;k<=ei;k++)cov.add(k);
      i=j;continue;
    }
    // Weekends: merge Sat+Sun into one "Break" span when both are plain Break
    // cells. Weekend ML specials (a person assigned) still render individually.
    if(opsIsWk(d.dow)){
      const nd=days[i+1];
      const isBrkVal=vv=>!vv.length||vv[0]==='Break / Off Air';
      if(nd&&opsIsWk(nd.dow)&&!opsInBrk(opsDStr(month,nd.day))
         &&isBrkVal(og(month,d.day,'ml'))&&isBrkVal(og(month,nd.day,'ml'))){
        spans.push({si:i,ei:i+1,label:'Weekend',isBreak:true});
        cov.add(i+1);
        i+=2;continue;
      }
      i++;continue;
    }
    const v=og(month,d.day,'ml');
    if(v.length&&v[0]!=='Break / Off Air'){
      const person=v[0];let j=i+1;let crossedWknd=false;
      while(j<days.length){
        const nd=days[j];
        if(opsInBrk(opsDStr(month,nd.day)))break;
        // Weekend days: track that we've crossed into a new week
        if(opsIsWk(nd.dow)){crossedWknd=true;j++;continue;}
        // Always break at Monday — never span across week boundaries
        if(nd.dow.toUpperCase()==='MONDAY')break;
        const nv=og(month,nd.day,'ml');
        if(nv.length&&nv[0]===person)j++;
        else break;
      }
      let ei=j-1;
      while(ei>i&&opsIsWk(days[ei].dow))ei--;
      spans.push({si:i,ei,label:person,isBreak:false});
      for(let k=i+1;k<=ei;k++)cov.add(k);
      i=ei+1;
    }else i++;
  }
  return{spans,cov};
}

// Auto-fit text in any element that uses text-overflow:ellipsis. Shrinks font-size
// (down to a floor of 8px) until the text fits. Re-runs after every render, on
// window resize, and via a MutationObserver as a catch-all for DOM changes.
function versaFitText(el){
  if(!el||!el.style)return;
  var cs=window.getComputedStyle(el);
  if(cs.textOverflow!=='ellipsis')return;
  el.style.fontSize='';
  if(el.scrollWidth<=el.clientWidth+0.5)return;
  var fs=parseFloat(cs.fontSize)||12;
  for(var i=0;i<16;i++){
    fs-=0.5;
    if(fs<8)break;
    el.style.fontSize=fs+'px';
    if(el.scrollWidth<=el.clientWidth+0.5)return;
  }
}
// Selectors covering every chip/box type in the app that truncates with ellipsis.
// Add new ones here to opt them into auto-fit; harmless if a selector matches
// nothing on a given page.
var VERSA_FIT_SEL='.ops-chip,.cal-bar,.drw-title,.td';
function versaFitAll(){
  document.querySelectorAll(VERSA_FIT_SEL).forEach(versaFitText);
}
// Back-compat aliases — keep old call sites working.
function opsFitChip(el){versaFitText(el);}
function opsFitAllChips(){versaFitAll();}
(function(){
  var t=null;
  window.addEventListener('resize',function(){
    if(t)clearTimeout(t);
    t=setTimeout(versaFitAll,120);
  });
})();
// Catch any DOM mutation we don't explicitly hook into. childList:true watches
// node additions/removals only — setting style.fontSize from this function
// doesn't fire it back, avoiding loops. Debounced at 180ms.
(function(){
  if(!('MutationObserver' in window))return;
  var t=null;
  var schedule=function(){
    if(t)clearTimeout(t);
    t=setTimeout(versaFitAll,180);
  };
  var go=function(){
    if(!document.body)return;
    try{new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});}catch(e){}
  };
  if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
})();

function opsCk(td,dayOverride){

function _opsCellRect(td){
  var r=td.getBoundingClientRect();
  // Self-calibrating zoom correction. Browsers disagree on whether rects under
  // CSS zoom are reported in visual pixels (Safari) or layout pixels (Chrome
  // 128+). Rather than trust either model, measure: offsetWidth is always
  // layout px, and layout px x cumulative zoom = true visual width. If the
  // rect already matches visual (ratio 1) nothing changes; if it's layout-
  // based, scale everything up to visual so it matches event clientX/Y.
  var z=1;
  if(typeof td.currentCSSZoom==='number'&&td.offsetWidth>0&&r.width>0){
    z=(td.offsetWidth*td.currentCSSZoom)/r.width;
    if(!isFinite(z)||z<=0)z=1;
    if(Math.abs(z-1)<0.02)z=1;
  }
  if(z!==1){
    return {top:r.top*z,left:r.left*z,bottom:r.bottom*z,right:r.right*z,width:r.width*z,height:r.height*z};
  }
  return r;
}
function _opsPositionCed(td){
  const ced=document.getElementById('opsCed');
  if(!ced||!td)return;
  const rect=_opsCellRect(td);
  var vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  var vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  var vtop=window.visualViewport?(window.visualViewport.offsetTop||0):0;
  var spaceBelow=(vtop+vh)-(rect.bottom+8);
  var spaceAbove=(rect.top)-(vtop+8);
  var top,maxH;
  // Prefer below if there's room; otherwise above; otherwise pin to top
  if(spaceBelow>=240||spaceBelow>=spaceAbove){
    top=rect.bottom+3;
    maxH=Math.max(160,spaceBelow);
  } else if(spaceAbove>=240){
    // Place above the cell. We'll measure after setting maxHeight.
    ced.style.maxHeight=spaceAbove+'px';
    var measuredH=ced.offsetHeight;
    top=rect.top-measuredH-3;
    maxH=spaceAbove;
  } else {
    top=vtop+8;
    maxH=vh-16;
  }
  ced.style.top=top+'px';
  ced.style.left=Math.max(4,Math.min(rect.left,vw-(ced.offsetWidth||260)-8))+'px';
  ced.style.maxHeight=maxH+'px';
}

// ── DRAG INTERACTIONS ────────────────────────────────────────────────────────
// Two modes, selected automatically by where the drag ends:
//   • SAME row, same month → RESIZE. Span = endDay − startDay + 1.
//       Drag right past current end → extend. Drag left / inside merged cell
//       → shrink. Shrink to 1 removes the merge.
//   • DIFFERENT row OR month → MOVE. First entry from source is appended to
//       the destination cell. Span attribute is dropped on move.
// startDay always anchors to the source cell's data-day (the entry's true start

var _opsDrag=null;

// Map an in-cell mouse X to the day under the cursor, accounting for colspan.
function _opsVirtualDayAt(cell,clientX){
  var dataDay=+cell.dataset.day;
  var colspan=parseInt(cell.getAttribute('colspan')||'1',10);
  if(colspan<=1)return dataDay;
  var rect=_opsCellRect(cell);   // zoom-corrected — clientX is visual pixels
  if(rect.width<=0)return dataDay;
  var perDay=rect.width/colspan;
  var offIdx=Math.max(0,Math.min(colspan-1,Math.floor((clientX-rect.left)/perDay)));

function _opsDragMouseDown(ev){

  // ~9px with cursor:ew-resize. Pseudo-elements aren't event targets, so detect by
  // checking which edge of the chip the click landed near.

// Horizontal gestures (resize / span paint) don't hit-test at all: at drag

// cursor's X straight to a day. Nothing to drift, overlay, or mis-hit.
function _opsCaptureRowMap(){
  // The map is stored in RAW rect coordinates, and incoming cursor X gets
  // divided by a scale factor calibrated from the start cell: the app knows
  // its own zoom (_opsZoomVal), and offsetWidth is always layout pixels, so
  // scale = (offsetWidth x zoom) / rectWidth. This is exact on engines that
  // report zoomed rects (scale=1) AND on engines that report unzoomed rects
  // (scale=zoom) - no browser detection, no currentCSSZoom needed.
  var map=[];
  document.querySelectorAll('.ops-cell[data-mi="'+_opsDrag.mi+'"][data-row="'+_opsDrag.row+'"]').forEach(function(td){
    var r=td.getBoundingClientRect();
    var colspan=parseInt(td.getAttribute('colspan')||'1',10);
    var day0=+td.dataset.day;
    var w=r.width/colspan;
    for(var k=0;k<colspan;k++)map.push({day:day0+k,left:r.left+k*w,right:r.left+(k+1)*w});

  map.sort(function(a,b){return a.left-b.left;});

  var scale=1;
  if(sc&&sc.offsetWidth>0){
    var r0=sc.getBoundingClientRect();

    if(r0.width>0)scale=(sc.offsetWidth*z)/r0.width;

  _opsDrag.mapScale=scale;
}
function _opsDayFromX(x){

  for(var i=0;i<map.length;i++)if(q<map[i].right)return map[i].day;

function _opsDragMouseMove(ev){

function _opsDragMouseUp(ev){

// SAME-ROW (non-ML): adjust the chip's span based on where the drag ended.

function _opsDragSpanAdjust(drag){

// Start/end ISO dates and headings for the current range
function _mlRange(){
  var fmt={day:'numeric',month:'long',year:'numeric',timeZone:'UTC'},mfmt={month:'long',year:'numeric',timeZone:'UTC'};
  if(_mlE.mode==='month'){
    var a=_mlUtc(_mlE.anchor);a.setUTCDate(1);
    var b=new Date(a);b.setUTCMonth(b.getUTCMonth()+1);b.setUTCDate(0);
    var lbl=a.toLocaleDateString('en-GB',mfmt);
    return {from:_mlIso(a),to:_mlIso(b),label:lbl,title:lbl};
  }
  if(_mlE.mode==='all'){
    var first=OPS_MPX[OPS_CAL[0].month]+'-01',lm=OPS_CAL[OPS_CAL.length-1];
    var to=OPS_MPX[lm.month]+'-'+String(lm.days[lm.days.length-1].day).padStart(2,'0');
    var la=_mlUtc(first).toLocaleDateString('en-GB',mfmt)+' – '+_mlUtc(to).toLocaleDateString('en-GB',mfmt);
    return {from:first,to:to,label:la,title:'All dates ('+la+')'};
  }
  if(_mlE.mode==='custom'){
    var f=document.getElementById('mlEFrom').value,t=document.getElementById('mlETo').value;
    if(!f||!t)return null;
    if(t<f){var x=f;f=t;t=x;}
    var l=_mlUtc(f).toLocaleDateString('en-GB',fmt)+' – '+_mlUtc(t).toLocaleDateString('en-GB',fmt);
    return {from:f,to:t,label:l,title:l};
  }
  var mon=_opsMondayOf(_mlE.anchor),fri=_mlUtc(mon);fri.setUTCDate(fri.getUTCDate()+4);
  return {from:mon,to:_mlIso(fri),label:'w/c '+_mlUtc(mon).toLocaleDateString('en-GB',fmt),title:'Week commencing '+_mlUtc(mon).toLocaleDateString('en-GB',fmt)};
}
// Morning Live: weekdays in the range with the tech manager from the ML row
function opsWeekData(from,to){
  var res=[],d=_mlUtc(from),end=_mlUtc(to),guard=0;
  while(d<=end&&guard++<800){
    var dow=d.getUTCDay();
    if(dow>=1&&dow<=5){
      var yr=d.getUTCFullYear(),mo=d.getUTCMonth()+1,day=d.getUTCDate(),tech='TBC';
      for(var i=0;i<OPS_CAL.length;i++){
        var px=OPS_MPX[OPS_CAL[i].month];if(!px)continue;
        var pp=px.split('-').map(Number);
        if(pp[0]===yr&&pp[1]===mo){
          var v=og(OPS_CAL[i].month,day,'ml'),v0=(v&&v.length)?v[0]:'';
          if(v0&&typeof v0==='object')v0=v0.person||v0.text||'';
          if(v0==='Break / Off Air')tech='Off air';else if(v0)tech=v0;
          break;
        }
      }
      res.push({iso:_mlIso(d),name:d.toLocaleDateString('en-GB',{weekday:'long',timeZone:'UTC'}),date:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',timeZone:'UTC'}),tech:tech});
    }
    d.setUTCDate(d.getUTCDate()+1);
  }
  return res;
}

    var t=c.times&&c.times[x.off];if(t&&(t.s||t.e)){var m=_nsMins(t.s,t.e);if(m!=null)_cmap[k].mins+=m;_ctimes.push({iso:x.iso,name:c.name,role:c.role||'',job:x.text,s:t.s||'',e:t.e||'',m:m});}});});
  _ctimes.sort(function(a,b){return a.iso<b.iso?-1:a.iso>b.iso?1:a.name.localeCompare(b.name);});

    return {name:c.name,role:Object.keys(c.roles).join(', ')||d.role||'',section:_nsCrewTypeName(d.type||c.type),phone:d.phone||'',email:d.email||'',days:Object.keys(c.days).length,mins:c.mins};}).sort(function(a,b){return a.name.localeCompare(b.name);});

  });
  var _rows=order.map(function(k){var d=byDay[k];return {iso:d.iso,label:d.label,what:d.whats.join(' · '),where:d.wheres.join(', '),note:d.notes.join(' · ')};});

// Crew export: one person's days (with a per-job total) or everyone's totals
function _exCrewRows(recs){

  if(who==='*'){

      var p=people[c.name]=people[c.name]||{name:c.name,roles:{},days:{},jobs:{},type:_nsCrewType(c)};
      if(c.role)p.roles[c.role]=1;p.days[x.iso]=1;
      var job=_nsShowName(x.text);(p.jobs[job]=p.jobs[job]||{})[x.iso]=1;});});
    return Object.keys(people).map(function(n){var p=people[n];
      var jobs=Object.keys(p.jobs).map(function(j){return {job:j,days:Object.keys(p.jobs[j]).length};}).sort(function(a,b){return b.days-a.days;});
      return {summary:true,iso:'',label:p.name,section:_nsCrewTypeName(p.type),role:Object.keys(p.roles).join(', '),days:Object.keys(p.days).length,jobs:jobs,
        what:Object.keys(p.days).length+' day'+(Object.keys(p.days).length===1?'':'s'),where:jobs.map(function(j){return j.job+' ('+j.days+')';}).join(' · ')};
    }).sort(function(a,b){return b.days-a.days||a.label.localeCompare(b.label);});
  }

  recs.forEach(function(x){

    if(!d){d=byDay[x.iso]={iso:x.iso,label:_mlUtc(x.iso).toLocaleDateString('en-GB',{weekday:'long',timeZone:'UTC'})+' '+_mlUtc(x.iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}),whats:[],wheres:[],notes:[],starts:[],ends:[],mins:0};order.push(x.iso);}

        out+='\n'+t.name+'\n';list.forEach(function(x){out+=x.label+(x.role?' ('+x.role+')':'')+': '+x.what+' — '+x.where+'\n';});});

    var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();
