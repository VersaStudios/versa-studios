[data-theme="dark"]{--bg:#080c12;--s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.16);--tx:#eef0f4;--mt:rgba(255,255,255,.42);--modal:#141418;--inp:rgba(255,255,255,.06);--kit-bg:rgba(74,158,255,.12);--kit-bd:rgba(74,158,255,.3);--kit-col:#7ab8ff;}
[data-theme="light"]{--bg:#f3f0ff;--s1:rgba(0,0,0,.04);--s2:rgba(0,0,0,.08);--bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.17);--tx:#111318;--mt:rgba(0,0,0,.45);--modal:#fff;--inp:rgba(0,0,0,.05);--kit-bg:rgba(30,80,200,.08);--kit-bd:rgba(30,80,200,.25);--kit-col:#1e50c8;}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--acc);height:auto;min-height:80px;display:flex;flex-direction:column;align-items:stretch;padding:0;position:relative}
.tb-logo{height:44px;filter:brightness(0) invert(1);opacity:.9;flex-shrink:0}
[data-theme="light"] .tb-logo{filter:brightness(0);opacity:.85}
.tb-loc{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 14px;border-radius:20px;background:var(--acc-dim);border:1.5px solid var(--acc-bd);color:var(--acc)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tb-count{font-family:var(--mono);font-size:12px;color:var(--mt);display:none}
@media(min-width:600px){.tb-count{display:block}}
.theme-btn{background:var(--s1);border:1px solid var(--bd2);color:var(--mt);width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-btn{display:flex;align-items:center;gap:8px;background:var(--acc);border:none;border-radius:8px;padding:11px 18px;font-family:var(--sans);font-size:15px;font-weight:700;color:#000;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.add-btn:active{opacity:.8}
/* PAGE */
.page{max-width:100%;margin:0 auto;padding:20px 20px 100px}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.stat-n{font-size:28px;font-weight:700;color:var(--acc);line-height:1;font-family:var(--display)}
.stat-l{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mt);margin-top:4px}
/* FILTERS */
.filter-row{display:flex;align-items:center;gap:7px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-wrap{flex:1;display:flex;align-items:center;gap:9px;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:10px 14px}
.search-wrap input{background:none;border:none;outline:none;color:var(--tx);font-family:var(--sans);font-size:16px;font-weight:500;width:100%}
.search-wrap input::placeholder{color:var(--mt)}
/* STATUS FILTERS */
.sfilter{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:0 6px 6px 0;border:0.5px solid var(--bd);border-left:3px solid var(--bd2);background:var(--s1);color:var(--mt);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s,border-left-color .12s;-webkit-tap-highlight-color:transparent}
.sfilter:hover{background:var(--s2);color:var(--tx)}
.sfilter.on{background:var(--s2);color:var(--tx);border-left-color:var(--tx)}
.sfilter.ongoing{border-left-color:#ef4444}
.sfilter.ongoing.on{color:#ef4444;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);border-left-color:#ef4444}
.sfilter.information{border-left-color:#f59e0b}
.sfilter.information.on{color:#f59e0b;background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2);border-left-color:#f59e0b}
.sfilter.resolved{border-left-color:#22c55e}
.sfilter.resolved.on{color:#22c55e;background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);border-left-color:#22c55e}
/* CARDS */

/* EXPAND */

@media(min-width:600px){}

/* EMPTY */
.empty{padding:80px 24px;text-align:center;color:var(--mt)}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.3}
.empty-txt{font-size:18px;font-weight:700}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:100;display:none;align-items:flex-end;justify-content:center}
@media(min-width:600px){.ov{align-items:center;padding:20px}}
.ov.open{display:flex}
.modal{background:var(--modal);border:1px solid var(--bd2);border-radius:20px 20px 0 0;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
@media(min-width:600px){.modal{border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6)}}
.drag-handle{width:40px;height:4px;background:var(--bd2);border-radius:2px;margin:12px auto 0}
@media(min-width:600px){.drag-handle{display:none}}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:22px;font-weight:700;color:var(--acc);letter-spacing:.01em;font-family:var(--display)}
.x-btn{background:none;border:none;color:var(--mt);font-size:26px;cursor:pointer;line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.x-btn:hover{background:var(--s2);color:var(--tx)}
.modal-body{padding:18px 20px 32px;display:flex;flex-direction:column;gap:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg.full{grid-template-columns:1fr}
.ff{display:flex;flex-direction:column}
.ff label{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mt);margin-bottom:7px}
.csel{position:relative}
.csel .fi{-webkit-appearance:none;appearance:none;padding-right:38px;cursor:pointer}
.csel-arr{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mt);transition:transform .15s,color .15s}
.csel:focus-within .csel-arr{transform:translateY(-50%) rotate(180deg);color:var(--acc)}
.fi{width:100%;background:var(--inp);border:1.5px solid var(--bd2);border-radius:10px;padding:12px 14px;font-family:var(--sans);font-size:16px;font-weight:500;color:var(--tx);outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none}
.fi:focus{border-color:var(--acc);background:var(--s2)}
.fi::placeholder{color:var(--mt)}
.fi option{background:var(--modal,#141418);color:var(--tx)}
textarea.fi{min-height:100px;resize:none;line-height:1.6}
.kit-results{background:var(--s2);border:1px solid var(--bd);border-radius:8px;max-height:160px;overflow-y:auto;margin-top:6px;display:none}
.kr{padding:12px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);-webkit-tap-highlight-color:transparent}
.kr:last-child{border-bottom:none}
.kr:active{background:var(--s2)}
.kr-tag{font-family:var(--mono);font-size:12px;color:var(--mt);font-weight:600}
.tagged-wrap{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;background:var(--kit-bg);border:1px solid var(--kit-bd);font-family:var(--mono);font-size:12px;color:var(--kit-col);font-weight:600}
.tchip button{background:none;border:none;cursor:pointer;color:inherit;opacity:.7;font-size:15px;padding:0;line-height:1}
.submit-btn{width:100%;padding:15px;background:var(--acc);border:none;border-radius:10px;font-family:var(--sans);font-size:17px;font-weight:700;color:#000;cursor:pointer;margin-top:4px;-webkit-tap-highlight-color:transparent}
.submit-btn:active{opacity:.8}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* TOPBAR INNER LAYOUT */
.tb-inner{display:flex;align-items:center;padding:0 20px;gap:16px;height:80px}
.tb-title-block{display:flex;flex-direction:column;gap:2px;position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.tb-location{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);line-height:1}
.tb-tlog{font-family:var(--sans);font-size:30px;font-weight:700;color:var(--tx);line-height:1;letter-spacing:.08em;text-transform:uppercase}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* collapsed row */

/* expanded detail */

.er-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;background:rgba(245,196,0,.1);border:1px solid rgba(245,196,0,.3);color:#f5c400;border-radius:2px;margin-left:4px}

/* ── COMPACT NUMBERED LIST ── */
.e-list{display:flex;flex-direction:column;gap:0;width:100%}
.entry{border-bottom:1px solid var(--bd);-webkit-tap-highlight-color:transparent}
.entry:first-child{border-top:1px solid var(--bd)}
.entry:hover .e-row{background:var(--s1)}
.entry.expanded .e-row{background:var(--s1)}
.er-entry{border-left:3px solid rgba(245,196,0,.5)}
.e-row{display:flex;align-items:flex-start;gap:0;padding:9px 16px;cursor:pointer;transition:background .08s}
.e-left{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;width:80px;padding-right:14px;padding-top:1px}
.e-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.04em;line-height:1.4}
.e-date{font-family:var(--mono);font-size:10px;color:var(--mt);font-weight:500;line-height:1.4}
.e-mid{flex:1;min-width:0}
.e-meta{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:3px}
.e-by{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--tx);margin-right:5px}
.e-sep{color:var(--bd2);font-size:10px;margin-right:5px}
.e-studio{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin-right:5px}
.e-dept{font-family:var(--mono);font-size:11px;color:var(--mt);margin-right:5px}
.e-job{font-family:var(--mono);font-size:11px;color:var(--mt)}
.er-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;background:rgba(245,196,0,.1);border:1px solid rgba(245,196,0,.3);color:#f5c400;border-radius:2px;margin-left:4px}
.e-info{font-size:14px;font-weight:500;line-height:1.5;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry.expanded .e-info{-webkit-line-clamp:unset;overflow:visible}
.e-status{flex-shrink:0;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none;padding:2px 0 0 12px;-webkit-tap-highlight-color:transparent;margin-top:1px;white-space:nowrap}
.e-sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
/* expanded detail */
.e-detail{border-top:1px solid var(--bd)}
.e-section{padding:9px 16px 9px 94px;border-bottom:1px solid var(--bd)}
.e-section:last-child{border-bottom:none}
.e-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.e-sec-lbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mt)}
.e-next-val{font-size:14px;font-weight:500;color:var(--tx);flex:1;line-height:1.4}
.e-next-row{display:flex;align-items:flex-start;gap:10px}
.e-edit-btn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:transparent;border:1px solid var(--bd2);color:var(--mt);cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;border-radius:3px}
.e-edit-btn:hover{border-color:var(--acc);color:var(--acc)}
.e-next-inp{width:100%;background:var(--inp);border:1.5px solid var(--acc);border-radius:5px;padding:7px 10px;font-family:var(--sans);font-size:14px;color:var(--tx);outline:none}
.e-kit{display:flex;gap:5px;flex-wrap:wrap}
.e-kit-tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;background:var(--kit-bg);border:1px solid var(--kit-bd);color:var(--kit-col)}
.e-notes{display:flex;flex-direction:column;gap:7px}
.e-note{display:flex;flex-direction:column;gap:2px}
.e-note-meta{display:flex;align-items:center;gap:7px}
.e-note-ts{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--acc)}
.e-note-by{font-family:var(--mono);font-size:10px;color:var(--mt)}
.e-note-txt{font-size:13px;font-weight:500;line-height:1.45;color:var(--tx)}
.e-no-notes{font-family:var(--mono);font-size:11px;color:var(--mt)}
.e-add-btn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:transparent;border:1px solid var(--acc);color:var(--acc);cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
.e-add-btn:hover{background:var(--acc);color:#000}
.e-note-box{display:none;flex-direction:column;gap:7px;margin-top:8px;padding:10px;background:var(--s2);border-radius:6px}
.e-note-sel{background:var(--inp);border:1px solid var(--bd2);border-radius:4px;padding:7px 10px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tx);outline:none;-webkit-appearance:none;cursor:pointer;width:100%}
.e-note-sel option{background:var(--modal)}
.e-note-ta{width:100%;background:var(--inp);border:1px solid var(--bd2);border-radius:4px;padding:7px 10px;font-family:var(--sans);font-size:13px;color:var(--tx);outline:none;resize:none;min-height:60px;line-height:1.5}
.e-note-ta:focus{border-color:var(--acc)}
.e-note-ta::placeholder{color:var(--mt)}
.e-note-sub{align-self:flex-end;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;background:var(--acc);border:none;border-radius:4px;color:#000;cursor:pointer}
.e-actions{display:flex;border-top:1px solid var(--bd)}
.e-act{flex:1;padding:9px 8px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;border-right:1px solid var(--bd);background:transparent;color:var(--mt);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.e-act:last-child{border-right:none}
.e-act.e-edit:hover{background:var(--acc);color:#000}
.e-act.e-del{color:rgba(200,70,70,.7)}
.e-act.e-del:hover{background:rgba(200,50,50,.1);color:#e05050}

.e-updates{padding:2px 0 4px}
.e-upd-line{font-size:12px;line-height:1.5;color:var(--tx);display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
.e-upd-ts{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--acc);white-space:nowrap;flex-shrink:0}
.e-upd-txt{color:var(--tx)}
.e-footer{display:flex;align-items:center;justify-content:space-between;padding-top:4px;gap:8px}
.e-next-preview{font-family:var(--mono);font-size:11px;color:var(--mt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-next-label{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mt);margin-right:5px}

/* entry layout updates */
.e-meta{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-bottom:4px}
.e-next-inline{font-family:var(--mono);font-size:11px;color:var(--mt);margin-right:0}
.e-next-lbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mt);margin-right:4px}
.e-status{margin-left:auto;flex-shrink:0}
/* box around each entry */
.e-list{gap:8px !important}
.entry{border:1px solid var(--bd) !important;border-bottom:1px solid var(--bd) !important;border-radius:8px !important;overflow:hidden}
.entry:first-child{border-top:1px solid var(--bd) !important}
.entry.expanded{border-color:var(--acc-bd) !important}
.entry:hover{border-color:var(--bd2) !important}
/* remove footer row styles */
.e-footer{display:none}
.e-next-preview{display:none}

/* ── SIZING & COLOUR OVERRIDES ── */
/* Bigger number */
.e-num{font-size:28px !important;line-height:1 !important;font-weight:700 !important}
.e-date{font-size:11px !important}
.e-left{width:70px !important;padding-right:14px !important;gap:4px !important;padding-top:2px !important}
/* Bigger meta text */
.e-by{font-size:13px !important}
.e-studio{font-size:12px !important}
.e-dept{font-size:12px !important}
.e-job{font-size:12px !important}
.e-sep{font-size:12px !important}
.e-next-inline{font-size:12px !important}
.e-next-lbl{font-size:11px !important}

/* Bigger info text */

/* Better entry/background separation */
[data-theme="dark"] .entry{background:#1c1f2a !important;border-color:#2a2f3d !important}

<script>


const SB_URL='https://dttwgmoyxthczlzxjgag.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ', DATA_KEY='tech_log_abc';

let _entries=[],_kit=[],_jobs=[],_tagged=[],_filterDept='',_filterStatus='',_editId=null,_expandedId=null;
const HDR={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'resolution=merge-duplicates'};

// THEME
function applyTheme(t,save){
  document.documentElement.setAttribute('data-theme',t);
  var b=document.getElementById('themeBtn');
  if(b)b.innerHTML=t==='dark'
    ?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    :'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
  if(save!==false)localStorage.setItem('_tl_theme',t);
}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'dark';applyTheme(c==='dark'?'light':'dark');}
applyTheme(localStorage.getItem('_tl_theme')||'dark',false);

// LOAD
async function loadData(){
  try{var r=await fetch(SB_URL+'/rest/v1/app_data?key=eq.'+DATA_KEY+'&select=value',{headers:HDR});var d=await r.json();if(d&&d[0]&&Array.isArray(d[0].value))_entries=d[0].value;}catch(e){}
  try{var r2=await fetch(SB_URL+'/rest/v1/app_data?key=eq.kit&select=value',{headers:HDR});var d2=await r2.json();if(d2&&d2[0]&&Array.isArray(d2[0].value))_kit=d2[0].value;}catch(e){}
  try{var r3=await fetch(SB_URL+'/rest/v1/app_data?key=eq.jobs&select=value',{headers:HDR});var d3=await r3.json();if(d3&&d3[0]&&Array.isArray(d3[0].value)){_jobs=d3[0].value.map(function(j){return j.name;}).filter(Boolean);populateJobSel();}}catch(e){}
  await loadLinkedReports();
  render();
}
async function loadLinkedReports(){}
function populateJobSel(){
  var sel=document.getElementById('fJob');if(!sel)return;
  var cur=sel.value;
  sel.innerHTML='<option>None</option>'+_jobs.map(function(j){return '<option>'+esc(j)+'</option>';}).join('');
  for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===cur||sel.options[i].text===cur){sel.selectedIndex=i;break;}
}

function toggleCard(ev, sid) {
  ev.stopPropagation();
  _expandedId = (_expandedId === sid) ? null : sid;
  render();
  if (_expandedId) {
    setTimeout(function() {
      var el = document.querySelector('.card.expanded');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

async function save(){await fetch(SB_URL+'/rest/v1/app_data',{method:'POST',headers:HDR,body:JSON.stringify({key:DATA_KEY,value:_entries,updated_at:new Date().toISOString()})});}

// STATUS
var SC={information:'#f59e0b',ongoing:'#ef4444',resolved:'#22c55e'};
var SL={information:'Information',ongoing:'Ongoing',resolved:'Resolved'};
var SCycle=['information','ongoing','resolved'];

function deleteEntry(eid,ev){
  if(ev)ev.stopPropagation();
  var e=findEntry(eid);if(!e)return;
  if(!confirm('Delete this entry?'))return;
  _entries=_entries.filter(function(x){return String(x.id)!==String(eid);});
  _expandedId=null;
  save();render();
}

function cycleStatusById(id){
  var e=findEntry(id);if(!e||e._er)return;
  var cur=e.status||'information';
  e.status=SCycle[(SCycle.indexOf(cur)+1)%SCycle.length];
  save();render();
}

// UTILS
function fmt(s){if(!s)return'—';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function findEntry(id){return _entries.find(function(x){return String(x.id)===String(id);});}
function strId(e){return String(e.id);}

// RENDER
var CREW_OPTS='<option>Andrew Rowell</option><option>James Laishley</option><option>Marcus Lamb</option><option>Ian Curry</option><option>James Forshaw</option><option>Mark Openshaw</option><option>Mark Isbister</option><option>Lily Britten</option><option>Esther Brazil</option><option>Chris Warden</option><option>Howard Knock</option><option>Heather (BBC)</option><option>Other</option>';

function render(){
  var q=(document.getElementById('searchBox').value||'').toLowerCase();
  var data=_entries.slice();
  if(_filterDept)data=data.filter(function(e){return e.dept===_filterDept;});
  if(_filterStatus)data=data.filter(function(e){return(e.status||'information')===_filterStatus;});
  if(q)data=data.filter(function(e){return(e.info+e.dept+e.job+e.by+e.studio+e.updates+e.next+(e.kit||[]).map(function(k){return k.name+k.tag;}).join(' ')).toLowerCase().includes(q);});
  
  data.sort(function(a,b){if(a._er!==b._er)return a._er?1:-1;return(b.date||'').localeCompare(a.date||'')||String(b.id).localeCompare(String(a.id));});

  var now=new Date(),mp=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('stTotal').textContent=_entries.length;
  document.getElementById('stMonth').textContent=_entries.filter(function(e){return e.date&&e.date.startsWith(mp);}).length;
  document.getElementById('stOngoing').textContent=_entries.filter(function(e){return(e.status||'information')==='ongoing';}).length;
  document.getElementById('stResolved').textContent=_entries.filter(function(e){return(e.status||'information')==='resolved';}).length;
  document.getElementById('tbCount').textContent=data.length+' entr'+(data.length===1?'y':'ies');

  var list=document.getElementById('cardList');
  if(!data.length){list.innerHTML='<div class="empty"><div class="empty-icon">✓</div><div class="empty-txt">'+(q||_filterDept||_filterStatus?'No matching entries':'No entries yet — tap New Entry to start')+'</div></div>';return;}


  list.innerHTML=data.map(function(e,idx){
    var sid=strId(e);
    var s=e.status||'information',col=SC[s]||'#888',lbl=SL[s]||s;
    var isExp=_expandedId===sid;
    var num=String(idx+1).padStart(2,'0');
    var kit=(e.kit||[]).map(function(k){return '<span class="e-kit-tag">'+esc(k.tag||k.name)+'</span>';}).join('');
    var logItems=Array.isArray(e.update_log)&&e.update_log.length?e.update_log:(e.updates?[{text:e.updates,by:e.by||'',at:e.date?e.date+'T12:00:00':null}]:[]);
    var erBadge=e._er?'<span class="er-badge">ENG</span>':'';

    // Updates always visible below info, with date
    var updatesHtml='';
    if(logItems.length){
      updatesHtml='<div class="e-updates">'
        +logItems.map(function(n){
          return '<div class="e-upd-line">'
            +'<span class="e-upd-ts">'+fmtTs(n.at)+'</span>'
            +'<span class="e-upd-txt">'+esc(n.text)+'</span>'
            +'</div>';
        }).join('')
        +'</div>';
    }

    var detailHtml='';
    if(isExp){
      var logHtml=logItems.length?logItems.map(function(n){return '<div class="e-note"><div class="e-note-meta"><span class="e-note-ts">'+fmtTs(n.at)+'</span><span class="e-note-by">'+esc(n.by)+'</span></div><div class="e-note-txt">'+esc(n.text)+'</div></div>';}).join(''):'<span class="e-no-notes">No updates yet</span>';
      var noteBox=e._er?'':'<div class="e-note-box" id="note-box-'+sid+'" style="display:none"><select class="e-note-sel" id="note-by-'+sid+'">'+CREW_OPTS+'</select><textarea class="e-note-ta" id="note-inp-'+sid+'" placeholder="Add a note…"></textarea><button class="e-note-sub" data-action="submitnote" data-eid="'+sid+'">Add</button></div>';
      detailHtml='<div class="e-detail">'
        +'<div class="e-section"><div class="e-sec-hdr"><span class="e-sec-lbl">Next Stage</span>'+(e._er?'':'<button class="e-edit-btn" data-action="editnext" data-eid="'+sid+'">Edit</button>')+'</div><div class="e-next-row"><span class="e-next-val" id="next-val-'+sid+'">'+esc(e.next||'Not set')+'</span></div></div>'
        +(kit?'<div class="e-section"><div class="e-sec-lbl" style="margin-bottom:5px">Kit</div><div class="e-kit">'+kit+'</div></div>':'')
        +'<div class="e-section"><div class="e-sec-hdr"><span class="e-sec-lbl">Updates</span>'+(e._er?'':'<button class="e-add-btn" data-action="addnote" data-eid="'+sid+'">+ Add Note</button>')+'</div><div class="e-notes">'+logHtml+'</div>'+noteBox+'</div>'
        +(e._er?'':'<div class="e-actions"><button class="e-act e-edit" data-action="edit" data-eid="'+sid+'">Edit Entry</button><button class="e-act e-del" data-action="delete" data-eid="'+sid+'">Delete</button></div>')
        +'</div>';
    }

    return '<div class="entry'+(isExp?' expanded':'')+(e._er?' er-entry':'')+'" data-eid="'+sid+'">'
      +'<div class="e-row" onclick="tgEntry(this)" data-eid="'+sid+'">'
      // Left column: number + date
      +'<div class="e-left"><span class="e-num">'+num+'</span><span class="e-date">'+fmt(e.date)+'</span></div>'
      // Main column
      +'<div class="e-mid">'
      // Single meta line: reporter · studio · dept · job · next · status — all one line
      +'<div class="e-meta">'
      +'<span class="e-by">'+esc(e.by||'—')+'</span>'
      +'<span class="e-sep">·</span><span class="e-studio">'+esc(e.studio||'')+'</span>'
      +'<span class="e-sep">·</span><span class="e-dept">'+esc(e.dept||'')+'</span>'
      +(e.job&&e.job!=='None'?'<span class="e-sep">·</span><span class="e-job">'+esc(e.job)+'</span>':'')
      +erBadge
      +(e.next?'<span class="e-sep">·</span><span class="e-next-inline"><span class="e-next-lbl">Next:</span>'+esc(e.next)+'</span>':'')
      +'<button class="e-status" data-action="status" data-eid="'+sid+'" onclick="event.stopPropagation()" style="color:'+col+'"><span class="e-sdot" style="background:'+col+'"></span>'+lbl.toUpperCase()+'</button>'
      +'</div>'
      // Info text
      +'<div class="e-info">'+esc(e.info||'')+'</div>'
      // Updates (always visible)
      +updatesHtml
      +'</div>'
      +'</div>'
      +detailHtml
      +'</div>';
  }).join('');
}

// EVENT DELEGATION — no inline onclick needed
document.getElementById('cardList').addEventListener('click',function(e){
  var btn=e.target.closest('[data-action]');if(!btn)return;
  var action=btn.getAttribute('data-action');
  var eid=btn.getAttribute('data-eid');
  if(action==='toggle'){_expandedId=(_expandedId===eid)?null:eid;render();if(_expandedId){setTimeout(function(){var el=document.querySelector('.card.expanded');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);}return;}
  if(action==='status'){e.stopPropagation();cycleStatusById(eid);return;}
  if(action==='edit'){e.stopPropagation();openEditById(eid);return;}
  if(action==='delete'){e.stopPropagation();deleteEntry(eid,e);return;}
  if(action==='editnext'){e.stopPropagation();editNext(eid,e);return;}
  if(action==='addnote'){e.stopPropagation();showAddNote(eid,e);return;}
  if(action==='submitnote'){e.stopPropagation();submitNote(eid,e);return;}
});

// FILTERS
function setFilter(btn,dept){_filterDept=dept;document.querySelectorAll('.chip[data-f]').forEach(function(c){c.classList.toggle('on',c===btn);});render();}
function filterStatus(btn,s){_filterStatus=s;document.querySelectorAll('.chip[data-s]').forEach(function(c){c.classList.toggle('on',c===btn);});render();}

// MODAL
function openAdd(){
  _editId=null;_tagged=[];
  document.getElementById('modalTitle').textContent='New Log Entry';
  document.getElementById('submitBtn').textContent='Add Entry';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('fStatus').value='information';
  document.getElementById('fStudio').selectedIndex=0;
  document.getElementById('fDept').selectedIndex=0;
  document.getElementById('fBy').selectedIndex=0;
  document.getElementById('fJob').value='None';
  document.getElementById('fKitQ').value='';
  document.getElementById('kitRes').style.display='none';
  document.getElementById('taggedWrap').innerHTML='';
  document.getElementById('fInfo').value='';
  var _fu=document.getElementById('fUpdates');if(_fu)_fu.value='';
  document.getElementById('fNext').value='';
  document.getElementById('addOv').classList.add('open');
  setTimeout(function(){document.getElementById('fInfo').focus();},150);
}
function closeAdd(){document.getElementById('addOv').classList.remove('open');}
function setSel(id,val){var el=document.getElementById(id);if(!el)return;for(var i=0;i<el.options.length;i++)if(el.options[i].text===val||el.options[i].value===val){el.selectedIndex=i;return;}}
function openEditById(eid){
  var e=findEntry(eid);if(!e)return;
  _editId=e.id;_tagged=(e.kit||[]).slice();
  document.getElementById('modalTitle').textContent='Edit Entry';
  document.getElementById('submitBtn').textContent='Save Changes';
  document.getElementById('fDate').value=e.date||'';
  document.getElementById('fStatus').value=e.status||'information';
  setSel('fStudio',e.studio);setSel('fDept',e.dept);setSel('fJob',e.job);setSel('fBy',e.by);
  document.getElementById('fKitQ').value='';
  document.getElementById('kitRes').style.display='none';
  document.getElementById('fInfo').value=e.info||'';
  document.getElementById('fUpdates').value=e.updates||'';
  document.getElementById('fNext').value=e.next||'';
  renderTagged();
  document.getElementById('addOv').classList.add('open');
}
async function submitEntry(){
  var info=document.getElementById('fInfo').value.trim();
  if(!info){alert('Please describe the issue.');return;}
  var entry={
    id:_editId||Date.now(),
    date:document.getElementById('fDate').value,
    studio:document.getElementById('fStudio').value,
    dept:document.getElementById('fDept').value,
    job:document.getElementById('fJob').value||'None',
    by:document.getElementById('fBy').value,
    kit:_tagged.slice(),info:info,
    updates:(document.getElementById('fUpdates')?document.getElementById('fUpdates').value.trim():''),
    next:document.getElementById('fNext').value.trim(),
    status:document.getElementById('fStatus').value||'information',
    resolved:false
  };
  if(_editId){var idx=_entries.findIndex(function(x){return String(x.id)===String(_editId);});if(idx>=0)_entries[idx]=entry;else _entries.push(entry);}
  else _entries.push(entry);
  document.getElementById('submitBtn').textContent='Saving…';
  await save();render();closeAdd();
}

// KIT
function kitSearch(q){
  var el=document.getElementById('kitRes');
  if(!q.trim()){el.style.display='none';return;}
  var m=_kit.filter(function(k){return(k.name+' '+k.tag).toLowerCase().includes(q.toLowerCase());}).slice(0,8);
  if(!m.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=m.map(function(k){return '<div class="kr" data-kid="'+k.id+'"><span>'+esc(k.name)+'</span><span class="kr-tag">'+esc(k.tag)+'</span></div>';}).join('');
  el.querySelectorAll('.kr').forEach(function(row){
    row.addEventListener('click',function(){
      var kid=parseInt(row.getAttribute('data-kid'));
      var kobj=_kit.find(function(x){return x.id===kid;});
      if(kobj)tagKit(kobj.id,kobj.tag,kobj.name);
    });
  });
}
function tagKit(id,tag,name){if(_tagged.find(function(k){return k.id===id;}))return;_tagged.push({id:id,tag:tag,name:name});document.getElementById('fKitQ').value='';document.getElementById('kitRes').style.display='none';renderTagged();}
function untagKit(id){_tagged=_tagged.filter(function(k){return k.id!==id;});renderTagged();}
function renderTagged(){document.getElementById('taggedWrap').innerHTML=_tagged.map(function(k){return '<span class="tchip">'+esc(k.tag)+'<button data-uid="'+k.id+'">×</button></span>';}).join('');
  document.querySelectorAll('#taggedWrap button').forEach(function(b){b.addEventListener('click',function(){untagKit(parseInt(b.getAttribute('data-uid')));});});
}
document.getElementById('addOv').addEventListener('click',function(e){if(e.target===this)closeAdd();});
// Swipe down to close on mobile
(function(){
  var startY=0,modal=document.querySelector('.modal');
  if(!modal)return;
  modal.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;},{passive:true});
  modal.addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-startY>80)closeAdd();},{passive:true});
})();


function tgEntry(el){
  var sid=el.getAttribute('data-eid');
  if(!sid)return;
  _expandedId=(_expandedId===sid)?null:sid;
  render();
  if(_expandedId){
    setTimeout(function(){
      var el2=document.querySelector('.entry.expanded');
      if(el2)el2.scrollIntoView({behavior:'smooth',block:'nearest'});
    },50);
  }
}

function fmtTs(ts){if(!ts)return'';try{var d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}

function editNext(eid,ev){
  ev.stopPropagation();
  var cell=document.getElementById('next-val-'+eid);if(!cell)return;
  var e=findEntry(eid);if(!e)return;
  var cur=e.next||'';
  cell.outerHTML='<input class="next-inp" id="next-val-'+eid+'" value="'+cur.replace(/"/g,'&quot;')+'" placeholder="Enter next action…"/>';
  var inp=document.getElementById('next-val-'+eid);
  if(inp){
    inp.focus();try{inp.select();}catch(x){}
    inp.addEventListener('blur',function(){e.next=inp.value.trim();save();render();});
    inp.addEventListener('keydown',function(ev2){if(ev2.key==='Enter')inp.blur();if(ev2.key==='Escape')render();});
    inp.addEventListener('click',function(ev2){ev2.stopPropagation();});
  }
}

function showAddNote(eid,ev){
  ev.stopPropagation();
  var box=document.getElementById('note-box-'+eid);if(!box)return;
  box.style.display=box.style.display==='none'?'flex':'none';
  if(box.style.display==='flex'){var ta=box.querySelector('textarea');if(ta)ta.focus();}
}

function submitNote(eid,ev){
  if(ev)ev.stopPropagation();
  var inp=document.getElementById('note-inp-'+eid);
  var byEl=document.getElementById('note-by-'+eid);
  if(!inp)return;
  var text=inp.value.trim(),by=byEl?byEl.value.trim():'';
  if(!text)return;
  var e=findEntry(eid);if(!e)return;
  if(!Array.isArray(e.update_log))e.update_log=[];
  if(e.updates&&!e.update_log.length){
    e.update_log.push({text:e.updates,by:e.by||'',at:e.date?e.date+'T12:00:00':new Date().toISOString()});
    e.updates='';
  }
  e.update_log.push({text:text,by:by,at:new Date().toISOString()});
  save();render();
}

loadData();
