<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dragon's Den — Technical Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Barlow',sans-serif;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:600px;margin:0 auto}
.card{background:#111;border-radius:12px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.6)}
.hd{background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 100%);padding:22px 24px 18px;border-bottom:2px solid rgba(160,160,160,.2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd-brand{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:5px}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#aaa}
.sec{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
.sec:last-child{border-bottom:none}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:10px}
.inp{width:100%;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;padding:13px 16px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s}
.inp:focus{border-color:#888}
.inp::placeholder{color:rgba(255,255,255,.2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pick-btn{padding:14px 16px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);transition:all .15s;flex:1;min-width:120px}
.pick-btn.active{background:rgba(160,160,160,.12);border-color:#888;color:#ccc}
.hrs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hrs-person{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px}
.hrs-row{display:flex;align-items:center;gap:6px}
.hrs-inp{flex:1;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#fff;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;outline:none}
.hrs-inp:focus{border-color:#666}
.hrs-sep{color:rgba(255,255,255,.2);font-size:11px;font-weight:600}
.status-txt{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.3);margin-bottom:10px}
.submit-btn{width:100%;padding:16px;background:#888;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#000;cursor:pointer;transition:opacity .15s}
.submit-btn:disabled{opacity:.3;cursor:not-allowed}
.submit-btn:not(:disabled):hover{opacity:.85}
.success{display:none;text-align:center;padding:40px 24px}
.suc-icon{font-size:48px;margin-bottom:16px}
.suc-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#aaa;margin-bottom:8px}
.suc-detail{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:24px}
.suc-again{padding:12px 24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;padding:20px 0 24px">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:4px">Versa Studios</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:#fff;letter-spacing:.04em;text-transform:uppercase">Dragon's Den</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-top:3px">Technical Report</div>
  </div>
  <div class="card">
    <div id="formView">
      <!-- Tech Manager -->
      <div class="sec">
        <div class="lbl">Tech Manager</div>
        <div class="btn-row">
          <button class="pick-btn active" id="btnAR" onclick="pick('AR')">Andrew Rowell</button>
          <button class="pick-btn" id="btnJL" onclick="pick('JL')">James Laishley</button>
        </div>
        <input type="hidden" id="techMgr" value="Andrew Rowell"/>
      </div>
      <!-- RX Date -->
      <div class="sec">
        <div class="lbl">RX Date</div>
        <input type="date" class="inp" id="rxDate" onchange="checkReady()"/>
      </div>
      <!-- Technical Report -->
      <div class="sec">
        <div class="lbl">Technical Report</div>
        <textarea class="inp" id="techReport" style="min-height:140px;resize:vertical" placeholder="Describe the day's technical activity, issues encountered, equipment used…" oninput="checkReady()"></textarea>
      </div>
      <!-- Work Hours -->
      <div class="sec">
        <div class="lbl">Work Hours <span style="color:rgba(255,255,255,.2);font-size:9px;letter-spacing:0;text-transform:none;font-weight:400">(optional)</span></div>
        <div class="hrs-grid">
          <div>
            <div class="hrs-person">Andrew Rowell</div>
            <div class="hrs-row"><input type="time" class="hrs-inp" id="hrsARs"/><span class="hrs-sep">→</span><input type="time" class="hrs-inp" id="hrsARe"/></div>
          </div>
          <div>
            <div class="hrs-person">James Laishley</div>
            <div class="hrs-row"><input type="time" class="hrs-inp" id="hrsJLs"/><span class="hrs-sep">→</span><input type="time" class="hrs-inp" id="hrsJLe"/></div>
          </div>
          <div>
            <div class="hrs-person">Mark Openshaw</div>
            <div class="hrs-row"><input type="time" class="hrs-inp" id="hrsMOs"/><span class="hrs-sep">→</span><input type="time" class="hrs-inp" id="hrsMOe"/></div>
          </div>
        </div>
      </div>
      <!-- Submit -->
      <div class="sec" style="border:none;padding-top:12px">
        <div class="status-txt" id="statusTxt">Complete all fields to submit</div>
        <button class="submit-btn" id="submitBtn" onclick="doSubmit()" disabled>Submit Report</button>
      </div>
    </div>
    <div class="success" id="successView">
      <div class="suc-icon">✅</div>
      <div class="suc-title">Report Submitted</div>
      <div class="suc-detail" id="successDetail"></div>
      <button class="suc-again" onclick="doReset()">Submit Another</button>
    </div>
  </div>
</div>
<script>
const SB_URL='https://dttwgmoyxthczlzxjgag.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ';

var _mgr='Andrew Rowell';
function pick(code){
  _mgr={AR:'Andrew Rowell',JL:'James Laishley'}[code]||code;
  document.getElementById('techMgr').value=_mgr;
  ['AR','JL'].forEach(c=>{document.getElementById('btn'+c).classList.toggle('active',c===code);});
}
function checkReady(){
  var ok=!!(document.getElementById('rxDate').value&&document.getElementById('techReport').value.trim());
  document.getElementById('submitBtn').disabled=!ok;
  document.getElementById('statusTxt').textContent=ok?'Ready to submit':'Complete all fields to submit';
}
function getHrs(sid,eid){
  var s=document.getElementById(sid),e=document.getElementById(eid);
  return(s&&e&&s.value&&e.value)?s.value+' → '+e.value:'—';
}
async function doSubmit(){
  var date=document.getElementById('rxDate').value;
  var rep=document.getElementById('techReport').value.trim();
  if(!date||!rep)return;
  var workHours='\n\n[WORK HOURS]\nAndrew Rowell: '+getHrs('hrsARs','hrsARe')+'\nJames Laishley: '+getHrs('hrsJLs','hrsJLe')+'\nMark Openshaw: '+getHrs('hrsMOs','hrsMOe');
  var fullReport=rep+workHours;
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting\u2026';
  try{
    var r=await fetch(SB_URL+'/rest/v1/engineering_reports',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify({versa_tech_manager:_mgr,bbc_tech_manager:'',show_date:date,show_name:"Dragon's Den",summary_mode:'str',summary_text:fullReport,tagged_kit:[],tagged_kit_names:[],urgent_action:'No',urgent_details:'',submitted_at:new Date().toISOString()})
    });
    if(r.ok){
      document.getElementById('formView').style.display='none';
      document.getElementById('successView').style.display='block';
      document.getElementById('successDetail').textContent=_mgr+' · '+date;
    }else alert('Submit failed — please try again');
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false;btn.textContent='Submit Report';
}
function doReset(){
  document.getElementById('formView').style.display='';
  document.getElementById('successView').style.display='none';
  ['rxDate','hrsARs','hrsARe','hrsJLs','hrsJLe','hrsMOs','hrsMOe'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('techReport').value='';
  pick('AR');checkReady();
}
</script>
</body>
</html>
