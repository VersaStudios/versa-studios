<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alert">
<meta name="theme-color" content="#ededed">
<link rel="apple-touch-icon" href="/versa-icon.png">
<title>Alert</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ededed;
  --card:#ffffff;
  --ink:#0d0d0d;
  --mute:#9a9a9a;
  --evac:#f04a23;
  --clear:#c3d1b0;
  --roll:#b3a7f5;
  --stone:#d8d2c7;
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;
}
main{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:520px;margin:0 auto}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 16px;flex-shrink:0}
.mast .stack{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.mast .stack .b{display:block}
.mast .stack .g{display:block;color:var(--mute)}
.mast img.vlogo{
  height:23px;width:auto;display:block;margin-top:3px;
  cursor:pointer;padding:8px 0 8px 14px;box-sizing:content-box;
}
.mast img.vlogo:active{opacity:.4}
.mast-right{display:flex;align-items:center;gap:4px}
.mast .chev{background:none;border:none;color:var(--ink);font-size:19px;cursor:pointer;padding:4px 0 0 10px;font-family:inherit}

/* ---------- cards ---------- */
/* deliberately not card-shaped — it navigates, it doesn't send */
.rollentry{
  display:flex;align-items:center;gap:11px;background:none;border:none;
  font-family:inherit;color:var(--ink);cursor:pointer;padding:0;text-align:left;
}
.rollentry:active{opacity:.55}
.rollentry .ic{height:29px;width:auto;display:block}
.rollentry .rc{display:flex;flex-direction:column;gap:1px}
.rollentry .t{font-size:22px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.rollentry .n{font-size:12px;font-weight:500;color:var(--mute)}
.rollentry .n b{font-weight:700;color:var(--ink)}

.deck{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;min-height:0}
.card{
  flex:1;border:none;border-radius:var(--r);cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left;
  padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .09s;min-height:132px;
}
.card:active{transform:scale(.988)}
.card .top{display:flex;align-items:center;justify-content:space-between}
.badge{
  width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(13,13,13,.28);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;letter-spacing:-.02em;
}
.go{
  width:46px;height:46px;border-radius:50%;background:rgba(13,13,13,.1);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;
}
.card .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.card .ttl{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
.card .sub{font-size:12.5px;font-weight:500;color:rgba(13,13,13,.55);margin-top:5px}
.card .num{font-size:50px;font-weight:700;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}

.c-evac {background:var(--evac)}
.c-clear{background:var(--clear)}
.c-roll {background:var(--roll)}
.c-note {background:var(--stone);flex:0 0 96px;min-height:96px}
.c-note .ttl{font-size:21px}

/* ---------- PIN ---------- */
#scrPin{padding:0 8px 8px}
.pin-card{
  flex:1;background:var(--card);border-radius:var(--r);
  display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
}
.pin-card .pinlogo{height:26px;width:auto;display:block;margin:0 auto 22px}
.pin-card .hd{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.02;text-align:center}
.pin-card .hd .g{color:var(--mute)}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0 30px}
.dot{width:14px;height:14px;border-radius:50%;background:#e2e2e2;transition:background .12s}
.dot.on{background:var(--ink)}
.dot.bad{background:var(--evac)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;width:100%;margin:0 auto}
.key{
  background:var(--bg);border:none;border-radius:16px;color:var(--ink);
  font-family:inherit;font-size:25px;font-weight:700;letter-spacing:-.03em;
  padding:17px 0;cursor:pointer;transition:background .1s;
}
.key:active{background:#e0e0e0}
.key.fn{font-size:12px;font-weight:600;color:var(--mute);background:none}
.key.fn:active{background:var(--bg)}

/* ---------- panels ---------- */
.panel{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;min-height:0}
.sheet{background:var(--card);border-radius:var(--r);padding:22px;flex-shrink:0}
.sheet .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sheet .big{font-size:54px;font-weight:700;letter-spacing:-.05em;line-height:.92;margin-top:8px;font-variant-numeric:tabular-nums}
.sheet .cap{font-size:13px;font-weight:500;color:var(--mute);margin-top:6px}
.sheet p{font-size:14.5px;font-weight:400;line-height:1.55;margin-top:10px}
.sheet p.msg-body{
  font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.38;
  margin-top:12px;overflow-wrap:anywhere;
}

.stopper{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px;margin-top:auto;flex-shrink:0}
.stopper .t{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.stopper .d{font-size:13.5px;font-weight:400;line-height:1.55;opacity:.78;margin-top:8px}

.holdwrap{margin-top:auto;padding:14px 0 6px;display:flex;flex-direction:column;align-items:center;gap:13px;flex-shrink:0}
.dial{
  position:relative;width:172px;height:172px;border:none;background:none;padding:0;
  cursor:pointer;font-family:inherit;display:block;touch-action:none;
}
.dial .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.dial .ring .track{stroke:#dcdcdc}
.dial .ring .prog{stroke:var(--ink);stroke-dasharray:452.4;stroke-dashoffset:452.4}
.dial .disc{
  position:absolute;inset:16px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
.dial:active .disc{transform:scale(.975)}
.dial .cap{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1}
.dial .sub{font-size:12px;font-weight:500;opacity:.72}
.holdhint{font-size:12px;font-weight:500;color:var(--mute)}

.hd-res{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-top:10px}

.back{
  background:var(--card);border:none;border-radius:var(--r);width:100%;
  font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);
  padding:19px;cursor:pointer;flex-shrink:0;
}
.back:active{background:#e6e6e6}

/* ---------- compose ---------- */
.field{background:var(--card);border-radius:var(--r);padding:20px 22px;flex:0 1 auto}
.field .pre{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
#composeBox{
  width:100%;height:132px;resize:none;border:none;background:none;margin-top:8px;
  font-family:inherit;font-size:18px;font-weight:500;line-height:1.5;color:var(--ink);
  user-select:text;-webkit-user-select:text;
}
#composeBox:focus{outline:none}
#composeBox::placeholder{color:#c9c9c9}
.count-row{text-align:right;font-size:12px;font-weight:600;color:var(--mute);margin-top:8px}
.count-row.low{color:var(--evac)}
.next{
  background:var(--ink);color:#fff;border:none;border-radius:var(--r);width:100%;
  font-family:inherit;font-size:14px;font-weight:700;padding:21px;cursor:pointer;flex-shrink:0;
}
.next:disabled{opacity:.3}

/* ---------- roll ---------- */
.roll-head{background:var(--roll);border-radius:var(--r);padding:20px 22px;flex-shrink:0}
.roll-head .big{font-size:54px;font-weight:700;letter-spacing:-.05em;line-height:.92;font-variant-numeric:tabular-nums}
.roll-head .cap{font-size:13px;font-weight:500;color:rgba(13,13,13,.6);margin-top:5px}
.roll-head .note{font-size:12.5px;font-weight:500;color:rgba(13,13,13,.55);margin-top:12px;line-height:1.5}
.list{flex:1;overflow-y:auto;min-height:0;background:var(--card);border-radius:var(--r);-webkit-overflow-scrolling:touch}
.item{
  display:flex;align-items:center;gap:12px;width:100%;
  background:none;border:none;border-bottom:1px solid #efefef;
  font-family:inherit;text-align:left;padding:11px 18px;cursor:pointer;
}
.item:last-child{border-bottom:none}
.item:active{background:#f6f6f6}
.item .box{
  width:22px;height:22px;border-radius:6px;border:2px solid #cfcfcf;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;line-height:1;
  transition:background .12s,border-color .12s;
}
.item.gone .box{background:var(--ink);border-color:var(--ink)}
.item .box span{opacity:0}
.item.gone .box span{opacity:1}
.item .who{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
.item .nm{
  font-size:18px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;
}
.item .dt{
  font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:2;min-width:0;
}
.item.gone .nm{text-decoration:line-through;color:var(--mute)}
.empty{padding:34px 22px;color:var(--mute);font-size:15px;font-weight:500;line-height:1.6}


@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="panel">
      <div class="roll-head">
        <div class="big" id="count">—</div>
        <div class="cap">still signed in at Manchester</div>
        <div class="note">Tap a name to sign them off. Anyone left is unaccounted for.</div>

<script>
// =====================================================================
// Standalone build. Uses only the sign-in app's existing endpoints:
//   GET  /api/visitors    everyone currently signed in
//   POST /api/signout     {name} — updates the cache and wall display
// No server changes. Nothing here can affect the kiosk.
// =====================================================================

// Images, defined once and applied everywhere.

// Who can open this page. Change these before sharing the link.
const PINS = {
  '1111': 'Andrew Rowell',
  '2222': 'Esther Brazil',
  '3333': 'Lily Britten'
};

const PREFIX = 'VERSA MANCHESTER: ';
const LIMIT  = 142;
const MAP    = 'https://maps.google.com/?q=St+Johns+Gardens+Manchester';

const TEXT = {
  evacuate:  `VERSA MANCHESTER. LEAVE BY THE NEAREST EXIT AND ASSEMBLE AT ST JOHNS GARDENS. MAP: ${MAP}`,
  all_clear: `VERSA MANCHESTER. YOU ARE NOW FREE TO RE-ENTER THE BUILDING.`
};
const TITLE = { evacuate:'Evacuate', all_clear:'All clear', custom:'Custom' };
// hold button matches its card
const TINT = { evacuate:'#f04a23', all_clear:'#c3d1b0', custom:'#d8d2c7' };

const S = { pin:'', who:null, type:null, custom:'' };

// Open /alert.html?demo=1 to see the roll call populated with sample
// names. Nothing is read from or written to the sign-in system.
const DEMO = true;   // demo build — sample names only, nothing is read or written
let demoAll = [
  { id:'d1', name:'Andrew Rowell',  project:'Versa Staff' },
  { id:'d2', name:'Esther Brazil',  project:'Versa Staff' },
  { id:'d3', name:'Lily Britten',   project:'Versa Staff' },
  { id:'d4', name:'Ian Curry',      project:'Morning Live' },
  { id:'d5', name:'Howard Knock',   project:'Versa Freelance Crew' },
  { id:'d6', name:'Mark Openshaw',  project:'Morning Live' },
  { id:'d7', name:'Rob Locke',      project:'ShopOn TV' },
  { id:'d8', name:'Julie Larkin',   project:'ShopOn TV' },
  { id:'d9', name:'Simon Blunt',    project:'Dragons Den' },
  { id:'d10',name:'Ade Thompson',   project:'Dragons Den' }
];
const demoOut = new Set();

// One place that answers "who is on site", so demo and live behave the same.
async function fetchOnSite(){
  if (DEMO) return demoAll.filter(p => !demoOut.has(p.name));
  const r = await fetch('/api/visitors');
  return (await r.json()) || [];
}

// People signed off during this session. Kept on screen, ticked and
// struck through, so a mistaken tap can be undone. Cleared on Back.
const signedOff = new Map();
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); };
const dots = bad => document.querySelectorAll('.dot').forEach((d,i)=>{
  d.classList.toggle('on', i < S.pin.length);
  d.classList.toggle('bad', !!bad);
});
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const gsm7 = t => t
  .replace(/[\u2018\u2019\u201B]/g, "'").replace(/[\u201C\u201D]/g, '"')
  .replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...')
  .replace(/[^\x20-\x7E\n]/g, '');

// ---- keypad ----
$('keypad').innerHTML = ['1','2','3','4','5','6','7','8','9','clear','0','del'].map(k =>
  k==='clear' ? '<button class="key fn" data-k="clear">Clear</button>' :
  k==='del'   ? '<button class="key fn" data-k="del">Delete</button>' :
                `<button class="key" data-k="${k}">${k}</button>`).join('');

$('keypad').addEventListener('click', e => {
  const k = e.target.closest('[data-k]'); if(!k) return;
  const v = k.dataset.k;
  if (v==='clear') S.pin='';
  else if (v==='del') S.pin = S.pin.slice(0,-1);
  else if (S.pin.length<4) S.pin += v;
  dots();

  if (S.pin.length === 4) {
    if (PINS[S.pin]) {
      S.who = PINS[S.pin];
      setTimeout(() => { show('scrPick'); refreshCount(); connectLive(); }, 130);
    } else {
      dots(true);
      setTimeout(() => { S.pin=''; dots(); }, 420);
    }
  }
});

// ---- headcount on the cards ----
async function refreshCount(){
  try {
    const d = await fetchOnSite();
    const n = d.length;
    $('nEvac').textContent = n;
    $('nRoll').textContent = n;
  } catch(e) { $('nEvac').textContent = '—'; $('nRoll').textContent = '—'; }
}

// ---- compose ----
$('customBtn').addEventListener('click', () => {
  show('scrCompose');
  setTimeout(()=>$('composeBox').focus(), 120);
});

$('composeBox').addEventListener('input', e => {
  const clean = gsm7(e.target.value).slice(0, LIMIT);
  if (clean !== e.target.value) e.target.value = clean;
  S.custom = clean.trim();
  const left = LIMIT - clean.length;
  $('cLeft').textContent = `${left} left`;
  $('cLeft').classList.toggle('low', left < 20);
  $('composeNext').disabled = S.custom.length < 5;
});

$('composeNext').addEventListener('click', () => {
  if (S.custom.length < 5) return;
  $('composeBox').blur();
  openConfirm('custom');
});

// ---- confirm ----
async function openConfirm(type){
  S.type = type;
  $('cTitle').textContent  = TITLE[type];
  $('preview').textContent = type === 'custom' ? PREFIX + S.custom : TEXT[type];
  $('cReach').textContent  = '—';
  $('disc').style.background = TINT[type];
  $('disc').style.color = type === 'evacuate' ? '#fff' : '#0d0d0d';
  $('prog').style.stroke = TINT[type];
  show('scrConfirm');
  try {
    const d = await fetchOnSite();
    $('cReach').textContent = d.length;
  } catch(e) { $('cReach').textContent = '—'; }
}
document.querySelectorAll('.card[data-type]').forEach(b =>
  b.addEventListener('click', () => openConfirm(b.dataset.type)));

// ---- hold to send ----
(function(){
  const btn=$('holdBtn'), prog=$('prog'), cap=$('holdCap');
  const C=2*Math.PI*72;                       // ring circumference
  let t0=null, raf=null; const MS=2000;
  const set=p=>{ prog.style.strokeDashoffset = C*(1-p); };
  const frame=()=>{ const p=Math.min((Date.now()-t0)/MS,1); set(p);
    if(p>=1){ stop(); fire(); } else raf=requestAnimationFrame(frame); };
  const start=e=>{ e.preventDefault(); if(t0) return; t0=Date.now(); cap.textContent='Holding'; raf=requestAnimationFrame(frame); };
  const stop=()=>{ if(raf) cancelAnimationFrame(raf); raf=null; t0=null; set(0); cap.textContent='Hold'; };
  prog.style.strokeDasharray = C; set(0);
  btn.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev, stop));
})();

async function fire(){
  show('scrResult');
  $('rLbl').textContent = TITLE[S.type];

  // There is no send route in this build. Say so plainly rather than
  // letting anyone walk away thinking a text went out.
  $('rTitle').textContent = 'Not sent';
  $('rDetail').textContent =
    'Text alerts are not set up yet, so nothing has gone out. Use the PA system and the fire alarm.';

  try {
    const d = await fetchOnSite();
    $('rDetail').textContent +=
      ` ${d.length} people are signed in — use the roll call to account for them.`;
  } catch(e) {}
}

// ---- roll call ----
async function load(){
  if (!$('list').innerHTML) $('list').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const raw = await fetchOnSite();
    const here = raw.map(p => ({ ...p, off:false }));
    const hereNames = new Set(here.map(p => p.name));

    // Anyone signed off in this session stays on the list, ticked, so an
    // accidental tap can be put right.
    const off = [...signedOff.values()]
      .filter(p => !hereNames.has(p.name))
      .map(p => ({ ...p, off:true }));

    const people = here.concat(off)
      .sort((a,b) => String(a.name).localeCompare(String(b.name)));

    $('count').textContent = here.length;
    $('nEvac').textContent = here.length;
    $('nRoll').textContent = here.length;

    if (!people.length) {
      $('list').innerHTML = '<div class="empty">Nobody is signed in.</div>';
      return;
    }
    $('list').innerHTML = people.map(p => `
      <button class="item${p.off ? ' gone' : ''}"
              data-name="${esc(p.name)}"
              data-person="${esc(p.personId || '')}"
              data-job="${esc(p.jobTitle || '')}"
              data-project="${esc(p.project || '')}">
        <span class="box"><span>✓</span></span>
        <span class="who">
          <span class="nm">${esc(p.name)}</span>
          ${p.project || p.jobTitle ? `<span class="dt">${esc(p.project || p.jobTitle)}</span>` : ''}
        </span>
      </button>`).join('');
  } catch(e) {
    $('count').textContent = '—';
    $('list').innerHTML = '<div class="empty">Could not reach the sign-in system.<br>Check your connection and tap ↻.</div>';
  }
}

$('rollBtn').addEventListener('click', () => { show('scrRoll'); load(); connectLive(); startPolling(); });
$('refreshBtn').addEventListener('click', load);

$('list').addEventListener('click', async e => {
  const row = e.target.closest('.item');
  if (!row || row.dataset.busy) return;

  const wasOff = row.classList.contains('gone');
  const p = {
    name:     row.dataset.name,
    personId: row.dataset.person || null,
    jobTitle: row.dataset.job || '',
    project:  row.dataset.project || ''
  };

  row.dataset.busy = '1';
  row.classList.toggle('gone', !wasOff);

  try {
    if (wasOff) {
      // Put them back — an accidental tap, or they came back inside.
      if (DEMO) demoOut.delete(p.name);
      else {
        const r = await fetch('/api/signin', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(p)
        });
        if (!r.ok && r.status !== 409) throw new Error();
      }
      signedOff.delete(p.name);
    } else {
      if (DEMO) demoOut.add(p.name);
      else {
        const r = await fetch('/api/signout', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name: p.name })
        });
        if (!r.ok) throw new Error();
      }
      signedOff.set(p.name, p);
    }

    const left = $('list').querySelectorAll('.item:not(.gone)').length;
    $('count').textContent = left;
    $('nEvac').textContent = left;
    $('nRoll').textContent = left;
  } catch(err) {
    row.classList.toggle('gone', wasOff);
    row.style.background = '#fdecea';
    setTimeout(() => { row.style.background = ''; }, 1400);
  } finally {
    delete row.dataset.busy;
  }
});

// ---- live sync ----
// The sign-in app already broadcasts 'update' over socket.io whenever
// anyone signs in or out, from the kiosk, an NFC tap or this page. So
// every phone and the wall display move together, instantly. Polling
// stays as a fallback for when the socket isn't there.
let socket = null;
function connectLive(){
  if (DEMO || socket || window.__nosocket || typeof io === 'undefined') return;
  try {
    socket = io();
    socket.on('update', () => {
      if ($('scrRoll').classList.contains('on')) load();
      else refreshCount();
    });
  } catch(e) { socket = null; }
}

let poll;
function startPolling(){
  clearInterval(poll);
  poll = setInterval(() => {
    if ($('scrRoll').classList.contains('on') && !document.hidden) load();
  }, socket ? 60000 : 20000);
}

// ---- navigation ----
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
  clearInterval(poll);
  signedOff.clear();
  $('composeBox').value=''; S.custom=''; $('composeNext').disabled = true;
  $('cLeft').textContent = `${LIMIT} left`; $('cLeft').classList.remove('low');
  show('scrPick'); refreshCount();
}));

// ---- log out ----
function logout(){
  S.pin=''; S.who=null; S.custom=''; S.type=null;
  signedOff.clear();
  dots(); clearInterval(poll);
  $('list').innerHTML=''; $('composeBox').value='';
  $('composeNext').disabled = true;
  $('cLeft').textContent = `${LIMIT} left`; $('cLeft').classList.remove('low');
  show('scrPin');
}
document.querySelectorAll('img.vlogo').forEach(l => l.addEventListener('click', logout));

// Back to the PIN screen after five minutes idle.
let idle;
function resetIdle(){
  clearTimeout(idle);
  idle = setTimeout(() => {
    S.pin=''; dots(); clearInterval(poll); $('list').innerHTML=''; show('scrPin');
  }, 300000);
}
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, resetIdle));
resetIdle();
dots();
</script>
</body>
