<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ShopOn TV — Technical Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#efede3;color:#302f2c;font-family:'Barlow',sans-serif;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:780px;margin:0 auto;padding-top:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.hd{padding:22px 28px;border-bottom:1px solid #e8e5dc;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-logos{display:flex;align-items:center;gap:14px}
.hd-logos img{height:34px}
.hd-div{width:1px;height:32px;background:#d4d0c8}
.hd-right{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#999;text-align:right;line-height:1.4}
.sec{padding:20px 28px;border-bottom:1px solid #eae7df}
.sec:last-child{border-bottom:none}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:12px}
.inp{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:14px 16px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s}
.inp:focus{border-color:#F4A258}
.inp::placeholder{color:#b5b0a6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pick-btn{padding:14px 16px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:2px solid #ddd8cf;background:#f8f6f1;color:#999;transition:all .15s;flex:1;min-width:90px;text-align:center}
.pick-btn.active{background:rgba(244,162,88,.08);border-color:#F4A258;color:#F4A258}
.pick-btn.temp-ok.active{background:rgba(34,197,94,.08);border-color:#22c55e;color:#16a34a}
.pick-btn.temp-nok.active{background:rgba(239,68,68,.08);border-color:#ef4444;color:#dc2626}
.pick-btn.stat-ntr.active{background:rgba(34,197,94,.08);border-color:#22c55e;color:#16a34a}
.pick-btn.stat-str.active{background:rgba(244,162,88,.08);border-color:#F4A258;color:#F4A258}
.temp-detail{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:12px 14px;font-size:14px;font-family:'Barlow',sans-serif;outline:none;margin-top:10px;transition:border-color .15s;min-height:72px;resize:vertical;display:none}
.temp-detail:focus{border-color:#ef4444}
.temp-detail::placeholder{color:#b5b0a6}
.other-inp{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:11px 14px;font-size:14px;font-family:'Barlow',sans-serif;outline:none;margin-top:8px;display:none;transition:border-color .15s}
.other-inp:focus{border-color:#F4A258}
.other-inp::placeholder{color:#b5b0a6}
.delay-row{display:flex;align-items:center;gap:10px}
.delay-inp{width:120px;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:14px 16px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;text-align:center;transition:border-color .15s}
.delay-inp:focus{border-color:#F4A258}
.delay-unit{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:#999;text-transform:uppercase}
.status-txt{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#b5b0a6;margin-bottom:10px}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#f0a0c0 0%,#c0a0f0 50%,#90c0f0 100%);border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer;transition:opacity .15s}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.submit-btn:not(:disabled):hover{opacity:.9}
.success{display:none;text-align:center;padding:40px 28px}
.suc-icon{font-size:48px;margin-bottom:16px}
.suc-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#F4A258;margin-bottom:8px}
.suc-detail{font-size:14px;color:#999;margin-bottom:24px}
.suc-again{padding:12px 24px;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer}
.kit-search{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:10px 14px;font-size:14px;font-family:'Barlow',sans-serif;outline:none;margin-bottom:8px}
.kit-search:focus{border-color:#F4A258}
.kit-search::placeholder{color:#b5b0a6}
.kit-list{max-height:200px;overflow-y:auto;border:1.5px solid #e0ddd5;border-radius:10px;background:#faf9f5}
.kit-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eae7df;cursor:pointer;transition:background .1s}
.kit-row:last-child{border-bottom:none}
.kit-row:hover{background:#f0eee6}
.kit-row.sel{background:rgba(244,162,88,.08)}
.kit-cb{width:16px;height:16px;border:2px solid #d4d0c8;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s}
.kit-row.sel .kit-cb{background:#F4A258;border-color:#F4A258}
.kit-row.sel .kit-cb::after{content:'';width:4px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);display:block;margin-top:-2px}
.kit-nm{font-size:14px;font-weight:600;color:#302f2c;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#999;letter-spacing:.04em}
.kit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kit-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(244,162,88,.1);border:1px solid rgba(244,162,88,.3);border-radius:8px;font-size:12px;font-weight:600;color:#c07020}
.kit-chip button{background:none;border:none;cursor:pointer;color:#c07020;font-size:14px;line-height:1;padding:0}
.kit-loading{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#b5b0a6;padding:12px 0}
</style>
</head>

function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtNice(iso){var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

// ── DATE ──
function setDate(mode){
  _dateMode=mode;
  var today=new Date();
  var yest=new Date();yest.setDate(yest.getDate()-1);
  ['btnToday','btnYest','btnOther'].forEach(function(id){document.getElementById(id).classList.remove('active');});
  var dateInp=document.getElementById('soDate');
  var dateDisp=document.getElementById('dateDisplay');
  if(mode==='today'){
    document.getElementById('btnToday').classList.add('active');
    _selectedDate=fmtISO(today);
    dateInp.style.display='none';
    dateDisp.textContent=fmtNice(_selectedDate);
  } else if(mode==='yesterday'){
    document.getElementById('btnYest').classList.add('active');
    _selectedDate=fmtISO(yest);
    dateInp.style.display='none';
    dateDisp.textContent=fmtNice(_selectedDate);
  } else {
    document.getElementById('btnOther').classList.add('active');
    dateInp.style.display='block';
    if(dateInp.value){_selectedDate=dateInp.value;dateDisp.textContent=fmtNice(_selectedDate);}
    else{_selectedDate='';dateDisp.textContent='Select a date below';}
  }
  checkReady();
}
function otherDatePicked(){
  var v=document.getElementById('soDate').value;
  _selectedDate=v;
  document.getElementById('dateDisplay').textContent=v?fmtNice(v):'Select a date';
  checkReady();
}

// ── KIT TOGGLE ──
function toggleKitEnabled(){
  _kitEnabled=!_kitEnabled;
  var track=document.getElementById('kitTogTrack');
  var thumb=document.getElementById('kitTogThumb');
  var label=document.getElementById('kitTogLabel');
  var section=document.getElementById('kitSection');
  var loading=document.getElementById('kitLoading');
  if(_kitEnabled){
    track.style.background='#F4A258';
    thumb.style.left='20px';
    label.textContent='ON';
    label.style.color='#F4A258';
    if(!_shoponKit.length){loading.style.display='block';loadKitForShopOn();}
    else{section.style.display='block';}
  } else {
    track.style.background='#e0ddd5';
    thumb.style.left='2px';
    label.textContent='OFF';
    label.style.color='#999';
    section.style.display='none';
    loading.style.display='none';
    _taggedIds=[];
    renderKitChips();
    updateKitLabel();
  }
}

// ── KIT LOADING ──
async function loadKitForShopOn(){
  try{
    var kr=await fetch(SB_URL+'/rest/v1/app_data?key=eq.kit&select=value',{headers:_sbHdr});
    var kd=await kr.json();
    if(kd&&kd[0]&&Array.isArray(kd[0].value)) _allKit=kd[0].value;
    var jr=await fetch(SB_URL+'/rest/v1/app_data?key=eq.jobs&select=value',{headers:_sbHdr});
    var jd=await jr.json();
    var jobs=(jd&&jd[0]&&Array.isArray(jd[0].value))?jd[0].value:[];
    var shopon=jobs.find(function(j){return j.name&&j.name.toLowerCase().includes('shopon');});
    if(shopon&&shopon.prep&&shopon.prep.length){
      var prepIds=shopon.prep.map(function(p){return p.kid;});
      _shoponKit=_allKit.filter(function(k){return prepIds.indexOf(k.id)>=0;});
    } else {
      _shoponKit=_allKit;
    }
    _shoponKit.sort(function(a,b){return(a.name||'').localeCompare(b.name||'');});
    document.getElementById('kitLoading').style.display='none';
    document.getElementById('kitSection').style.display='block';
    renderKitList();
  }catch(e){
    document.getElementById('kitLoading').textContent='Could not load kit list';
  }
}

function toggleKitDrop(){
  var drop=document.getElementById('kitDrop');
  var arrow=document.getElementById('kitDropArrow');
  var open=drop.style.display==='none';
  drop.style.display=open?'block':'none';
  arrow.style.transform=open?'rotate(180deg)':'';
  if(open){var s=document.getElementById('kitSearch');if(s){s.value='';s.focus();}renderKitList();}
}

function updateKitLabel(){
  var el=document.getElementById('kitDropLabel');if(!el)return;
  if(_taggedIds.length){el.textContent=_taggedIds.length+' item'+(_taggedIds.length>1?'s':'')+' tagged';el.style.color='#302f2c';}
  else{el.textContent='Select equipment...';el.style.color='#b5b0a6';}
}

function renderKitList(){
  var q=(document.getElementById('kitSearch').value||'').toLowerCase();
  var filtered=_shoponKit.filter(function(k){
    if(!q) return true;
    return (k.name||'').toLowerCase().indexOf(q)>=0||(k.tag||'').toLowerCase().indexOf(q)>=0||(k.cat||'').toLowerCase().indexOf(q)>=0;
  });
  var el=document.getElementById('kitList');
  if(!filtered.length){el.innerHTML='<div style="padding:12px 14px;font-size:13px;color:#b5b0a6">No items found</div>';return;}
  el.innerHTML=filtered.map(function(k){
    var sel=_taggedIds.indexOf(k.id)>=0;
    return '<div class="kit-row'+(sel?' sel':'')+'" onclick="toggleKit('+k.id+')"><div class="kit-cb"></div><div class="kit-nm">'+k.name+'</div><div class="kit-tag">'+(k.tag||'')+'</div></div>';
  }).join('');
}

function toggleKit(id){
  var idx=_taggedIds.indexOf(id);
  if(idx>=0) _taggedIds.splice(idx,1); else _taggedIds.push(id);
  renderKitList();renderKitChips();updateKitLabel();
}

function renderKitChips(){
  var el=document.getElementById('kitChips');if(!_taggedIds.length){el.innerHTML='';return;}
  el.innerHTML=_taggedIds.map(function(id){
    var k=_allKit.find(function(x){return x.id===id;});if(!k)return '';
    return '<span class="kit-chip">'+k.name+' <button onclick="event.stopPropagation();toggleKit('+id+')">×</button></span>';
  }).join('');
}

// ── DIRECTOR ──
function pickDir(code){
  var names={PK:'Paul Keetley',KB:'Kieron Bateman'};
  var otherInp=document.getElementById('dirOther');
  if(code==='OT'){_dir=otherInp.value.trim()||'';otherInp.style.display='block';otherInp.focus();}
  else{_dir=names[code]||code;otherInp.style.display='none';otherInp.value='';}
  ['PK','KB','OT'].forEach(function(c){var b=document.getElementById('btn'+c);if(b)b.classList.toggle('active',c===code);});
  checkReady();
}
function dirOtherTyped(){_dir=document.getElementById('dirOther').value.trim();checkReady();}

// ── TEMPERATURE ──
function pickTemp(btn,val){
  _temp=val;
  btn.closest('.btn-row').querySelectorAll('.pick-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var det=document.getElementById('tempDetail');
  if(det)det.style.display=(val==='Not OK')?'block':'none';
}

// ── REPORT STATUS (NTR / STR) ──
function pickStat(btn,val){
  _stat=val;
  btn.closest('.btn-row').querySelectorAll('.pick-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var wrap=document.getElementById('techInfoWrap');
  if(wrap)wrap.style.display=(val==='str')?'':'none';
  checkReady();
}

// ── READY CHECK ──
function checkReady(){
  var info=document.getElementById('techInfo').value.trim();
  // NTR: just date + director. STR: also info.
  var ok=!!(_selectedDate && _dir && (_stat==='ntr' || info));
  document.getElementById('submitBtn').disabled=!ok;
  var st=document.getElementById('statusTxt');
  if(st){
    if(_stat==='ntr')st.textContent=ok?'Ready to submit (Nothing to Report)':'Complete date and director to submit';
    else st.textContent=ok?'Ready to submit':'Complete date, director and technical info to submit';
  }
}

// ── SUBMIT ──
async function doSubmit(){
  var date=_selectedDate;
  var info=document.getElementById('techInfo').value.trim();
  var delay=document.getElementById('soDelay').value||'';
  var tempDetail=((document.getElementById('tempDetail')||{}).value||'').trim();
  // NTR allowed without info
  if(!date||!_dir||(_stat==='str'&&!info))return;

  // Build temperature string with detail when Not OK
  var tempStr=_temp;
  if(_temp==='Not OK' && tempDetail) tempStr='Not OK — '+tempDetail;

  var summary;
  var extras=[];
  if(tempStr) extras.push('Temperature: '+tempStr);
  if(delay) extras.push('Delay: '+delay+'s');
  if(_stat==='ntr'){
    summary='Nothing to Report'+(extras.length?' — ['+extras.join(' | ')+']':'');
  } else {
    summary=info;
    if(extras.length) summary='['+extras.join(' | ')+'] '+summary;
  }

  var taggedNames=_kitEnabled?_taggedIds.map(function(id){var k=_allKit.find(function(x){return x.id===id;});return k?k.name+(k.tag?' ('+k.tag+')':''):'';}).filter(Boolean):[];

  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';
  try{
    var payload={versa_tech_manager:_dir,bbc_tech_manager:'',show_date:date,show_name:'ShopOn TV',summary_mode:_stat,summary_text:summary,tagged_kit:_kitEnabled?_taggedIds:[],tagged_kit_names:taggedNames,urgent_action:'No',urgent_details:'',submitted_at:new Date().toISOString()};
    var r=await fetch(SB_URL+'/rest/v1/engineering_reports',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify(payload)});
    if(r.ok){
      // Send email to Andrew + Ian — same EmailJS template as Morning Live
      try{
        if(window.emailjs){
          await emailjs.send(EJS_SERVICE,EJS_TEMPLATE,{
            show_date:fmtNice(date),
            versa_tech:_dir,
            bbc_tech:'ShopOn TV — '+_dir,
            summary:summary,
            urgent:_temp==='Not OK'?'Yes':'No',
            urgent_details:_temp==='Not OK'?('Studio temperature flagged Not OK'+(tempDetail?' — '+tempDetail:'')):'--',
            tagged_kit:taggedNames.join(', ')||'None',
            submitted_at:new Date().toLocaleString('en-GB'),
            to_email:'andrew.rowell@versastudios.com, ian.curry@versastudios.com',
            show_name:'ShopOn TV'
          });
        }
      }catch(em){}
      document.getElementById('formView').style.display='none';
      document.getElementById('successView').style.display='block';
      document.getElementById('successDetail').textContent=_dir+' · '+fmtNice(date)+' · '+(_stat==='ntr'?'NTR':'STR')+' · Temp '+_temp+(delay?' · '+delay+'s delay':'');
    }else alert('Submit failed — please try again');
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false;btn.textContent='Submit Report';
}

// ── RESET ──
function doReset(){
  document.getElementById('formView').style.display='';
  document.getElementById('successView').style.display='none';
  document.getElementById('techInfo').value='';
  document.getElementById('soDelay').value='';
  document.getElementById('dirOther').style.display='none';
  document.getElementById('dirOther').value='';
  var td=document.getElementById('tempDetail');if(td){td.value='';td.style.display='none';}
  _temp='OK';
  _stat='str';
  _taggedIds=[];
  if(_kitEnabled){renderKitList();renderKitChips();updateKitLabel();}
  var ks=document.getElementById('kitSearch');if(ks)ks.value='';
  var kd=document.getElementById('kitDrop');if(kd)kd.style.display='none';
  var ka=document.getElementById('kitDropArrow');if(ka)ka.style.transform='';
  document.querySelectorAll('.temp-ok,.temp-nok').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.temp-ok').classList.add('active');
  document.querySelectorAll('.stat-ntr,.stat-str').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.stat-str').classList.add('active');
  var iw=document.getElementById('techInfoWrap');if(iw)iw.style.display='';
  pickDir('PK');
  setDate('today');
}
</script>
