<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ShopOn TV — Technical Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#efede3;color:#302f2c;font-family:'Barlow',sans-serif;min-height:100vh;padding:16px 16px 24px}
.wrap{max-width:1280px;margin:0 auto;padding-top:8px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.hd{padding:22px 28px;border-bottom:1px solid #e8e5dc;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-logos{display:flex;align-items:center;gap:14px}
.hd-logos img{height:34px}
.hd-div{width:1px;height:32px;background:#d4d0c8}
.hd-right{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#999;text-align:right;line-height:1.4}
.sec{padding:16px 24px;border-bottom:1px solid #eae7df}
/* Two columns on a desktop screen, so the whole form is on one page */
#formView{display:flex;flex-direction:column}
@media (min-width:1000px){
  #formView{flex-direction:row;align-items:stretch}
  #formView > .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  #formView > .col + .col{border-left:1px solid #eae7df}
  #formView > .col > .sec:last-child{border-bottom:none}
  #formView > .col > .sec.grow{flex:1 1 auto;display:flex;flex-direction:column}
  #formView > .col > .sec.grow > textarea{flex:1 1 auto}
}
.sec:last-child{border-bottom:none}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#302f2c;margin-bottom:10px}
.inp{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:14px 16px;font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s}
.inp:focus{border-color:#2850a0}
.inp::placeholder{color:#b5b0a6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pick-btn{white-space:nowrap;padding:18px 16px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:2px solid #ddd8cf;background:#f8f6f1;color:#999;transition:all .15s;flex:1;min-width:90px;text-align:center}
.pick-btn.active{background:rgba(40,80,160,.08);border-color:#2850a0;color:#2850a0}
.pick-btn.temp-ok.active{background:rgba(34,197,94,.08);border-color:#22c55e;color:#16a34a}
.pick-btn.temp-nok.active{background:rgba(239,68,68,.08);border-color:#ef4444;color:#dc2626}
.pick-btn.stat-ntr.active{background:rgba(34,197,94,.08);border-color:#22c55e;color:#16a34a}
.pick-btn.stat-str.active{background:rgba(40,80,160,.08);border-color:#2850a0;color:#2850a0}
.temp-detail{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:10px 12px;font-size:13px;font-family:'Barlow',sans-serif;outline:none;margin-top:10px;transition:border-color .15s;min-height:48px;resize:vertical;display:none}
.temp-detail:focus{border-color:#ef4444}
.temp-detail::placeholder{color:#b5b0a6}
.other-inp{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:11px 14px;font-size:14px;font-family:'Barlow',sans-serif;outline:none;margin-top:8px;display:none;transition:border-color .15s}
.other-inp:focus{border-color:#2850a0}
.other-inp::placeholder{color:#b5b0a6}
.delay-row{display:flex;align-items:center;gap:10px}
.delay-inp{width:120px;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:18px 16px;font-size:20px;font-weight:700;font-family:'Barlow',sans-serif;outline:none;text-align:center;transition:border-color .15s}
.delay-inp:focus{border-color:#2850a0}
.delay-unit{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:.08em;color:#555;text-transform:uppercase}
.status-txt{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#b5b0a6;margin-bottom:10px}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#f0a0c0 0%,#c0a0f0 50%,#90c0f0 100%);border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer;transition:opacity .15s}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.submit-btn:not(:disabled):hover{opacity:.9}
.success{display:none;text-align:center;padding:40px 28px}
.suc-icon{font-size:48px;margin-bottom:16px}
.suc-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#2850a0;margin-bottom:8px}
.suc-detail{font-size:14px;color:#999;margin-bottom:24px}
.suc-again{padding:12px 24px;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer}
.kit-search{width:100%;background:#f5f3ee;border:1.5px solid #e0ddd5;border-radius:10px;color:#302f2c;padding:10px 14px;font-size:14px;font-family:'Barlow',sans-serif;outline:none;margin-bottom:8px}
.kit-search:focus{border-color:#2850a0}
.kit-search::placeholder{color:#b5b0a6}
.kit-list{max-height:200px;overflow-y:auto;border:1.5px solid #e0ddd5;border-radius:10px;background:#faf9f5}
.kit-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eae7df;cursor:pointer;transition:background .1s}
.kit-row:last-child{border-bottom:none}
.kit-row:hover{background:#f0eee6}
.kit-row.sel{background:rgba(40,80,160,.08)}
.kit-cb{width:16px;height:16px;border:2px solid #d4d0c8;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s}
.kit-row.sel .kit-cb{background:#2850a0;border-color:#2850a0}
.kit-row.sel .kit-cb::after{content:'';width:4px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);display:block;margin-top:-2px}
.kit-nm{font-size:14px;font-weight:600;color:#302f2c;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#999;letter-spacing:.04em}
.kit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kit-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(40,80,160,.1);border:1px solid rgba(40,80,160,.3);border-radius:8px;font-size:12px;font-weight:600;color:#1a3a80}
.kit-chip button{background:none;border:none;cursor:pointer;color:#1a3a80;font-size:14px;line-height:1;padding:0}
.kit-loading{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#b5b0a6;padding:12px 0}
/* ---- The docket (17 Nov): the ShopOn report in the same sheet as the Morning Live engineering report —
   one warm sheet on a grey ground, a ruled row per step with the label in a 152px column, outlined
   controls, filled colour only where it means something, and a black Submit at the foot ---- */
:root{--ground:#dedcd6; --sheet:#fbfaf7; --surface:#ffffff; --ink:#0d0d0d; --subtle:#4a4a4a; --muted:#8b8b8b;
  --tab:#eeece7; --tab-hover:#e4e1da; --border:rgba(13,13,13,.10); --border-l:rgba(13,13,13,.16);
  --st-confirmed:#b5c3a0; --st-likely:#e5c48f; --st-possible:#dda58c; --sec-studio:#708C69}
body{background:var(--ground); color:var(--ink); font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif; letter-spacing:-.011em; padding:20px 16px 40px}
.wrap{max-width:720px; padding-top:20px}
.card{background:var(--sheet); border-radius:24px; padding:8px 28px 28px; box-shadow:0 1px 3px rgba(13,13,13,.07),0 8px 24px rgba(13,13,13,.05); overflow:visible}
/* letterhead: the show signs the sheet on the left, Versa on the right, the way across between them */
.hd{display:flex; align-items:flex-start; gap:24px; padding:24px 0 16px; border-bottom:2px solid var(--ink); margin:0}
.hd-logos{display:contents}
.hd-div{display:none}
.hd-logos img:last-child{order:1; height:36px; width:auto; margin:0 0 9px}
.hd::after{content:"Engineering report"; order:2; align-self:flex-end; margin:0 0 2px 2px; font-size:15px; font-weight:600; letter-spacing:-.02em; color:var(--muted)}
.hd-right{order:3; margin-left:auto; align-self:center; text-align:left; font-family:inherit; letter-spacing:0; text-transform:none}
.hd-logos img:first-child{order:4; height:auto; width:84px; filter:brightness(0); opacity:.9; margin:2px 0 0}
.hd-right a{display:inline-flex !important; align-items:center; gap:10px; background:var(--tab) !important; color:var(--ink) !important; border:none; border-radius:11px;
  padding:10px 15px 10px 12px !important; font-family:inherit !important; font-size:13.5px !important; font-weight:700 !important; letter-spacing:-.02em !important;
  text-transform:none !important; box-shadow:none !important; text-decoration:none}
.hd-right a:hover{background:var(--tab-hover) !important; transform:none}
/* one ruled row per step */
#formView{display:flex !important; flex-direction:column !important; gap:0; padding:0; background:none; counter-reset:step}
#formView > .col{display:contents}
.sec,#formView > .col > .sec{display:grid; grid-template-columns:152px minmax(0,1fr); gap:26px; align-items:start; padding:18px 0; margin:0;
  background:none; border:none; border-bottom:1px solid var(--border); border-radius:0; counter-increment:step}
.lbl{margin:7px 0 0; font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:-.02em; text-transform:none; color:var(--ink); line-height:1.25}
.lbl::before{content:"0." counter(step); display:block; font-size:10px; font-weight:800; letter-spacing:.16em; color:var(--muted); margin-bottom:3px; font-variant-numeric:tabular-nums}
.sec-row{display:block !important; padding:0 !important; border-bottom:none !important; counter-increment:none}
.sec-row > div{display:grid; grid-template-columns:152px minmax(0,1fr); gap:26px; align-items:start; padding:18px 0; border-bottom:1px solid var(--border);
  flex:none !important; min-width:0 !important; counter-increment:step}
.sec-row > div:last-child{border-bottom:none}
/* the first and last rows of the sheet */
#formView > .col > .sec:first-child{padding-top:14px}
.sec:has(#kitTogTrack){display:block}
.sec:has(#kitTogTrack) .lbl::before{display:none}
.sec:has(#submitBtn){display:block; border-top:2px solid var(--ink); border-bottom:none; padding:14px 0 0 !important; margin-top:2px; counter-increment:none}
/* controls: outlined, so filled colour always means something */
.btn-row{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch}
.btn-row .pick-btn{flex:0 1 auto}
.pick-btn{background:none; border:1px solid var(--border-l); border-radius:8px; padding:10px 14px; min-height:0; font-family:inherit; font-size:13.5px; font-weight:600;
  letter-spacing:-.015em; text-transform:none; color:var(--ink); white-space:nowrap; line-height:1.2; display:inline-flex; align-items:center; justify-content:center; text-align:center}
.pick-btn:hover{background:var(--tab); border-color:var(--ink); color:var(--ink)}
.pick-btn.active{background:var(--ink); color:var(--ground); border-color:var(--ink); font-weight:700}
.pick-btn.temp-ok.active{background:var(--st-confirmed); border-color:#93a37c; color:var(--ink)}
.pick-btn.temp-nok.active{background:var(--st-possible); border-color:#c07f63; color:var(--ink)}
.sec:has(.stat-ntr) .btn-row{display:grid; grid-template-columns:1fr 1fr}
.pick-btn.stat-ntr,.pick-btn.stat-str{padding:14px 16px; font-size:14px; font-weight:700; letter-spacing:-.025em; justify-content:flex-start; text-align:left; gap:11px}
.pick-btn.stat-ntr::before{content:"\2713"; font-size:16px; opacity:.55}
.pick-btn.stat-str::before{content:"\270E"; font-size:16px; opacity:.55}
.pick-btn.stat-ntr.active{background:var(--st-confirmed); border-color:#93a37c; color:var(--ink)}
.pick-btn.stat-str.active{background:var(--st-likely); border-color:#c39f5f; color:var(--ink)}
.pick-btn.stat-ntr.active::before,.pick-btn.stat-str.active::before{opacity:1}
.stat-ntr span,.stat-str span{font-size:14px !important; font-weight:700 !important; letter-spacing:-.025em !important}
#dateDisplay{font-family:inherit !important; font-size:15.5px !important; font-weight:700 !important; letter-spacing:-.032em; color:var(--ink) !important; padding:10px 2px 0 !important}
.inp,.temp-detail,.kit-search,.delay-inp{background:var(--surface); border:1px solid var(--border-l); border-radius:8px; padding:11px 13px; font-family:inherit; font-size:13.5px; letter-spacing:-.011em; color:var(--ink); box-shadow:none}
.inp:focus,.temp-detail:focus,.kit-search:focus,.delay-inp:focus{border-color:rgba(13,13,13,.75); box-shadow:none}
.inp{margin-top:11px}
#techInfo{margin-top:0; min-height:112px; line-height:1.6; resize:vertical}
.delay-row{display:flex; align-items:center; gap:10px}
.delay-inp{width:110px; min-height:0; padding:11px 13px; font-size:15px; font-weight:700; text-align:center}
.delay-unit{font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:-.02em; text-transform:none; color:var(--muted)}
.temp-detail{margin-top:11px; font-size:13.5px}
/* foot of the sheet */
.status-txt{display:flex; align-items:center; gap:10px; padding:0 2px 12px; margin:0; font-family:inherit; font-size:13px; font-weight:600; letter-spacing:-.015em; color:var(--muted)}
.status-txt::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--border-l); flex-shrink:0}
.status-txt:has(+ .submit-btn:not(:disabled)){color:var(--ink)}
.status-txt:has(+ .submit-btn:not(:disabled))::before{background:var(--sec-studio)}
.submit-btn{background:var(--ink); color:var(--ground); border-radius:10px; padding:15px; min-height:0; font-family:inherit; font-size:14px; font-weight:700; letter-spacing:-.022em; text-transform:none}
.submit-btn:disabled{background:var(--tab); color:var(--muted); opacity:1}
.submit-btn:not(:disabled):hover{opacity:.88; background:var(--ink)}
/* success, kit */
.suc-title{font-family:inherit; font-size:24px; font-weight:800; letter-spacing:-.04em; color:var(--ink)}
.suc-detail{font-size:14px; color:var(--muted)}
.suc-again{font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:-.02em; text-transform:none; background:var(--tab); border:none; border-radius:11px; padding:10px 15px; color:var(--ink)}
.kit-list{background:var(--surface); border:1px solid var(--border-l); border-radius:8px}
.kit-row.sel{background:var(--tab)} .kit-row.sel .kit-cb{background:var(--ink); border-color:var(--ink)}
.kit-chip{background:var(--tab); border:none; border-radius:8px; font-size:12.5px; color:var(--ink)}
.kit-chip button{color:var(--ink)}
.kit-tag,.kit-loading{font-family:inherit; letter-spacing:0}
/* docket fixes: every answer in the answer column; the writing row a grid like the rest; the foot and the kit row free of the grid */
.sec > :not(.lbl),.sec-row > div > :not(.lbl){grid-column:2; min-width:0}
#formView > .col > .sec.grow{display:grid; flex:none}
#formView > .col > .sec:has(#submitBtn){display:block}
#formView > .col > .sec:has(#kitTogTrack){display:block}
#formView > .col > .sec:has(#kitTogTrack) > *{grid-column:auto}
.hd-logos img:first-child{filter:none; opacity:1; mix-blend-mode:multiply; width:92px}
/* ---- the mix (17 Nov): the docket's sheet, rows and rules, in Versa Control's materials ---- */
:root{--ground:#e4e3df; --sheet:#f4f4f1; --surface:#fbfbf8; --ink:#141414; --subtle:#4e4e49; --muted:#8e8e94;
  --tab:#e6e5e1; --tab-hover:#dcdbd6; --border:rgba(20,20,20,.10); --border-l:rgba(20,20,20,.14);
  --st-confirmed:#93c97e; --st-likely:#ee4d12; --st-possible:#ee4d12; --sec-studio:#4c9a3f}
body{font-family:'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif; letter-spacing:-.012em}
.wrap{max-width:780px}
.card{border-radius:14px; box-shadow:0 1px 3px rgba(20,20,20,.06),0 10px 28px rgba(20,20,20,.06); padding:8px 30px 30px}
.hd{border-bottom-width:2px}
.hd::after{font-size:16px}
.hd-right a{border-radius:9px; font-size:14px !important}
.lbl{font-size:15px}
.lbl::before{font-size:10.5px}
/* keys as Versa Control has them: light tiles, filled solid when chosen */
.pick-btn{background:var(--tab); border:1px solid transparent; border-radius:9px; padding:12px 18px; font-size:15px; font-weight:600}
.pick-btn:hover{background:var(--tab-hover); border-color:transparent}
.pick-btn.active{background:var(--ink); color:#f4f4f1; border-color:var(--ink)}
.pick-btn.temp-ok.active{background:var(--st-confirmed); border-color:var(--st-confirmed); color:var(--ink)}
.pick-btn.temp-nok.active{background:#ee4d12; border-color:#ee4d12; color:var(--ink)}
.pick-btn.stat-ntr,.pick-btn.stat-str{padding:16px 18px; font-size:15px}
.pick-btn.stat-ntr.active{background:var(--st-confirmed); border-color:var(--st-confirmed); color:var(--ink)}
.pick-btn.stat-str.active{background:#ee4d12; border-color:#ee4d12; color:var(--ink)}
.stat-ntr span,.stat-str span{font-size:15px !important}
#dateDisplay{font-size:17px !important}
.inp,.temp-detail,.kit-search,.delay-inp{background:var(--surface); border:1px solid var(--border-l); border-radius:9px; font-size:15px; padding:12px 14px}
.delay-inp{width:120px; font-size:17px}
.delay-unit{font-size:14px}
#techInfo{min-height:140px; font-size:15px}
.status-txt{font-size:14px}
.submit-btn{border-radius:9px; padding:17px; font-size:16px}
.submit-btn:disabled{background:var(--tab); color:var(--muted)}
.suc-again{border-radius:9px}
.kit-chip{border-radius:9px}
/* ---- like the calendar (17 Nov): the dark frame round light panels, the calendar's header, keys on a grey track ---- */
.wrap{max-width:1100px}
.card{background:#161616; border-radius:14px; padding:4px; box-shadow:none}
.hd{background:#f4f4f1; border-radius:10px; margin:0 0 4px; padding:14px 22px; border-bottom:0; display:flex; align-items:center; gap:14px}
.hd-logos{display:flex; align-items:center; gap:14px; order:1}
.hd-div{display:block; width:1px; height:32px; background:rgba(20,20,20,.14)}
.hd-logos img{order:0; height:34px; width:auto; margin:0; filter:none; mix-blend-mode:normal}
.hd-logos img:first-child{width:auto; height:30px}
.hd::after{content:"Engineering Report"; order:2; flex:1; text-align:center; align-self:center; margin:0; font-size:26px; font-weight:700; letter-spacing:-.03em; color:#141414}
.hd-right{order:3; margin-left:0}
.hd-right a{background:#141414 !important; color:#fff !important; border-radius:9px; padding:12px 18px !important; font-size:16px !important; font-weight:600 !important}
.hd-right a:hover{background:#2a2a2a !important}
#formView{background:#f4f4f1; border-radius:10px; padding:4px 22px 18px}
.sec,#formView > .col > .sec,.sec-row > div{grid-template-columns:200px minmax(0,1fr); padding:16px 0}
.lbl{font-size:16px}
/* keys on a grey track, as the month strip is */
.btn-row{display:inline-flex; background:#e6e5e1; border-radius:11px; padding:5px; gap:5px; max-width:100%}
.pick-btn{background:#fbfbf8; border:0; border-radius:8px; padding:12px 18px; font-size:16px; font-weight:700; color:#141414}
.pick-btn:hover{background:#fff}
.pick-btn.active{background:#141414; color:#fff}
.sec:has(.stat-ntr) .btn-row{display:grid; width:100%}
.pick-btn.stat-ntr,.pick-btn.stat-str{padding:16px 18px; font-size:16px}
.stat-ntr span,.stat-str span{font-size:16px !important}
#dateDisplay{font-size:18px !important; font-weight:600 !important}
.inp,.temp-detail,.kit-search,.delay-inp{background:#fbfbf8; border:0; box-shadow:inset 0 0 0 2px #e6e5e1; border-radius:9px; font-size:16px}
.inp:focus,.temp-detail:focus,.kit-search:focus,.delay-inp:focus{box-shadow:inset 0 0 0 2px #141414}
#techInfo{min-height:150px}
.sec:has(#submitBtn){border-top:1px solid rgba(20,20,20,.10)}
.submit-btn{font-size:17px; padding:18px}
.sec > .btn-row,.sec-row > div > .btn-row{justify-self:start}
.sec:has(.stat-ntr) > .btn-row{justify-self:stretch}
.hd .hd-div{display:block !important}
/* no step numbers; the field a choice opens sits to the right of its keys, on the same line */
.lbl::before{display:none}
.sec,#formView > .col > .sec,.sec-row > div{grid-template-columns:200px auto minmax(0,1fr); grid-auto-rows:auto; align-items:center; padding:12px 0; gap:16px 20px}
.lbl{grid-column:1; grid-row:1; margin:0}
.sec > .btn-row,.sec-row > div > .btn-row{grid-column:2; grid-row:1; justify-self:start}
.sec > :not(.lbl):not(.btn-row),.sec-row > div > :not(.lbl):not(.btn-row){grid-column:3; grid-row:1; margin:0; align-self:center}
.sec > .delay-row{grid-column:2}

    _selectedDate=fmtISO(today);
    dateInp.style.display='none';
    dateDisp.textContent=fmtNice(_selectedDate);
  } else if(mode==='yesterday'){
    document.getElementById('btnYest').classList.add('active');
    _selectedDate=fmtISO(yest);
    dateInp.style.display='none';
    dateDisp.textContent=fmtNice(_selectedDate);
  } else {
    document.getElementById('btnOther').classList.add('active');
    dateInp.style.display='block';
    if(dateInp.value){_selectedDate=dateInp.value;dateDisp.textContent=fmtNice(_selectedDate);}
    else{_selectedDate='';dateDisp.textContent='';}
  }
  checkReady();
}
function otherDatePicked(){
  var v=document.getElementById('soDate').value;
  _selectedDate=v;
  document.getElementById('dateDisplay').textContent=v?fmtNice(v):'Select a date';
  checkReady();
}

function toggleKitEnabled(){
  _kitEnabled=!_kitEnabled;
  var track=document.getElementById('kitTogTrack');
  var thumb=document.getElementById('kitTogThumb');
  var label=document.getElementById('kitTogLabel');
  var section=document.getElementById('kitSection');
  var loading=document.getElementById('kitLoading');
  if(_kitEnabled){
    track.style.background='#2850a0';
    thumb.style.left='20px';
    label.textContent='ON';
    label.style.color='#2850a0';
    if(!_shoponKit.length){loading.style.display='block';loadKitForShopOn();}
    else{section.style.display='block';}
  } else {
    track.style.background='#e0ddd5';
    thumb.style.left='2px';
    label.textContent='OFF';
    label.style.color='#999';
    section.style.display='none';
    loading.style.display='none';
    _taggedIds=[];
    renderKitChips();
    updateKitLabel();
  }
}

async function loadKitForShopOn(){
  try{
    var kr=await fetch(SB_URL+'/rest/v1/app_data?key=eq.kit&select=value',{headers:_sbHdr});
    var kd=await kr.json();
    if(kd&&kd[0]&&Array.isArray(kd[0].value)) _allKit=kd[0].value;
    var jr=await fetch(SB_URL+'/rest/v1/app_data?key=eq.jobs&select=value',{headers:_sbHdr});
    var jd=await jr.json();
    var jobs=(jd&&jd[0]&&Array.isArray(jd[0].value))?jd[0].value:[];
    var shopon=jobs.find(function(j){return j.name&&j.name.toLowerCase().includes('shopon');});
    if(shopon&&shopon.prep&&shopon.prep.length){
      var prepIds=shopon.prep.map(function(p){return p.kid;});
      _shoponKit=_allKit.filter(function(k){return prepIds.indexOf(k.id)>=0;});
    } else {
      _shoponKit=_allKit;
    }
    _shoponKit.sort(function(a,b){return(a.name||'').localeCompare(b.name||'');});
    document.getElementById('kitLoading').style.display='none';
    document.getElementById('kitSection').style.display='block';
    renderKitList();
  }catch(e){
    document.getElementById('kitLoading').textContent='Could not load kit list';
  }
}

function toggleKitDrop(){
  var drop=document.getElementById('kitDrop');
  var arrow=document.getElementById('kitDropArrow');
  var open=drop.style.display==='none';
  drop.style.display=open?'block':'none';
  arrow.style.transform=open?'rotate(180deg)':'';
  if(open){var s=document.getElementById('kitSearch');if(s){s.value='';s.focus(window.parent!==window?{preventScroll:true}:undefined);}renderKitList();}
}

function updateKitLabel(){
  var el=document.getElementById('kitDropLabel');if(!el)return;
  if(_taggedIds.length){el.textContent=_taggedIds.length+' item'+(_taggedIds.length>1?'s':'')+' tagged';el.style.color='#302f2c';}
  else{el.textContent='Select equipment...';el.style.color='#b5b0a6';}
}

function renderKitList(){
  var q=(document.getElementById('kitSearch').value||'').toLowerCase();
  var filtered=_shoponKit.filter(function(k){
    if(!q) return true;
    return (k.name||'').toLowerCase().indexOf(q)>=0||(k.tag||'').toLowerCase().indexOf(q)>=0||(k.cat||'').toLowerCase().indexOf(q)>=0;
  });
  var el=document.getElementById('kitList');
  if(!filtered.length){el.innerHTML='<div style="padding:12px 14px;font-size:13px;color:#b5b0a6">No items found</div>';return;}
  el.innerHTML=filtered.map(function(k){
    var sel=_taggedIds.indexOf(k.id)>=0;
    return '<div class="kit-row'+(sel?' sel':'')+'" onclick="toggleKit('+k.id+')"><div class="kit-cb"></div><div class="kit-nm">'+k.name+'</div><div class="kit-tag">'+(k.tag||'')+'</div></div>';
  }).join('');
}

function toggleKit(id){
  var idx=_taggedIds.indexOf(id);
  if(idx>=0) _taggedIds.splice(idx,1); else _taggedIds.push(id);
  renderKitList();renderKitChips();updateKitLabel();
}

function renderKitChips(){
  var el=document.getElementById('kitChips');if(!_taggedIds.length){el.innerHTML='';return;}
  el.innerHTML=_taggedIds.map(function(id){
    var k=_allKit.find(function(x){return x.id===id;});if(!k)return '';
    return '<span class="kit-chip">'+k.name+' <button onclick="event.stopPropagation();toggleKit('+id+')">×</button></span>';
  }).join('');
}

function pickDir(code){
  var names={PK:'Paul Keetley',KB:'Kieron Bateman'};
  var otherInp=document.getElementById('dirOther');
  if(code==='OT'){_dir=otherInp.value.trim()||'';otherInp.style.display='block';otherInp.focus(window.parent!==window?{preventScroll:true}:undefined);}
  else{_dir=names[code]||code;otherInp.style.display='none';otherInp.value='';}
  ['PK','KB','OT'].forEach(function(c){var b=document.getElementById('btn'+c);if(b)b.classList.toggle('active',c===code);});
  checkReady();
}
function dirOtherTyped(){_dir=document.getElementById('dirOther').value.trim();checkReady();}

/* Versa engineer. 'None' is a real answer - nobody from Versa was on the show -
   so it is the one the form opens on. */
var _eng='';
function pickEng(code){
  var names={IC:'Ian Curry',JF:'James Forshaw'};
  var otherInp=document.getElementById('engOther');
  if(code==='OT'){_eng=otherInp.value.trim();otherInp.style.display='block';otherInp.focus(window.parent!==window?{preventScroll:true}:undefined);}
  else{_eng=names[code]||'';otherInp.style.display='none';otherInp.value='';}
  ['EngNone','EngIC','EngJF','EngOT'].forEach(function(c){
    var b=document.getElementById('btn'+c);
    if(b)b.classList.toggle('active',c==='Eng'+(code==='NONE'?'None':code));
  });
}
function engOtherTyped(){_eng=document.getElementById('engOther').value.trim();}

function pickTemp(btn,val){
  _temp=val;
  btn.closest('.btn-row').querySelectorAll('.pick-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var wrap=document.getElementById('tempDetailWrap');
  var det=document.getElementById('tempDetail');
  if(wrap)wrap.style.display=(val==='Not OK')?'block':'none';
  if(det)det.style.display=(val==='Not OK')?'block':'none';
}

function pickStat(btn,val){
  _stat=val;
  btn.closest('.btn-row').querySelectorAll('.pick-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var ti=document.getElementById('techInfo');
  if(ti){ti.classList.toggle('rp-off',val!=='str'); if(val==='str')ti.focus(window.parent!==window?{preventScroll:true}:undefined);}
  checkReady();
}

var _dstat='ntr';
function pickDirStat(btn,val){
  _dstat=val;
  btn.closest('.btn-row').querySelectorAll('.pick-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var t=document.getElementById('dirRep');
  if(t){t.classList.toggle('rp-off',val!=='str'); if(val==='str')t.focus(window.parent!==window?{preventScroll:true}:undefined);}
  checkReady();
}
/* tag equipment lives inside whichever report is marked Something to Report (the engineer's first) */
function placeKit(){
  var kit=document.getElementById('kitTogTrack'); if(!kit)return;
  var sec=kit.closest('.sec'); if(!sec)return;
  var slot=_stat==='str'?document.getElementById('engKitSlot'):(_dstat==='str'?document.getElementById('dirKitSlot'):null);
  sec.classList.add('rp-kitsec');
  if(slot){ if(sec.parentNode!==slot)slot.appendChild(sec); sec.classList.remove('rp-hide'); }
  else sec.classList.add('rp-hide');
}
function kitIn(kind){var k=document.getElementById('kitTogTrack');return !!(k&&k.closest('#'+(kind==='dir'?'dirKitSlot':'engKitSlot')));}
function checkReady(){
  var info=document.getElementById('techInfo').value.trim();
  var dtx=((document.getElementById('dirRep')||{}).value||'').trim();
  var ok=!!(_selectedDate && _dir && (_stat==='ntr' || info) && (_dstat==='ntr' || dtx));
  document.getElementById('submitBtn').disabled=!ok;
  placeKit();
  var st=document.getElementById('statusTxt');
  if(st){
    if(_stat==='ntr')st.textContent=ok?'Ready to submit (Nothing to Report)':'Complete date and director to submit';
    else st.textContent=ok?'Ready to submit':'Complete date, director and technical info to submit';
  }
}

/* each report is filed on its own, so the engineer need not wait for the director */
var DRAFT_KEY='shopon_report_draft';
function _engDraftNow(){
  return {date:_selectedDate, dir:_dir, eng:_eng, temp:_temp, tempDetail:((document.getElementById('tempDetail')||{}).value||''),
    delay:(document.getElementById('soDelay')||{}).value||'', stat:_stat, info:(document.getElementById('techInfo')||{}).value||'', savedAt:new Date().toISOString()};
}
async function saveEngDraft(){
  refreshDate();
  var b=document.getElementById('engSave'), said=document.getElementById('engSaved');
  b.disabled=true; b.textContent='Saving\u2026';
  try{
    var r=await fetch(SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({key:DRAFT_KEY,value:_engDraftNow(),updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(said)said.textContent='Saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(e){alert('Could not save the engineer\u2019s report \u2014 '+e.message);}
  b.disabled=false; b.textContent='Save';
}
async function loadEngDraft(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/app_data?select=value&key=eq.'+DRAFT_KEY,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)return; var rows=await r.json(); var d=rows[0]&&rows[0].value; if(!d||!d.date)return;
    if(d.date!==_selectedDate)return;                    /* only today's (or the chosen day's) half */
    if(d.eng){var map={'Ian Curry':'IC','James Forshaw':'JF'}; if(map[d.eng])pickEng(map[d.eng]); else{pickEng('OT');var eo=document.getElementById('engOther');if(eo){eo.value=d.eng;_eng=d.eng;}}}
    if(d.temp==='Not OK'){var nb=document.querySelector('.temp-nok');if(nb)pickTemp(nb,'Not OK');var td=document.getElementById('tempDetail');if(td)td.value=d.tempDetail||'';}
    if(d.delay){var de=document.getElementById('soDelay');if(de)de.value=d.delay;}
    if(d.stat==='str'){var sb=document.querySelector('.stat-str');if(sb)pickStat(sb,'str');var ti=document.getElementById('techInfo');if(ti)ti.value=d.info||'';}
    var said=document.getElementById('engSaved');
    if(said)said.textContent='Saved '+new Date(d.savedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    checkReady();
  }catch(e){}
}
async function clearEngDraft(){
  try{await fetch(SB_URL+'/rest/v1/app_data?on_conflict=key',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify({key:DRAFT_KEY,value:{},updated_at:new Date().toISOString()})});}catch(e){}
  var said=document.getElementById('engSaved'); if(said)said.textContent='';
}
async function submitPart(kind){
  var date=_selectedDate; if(!date||!_dir)return;
  var btn=document.getElementById(kind==='dir'?'dirSend':'engSend');
  var label=btn.textContent, summary, mode, tempStr='', delay='';
  if(kind==='eng'){
    var info=document.getElementById('techInfo').value.trim();
    if(_stat==='str'&&!info)return;
    delay=document.getElementById('soDelay').value||'';
    var tempDetail=((document.getElementById('tempDetail')||{}).value||'').trim();
    tempStr=_temp; if(_temp==='Not OK'&&tempDetail)tempStr='Not OK \u2014 '+tempDetail;
    var extras=[]; if(_eng)extras.push('Engineer: '+_eng); if(tempStr)extras.push('Temperature: '+tempStr); if(delay)extras.push('Delay: '+delay+'s');
    summary=_stat==='ntr'?'Nothing to Report'+(extras.length?' \u2014 ['+extras.join(' | ')+']':''):(extras.length?'['+extras.join(' | ')+'] ':'')+info;
    mode=_stat;
  }else{
    var dtx=((document.getElementById('dirRep')||{}).value||'').trim();
    if(_dstat==='str'&&!dtx)return;
    summary='Director\u2019s report: '+(_dstat==='str'?dtx:'Nothing to report');
    mode=_dstat;
  }
  var withKit=_kitEnabled&&kitIn(kind);
  var taggedNames=withKit?_taggedIds.map(function(id){var k=_allKit.find(function(x){return x.id===id;});return k?k.name+(k.tag?' ('+k.tag+')':''):'';}).filter(Boolean):[];
  btn.dataset.busy='1'; btn.disabled=true; btn.textContent='Saving\u2026';
  try{
    var payload={versa_tech_manager:_dir,bbc_tech_manager:'',show_date:date,show_name:'ShopOn TV',summary_mode:mode,summary_text:summary,tagged_kit:withKit?_taggedIds:[],tagged_kit_names:taggedNames,urgent_action:'No',urgent_details:'',submitted_at:new Date().toISOString()};
    var r=await fetch(SB_URL+'/rest/v1/engineering_reports',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    try{ if(window.emailjs)await emailjs.send(EJS_SERVICE,EJS_TEMPLATE,{show_date:fmtNice(date),director:_dir,temperature:tempStr||'\u2014',delay:delay?delay+' seconds':'Not specified',
      status:(kind==='dir'?'Director\u2019s report \u2014 ':'Engineer\u2019s report \u2014 ')+(mode==='ntr'?'Nothing to Report':'Something to Report'),summary:summary,tagged_kit:taggedNames.join(', ')||'None',submitted_at:new Date().toLocaleString('en-GB')}); }
    catch(em){console.error('EmailJS failed:',em);}
    /* that report starts again; the other is left as it is */
    if(kind==='eng'){document.getElementById('techInfo').value='';var n=document.querySelector('.stat-ntr');if(n)pickStat(n,'ntr');}
    else{document.getElementById('dirRep').value='';var d=document.querySelector('.dstat-ntr');if(d)pickDirStat(d,'ntr');}
    if(withKit){_taggedIds=[];if(typeof renderKitChips==='function'){renderKitList();renderKitChips();updateKitLabel();}}
    btn.textContent='Saved \u2713';
    try{if(window.parent!==window)window.parent.postMessage({shoponReport:'saved',stay:true,date:date},'*');}catch(pm){}
    setTimeout(function(){btn.textContent=label;delete btn.dataset.busy;checkReady();},2200);
  }catch(e){ alert('The report was not saved \u2014 '+e.message); btn.textContent=label; delete btn.dataset.busy; checkReady(); }
}
function refreshDate(){ if(_dateMode==='today'||_dateMode==='yesterday') setDate(_dateMode); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) refreshDate(); });
window.addEventListener('focus',refreshDate);
setInterval(refreshDate,60000);
async function doSubmit(){
  refreshDate();
  var date=_selectedDate;
  var info=document.getElementById('techInfo').value.trim();
  var delay=document.getElementById('soDelay').value||'';
  var tempDetail=((document.getElementById('tempDetail')||{}).value||'').trim();
  if(!date||!_dir||(_stat==='str'&&!info))return;
  if(_dstat==='str'&&!((document.getElementById('dirRep')||{}).value||'').trim())return;

  var tempStr=_temp;
  if(_temp==='Not OK' && tempDetail) tempStr='Not OK — '+tempDetail;

  var summary;
  var extras=[];
  if(_eng) extras.push('Engineer: '+_eng);
  if(tempStr) extras.push('Temperature: '+tempStr);
  if(delay) extras.push('Delay: '+delay+'s');
  if(_stat==='ntr'){
    summary='Nothing to Report'+(extras.length?' — ['+extras.join(' | ')+']':'');
  } else {
    summary=info;
    if(extras.length) summary='['+extras.join(' | ')+'] '+summary;
  }
  /* the director's and the engineer's own reports, each under its own heading, after the rest */
  var dirRep=((document.getElementById('dirRep')||{}).value||'').trim();
  summary+='\n\nDirector\u2019s report: '+(_dstat==='str'&&dirRep?dirRep:'Nothing to report');

  var taggedNames=_kitEnabled?_taggedIds.map(function(id){var k=_allKit.find(function(x){return x.id===id;});return k?k.name+(k.tag?' ('+k.tag+')':''):'';}).filter(Boolean):[];

  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';
  try{
    var payload={versa_tech_manager:_dir,bbc_tech_manager:'',show_date:date,show_name:'ShopOn TV',summary_mode:_stat,summary_text:summary,tagged_kit:_kitEnabled?_taggedIds:[],tagged_kit_names:taggedNames,urgent_action:'No',urgent_details:'',submitted_at:new Date().toISOString()};
    var r=await fetch(SB_URL+'/rest/v1/engineering_reports',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify(payload)});
    if(r.ok){
      try{
        if(window.emailjs){
          await emailjs.send(EJS_SERVICE,EJS_TEMPLATE,{
            show_date:fmtNice(date),
            director:_dir,
            temperature:tempStr,
            delay:delay?delay+' seconds':'Not specified',
            status:_stat==='ntr'?'Nothing to Report':'Something to Report',
            summary:summary,
            tagged_kit:taggedNames.join(', ')||'None',
            submitted_at:new Date().toLocaleString('en-GB')
          });
        }
      }catch(em){
        console.error('EmailJS failed:',em);
        alert('Saved to database, but email failed: '+(em.text||em.message||JSON.stringify(em)));
      }
      clearEngDraft();
      document.getElementById('formView').style.display='none';
      document.getElementById('successView').style.display='block';
      try{if(window.parent!==window)window.parent.postMessage({shoponReport:'saved',date:date},'*');}catch(pm){}
      document.getElementById('successDetail').textContent=_dir+' · '+fmtNice(date)+' · '+(_stat==='ntr'?'Nothing to Report':'Something to Report')+' · Temp '+_temp+(delay?' · '+delay+'s delay':'');
    }else alert('Submit failed — please try again');
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false;btn.textContent='Submit Report';
}

function doReset(){
  setDate('today');
  document.getElementById('formView').style.display='';
  document.getElementById('successView').style.display='none';
  document.getElementById('techInfo').value='';
  ['dirRep'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
  var dn=document.querySelector('.dstat-ntr');if(dn)pickDirStat(dn,'ntr');
  document.getElementById('soDelay').value='';
  document.getElementById('dirOther').style.display='none';
  document.getElementById('dirOther').value='';
  var td=document.getElementById('tempDetail');if(td){td.value='';td.style.display='none';}
  var tdw=document.getElementById('tempDetailWrap');if(tdw)tdw.style.display='none';
  _temp='OK';
  _stat='ntr';
  var ntrB=document.querySelector('.stat-ntr');if(ntrB)pickStat(ntrB,'ntr');
  _taggedIds=[];
  if(_kitEnabled){renderKitList();renderKitChips();updateKitLabel();}
  var ks=document.getElementById('kitSearch');if(ks)ks.value='';
  var kd=document.getElementById('kitDrop');if(kd)kd.style.display='none';
  var ka=document.getElementById('kitDropArrow');if(ka)ka.style.transform='';
  document.querySelectorAll('.temp-ok,.temp-nok').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.temp-ok').classList.add('active');
  document.querySelectorAll('.stat-ntr,.stat-str').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.stat-str').classList.add('active');
  var iw=document.getElementById('techInfoWrap');if(iw)iw.style.display='';
  pickDir('PK');
  setDate('today');
}
