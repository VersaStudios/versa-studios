<style>

.er-pbody{padding:16px 20px 0;font-size:16px}

.er-shead{background:#E0DFDC;border-bottom:1px solid #AEADA9;padding:7px 14px;display:flex;align-items:center;gap:8px}

.er-stitle{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#333;font-family:"IBM Plex Mono",monospace}
.er-sbody{padding:12px 14px}
.er-btnrow{display:flex;flex-wrap:wrap;gap:7px}
.er-hwbtn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:5px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;cursor:pointer;transition:all .08s;border:1px solid #AEADA9;background:#EFEFED;color:#333;box-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.07),0 2px 3px rgba(0,0,0,.1);user-select:none;position:relative}
.er-hwbtn:hover{background:#F8F8F6;color:#111}
.er-hwbtn:active{box-shadow:inset 0 1px 3px rgba(0,0,0,.15);transform:translateY(1px)}

.er-hwbtn.er-active::before{content:"";position:absolute;top:5px;right:5px;width:4px;height:4px;border-radius:50%;background:#00C472;box-shadow:0 0 4px rgba(0,196,114,.9)}
.er-hwbtn-xl{padding:20px 32px;font-size:15px;font-weight:700;border-radius:7px}

.er-datechip.er-active{background:#111;color:#FFD000;border-color:#111;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.er-datedisp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#111;padding:8px 12px;background:#E0DFDC;border-radius:4px;border:1px solid #AEADA9}
.er-dinput{width:100%;margin-top:7px;border:1px solid #AEADA9;border-radius:4px;padding:9px 12px;font-family:"IBM Plex Mono",monospace;font-size:12px;background:#E0DFDC;color:#111;outline:none}
.er-dinput:focus{border-color:#111}
input[type="date"].er-dinput::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
.er-modegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.er-modebtn{padding:18px 14px;border-radius:7px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid #AEADA9;background:#EFEFED;color:#777770;text-align:center;transition:all .1s;box-shadow:0 1px 0 rgba(255,255,255,.9),0 2px 3px rgba(0,0,0,.1)}
.er-modebtn .er-micon{font-size:20px;display:block;margin-bottom:8px;opacity:.3;transition:opacity .15s}
.er-modebtn:hover{color:#333}.er-modebtn:hover .er-micon{opacity:.6}
.er-modebtn.er-ntr{background:#111;color:#fff;border-color:#111;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.er-modebtn.er-ntr .er-micon{opacity:1}
.er-modebtn.er-str{background:#FFD000;color:#111;border-color:#cc9900;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.er-modebtn.er-str .er-micon{opacity:1}
.er-strfields{display:none;flex-direction:column;gap:9px;margin-top:10px;padding-top:10px;border-top:1px dashed #C8C7C3}
.er-strfields.open{display:flex}
.er-flabel{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#777770;margin-bottom:5px;font-family:"IBM Plex Mono",monospace}
.er-ftxt{width:100%;border:1px solid #AEADA9;border-radius:4px;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#111;background:#E0DFDC;resize:vertical;min-height:90px;outline:none;line-height:1.7}
.er-ftxt:focus{border-color:#111;background:#fff}
.er-ftxt::placeholder{color:#C8C7C3}
.er-catbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.er-catbtn{padding:3px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid #AEADA9;background:#EFEFED;color:#777770;cursor:pointer;border-radius:3px;font-family:"IBM Plex Mono",monospace}
.er-catbtn.er-active{background:#111;color:#FFD000;border-color:#111}
.er-ksearch{width:100%;border:1px solid #AEADA9;border-radius:4px;padding:8px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;background:#E0DFDC;color:#111;outline:none;margin-bottom:5px}
.er-ksearch:focus{border-color:#111}.er-ksearch::placeholder{color:#C8C7C3}
.er-klist{max-height:160px;overflow-y:auto;border:1px solid #AEADA9;border-radius:4px;background:#fff}
.er-krow{display:flex;align-items:center;gap:7px;padding:7px 11px;border-bottom:1px solid #E0DFDC;cursor:pointer;transition:background .08s}
.er-krow:last-child{border-bottom:none}.er-krow:hover{background:#E0DFDC}
.er-krow.er-sel{background:rgba(17,17,17,.05)}
.er-kchk{width:13px;height:13px;border:1.5px solid #AEADA9;border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s}
.er-krow.er-sel .er-kchk{background:#111;border-color:#111}
.er-krow.er-sel .er-kchk::after{content:"";width:3px;height:6px;border:1.5px solid #FFD000;border-top:none;border-left:none;transform:rotate(45deg);display:block;margin-top:-1px}
.er-kname{font-size:11px;font-weight:500;color:#111;flex:1;font-family:"IBM Plex Mono",monospace}
.er-kpill{font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;background:#E0DFDC;color:#777770;border-radius:2px;font-family:"IBM Plex Mono",monospace}
.er-ktag{font-size:10px;color:#777770;font-family:"IBM Plex Mono",monospace}
.er-tagchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.er-tagchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 9px;background:#111;color:#FFD000;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;border-radius:3px}
.er-tagchip button{background:rgba(255,208,0,.2);border:none;cursor:pointer;color:#FFD000;width:13px;height:13px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1}
.er-urgpanel{margin:0 20px 10px;background:#F8F8F6;border-radius:7px;border:1px solid #C8C7C3;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.9),0 2px 4px rgba(0,0,0,.1)}
.er-urghead{background:#1A1A1A;border-bottom:1px solid #333;padding:7px 14px;display:flex;align-items:center;gap:8px}
.er-urgledR{width:6px;height:6px;border-radius:50%;background:#E8002A;box-shadow:0 0 5px rgba(232,0,42,.7)}
.er-urgtitle{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);font-family:"IBM Plex Mono",monospace}
.er-urgbody{padding:12px 14px}
.er-urgrow{display:flex;gap:7px}
.er-urgbtn{flex:1;padding:14px 10px;border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid #AEADA9;background:#EFEFED;color:#777770;text-align:center;transition:all .1s;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.9),0 2px 3px rgba(0,0,0,.08)}
.er-urgbtn:hover{color:#333}
.er-urgbtn::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#C8C7C3;transition:all .15s}
.er-urgbtn.er-urg-no::after{background:#00C472;box-shadow:0 0 4px rgba(0,196,114,.8)}
.er-urgbtn.er-urg-yes::after{background:#E8002A;box-shadow:0 0 4px rgba(232,0,42,.8)}
.er-urgbtn.er-urg-oth::after{background:#FFD000;box-shadow:0 0 4px rgba(255,208,0,.8)}
.er-urgbtn.er-urg-no{border-color:#00C472;color:#111;box-shadow:0 0 0 1px #00C472,0 2px 3px rgba(0,0,0,.08)}
.er-urgbtn.er-urg-yes{border-color:#E8002A;color:#111;box-shadow:0 0 0 1px #E8002A,0 2px 3px rgba(0,0,0,.08)}
.er-urgbtn.er-urg-oth{border-color:#cc9900;color:#111;box-shadow:0 0 0 1px #FFD000,0 2px 3px rgba(0,0,0,.08)}
.er-urgdet{margin-top:10px;display:none}
.er-urgdet.open{display:block}
.er-urgtxt{width:100%;border:1px solid #AEADA9;border-radius:4px;padding:9px 12px;background:#E0DFDC;color:#111;font-family:"IBM Plex Mono",monospace;font-size:11px;resize:vertical;min-height:65px;outline:none;line-height:1.6}
.er-urgtxt:focus{border-color:#111}.er-urgtxt::placeholder{color:#C8C7C3}
.er-bottom{padding:0 20px}
.er-statusbar{background:#F8F8F6;border:1px solid #C8C7C3;border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:9px;margin-bottom:8px;box-shadow:0 1px 0 rgba(255,255,255,.9),0 2px 4px rgba(0,0,0,.08);transition:all .25s}
.er-statusbar.er-ready{border-color:#00C472;background:rgba(0,196,114,.07)}
.er-statusled{width:7px;height:7px;border-radius:50%;background:#C8C7C3;flex-shrink:0;transition:all .25s}
.er-statusbar.er-ready .er-statusled{background:#00C472;box-shadow:0 0 5px rgba(0,196,114,.8)}
.er-statustxt{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#777770;transition:color .2s}
.er-statusbar.er-ready .er-statustxt{color:#111}
.er-submit{width:100%;padding:16px;border:none;background:#111;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:6px;transition:all .15s;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.er-submit:hover:not(:disabled){background:#222}
.er-submit:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.er-submit:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.er-submit.er-ready{color:#FFD000}
/* SUCCESS */
.er-success{display:none}
.er-suchero{background:#111;padding:28px 22px}
.er-sucledrow{display:flex;gap:7px;margin-bottom:16px}
.er-sucled{width:9px;height:9px;border-radius:50%}
.er-sucled.gn{background:#00C472;box-shadow:0 0 7px rgba(0,196,114,.9)}
.er-sucled.of{background:#333}
.er-suctitle{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1;margin-bottom:6px}
.er-suctitle span{color:#00C472}
.er-sucsub{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.er-sucbody{padding:0 20px}
.er-suctblhd{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#777770;padding:12px 0 7px;border-bottom:1px solid #C8C7C3}
.er-sucrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #E0DFDC}
.er-sucrow:last-child{border-bottom:none}
.er-suclbl{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#777770;width:120px;flex-shrink:0}
.er-sucval{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#111;flex:1}
.er-sucdet{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#E8002A;padding:12px 0 4px;display:none}
.er-newrpt{width:100%;margin-top:14px;padding:14px;border:1px solid #AEADA9;background:#EFEFED;color:#333;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.9),0 2px 3px rgba(0,0,0,.1);transition:all .15s}
.er-newrpt:hover{background:#111;color:#fff}
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--near-black:#111;--dark:#1c1c1c;--border:#2e2e2e;--muted:#aaa;--white:#f2f2f2;--pure:#fff;--accent:#4a9eff;--font:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif}
html,body{background:#0a0a0a;color:#f2f2f2;font-family:'Barlow',sans-serif;min-height:100vh;overflow-y:auto}
.sa-bar{background:#111;border-bottom:1px solid #222;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.sa-bar img{height:24px;opacity:.8;filter:brightness(0) invert(1)}
.sa-link{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(128,208,160,.1);border:1px solid rgba(128,208,160,.35);border-radius:4px;padding:5px 12px;color:#80d0a0;text-decoration:none;margin-left:auto}
.sa-bar-lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#aaa}
.sa-bar-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#888}
.sa-bar-link{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(128,208,160,.1);border:1px solid rgba(128,208,160,.35);border-radius:4px;padding:5px 12px;color:#80d0a0;text-decoration:none;margin-left:auto}
.sa-wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}

/* Tech Log extras — match ER pbody styling */
.tl-controls{padding:14px 20px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;background:#f5f5f3}
.tl-ftab{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:5px 12px;background:rgba(255,255,255,.7);color:#777;cursor:pointer;transition:all .12s}
.tl-ftab.on{background:#111;border-color:#111;color:#80d0a0}
.tl-srch-wrap{flex:1;min-width:140px;position:relative}
.tl-srch-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.3;pointer-events:none}
.tl-srch{width:100%;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:6px 10px 6px 30px;font-family:'Barlow',sans-serif;font-size:13px;color:#333;outline:none}
.tl-add-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#111;border:none;border-radius:3px;padding:7px 15px;color:#80d0a0;cursor:pointer;white-space:nowrap}
/* Stats bar */
.tl-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #ddd;background:#f5f5f3}
.tl-stat{padding:10px 16px;border-right:1px solid #ddd}.tl-stat:last-child{border-right:none}
.tl-stat-n{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;line-height:1;color:#222}
.tl-stat-n.red{color:#dc2626}.tl-stat-n.grn{color:#16a34a}
.tl-stat-l{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-top:2px}
/* Entries */
.tl-entries{padding:12px 20px 24px}
.tl-entry{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:6px;margin-bottom:8px;overflow:hidden}
.tl-entry-hdr{display:flex;align-items:flex-start;gap:10px;padding:12px 14px}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tl-entry-body{flex:1;min-width:0}
.tl-info{font-size:14px;font-weight:500;color:#222;line-height:1.45;margin-bottom:4px}
.tl-meta{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#aaa}
.tl-next{font-size:12px;color:#888;margin-top:3px}
.tl-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.tl-pill{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:3px 8px;color:#fff}
.tl-btns{display:flex;gap:4px}
.tl-btn{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:transparent;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:3px 7px;color:#999;cursor:pointer}
.tl-btn:hover{border-color:#555;color:#333}
.tl-btn.del:hover{border-color:#dc2626;color:#dc2626}
.tl-empty{text-align:center;padding:30px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#bbb}
/* New entry form */
.tl-form{background:#f8f8f6;border-top:1px solid #ddd;padding:16px 20px;display:none}
.tl-form.open{display:block}
.tl-form-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#111;margin-bottom:12px}
.tl-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.tl-form-grid{grid-template-columns:1fr}}
.tl-field{display:flex;flex-direction:column;gap:4px}
.tl-field.full{grid-column:1/-1}
.tl-field label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
.tl-field input,.tl-field select,.tl-field textarea{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:7px 10px;font-family:'Barlow',sans-serif;font-size:13px;color:#222;outline:none}
.tl-field textarea{resize:vertical;min-height:68px;line-height:1.5}
.tl-form-btns{display:flex;gap:8px;margin-top:12px}
.tl-form-save{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#111;border:none;border-radius:3px;padding:7px 16px;color:#80d0a0;cursor:pointer}
.tl-form-cancel{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:7px 12px;color:#999;cursor:pointer}
</style>

async function load(){

    var r=await fetch(SBU+'/rest/v1/app_data?key=eq.'+KEY+'&select=value',{headers:{'apikey':SBK,'Authorization':'Bearer '+SBK}});

async function save(){
  try{await fetch(SBU+'/rest/v1/app_data',{method:'POST',headers:{'Content-Type':'application/json','apikey':SBK,'Authorization':'Bearer '+SBK,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:KEY,value:entries,updated_at:new Date().toISOString()})});}catch(e){}
}

  document.getElementById('stTotal').textContent=entries.length;
  document.getElementById('stOngoing').textContent=entries.filter(function(e){return e.status==='ongoing';}).length;
  document.getElementById('stResolved').textContent=entries.filter(function(e){return e.status==='resolved';}).length;
  var el=document.getElementById('entriesList');
  if(!f.length){el.innerHTML='<div class="tl-empty">No entries yet</div>';return;}
  el.innerHTML=f.map(function(e){
    var col=SCOL[e.status]||'#888';
    var ds=e.date?new Date(e.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}):'';
    return '<div class="tl-entry">'
      +'<div class="tl-entry-hdr">'
      +'<div class="tl-dot" style="background:'+col+'"></div>'
      +'<div class="tl-entry-body">'
      +'<div class="tl-info">'+esc(e.info||'')+'</div>'
      +'<div class="tl-meta">'+(ds||'')+(e.dept?' &middot; '+esc(e.dept):'')+(e.by?' &middot; '+esc(e.by):'')+'</div>'
      +(e.next?'<div class="tl-next">Next: '+esc(e.next)+'</div>':'')
      +'</div>'
      +'<div class="tl-right">'
      +'<span class="tl-pill" style="background:'+col+'">'+esc(e.status)+'</span>'
      +'<div class="tl-btns">'
      +'<button class="tl-btn" data-id="'+e.id+'" data-a="cycle" onclick="hBtn(this)">Cycle</button>'
      +'<button class="tl-btn" data-id="'+e.id+'" data-a="edit" onclick="hBtn(this)">Edit</button>'
      +'<button class="tl-btn del" data-id="'+e.id+'" data-a="del" onclick="hBtn(this)">Del</button>'
      +'</div></div></div></div>';
  }).join('');
}

function hBtn(b){var id=b.dataset.id,a=b.dataset.a;if(a==='cycle')cycleStatus(id);else if(a==='edit')editEntry(id);else delEntry(id);}
function setFilter(btn,f){filter=f;document.querySelectorAll('.tl-ftab').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});render();}
function setSearch(q){search=q.toLowerCase();render();}

function openForm(){
  editId=null;
  document.getElementById('formTitle').textContent='New Entry';
  document.getElementById('fInfo').value='';
  document.getElementById('fStatus').value='information';
  document.getElementById('fDate').value=today();
  document.getElementById('fDept').value='';
  document.getElementById('fBy').value='Andrew Rowell';
  document.getElementById('fNext').value='';
  document.getElementById('entryForm').classList.add('open');
  document.getElementById('fInfo').focus();
}
function closeForm(){document.getElementById('entryForm').classList.remove('open');}

function editEntry(id){
  var e=entries.find(function(x){return String(x.id)===String(id);});if(!e)return;
  editId=id;
  document.getElementById('formTitle').textContent='Edit Entry';
  document.getElementById('fInfo').value=e.info||'';
  document.getElementById('fStatus').value=e.status||'information';
  document.getElementById('fDate').value=e.date||today();
  document.getElementById('fDept').value=e.dept||'';
  document.getElementById('fBy').value=e.by||'Andrew Rowell';
  document.getElementById('fNext').value=e.next||'';
  document.getElementById('entryForm').classList.add('open');
  document.getElementById('fInfo').focus();
}

function saveEntry(){
  var info=document.getElementById('fInfo').value.trim();
  if(!info){toast('Please describe the issue');return;}
  if(editId){
    var e=entries.find(function(x){return String(x.id)===String(editId);});
    if(e){e.info=info;e.status=document.getElementById('fStatus').value;e.date=document.getElementById('fDate').value;e.dept=document.getElementById('fDept').value;e.by=document.getElementById('fBy').value;e.next=document.getElementById('fNext').value;}
  }else{
    entries.push({id:String(Date.now()),info:info,status:document.getElementById('fStatus').value,date:document.getElementById('fDate').value,dept:document.getElementById('fDept').value,by:document.getElementById('fBy').value,next:document.getElementById('fNext').value});
  }
  save();closeForm();render();toast(editId?'Entry updated':'Entry saved');
}

function cycleStatus(id){
  var e=entries.find(function(x){return String(x.id)===String(id);});if(!e)return;
  var c=['information','ongoing','resolved'];
  e.status=c[(c.indexOf(e.status)+1)%3];
  save();render();
}

function delEntry(id){
  if(!confirm('Delete this entry?'))return;
  entries=entries.filter(function(x){return String(x.id)!==String(id);});
  save();render();toast('Entry deleted');
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('fDate').value=today();
  load();
});
</script>
</body></html>
