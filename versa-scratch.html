<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Versa Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#E2DFDA;--surface:#ECEAE5;--border:#C8C5BF;--dark:#1A1916;--text:#2A2926;
  --muted:rgba(42,41,38,.35);--rec:#E84D30;--rec-glow:rgba(232,77,48,.25);
  --accent:#F4A258;--screen-bg:#0C0C0A;--screen-text:#C8F7C5;--screen-dim:rgba(200,247,197,.3);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'JetBrains Mono',monospace;color:var(--text);display:flex;align-items:center;justify-content:center}
.device{width:100%;max-width:400px;height:100vh;max-height:860px;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 40px rgba(0,0,0,.12)}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px;flex-shrink:0}
.device-label{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--text)}
.back-link{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:4px}

/* Mini screen */
.mini-screen{position:absolute;top:8px;right:20px;background:var(--screen-bg);padding:6px 10px;min-width:100px;border-radius:4px;z-index:5}
.mini-screen::before{content:'';position:absolute;inset:0;border-radius:4px;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,.06) 1px,rgba(0,0,0,.06) 2px);pointer-events:none}
.scr-time{font-size:18px;font-weight:800;color:var(--screen-text);letter-spacing:.04em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.scr-status{font-size:8px;font-weight:600;color:var(--screen-dim);letter-spacing:.14em;text-transform:uppercase;position:relative;z-index:1;margin-top:1px}
.scr-status.recording{color:var(--rec);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Disc */
.disc-wrap{flex-shrink:0;padding:8px 20px 0;display:flex;align-items:center;justify-content:center}
.disc{width:260px;height:260px;border-radius:50%;border:2px solid var(--border);background:linear-gradient(160deg,#EFEDEA 0%,#E4E2DE 100%);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 4px 20px rgba(0,0,0,.06);transition:border-color .3s,box-shadow .3s}
.disc.recording{border-color:var(--rec);box-shadow:0 0 0 3px var(--rec-glow),0 0 30px var(--rec-glow),0 1px 0 rgba(255,255,255,.6) inset}
/* Single subtle inner ring */
.disc::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;border:1px solid rgba(0,0,0,.04)}
.disc-status{position:absolute;top:40px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:rgba(48,47,44,.15);transition:color .3s}
.disc.recording .disc-status{color:var(--rec);animation:blink 1s infinite}
.disc-wc{position:absolute;bottom:44px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:rgba(42,41,38,.2);letter-spacing:.06em}

/* Hub (record button) */
.hub{width:88px;height:88px;border-radius:50%;background:var(--surface);border:2px solid var(--border);position:relative;z-index:2;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hub:active{transform:scale(.95)}
.hub-dot{width:36px;height:36px;border-radius:50%;background:var(--rec);transition:all .2s}
.hub.active{border-color:var(--rec);box-shadow:0 0 20px var(--rec-glow)}
.hub.active .hub-dot{width:28px;height:28px;border-radius:6px;background:var(--rec);animation:pulse-rec 1.5s infinite}
@keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:.6}}

/* Meter arc */
.meter-ring{position:absolute;width:260px;height:260px;pointer-events:none}
.meter-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.meter-arc{fill:none;stroke:var(--rec);stroke-width:3;opacity:0;stroke-linecap:round;transition:stroke-dasharray .08s,opacity .3s}
.meter-arc.active{opacity:.5}

/* Transcript */
.transcript-area{flex:1;overflow-y:auto;margin:10px 20px 0;padding:14px 16px;background:rgba(255,255,255,.5);border:1.5px solid var(--border);min-height:0}
.transcript-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.word-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.08em}
.transcript-text{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word}
.transcript-text:empty::after{content:'Press the centre button and speak…';color:var(--muted);font-style:italic;font-size:11px}
.interim{color:var(--muted);font-style:italic}
.transcript-edit{width:100%;min-height:80px;background:transparent;border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--text);resize:none}

/* Controls */
.controls{flex-shrink:0;padding:8px 20px 16px}
.btn-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.ctrl-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 6px;background:var(--surface);border:1.5px solid var(--border);border-radius:50px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:background .1s,border-color .1s}
.ctrl-btn:active{background:var(--bg);border-color:#aaa}
.ctrl-btn svg{width:16px;height:16px}
.stop-icon{width:12px;height:12px;background:var(--text);border-radius:2px}
.action-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.act-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 6px;border:1.5px solid var(--border);border-radius:50px;background:var(--surface);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text);transition:background .1s}
.act-btn:active{background:var(--bg)}
.act-btn.save-act{background:var(--dark);color:var(--surface);border-color:var(--dark)}
.act-btn.save-act:active{background:#333}
.act-btn svg{width:12px;height:12px;flex-shrink:0}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--surface);padding:10px 20px;border-radius:40px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:all .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:340px){.disc{width:240px;height:240px}.disc::before{width:200px;height:200px}.hub{width:68px;height:68px}.hub-dot{width:26px;height:26px}}
@media(max-width:500px){
.disc{width:220px;height:220px}
.disc::before{width:170px;height:170px}
.hub{width:74px;height:74px}
.hub-dot{width:30px;height:30px}
.hub.active .hub-dot{width:24px;height:24px}
.meter-ring{width:220px;height:220px}
.disc-wrap{padding:4px 20px 0}
.transcript-area{margin:8px 16px 0;padding:10px 12px}
.controls{padding:6px 16px 12px}
.btn-row{gap:4px;margin-bottom:4px}
.ctrl-btn{padding:10px 4px;gap:3px}
.action-row{gap:4px}
.act-btn{padding:10px 4px}
}
</style>
</head>
<body>
<div class="device">
  <div class="top-bar">
    <span class="device-label">VS-1</span>
    <a class="back-link" onclick="window.close();history.back()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12"><path d="M10 3L5 8l5 5"/></svg>
      Notes
    </a>
  </div>
  <div class="mini-screen">
    <div class="scr-time" id="timer">00:00</div>
    <div class="scr-status" id="statusText">READY</div>
  </div>
  <div class="disc-wrap">
    <div class="disc" id="disc">
      <div class="disc-status" id="discStatus">Ready</div>
      <div class="disc-wc" id="wordCount">0 words</div>
      <svg class="meter-ring" viewBox="0 0 260 260">
        <circle class="meter-arc" id="meterArc" cx="130" cy="130" r="122" stroke-dasharray="0 770"/>
      </svg>
      <div class="hub" id="hubBtn" onclick="toggleRecord()">
        <div class="hub-dot"></div>
      </div>
    </div>
  </div>
  <div class="transcript-area" id="transcriptArea">
    <div class="transcript-label">
      <span>Transcript</span>
      <span class="word-count" id="charCount">0 chars</span>
    </div>
    <div class="transcript-text" id="transcript"></div>
  </div>
  <div class="controls">
    <div class="btn-row">
      <button class="ctrl-btn" onclick="toggleRecord()">
        <svg viewBox="0 0 20 20" fill="var(--rec)" stroke="none"><circle cx="10" cy="10" r="6"/></svg>
        <span>Rec</span>
      </button>
      <button class="ctrl-btn" onclick="pauseRecord()">
        <svg viewBox="0 0 20 20" fill="var(--text)"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg>
        <span>Pause</span>
      </button>
      <button class="ctrl-btn" onclick="stopRecord()">
        <div class="stop-icon"></div>
        <span>Stop</span>
      </button>
      <button class="ctrl-btn" onclick="clearTranscript()">
        <svg viewBox="0 0 20 20" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
        <span>Clear</span>
      </button>
    </div>
    <div class="action-row">
      <button class="act-btn save-act" onclick="saveToNotes()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h9l3 3v9H2z"/><path d="M5 2v4h5V2"/><path d="M5 10h6v4H5z"/></svg>
        Save
      </button>
      <button class="act-btn" onclick="copyText()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M5 11H3a1 1 0 01-1-1V3a1 1 0 011-1h7a1 1 0 011 1v2"/></svg>
        Copy
      </button>
      <button class="act-btn" onclick="toggleEdit()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 1.5l3 3L5 14H2v-3z"/></svg>
        Edit
      </button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SBU='https://dttwgmoyxthczlzxjgag.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ';
const NK='notes_andrew_rowell_versastudios_com';
const API=SBU+'/rest/v1/vault?key=eq.'+NK;
var isRecording=false,isPaused=false,recognition=null;
var fullTranscript='',interimText='';
var timerInterval=null,seconds=0,isEditing=false;
var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

function createRecognition(){
  if(!SpeechRecognition)return null;
  var r=new SpeechRecognition();r.continuous=true;r.interimResults=true;r.lang='en-GB';
  r.onresult=function(e){
    var interim='',final='';
    for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}
    if(final){fullTranscript+=(fullTranscript?' ':'')+final.trim();}
    interimText=interim;renderTranscript();updateCounts();
  };
  r.onerror=function(e){if(e.error==='no-speech'||e.error==='aborted')return;};
  r.onend=function(){if(isRecording&&!isPaused){try{recognition.start();}catch(e){}}};
  return r;
}
function toggleRecord(){if(isRecording)stopRecord();else startRecord();}
function startRecord(){
  if(!SpeechRecognition){showToast('Speech not supported');return;}
  recognition=createRecognition();isRecording=true;isPaused=false;
  try{recognition.start();}catch(e){}
  document.getElementById('hubBtn').classList.add('active');
  document.getElementById('disc').classList.add('recording');
  document.getElementById('discStatus').textContent='Recording';
  document.getElementById('statusText').textContent='REC';
  document.getElementById('statusText').classList.add('recording');
  startTimer();startMeter();
}
function pauseRecord(){
  if(!isRecording)return;
  if(!isPaused){isPaused=true;try{recognition.stop();}catch(e){}
    document.getElementById('disc').classList.remove('recording');
    document.getElementById('discStatus').textContent='Paused';
    document.getElementById('statusText').textContent='PAUSED';
    document.getElementById('statusText').classList.remove('recording');
    clearInterval(timerInterval);stopMeter();
  }else{isPaused=false;try{recognition.start();}catch(e){}
    document.getElementById('disc').classList.add('recording');
    document.getElementById('discStatus').textContent='Recording';
    document.getElementById('statusText').textContent='REC';
    document.getElementById('statusText').classList.add('recording');
    startTimer();startMeter();
  }
}
function stopRecord(){
  isRecording=false;isPaused=false;
  if(recognition){try{recognition.stop();}catch(e){}}recognition=null;
  document.getElementById('hubBtn').classList.remove('active');
  document.getElementById('disc').classList.remove('recording');
  document.getElementById('discStatus').textContent='Stopped';
  document.getElementById('statusText').textContent='STOPPED';
  document.getElementById('statusText').classList.remove('recording');
  clearInterval(timerInterval);stopMeter();
  if(interimText){fullTranscript+=(fullTranscript?' ':'')+interimText.trim();interimText='';renderTranscript();}
}
function clearTranscript(){
  if(fullTranscript&&!confirm('Clear transcript?'))return;
  stopRecord();fullTranscript='';interimText='';seconds=0;
  document.getElementById('timer').textContent='00:00';
  document.getElementById('discStatus').textContent='Ready';
  document.getElementById('statusText').textContent='READY';
  renderTranscript();updateCounts();
}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(function(){seconds++;var m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);}

var audioCtx,analyser,micStream,meterRAF;
function startMeter(){
  if(!navigator.mediaDevices)return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micStream=stream;audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    source.connect(analyser);drawMeter();
  }).catch(function(){});
}
function drawMeter(){
  if(!analyser)return;
  var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];var avg=sum/data.length;
  var pct=Math.min(1,avg/128);var circumference=2*Math.PI*122;
  var arc=document.getElementById('meterArc');
  arc.setAttribute('stroke-dasharray',(pct*circumference)+' '+circumference);
  arc.classList.toggle('active',pct>0.05);
  arc.style.stroke=pct>0.75?'var(--rec)':'var(--screen-text)';
  meterRAF=requestAnimationFrame(drawMeter);
}
function stopMeter(){
  cancelAnimationFrame(meterRAF);
  if(micStream){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;}
  if(audioCtx){try{audioCtx.close();}catch(e){}}audioCtx=null;analyser=null;
  var arc=document.getElementById('meterArc');arc.setAttribute('stroke-dasharray','0 770');arc.classList.remove('active');
}
function renderTranscript(){
  var el=document.getElementById('transcript');if(!el||isEditing)return;
  el.innerHTML=esc(fullTranscript)+(interimText?' <span class="interim">'+esc(interimText)+'</span>':'');
  var area=document.getElementById('transcriptArea');if(area)area.scrollTop=area.scrollHeight;
}
function updateCounts(){
  var txt=fullTranscript+(interimText?' '+interimText:'');
  var wc=txt.trim()?txt.trim().split(/\s+/).length:0;
  document.getElementById('wordCount').textContent=wc+' word'+(wc!==1?'s':'');
  document.getElementById('charCount').textContent=txt.length+' chars';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggleEdit(){
  var area=document.getElementById('transcriptArea'),el=document.getElementById('transcript');
  if(!isEditing){stopRecord();isEditing=true;var ta=document.createElement('textarea');ta.className='transcript-edit';ta.id='transcriptEdit';ta.value=fullTranscript;el.style.display='none';area.appendChild(ta);ta.focus();showToast('Editing');}
  else{var ta=document.getElementById('transcriptEdit');if(ta){fullTranscript=ta.value;ta.remove();}el.style.display='';isEditing=false;renderTranscript();updateCounts();showToast('Done');}
}
async function saveToNotes(){
  var txt=fullTranscript.trim();if(!txt){showToast('Nothing to save');return;}showToast('Saving…');
  try{
    var r=await fetch(API,{headers:{'apikey':SBK}});var rows=await r.json();
    var existing=rows&&rows[0]?rows[0].value:{};var notes=Array.isArray(existing.notes)?existing.notes:[];
    var title='Voice Note';var firstLine=txt.split(/[.\n]/)[0].trim();
    if(firstLine.length>3&&firstLine.length<60)title=firstLine;
    notes.unshift({id:Date.now(),type:'quick',title:title,content:txt,jobTag:'General',pinned:false,done:false,createdAt:new Date().toISOString()});
    existing.notes=notes;
    var method=rows&&rows[0]?'PATCH':'POST';var url=rows&&rows[0]?API:SBU+'/rest/v1/vault';
    await fetch(url,{method:method,headers:{'Content-Type':'application/json','apikey':SBK,'Prefer':'return=minimal'},body:JSON.stringify(rows&&rows[0]?{value:existing}:{key:NK,value:existing,updated_at:new Date().toISOString()})});
    showToast('Saved to Notes!');
  }catch(e){console.error(e);showToast('Save failed');}
}
function copyText(){var txt=fullTranscript.trim();if(!txt){showToast('Nothing to copy');return;}navigator.clipboard.writeText(txt).then(function(){showToast('Copied!');}).catch(function(){showToast('Copy failed');});}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2000);}
</script>
</body>
</html>
