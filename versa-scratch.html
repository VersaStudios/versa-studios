<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Versa Capture">
<meta name="theme-color" content="#302f2c">
<title>Versa Capture</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#302f2c;color:#efede3;font-family:'Barlow',sans-serif;user-select:none;-webkit-user-select:none}

/* Layout */
.wrap{display:flex;flex-direction:column;height:100vh;max-width:540px;margin:0 auto;padding:0}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex-shrink:0}
.logo{height:28px;filter:brightness(0) invert(1);opacity:.75}
.hdr-right{display:flex;align-items:center;gap:10px}
.clear-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:none;border:1.5px solid rgba(239,237,227,.18);border-radius:4px;padding:6px 12px;color:rgba(239,237,227,.5);cursor:pointer}
.send-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#efede3;border:none;border-radius:4px;padding:6px 14px;color:#302f2c;cursor:pointer;transition:opacity .15s}
.send-btn:active{opacity:.7}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* Transcript area */
.transcript{flex:1;overflow-y:auto;padding:12px 20px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;opacity:.3;padding-bottom:80px}
.empty-icon{font-size:48px}
.empty-txt{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Blocks */
.block{background:rgba(239,237,227,.07);border-radius:6px;padding:14px 16px;position:relative;border-left:2px solid transparent}
.block.voice{border-left-color:rgba(239,237,227,.3)}
.block.typed{border-left-color:rgba(90,128,80,.6)}
.block-time{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,237,227,.35);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.block-type-icon{font-size:11px;opacity:.6}
.block-text{font-size:16px;line-height:1.6;color:#efede3;white-space:pre-wrap;word-wrap:break-word}
.block-del{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(239,237,227,.25);cursor:pointer;font-size:16px;padding:2px 4px;line-height:1}
.block-del:hover{color:rgba(239,237,227,.6)}

/* Live transcript */
.live-block{background:rgba(239,237,227,.04);border-radius:6px;padding:14px 16px;border:1.5px dashed rgba(239,237,227,.2);border-left:2px solid #efede3}
.live-block .block-text{color:rgba(239,237,227,.6);font-style:italic}

/* Type area */
.type-area{padding:12px 20px 10px;flex-shrink:0;display:flex;gap:10px;border-top:1px solid rgba(239,237,227,.08)}
.type-inp{flex:1;background:rgba(239,237,227,.08);border:none;border-radius:6px;padding:12px 14px;font-family:'Barlow',sans-serif;font-size:15px;color:#efede3;outline:none;resize:none;line-height:1.5;min-height:48px;max-height:120px;-webkit-appearance:none}
.type-inp::placeholder{color:rgba(239,237,227,.3)}
.type-submit{background:rgba(239,237,227,.12);border:none;border-radius:6px;padding:0 14px;cursor:pointer;color:rgba(239,237,227,.6);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;min-height:48px;transition:background .15s}
.type-submit:active{background:rgba(239,237,227,.25)}

/* Mic button */
.mic-area{padding:16px 20px 24px;display:flex;justify-content:center;flex-shrink:0}
.mic-btn{width:88px;height:88px;border-radius:50%;border:none;background:#efede3;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.mic-btn:active,.mic-btn.recording{background:#fff;box-shadow:0 0 0 14px rgba(239,237,227,.12),0 4px 20px rgba(0,0,0,.4);transform:scale(1.06)}
.mic-btn.recording{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,237,227,.25),0 4px 20px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 18px rgba(239,237,227,.08),0 4px 20px rgba(0,0,0,.4)}}
.mic-icon{width:36px;height:36px}
.mic-icon path,.mic-icon rect{fill:#302f2c}
.mic-btn.recording .mic-icon path,.mic-btn.recording .mic-icon rect{fill:#302f2c}
.mic-hint{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,237,227,.35);text-align:center;margin-top:10px}

/* Status */
.status-bar{text-align:center;padding:4px 0 2px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,237,227,.35);flex-shrink:0;min-height:20px}

/* Toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#efede3;color:#302f2c;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1}
</style>
</head>

<script>
const SBU='https://dttwgmoyxthczlzxjgag.supabase.co',SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dHdnbW95eHRoY3psenhqZ2FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzc5NDIsImV4cCI6MjA4ODgxMzk0Mn0.RcmcYXqdfVbwVsr1eu-V1l4Zt_6m8wvUmr0mURZvGeQ',NK='notes_andrew_rowell_versastudios_com',SK='scratch_andrew_rowell_versastudios_com';
var blocks=[],recognition=null,isRecording=false,liveBlock=null,saveTimer=null;

// ── Speech Recognition ──────────────────────────────────────────────────────
function initRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStatus('Voice not supported on this browser');return null;}
  var r=new SR();
  r.continuous=true;
  r.interimResults=true;
  r.lang='en-GB';
  r.onresult=function(e){
    var interim='',final='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    if(final){addBlock(final.trim(),'voice');clearLive();}
    else if(interim){showLive(interim);}
  };
  r.onerror=function(e){
    if(e.error==='not-allowed'){showToast('Microphone access denied');}
    else if(e.error!=='aborted'){showToast('Voice error: '+e.error);}
    stopVoice();
  };
  r.onend=function(){if(isRecording)try{r.start();}catch(ex){}};
  return r;
}

function toggleVoice(){
  if(isRecording){stopVoice();}else{startVoice();}
}

function startVoice(){
  if(isRecording)return;
  if(!recognition)recognition=initRecognition();
  if(!recognition)return;
  isRecording=true;
  try{recognition.start();}catch(e){isRecording=false;return;}
  document.getElementById('micBtn').classList.add('recording');
  document.getElementById('micHint').textContent='Tap to stop';
  setStatus('Listening...');
}

function stopVoice(){
  if(!isRecording)return;
  isRecording=false;
  if(recognition)try{recognition.stop();}catch(e){}
  clearLive();
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micHint').textContent='Tap to speak';
  setStatus('');
}

// ── Blocks ─────────────────────────────────────────────────────────────────
function addBlock(text,type){
  if(!text||!text.trim())return;
  var block={id:Date.now(),text:text.trim(),type:type,time:new Date()};
  blocks.push(block);
  renderBlocks();
  autoSave();
  updateSendBtn();
}

function deleteBlock(id){
  blocks=blocks.filter(function(b){return b.id!==id;});
  renderBlocks();
  autoSave();
  updateSendBtn();
}

function clearAll(){
  if(blocks.length&&!confirm('Clear all blocks?'))return;
  blocks=[];renderBlocks();autoSave();updateSendBtn();
}

function showLive(text){
  var t=document.getElementById('transcript');
  if(!liveBlock){liveBlock=document.createElement('div');liveBlock.className='live-block';t.appendChild(liveBlock);}
  liveBlock.innerHTML='<div class="block-text">'+esc(text)+'</div>';
  t.scrollTop=t.scrollHeight;
}

function clearLive(){
  if(liveBlock){liveBlock.remove();liveBlock=null;}
}

function renderBlocks(){
  var t=document.getElementById('transcript');
  var empty=document.getElementById('emptyState');
  if(!blocks.length){
    t.innerHTML='';t.appendChild(empty);empty.style.display='flex';
    return;
  }
  empty.style.display='none';
  // Keep existing live block if present
  var live=t.querySelector('.live-block');
  t.innerHTML='';
  blocks.forEach(function(b){
    var ds=b.time.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    var div=document.createElement('div');div.className='block'+(b.type==='voice'?' voice':' typed');
    div.innerHTML='<div class="block-time"><span class="block-type-icon">'+(b.type==='voice'?'🎙':'✏️')+'</span>'+ds+'</div>'
      +'<div class="block-text">'+esc(b.text)+'</div>'
      +'<button class="block-del" onclick="deleteBlock('+b.id+')">&#215;</button>';
    t.appendChild(div);
  });
  if(live)t.appendChild(live);
  t.scrollTop=t.scrollHeight;
}

// ── Typed input ──────────────────────────────────────────────────────────────
function submitTyped(){
  var inp=document.getElementById('typeInp');
  var txt=inp.value.trim();if(!txt)return;
  addBlock(txt,'typed');
  inp.value='';inp.style.height='auto';
}

// ── Send to Notes ─────────────────────────────────────────────────────────────
async function sendToNotes(){
  if(!blocks.length)return;
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='Sending...';
  // Build a single note from all blocks
  var text=blocks.map(function(b){
    var t=b.time.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    return '['+t+'] '+b.text;
  }).join('\n\n');
  var today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var noteTitle='Scratch — '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
  try{
    // Load existing notes
    var r=await fetch(SBU+'/rest/v1/app_data?key=eq.'+NK+'&select=value',{headers:{'apikey':SBK,'Authorization':'Bearer '+SBK}});
    var d=await r.json();
    var existing={notes:[],todos:[],meetings:[]};
    if(d&&d[0]&&d[0].value)existing=d[0].value;
    var notes=Array.isArray(existing.notes)?existing.notes:[];
    notes.unshift({id:Date.now(),type:'note',title:noteTitle,content:text,jobTag:'Scratch',pinned:false,done:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    existing.notes=notes;
    await fetch(SBU+'/rest/v1/app_data',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SBK,'Authorization':'Bearer '+SBK,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({key:NK,value:existing,updated_at:new Date().toISOString()})
    });
    showToast('Sent to Notes!');
    blocks=[];renderBlocks();autoSave();updateSendBtn();
    btn.textContent='Send to Notes';
  }catch(e){
    showToast('Error — check connection');
    btn.disabled=false;btn.textContent='Send to Notes';
  }
}

// ── Local save (scratch pad persists between sessions) ────────────────────────
async function autoSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async function(){
    try{
      var payload=blocks.map(function(b){return {id:b.id,text:b.text,type:b.type,time:b.time.toISOString()};});
      await fetch(SBU+'/rest/v1/app_data',{method:'POST',
        headers:{'Content-Type':'application/json','apikey':SBK,'Authorization':'Bearer '+SBK,'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({key:SK,value:payload,updated_at:new Date().toISOString()})
      });
    }catch(e){}
  },1500);
}

async function loadScratch(){
  try{
    var r=await fetch(SBU+'/rest/v1/app_data?key=eq.'+SK+'&select=value',{headers:{'apikey':SBK,'Authorization':'Bearer '+SBK}});
    var d=await r.json();
    if(d&&d[0]&&Array.isArray(d[0].value)&&d[0].value.length){
      blocks=d[0].value.map(function(b){return {id:b.id,text:b.text,type:b.type,time:new Date(b.time)};});
      renderBlocks();updateSendBtn();
      setStatus(blocks.length+' unsent block'+(blocks.length!==1?'s':'')+' from last session');
      setTimeout(function(){setStatus('');},3000);
    }
  }catch(e){}
}

// ── Utils ──────────────────────────────────────────────────────────────────
function updateSendBtn(){
  var btn=document.getElementById('sendBtn');
  if(btn){btn.disabled=!blocks.length;btn.textContent='Send to Notes'+(blocks.length?' ('+blocks.length+')':'');}
}
function setStatus(msg){var el=document.getElementById('statusBar');if(el)el.textContent=msg;}
function showToast(msg){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Prevent scroll bounce on iOS ──────────────────────────────────────────
document.addEventListener('touchmove',function(e){
  if(e.target.closest('.mic-area'))e.preventDefault();
},{passive:false});

loadScratch();
</script>
